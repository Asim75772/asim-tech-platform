.app:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:0}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
h1{margin:0;text-align:center;color:#fff;font-size:30px;font-weight:800;text-shadow:0 2px 5px #000}
.sub{text-align:center;color:#fff;font-size:17px;margin:10px 0 20px;text-shadow:0 2px 4px #000}
.display{
 min-height:125px;border:1px solid rgba(255,255,255,.45);border-radius:32px;
 background:rgba(10,20,30,.52);backdrop-filter:blur(5px);
 color:#fff;display:flex;align-items:center;justify-content:flex-end;
 padding:18px 28px;font-size:58px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.25);
}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;flex:1}
button{
 border:1px solid rgba(255,255,255,.35);border-radius:27px;
 background:rgba(10,20,30,.72);color:#fff;font-size:28px;font-weight:700;
 box-shadow:0 4px 10px rgba(0,0,0,.28);min-height:65px;
}
button:active{transform:scale(.96)}
.op{background:rgba(255,145,0,.92)}
.ac{background:rgba(245,0,0,.92)}
.eq{background:rgba(0,205,55,.94)}
.zero{grid-column:span 2}
.footer{text-align:center;color:#fff;font-size:15px;font-weight:700;text-shadow:0 2px 4px #000;margin-top:8px}
@media(max-height:700px){
 .app{padding-top:10px}h1{font-size:25px}.sub{margin:5px 0 10px}
 .display{min-height:90px;font-size:45px}.keys{gap:8px;margin-top:12px}
 button{min-height:52px;font-size:24px}.footer{font-size:12px}
}
</style>
</head>
<body>
<div class="app"><div class="content">
<h1>ASIM TECH Calculator</h1>
<div class="sub">Calculate with Positive Vibes</div>
<div id="display" class="display">0</div>
<div class="keys">
<button class="ac" onclick="clearAll()">AC</button>
<button onclick="backspace()">⌫</button>
<button onclick="percent()">%</button>
<button class="op" onclick="press('/')">÷</button>
<button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('*')">×</button>
<button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('-')">−</button>
<button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button>
<button class="zero" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="eq" onclick="calculate()">=</button>
</div>
<div class="footer">|| गणेशाय नमः || &nbsp; • &nbsp; ASIM TECH</div>
</div></div>
<script>
let expr="";
const d=document.getElementById("display");
function update(){d.textContent=expr||"0"}
function press(v){
 if(v==="." && (expr==="" || /[+\-*\/.]$/.test(expr))){if(expr==="")expr="0";}
 expr+=v;update();
}
function clearAll(){expr="";update()}
function backspace(){expr=expr.slice(0,-1);update()}
function percent(){
 try{expr=String(parseFloat(expr)/100);update()}catch(e){}
}
function calculate(){
 try{
  if(!expr)return;
  if(!/^[0-9+\-*\/().\s]+$/.test(expr))throw 0;
  expr=String(Function("return ("+expr+")")());
  update();
 }catch(e){d.textContent="Error";setTimeout(clearAll,900)}
}
document.addEventListener("keydown",e=>{
 if(/[0-9+\-*\/().]/.test(e.key))press(e.key);
 else if(e.key==="Enter"||e.key==="=")calculate();
 else if(e.key==="Backspace")backspace();
 else if(e.key==="Escape")clearAll();
});
</script>
</body>
</html>
