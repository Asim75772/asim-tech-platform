<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#07111f,#0b2233,#063b35);
color:#fff;
min-height:100vh;
}

nav{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
background:rgba(5,12,22,.95);
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:22px;
font-weight:bold;
color:#36e0b5;
}

.nav-links{
display:flex;
gap:18px;
}

.nav-links a{
color:#ddd;
text-decoration:none;
}

.container{
width:90%;
max-width:800px;
margin:40px auto;
}

.back{
color:#8edfc9;
text-decoration:none;
display:inline-block;
margin-bottom:25px;
}

h1{
font-size:30px;
margin-bottom:8px;
}

.subtitle{
color:#aab7c4;
margin-bottom:25px;
}

.card{
background:rgba(13,29,43,.95);
border:1px solid rgba(255,255,255,.1);
border-radius:15px;
padding:25px;
margin-bottom:20px;
}

.label{
color:#8b949e;
font-size:13px;
margin-bottom:7px;
}

.value{
font-size:17px;
word-break:break-all;
}

input{
width:100%;
padding:13px;
border-radius:9px;
border:1px solid #30363d;
background:#0d1117;
color:#fff;
font-size:15px;
margin-top:7px;
}

.btn{
border:0;
border-radius:9px;
padding:12px 18px;
cursor:pointer;
font-weight:bold;
font-size:15px;
margin-top:15px;
}

.save{
background:#36e0b5;
color:#06151a;
}

.logout{
background:#55252c;
color:#ffb5bd;
}

.message{
display:none;
padding:12px;
border-radius:8px;
margin-top:15px;
background:#17384a;
color:#8edfc9;
}

.error{
background:#4b2027;
color:#ffb5bd;
}

.loading{
text-align:center;
padding:40px;
color:#aab7c4;
}

@media(max-width:600px){

nav{
padding:0 5%;
}

.nav-links{
gap:10px;
font-size:13px;
}

.container{
width:92%;
margin:25px auto;
}

h1{
font-size:25px;
}

.card{
padding:20px;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">
⚡ ASIM TECH
</div>

<div class="nav-links">

<a href="index.html">Home</a>

<a href="dashboard.html">Dashboard</a>

</div>

</nav>


<div class="container">

<a href="dashboard.html"
class="back">

← Back to Dashboard

</a>


<h1>
👤 My Profile
</h1>

<p class="subtitle">
Manage your ASIM TECH account.
</p>


<div id="loading"
class="loading">

Loading profile...

</div>


<div id="profileCard"
class="card"
style="display:none;">


<div class="label">
Email
</div>

<div id="email"
class="value">
-
</div>


<br><br>


<div class="label">
User ID
</div>

<div id="userId"
class="value">
-
</div>


<br><br>


<div class="label">
Account Created
</div>

<div id="created"
class="value">
-
</div>


</div>


<div id="nameCard"
class="card"
style="display:none;">

<h2>
Profile Information
</h2>


<label class="label"
style="display:block;margin-top:20px;">

Display Name

</label>


<input
id="displayName"
type="text"
placeholder="Enter your name"
>


<button
class="btn save"
onclick="saveProfile()">

💾 Save Profile

</button>


<div id="message"
class="message">
</div>

</div>


<div id="logoutCard"
class="card"
style="display:none;">

<h2>
Account
</h2>

<p style="color:#aab7c4;margin-top:8px;">

Sign out from your ASIM TECH account.

</p>


<button
class="btn logout"
onclick="logout()">

🚪 Logout

</button>

</div>


</div>


<script>

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let currentUser = null;


async function loadProfile(){

try{

const {
data:{user},
error
} =
await supabaseClient.auth.getUser();


if(error){

throw error;

}


if(!user){

window.location.href =
"login.html";

return;

}


currentUser = user;


document.getElementById(
"email"
).textContent =
user.email || "-";


document.getElementById(
"userId"
).textContent =
user.id;


document.getElementById(
"created"
).textContent =

user.created_at

? new Date(
user.created_at
).toLocaleString()

: "-";


const metadata =
user.user_metadata || {};


document.getElementById(
"displayName"
).value =

metadata.display_name || "";


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"profileCard"
).style.display =
"block";


document.getElementById(
"nameCard"
).style.display =
"block";


document.getElementById(
"logoutCard"
).style.display =
"block";


}catch(error){

console.error(error);

document.getElementById(
"loading"
).textContent =
"Unable to load profile.";

}

}


async function saveProfile(){

if(!currentUser){

return;

}


const name =
document.getElementById(
"displayName"
).value.trim();


const message =
document.getElementById(
"message"
);


try{

const {
error
} =
await supabaseClient.auth.updateUser({

data:{
display_name:name
}

});


if(error){

throw error;

}


message.textContent =
"Profile updated successfully!";

message.className =
"message";

message.style.display =
"block";


}catch(error){

console.error(error);

message.textContent =
"Unable to update profile.";

message.className =
"message error";

message.style.display =
"block";

}

}


async function logout(){

const confirmed =
confirm(
"Are you sure you want to logout?"
);


if(!confirmed){

return;

}


await supabaseClient.auth.signOut();


window.location.href =
"login.html";

}


loadProfile();

</script>

</body>

</html>
