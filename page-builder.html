<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Page Builder - ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#07111f,#0b2233,#063b35);
    color:#fff;
    min-height:100vh;
}

nav{
    background:#050c16;
    padding:16px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#36e0b5;
}

nav a{
    color:#fff;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#aab7c4;
    margin-bottom:25px;
    font-size:17px;
}

.card{
    background:rgba(13,29,43,.95);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #3a4a57;
    background:#081521;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#36e0b5;
}

.field{
    margin-bottom:20px;
}

textarea{
    min-height:260px;
    font-family:monospace;
    line-height:1.5;
    resize:vertical;
}

.editors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.editor-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
}

.html-title{
    color:#ff7b72;
}

.css-title{
    color:#58a6ff;
}

.js-title{
    color:#e3b341;
}

.preview{
    width:100%;
    height:500px;
    border:0;
    background:#fff;
    border-radius:9px;
    display:block;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:9px;
    padding:13px 20px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.save{
    background:#16a34a;
    color:#fff;
}

.preview-btn{
    background:#2563eb;
    color:#fff;
}

.back{
    background:#64748b;
    color:#fff;
}

.status{
    margin-top:15px;
    color:#aab7c4;
}

.success{
    color:#36e0b5;
}

.error{
    color:#ff7b72;
}

.mode{
    display:inline-block;
    background:#17384a;
    color:#8edfc9;
    padding:7px 13px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:20px;
}

@media(max-width:800px){

    nav{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    h1{
        font-size:25px;
    }

    .editors{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }

    .buttons button{
        width:100%;
    }

    .container{
        width:94%;
        margin:20px auto;
    }

    textarea{
        min-height:220px;
    }

    .preview{
        height:550px;
    }
}

</style>

</head>

<body>

<nav>

    <div class="logo">
        ⚡ ASIM TECH
    </div>

    <a href="dashboard.html">
        Dashboard
    </a>

</nav>


<div class="container">

<h1 id="pageTitle">
    🌐 Web Page Builder
</h1>

<p class="subtitle">
    Create your webpage using HTML, CSS and JavaScript.
</p>

<div id="modeLabel" class="mode">
    New Web Page
</div>


<!-- REPOSITORY / PAGE NAME -->

<div class="card">

    <div class="field">

        <label>
            📁 Repository
        </label>

        <select id="repository">

            <option value="">
                Loading repository...
            </option>

        </select>

    </div>


    <div class="field">

        <label>
            📝 Page Name
        </label>

        <input
            type="text"
            id="pageName"
            placeholder="Example: index.html"
        >

    </div>

</div>


<!-- EDITORS -->

<div class="editors">


<!-- HTML -->

<div class="card">

    <div class="editor-title html-title">
        HTML
    </div>

    <textarea
        id="htmlCode"
        placeholder="Write your HTML here..."
    ><h1>Welcome to ASIM TECH!</h1>
<p>This is my published website.</p></textarea>

</div>


<!-- CSS -->

<div class="card">

    <div class="editor-title css-title">
        CSS
    </div>

    <textarea
        id="cssCode"
        placeholder="Write your CSS here..."
    >body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background: #f5f7fb;
}

h1 {
    color: #0b8f55;
}

p {
    font-size: 18px;
}</textarea>

</div>


<!-- JAVASCRIPT -->

<div class="card">

    <div class="editor-title js-title">
        JavaScript
    </div>

    <textarea
        id="jsCode"
        placeholder="Write your JavaScript here..."
    >console.log("Hello from ASIM TECH!");</textarea>

</div>

</div>


<!-- LIVE PREVIEW -->

<div class="card">

    <div class="editor-title">
        👁️ Live Preview
    </div>

    <iframe
        id="preview"
        class="preview"
        sandbox="allow-scripts allow-forms allow-modals">
    </iframe>

</div>


<!-- BUTTONS -->

<div class="card">

    <div class="buttons">

        <button
            type="button"
            class="preview-btn"
            onclick="updatePreview()">
            👁️ Preview
        </button>


        <button
            type="button"
            id="saveButton"
            class="save"
            onclick="savePage()">
            💾 Save Page
        </button>


        <button
            type="button"
            class="back"
            onclick="goBack()">
            ← Back
        </button>

    </div>


    <div
        id="status"
        class="status">
    </div>

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ELEMENTS
========================================= */

const repository =
    document.getElementById("repository");

const pageName =
    document.getElementById("pageName");

const htmlCode =
    document.getElementById("htmlCode");

const cssCode =
    document.getElementById("cssCode");

const jsCode =
    document.getElementById("jsCode");

const preview =
    document.getElementById("preview");

const statusBox =
    document.getElementById("status");

const saveButton =
    document.getElementById("saveButton");

const modeLabel =
    document.getElementById("modeLabel");

const pageTitle =
    document.getElementById("pageTitle");


/* =========================================
   URL PARAMETERS
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const repositoryId =
    params.get("repository_id");

const pageId =
    params.get("page_id");


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let editingPage = null;


/* =========================================
   STATUS
========================================= */

function setStatus(
    message,
    type = ""
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;
}


/* =========================================
   INITIALIZE
========================================= */

async function initialize(){

    try{

        setStatus(
            "Checking login..."
        );


        const {
            data:{user},
            error:userError
        } =
        await supabaseClient.auth.getUser();


        if(userError){

            throw userError;
        }


        if(!user){

            window.location.href =
                "login.html";

            return;
        }


        currentUser =
            user;


        /*
        If repository_id is present,
        load that repository directly.
        */

        if(repositoryId){

            await loadSelectedRepository();

        }else{

            await loadRepositories();

        }


        /*
        If page_id is present,
        load existing page.
        */

        if(pageId){

            await loadExistingPage();

        }else{

            setStatus(
                "Ready to create your webpage.",
                "success"
            );
        }


        /*
        Initial preview
        */

        updatePreview();


    }catch(error){

        console.error(error);

        setStatus(
            error.message ||
            "Unable to load page builder.",
            "error"
        );
    }
}


/* =========================================
   LOAD SELECTED REPOSITORY
========================================= */

async function loadSelectedRepository(){

    setStatus(
        "Loading repository..."
    );


    const {
        data:repo,
        error
    } =
    await supabaseClient

        .from("repositories")

        .select(
            "id,name,owner_id"
        )

        .eq(
            "id",
            repositoryId
        )

        .single();


    if(error){

        console.error(error);

        throw new Error(
            "Unable to load repository."
        );
    }


    if(!repo){

        throw new Error(
            "Repository not found."
        );
    }


    if(
        repo.owner_id !==
        currentUser.id
    ){

        throw new Error(
            "You are not the owner of this repository."
        );
    }


    repository.innerHTML =
        "";


    const option =
        document.createElement(
            "option"
        );


    option.value =
        repo.id;


    option.textContent =
        repo.name;


    option.selected =
        true;


    repository.appendChild(
        option
    );


    setStatus(
        "Repository loaded successfully.",
        "success"
    );
}


/* =========================================
   LOAD ALL OWNED REPOSITORIES
========================================= */

async function loadRepositories(){

    setStatus(
        "Loading repositories..."
    );


    const {
        data:repos,
        error
    } =
    await supabaseClient

        .from("repositories")

        .select(
            "id,name,owner_id"
        )

        .eq(
            "owner_id",
            currentUser.id
        )

        .order(
            "name",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        throw new Error(
            "Unable to load repositories."
        );
    }


    if(
        !repos ||
        repos.length === 0
    ){

        repository.innerHTML = `
            <option value="">
                No repositories found
            </option>
        `;


        throw new Error(
            "Please create a repository first."
        );
    }


    repository.innerHTML = `
        <option value="">
            Select Repository
        </option>
    `;


    repos.forEach(
        repo => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                repo.id;


            option.textContent =
                repo.name;


            repository.appendChild(
                option
            );

        }
    );


    setStatus(
        "Repositories loaded.",
        "success"
    );
}


/* =========================================
   LOAD EXISTING PAGE
========================================= */

async function loadExistingPage(){

    setStatus(
        "Loading web page..."
    );


    const {
        data:page,
        error
    } =
    await supabaseClient

        .from("web_pages")

        .select("*")

        .eq(
            "id",
            pageId
        )

        .single();


    if(error){

        console.error(error);

        throw new Error(
            "Unable to load web page."
        );
    }


    if(!page){

        throw new Error(
            "Web page not found."
        );
    }


    if(
        page.owner_id !==
        currentUser.id
    ){

        throw new Error(
            "You are not the owner of this web page."
        );
    }


    editingPage =
        page;


    pageTitle.textContent =
        "✏️ Edit Web Page";


    modeLabel.textContent =
        "✏️ Edit Web Page";


    saveButton.textContent =
        "💾 Update Page";


    repository.value =
        page.repository_id;


    pageName.value =
        page.page_name || "";


    htmlCode.value =
        page.html_content || "";


    cssCode.value =
        page.css_content || "";


    jsCode.value =
        page.js_content || "";


    setStatus(
        "Web page loaded successfully.",
        "success"
    );
}


/* =========================================
   UPDATE PREVIEW
   IMPORTANT FIX
========================================= */

function updatePreview(){

    try{

        const html =
            htmlCode.value;

        const css =
            cssCode.value;

        const js =
            jsCode.value;


        /*
        First create the page with
        HTML + CSS only.
        */

        const previewHTML = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<style>

${css}

</style>

</head>

<body>

${html}

</body>

</html>

`;


        /*
        Put HTML into iframe.
        */

        preview.srcdoc =
            previewHTML;


        /*
        Wait until iframe has loaded,
        then create a REAL script
        element and execute JS.
        */

        preview.onload =
            function(){

                try{

                    const doc =
                        preview.contentDocument;


                    if(!doc){

                        console.error(
                            "Preview document unavailable."
                        );

                        return;
                    }


                    const script =
                        doc.createElement(
                            "script"
                        );


                    script.type =
                        "text/javascript";


                    script.textContent =
                        js;


                    /*
                    Append JavaScript
                    after page HTML exists.
                    */

                    doc.body.appendChild(
                        script
                    );


                }catch(error){

                    console.error(
                        "Preview JavaScript error:",
                        error
                    );
                }

            };


        setStatus(
            "Preview updated.",
            "success"
        );


    }catch(error){

        console.error(error);

        setStatus(
            "Preview error: " +
            error.message,
            "error"
        );
    }
}


/* =========================================
   SAVE PAGE
========================================= */

async function savePage(){

    try{

        if(!currentUser){

            alert(
                "Please login first."
            );

            return;
        }


        const selectedRepository =
            repository.value;


        if(!selectedRepository){

            alert(
                "Please select a repository."
            );

            return;
        }


        let name =
            pageName.value.trim();


        if(!name){

            alert(
                "Please enter a page name."
            );

            return;
        }


        /*
        Automatically add .html
        */

        if(
            !name
                .toLowerCase()
                .endsWith(".html")
        ){

            name +=
                ".html";
        }


        const html =
            htmlCode.value;

        const css =
            cssCode.value;

        const js =
            jsCode.value;


        /* =================================
           UPDATE EXISTING PAGE
        ================================= */

        if(editingPage){

            setStatus(
                "Updating page..."
            );


            const {
                error
            } =
            await supabaseClient

                .from("web_pages")

                .update({

                    page_name:
                        name,

                    html_content:
                        html,

                    css_content:
                        css,

                    js_content:
                        js

                })

                .eq(
                    "id",
                    editingPage.id
                )

                .eq(
                    "owner_id",
                    currentUser.id
                );


            if(error){

                console.error(error);

                throw error;
            }


            setStatus(
                "Web page updated successfully!",
                "success"
            );


            alert(
                "Web page updated successfully!"
            );


            window.location.href =
                "repository-files.html?repository_id=" +
                encodeURIComponent(
                    selectedRepository
                );


            return;
        }


        /* =================================
           CHECK DUPLICATE
        ================================= */

        setStatus(
            "Checking page name..."
        );


        const {
            data:existing,
            error:checkError
        } =
        await supabaseClient

            .from("web_pages")

            .select("id")

            .eq(
                "repository_id",
                selectedRepository
            )

            .eq(
                "page_name",
                name
            );


        if(checkError){

            throw checkError;
        }


        if(
            existing &&
            existing.length > 0
        ){

            alert(
                "A web page with this name already exists in this repository."
            );

            return;
        }


        /* =================================
           INSERT NEW PAGE
        ================================= */

        setStatus(
            "Saving page..."
        );


        const {
            error
        } =
        await supabaseClient

            .from("web_pages")

            .insert({

                repository_id:
                    selectedRepository,

                page_name:
                    name,

                html_content:
                    html,

                css_content:
                    css,

                js_content:
                    js,

                owner_id:
                    currentUser.id,

                is_published:
                    false,

                published_at:
                    null

            });


        if(error){

            console.error(error);

            throw error;
        }


        setStatus(
            "Web page saved successfully!",
            "success"
        );


        alert(
            "Web page saved successfully!"
        );


        window.location.href =
            "repository-files.html?repository_id=" +
            encodeURIComponent(
                selectedRepository
            );


    }catch(error){

        console.error(error);

        setStatus(
            error.message ||
            "Unable to save web page.",
            "error"
        );


        alert(
            error.message ||
            "Unable to save web page."
        );
    }
}


/* =========================================
   BACK
========================================= */

function goBack(){

    if(repositoryId){

        window.location.href =
            "repository-files.html?repository_id=" +
            encodeURIComponent(
                repositoryId
            );

    }else{

        window.location.href =
            "repository-files.html";
    }
}


/* =========================================
   START
========================================= */

initialize();

</script>

</body>
</html>
