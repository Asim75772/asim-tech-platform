
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Builder — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:#fff;
}

.navbar{
    height:65px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.green{
    color:#39d353;
}

.home{
    color:#58a6ff;
    text-decoration:none;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 18px;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#8b949e;
    margin-bottom:25px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    background:#0d1117;
    color:#fff;
    border:1px solid #30363d;
    border-radius:7px;
    padding:12px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#58a6ff;
}

textarea{
    min-height:260px;
    resize:vertical;
    font-family:monospace;
    line-height:1.5;
}

.field{
    margin-bottom:18px;
}

.editors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.editor-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.html-title{
    color:#ff7b72;
}

.css-title{
    color:#58a6ff;
}

.js-title{
    color:#e3b341;
}

.preview{
    width:100%;
    height:400px;
    background:#fff;
    border:none;
    border-radius:7px;
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:7px;
    padding:12px 20px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.save{
    background:#238636;
    color:#fff;
}

.preview-btn{
    background:#1f6feb;
    color:#fff;
}

.back{
    background:#21262d;
    color:#fff;
}

.status{
    margin-top:15px;
    color:#8b949e;
}

.success{
    color:#3fb950;
}

.error{
    color:#f85149;
}

.loading{
    color:#58a6ff;
}

@media(max-width:800px){

    .editors{
        grid-template-columns:1fr;
    }

    h1{
        font-size:25px;
    }

    .container{
        padding:20px 12px;
    }

    textarea{
        min-height:220px;
    }

    .preview{
        height:350px;
    }

}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        <span class="green">ASIM</span> TECH
    </div>

    <a href="dashboard.html" class="home">
        Dashboard
    </a>

</nav>


<div class="container">

    <h1>🌐 Web Page Builder</h1>

    <p class="subtitle">
        Create your webpage with HTML, CSS and JavaScript.
    </p>


    <div class="card">

        <div class="field">

            <label for="repository">
                📁 Repository
            </label>

            <select id="repository">

                <option value="">
                    Loading repositories...
                </option>

            </select>

        </div>


        <div class="field">

            <label for="pageName">
                📝 Page Name
            </label>

            <input
                type="text"
                id="pageName"
                placeholder="Example: home.html"
            >

        </div>

    </div>


    <div class="editors">

        <div class="card">

            <div class="editor-title html-title">
                HTML
            </div>

            <textarea
                id="htmlCode"
                placeholder="Write your HTML here..."
            ><h1>Welcome to ASIM TECH!</h1>
<p>This is my first webpage.</p></textarea>

        </div>


        <div class="card">

            <div class="editor-title css-title">
                CSS
            </div>

            <textarea
                id="cssCode"
                placeholder="Write your CSS here..."
            >body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background: #f5f5f5;
}

h1 {
    color: #0b8f55;
}

p {
    font-size: 18px;
}</textarea>

        </div>


        <div class="card">

            <div class="editor-title js-title">
                JavaScript
            </div>

            <textarea
                id="jsCode"
                placeholder="Write your JavaScript here..."
            >console.log("Hello from ASIM TECH!");</textarea>

        </div>

    </div>


    <div class="card">

        <div class="editor-title">
            👁️ Live Preview
        </div>

        <iframe
            id="preview"
            class="preview"
            sandbox="allow-scripts"
        ></iframe>

    </div>


    <div class="card">

        <div class="buttons">

            <button
                class="preview-btn"
                onclick="updatePreview()"
            >
                👁️ Preview
            </button>

            <button
                class="save"
                onclick="savePage()"
            >
                💾 Save Page
            </button>

            <button
                class="back"
                onclick="goBack()"
            >
                ← Back
            </button>

        </div>

        <div
            id="status"
            class="status"
        ></div>

    </div>

</div>


<script>

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const repository =
document.getElementById("repository");

const pageName =
document.getElementById("pageName");

const htmlCode =
document.getElementById("htmlCode");

const cssCode =
document.getElementById("cssCode");

const jsCode =
document.getElementById("jsCode");

const preview =
document.getElementById("preview");

const statusBox =
document.getElementById("status");


let currentUser = null;


async function initialize(){

    statusBox.textContent =
    "Checking login...";

    const {
        data:{user}
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        window.location.href =
        "login.html";

        return;

    }


    currentUser = user;

    await loadRepositories();

    updatePreview();

}


async function loadRepositories(){

    const {
        data:repos,
        error
    } =
    await supabaseClient

        .from("repositories")

        .select(
            "id,name,owner_id"
        )

        .eq(
            "owner_id",
            currentUser.id
        )

        .order(
            "name",
            {ascending:true}
        );


    if(error){

        console.error(error);

        repository.innerHTML = `
            <option value="">
                Unable to load repositories
            </option>
        `;

        statusBox.textContent =
        "Unable to load repositories.";

        statusBox.className =
        "status error";

        return;

    }


    if(!repos || repos.length === 0){

        repository.innerHTML = `
            <option value="">
                No repositories found
            </option>
        `;

        statusBox.innerHTML = `
            Create a repository first.
            <br><br>
            <a href="new-repository.html"
               style="color:#58a6ff">
               Create Repository →
            </a>
        `;

        statusBox.className =
        "status";

        return;

    }


    repository.innerHTML =
    `<option value="">
        Select Repository
    </option>`;


    repos.forEach(repo => {

        const option =
        document.createElement("option");

        option.value =
        repo.id;

        option.textContent =
        repo.name;

        repository.appendChild(option);

    });


    statusBox.textContent =
    "Ready to build your webpage.";

    statusBox.className =
    "status";

}


function updatePreview(){

    const html =
    htmlCode.value;

    const css =
    cssCode.value;

    const js =
    jsCode.value;


    const fullPage = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<style>

${css}

</style>

</head>

<body>

${html}

<script>

${js}

<\/script>

</body>

</html>

`;


    preview.srcdoc =
    fullPage;

}


async function savePage(){

    statusBox.textContent =
    "Saving page...";

    statusBox.className =
    "status";


    if(!currentUser){

        window.location.href =
        "login.html";

        return;

    }


    const repoId =
    repository.value;

    const name =
    pageName.value.trim();


    if(!repoId){

        statusBox.textContent =
        "Please select a repository.";

        statusBox.className =
        "status error";

        return;

    }


    if(!name){

        statusBox.textContent =
        "Please enter a page name.";

        statusBox.className =
        "status error";

        return;

    }


    if(!/^[a-zA-Z0-9._-]+$/.test(name)){

        statusBox.textContent =
        "Page name can contain letters, numbers, dot, underscore and hyphen only.";

        statusBox.className =
        "status error";

        return;

    }


    const {
        data:repo,
        error:repoError
    } =
    await supabaseClient

        .from("repositories")

        .select(
            "id,owner_id"
        )

        .eq(
            "id",
            repoId
        )

        .single();


    if(repoError || !repo){

        statusBox.textContent =
        "Repository not found.";

        statusBox.className =
        "status error";

        return;

    }


    if(repo.owner_id !== currentUser.id){

        statusBox.textContent =
        "You are not the owner of this repository.";

        statusBox.className =
        "status error";

        return;

    }


    const {
        data:existing,
        error:existingError
    } =
    await supabaseClient

        .from("web_pages")

        .select("id")

        .eq(
            "repository_id",
            repoId
        )

        .eq(
            "page_name",
            name
        )
        .maybeSingle();


    if(existingError){

        console.error(existingError);

        statusBox.textContent =
        "Unable to check existing page.";

        statusBox.className =
        "status error";

        return;

    }


    if(existing){

        statusBox.textContent =
        "A page with this name already exists.";

        statusBox.className =
        "status error";

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("web_pages")

        .insert({

            repository_id:repoId,

            page_name:name,

            html_content:htmlCode.value,

            css_content:cssCode.value,

            js_content:jsCode.value,

            owner_id:currentUser.id

        });


    if(error){

        console.error(error);

        statusBox.textContent =
        "Unable to save page: " +
        error.message;

        statusBox.className =
        "status error";

        return;

    }


    statusBox.textContent =
    "✅ Page saved successfully!";

    statusBox.className =
    "status success";

}


function goBack(){

    if(repository.value){

        window.location.href =
        "repository-files.html?repository_id=" +
        repository.value;

    }else{

        window.location.href =
        "dashboard.html";

    }

}


htmlCode.addEventListener(
    "input",
    updatePreview
);

cssCode.addEventListener(
    "input",
    updatePreview
);

jsCode.addEventListener(
    "input",
    updatePreview
);


initialize();

</script>

</body>
</html>
