<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - ASIM TECH</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            min-height: 65px;
            background: #010409;
            border-bottom: 1px solid #30363d;

            display: flex;
            align-items: center;

            padding: 10px 20px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .green {
            color: #39d353;
        }

        .profile {
            margin-left: auto;

            color: #c9d1d9;

            text-decoration: none;
        }

        .container {
            max-width: 1000px;

            margin: auto;

            padding: 30px 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 30px;

            margin-bottom: 8px;
        }

        .welcome p {
            color: #8b949e;
        }

        .top-buttons {
            display: flex;

            gap: 12px;

            margin-bottom: 30px;

            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;

            border-radius: 7px;

            text-decoration: none;

            font-weight: bold;

            border: 1px solid #30363d;
        }

        .new-repo {
            background: #238636;
            color: white;
        }

        .new-repo:hover {
            background: #2ea043;
        }

        .settings {
            background: #21262d;
            color: white;
        }

        .section {
            background: #161b22;

            border: 1px solid #30363d;

            border-radius: 10px;

            margin-bottom: 25px;

            overflow: hidden;
        }

        .section-title {
            padding: 18px 20px;

            border-bottom: 1px solid #30363d;

            font-size: 20px;

            font-weight: bold;
        }

        .repo {
            padding: 20px;

            border-bottom: 1px solid #30363d;
        }

        .repo:last-child {
            border-bottom: none;
        }

        .repo h3 {
            color: #58a6ff;

            margin-bottom: 8px;
        }

        .repo p {
            color: #8b949e;

            margin-bottom: 10px;
        }

        .repo-info {
            color: #8b949e;

            font-size: 14px;
        }

        .empty {
            padding: 35px 20px;

            text-align: center;

            color: #8b949e;
        }

        footer {
            text-align: center;

            padding: 30px;

            color: #8b949e;

            border-top: 1px solid #30363d;

            margin-top: 40px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px 15px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .btn {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>


<body>


<nav class="navbar">

    <div class="logo">

        <span class="green">ASIM</span> TECH

    </div>

    <a href="index.html" class="profile">

        Home

    </a>

</nav>



<div class="container">


    <div class="welcome">

        <h1>

            Welcome to ASIM TECH 👋

        </h1>

        <p>

            Your coding dashboard

        </p>

    </div>



    <div class="top-buttons">

        <a href="#" class="btn new-repo">

            ➕ New Repository

        </a>

        <a href="#" class="btn settings">

            ⚙️ Settings

        </a>

    </div>



    <div class="section">

        <div class="section-title">

            📁 Your Repositories

        </div>


        <div class="empty">

            No repositories yet.

            <br><br>

            Create your first repository!

        </div>

    </div>



    <div class="section">

        <div class="section-title">

            ⚡ Recent Activity

        </div>


        <div class="empty">

            Your recent activity will appear here.

        </div>

    </div>


</div>



<footer>

    © 2026 ASIM TECH — Code. Create. Innovate.

</footer>


</body>

</html>
