<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:#ffffff;
}

.navbar{
    min-height:65px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.green{
    color:#39d353;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.home{
    color:#58a6ff;
    text-decoration:none;
    padding:8px 10px;
}

.home:hover{
    text-decoration:underline;
}

.profile{
    color:#ffffff;
    text-decoration:none;
    background:#21262d;
    border:1px solid #30363d;
    padding:9px 13px;
    border-radius:8px;
    font-weight:bold;
}

.profile:hover{
    background:#30363d;
}

.logout{
    color:#ff7b72;
    background:#21262d;
    border:1px solid #30363d;
    padding:9px 13px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
}

.logout:hover{
    background:#30363d;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:35px 20px;
}

.welcome h1{
    font-size:30px;
    margin-bottom:8px;
}

.welcome p{
    color:#8b949e;
}

.top-buttons{
    display:flex;
    gap:12px;
    margin:25px 0;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:11px 17px;
    border-radius:7px;
    text-decoration:none;
    font-weight:bold;
    border:1px solid #30363d;
}

.new-repo{
    background:#238636;
    color:white;
}

.new-repo:hover{
    background:#2ea043;
}

.all-repo{
    background:#21262d;
    color:white;
}

.all-repo:hover{
    background:#30363d;
}

.page-builder{
    background:#1f6feb;
    color:white;
}

.page-builder:hover{
    background:#388bfd;
}

.section{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    margin-bottom:25px;
    overflow:hidden;
}

.section-title{
    padding:18px 20px;
    border-bottom:1px solid #30363d;
    font-size:20px;
    font-weight:bold;
}

.repo{
    padding:20px;
    border-bottom:1px solid #30363d;
}

.repo:last-child{
    border-bottom:none;
}

.repo h3{
    margin-bottom:8px;
}

.repo h3 a{
    color:#58a6ff;
    text-decoration:none;
}

.repo h3 a:hover{
    text-decoration:underline;
}

.repo p{
    color:#8b949e;
    margin-bottom:10px;
}

.repo-info{
    color:#8b949e;
    font-size:14px;
}

.open{
    color:#58a6ff;
    text-decoration:none;
}

.open:hover{
    text-decoration:underline;
}

.badge{
    display:inline-block;
    padding:3px 8px;
    border:1px solid #30363d;
    border-radius:20px;
    font-size:12px;
    margin-left:8px;
}

.empty{
    padding:35px 20px;
    text-align:center;
    color:#8b949e;
}

.loading{
    padding:35px 20px;
    text-align:center;
    color:#58a6ff;
}

.activity-item{
    padding:18px 20px;
    border-bottom:1px solid #30363d;
}

.activity-item:last-child{
    border-bottom:none;
}

.activity-item h3{
    margin-bottom:7px;
}

.activity-item h3 a{
    color:#58a6ff;
    text-decoration:none;
}

.activity-item h3 a:hover{
    text-decoration:underline;
}

.activity-item p{
    color:#8b949e;
    margin-bottom:8px;
}

.activity-info{
    color:#8b949e;
    font-size:13px;
}

footer{
    text-align:center;
    padding:30px;
    color:#8b949e;
    border-top:1px solid #30363d;
    margin-top:40px;
}

@media(max-width:600px){

    .navbar{
        padding:10px 15px;
        flex-wrap:wrap;
        gap:10px;
    }

    .logo{
        font-size:20px;
    }

    .nav-right{
        width:100%;
        justify-content:flex-end;
        flex-wrap:wrap;
    }

    .home,
    .profile,
    .logout{
        font-size:13px;
    }

    .container{
        padding:25px 15px;
    }

    .welcome h1{
        font-size:25px;
    }

    .top-buttons{
        flex-direction:column;
    }

    .btn{
        width:100%;
        text-align:center;
    }

}

</style>

</head>


<body>


<nav class="navbar">


    <div class="logo">

        <span class="green">
            ASIM
        </span>

        TECH

    </div>


    <div class="nav-right">


        <a
            href="index.html"
            class="home"
        >

            Home

        </a>


        <a
            href="profile.html"
            class="profile"
        >

            👤 My Profile

        </a>


        <button
            type="button"
            class="logout"
            onclick="logoutUser()"
        >

            🚪 Logout

        </button>


    </div>


</nav>



<div class="container">


    <div class="welcome">


        <h1>

            Welcome to ASIM TECH 👋

        </h1>


        <p>

            Your coding dashboard

        </p>


    </div>



    <div class="top-buttons">


        <a
            href="new-repository.html"
            class="btn new-repo"
        >

            ➕ New Repository

        </a>



        <a
            href="repositories.html"
            class="btn all-repo"
        >

            📁 All Repositories

        </a>



        <a
            href="page-builder.html"
            class="btn page-builder"
        >

            🌐 Web Page Builder

        </a>


    </div>



    <!-- YOUR REPOSITORIES -->


    <div class="section">


        <div class="section-title">

            📁 Your Repositories

        </div>


        <div id="repoList">


            <div class="loading">

                Loading repositories...

            </div>


        </div>


    </div>



    <!-- RECENT ACTIVITY -->


    <div class="section">


        <div class="section-title">

            ⚡ Recent Activity

        </div>


        <div id="activityList">


            <div class="loading">

                Loading activity...

            </div>


        </div>


    </div>


</div>



<footer>

    © 2026 ASIM TECH — Code. Create. Innovate.

</footer>



<script>


const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



const repoList =
document.getElementById(
    "repoList"
);


const activityList =
document.getElementById(
    "activityList"
);



let currentUser = null;



/* LOAD DASHBOARD */


async function loadDashboard(){


    try{


        const {
            data:{user},
            error:userError
        } =
        await supabaseClient.auth.getUser();


        if(userError){

            throw userError;

        }


        if(!user){

            window.location.href =
            "login.html";

            return;

        }


        currentUser = user;



        /* LOAD REPOSITORIES */


        const {
            data:repos,
            error
        } =
        await supabaseClient

            .from("repositories")

            .select(
                "id,name,description,is_private,created_at,updated_at"
            )

            .eq(
                "owner_id",
                user.id
            )

            .order(
                "updated_at",
                {ascending:false}
            )

            .limit(10);



        if(error){

            throw error;

        }



        if(!repos || repos.length === 0){


            repoList.innerHTML = `

                <div class="empty">

                    No repositories yet.

                    <br><br>

                    <a
                        href="new-repository.html"
                        class="open"
                    >

                        Create your first repository →

                    </a>

                </div>

            `;


        }else{


            repoList.innerHTML =

            repos.map(repo => `


                <div class="repo">


                    <h3>


                        <a
                            href="repository-details.html?id=${encodeURIComponent(repo.id)}"
                        >

                            ${escapeHtml(repo.name)}

                        </a>



                        <span class="badge">

                            ${
                                repo.is_private
                                ? "Private"
                                : "Public"
                            }

                        </span>


                    </h3>



                    <p>


                        ${
                            escapeHtml(
                                repo.description ||
                                "No description"
                            )
                        }


                    </p>



                    <div class="repo-info">


                        Updated:

                        ${
                            formatDate(
                                repo.updated_at ||
                                repo.created_at
                            )
                        }


                        &nbsp; • &nbsp;



                        <a
                            class="open"
                            href="repository-details.html?id=${encodeURIComponent(repo.id)}"
                        >

                            Open Repository →

                        </a>


                    </div>


                </div>


            `).join("");


        }



        /* LOAD RECENT ACTIVITY */


        await loadRecentActivity();


    }catch(error){


        console.error(
            "Dashboard error:",
            error
        );


        repoList.innerHTML = `

            <div class="empty">

                Unable to load repositories.

                <br><br>

                Please refresh the page.

            </div>

        `;


    }


}



/* RECENT ACTIVITY */


async function loadRecentActivity(){


    try{


        const user =
        currentUser;


        if(!user){

            return;

        }



        const [
            repoResult,
            fileResult,
            pageResult
        ] =
        await Promise.all([



            /* REPOSITORIES */


            supabaseClient

                .from("repositories")

                .select(
                    "id,name,created_at,updated_at"
                )

                .eq(
                    "owner_id",
                    user.id
                )

                .order(
                    "updated_at",
                    {ascending:false}
                )

                .limit(10),



            /* FILES */


            supabaseClient

                .from("repository_files")

                .select(
                    "id,file_path,repository_id,created_at,updated_at"
                )

                .order(
                    "updated_at",
                    {ascending:false}
                )

                .limit(10),



            /* WEB PAGES */


            supabaseClient

                .from("web_pages")

                .select(
                    "id,page_name,repository_id,created_at,updated_at"
                )

                .eq(
                    "owner_id",
                    user.id
                )

                .order(
                    "updated_at",
                    {ascending:false}
                )

                .limit(10)


        ]);



        const activities = [];



        /* REPOSITORY ACTIVITY */


        if(
            repoResult.data
        ){


            repoResult.data.forEach(
                repo => {


                    activities.push({

                        title:
                        "📁 Repository: " +
                        repo.name,


                        text:
                        "Repository created or updated",


                        date:
                        repo.updated_at ||
                        repo.created_at,


                        link:
                        "repository-details.html?id=" +
                        encodeURIComponent(
                            repo.id
                        )

                    });


                }
            );


        }



        /* FILE ACTIVITY */


        if(
            fileResult.data
        ){


            fileResult.data.forEach(
                file => {


                    activities.push({

                        title:
                        "📄 File: " +
                        file.file_path,


                        text:
                        "Repository file created or updated",


                        date:
                        file.updated_at ||
                        file.created_at,


                        link:
                        "repository-files.html?repository_id=" +
                        encodeURIComponent(
                            file.repository_id
                        )

                    });


                }
            );


        }



        /* WEB PAGE ACTIVITY */


        if(
            pageResult.data
        ){


            pageResult.data.forEach(
                page => {


                    activities.push({

                        title:
                        "🌐 Web Page: " +
                        page.page_name,


                        text:
                        "Web page created or updated",


                        date:
                        page.updated_at ||
                        page.created_at,


                        link:
                        "repository-files.html?repository_id=" +
                        encodeURIComponent(
                            page.repository_id
                        )

                    });


                }
            );


        }



        /* SORT BY DATE */


        activities.sort(

            (a,b) =>

            new Date(b.date) -
            new Date(a.date)

        );



        /* ONLY 10 */


        const recent =
        activities.slice(
            0,
            10
        );



        if(
            recent.length === 0
        ){


            activityList.innerHTML = `

                <div class="empty">

                    No recent activity yet.

                </div>

            `;


            return;

        }



        /* DISPLAY */


        activityList.innerHTML =


        recent.map(
            activity => `


                <div class="activity-item">


                    <h3>


                        <a
                            href="${activity.link}"
                        >

                            ${escapeHtml(
                                activity.title
                            )}

                        </a>


                    </h3>



                    <p>

                        ${escapeHtml(
                            activity.text
                        )}

                    </p>



                    <div class="activity-info">


                        ${formatDate(
                            activity.date
                        )}


                        &nbsp; • &nbsp;



                        <a
                            class="open"
                            href="${activity.link}"
                        >

                            Open →

                        </a>


                    </div>


                </div>


            `
        ).join("");


    }catch(error){


        console.error(
            "Activity error:",
            error
        );


        activityList.innerHTML = `

            <div class="empty">

                Unable to load recent activity.

            </div>

        `;


    }


}



/* LOGOUT */


async function logoutUser(){


    const logoutButton =
    document.querySelector(
        ".logout"
    );


    try{


        if(logoutButton){

            logoutButton.disabled = true;

            logoutButton.textContent =
            "Logging out...";

        }



        const {
            error
        } =
        await supabaseClient.auth.signOut();



        if(error){

            throw error;

        }



        window.location.href =
        "login.html";


    }catch(error){


        console.error(
            "Logout error:",
            error
        );


        alert(
            "Logout failed: " +
            error.message
        );



        if(logoutButton){

            logoutButton.disabled = false;

            logoutButton.textContent =
            "🚪 Logout";

        }


    }


}



/* ESCAPE HTML */


function escapeHtml(value){


    return String(
        value ?? ""
    ).replace(

        /[&<>"']/g,

        function(character){


            return {


                "&":"&amp;",

                "<":"&lt;",

                ">":"&gt;",

                '"':"&quot;",

                "'":"&#039;"


            }[character];


        }

    );


}



/* FORMAT DATE */


function formatDate(value){


    if(!value){

        return "Unknown";

    }


    return new Date(value)

        .toLocaleDateString(

            "en-IN",

            {

                day:"2-digit",

                month:"short",

                year:"numeric"

            }

        );


}



/* START */


loadDashboard();


</script>


</body>

</html>
