<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apps — ASIM TECH</title>
<meta name="description" content="Create, manage and publish apps with ASIM TECH Platform.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#172033;
    min-height:100vh;
}

header{
    height:68px;
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#111827;
    text-decoration:none;
}

.logo span{
    color:#2563eb;
}

.nav{
    display:flex;
    align-items:center;
    gap:10px;
}

.nav a{
    text-decoration:none;
    color:#4b5563;
    padding:9px 13px;
    border-radius:8px;
    font-size:14px;
}

.nav a:hover{
    background:#f3f4f6;
    color:#111827;
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.container{
    max-width:1150px;
    margin:0 auto;
    padding:42px 22px 70px;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:30px;
}

.title-area h1{
    font-size:34px;
    margin-bottom:8px;
}

.title-area p{
    color:#6b7280;
    font-size:15px;
}

.new-btn{
    border:none;
    background:#2563eb;
    color:#fff;
    padding:13px 20px;
    border-radius:9px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.new-btn:hover{
    background:#1d4ed8;
}

.apps-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.empty{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:55px 25px;
    text-align:center;
    grid-column:1/-1;
}

.empty-icon{
    font-size:48px;
    margin-bottom:15px;
}

.empty h2{
    font-size:21px;
    margin-bottom:8px;
}

.empty p{
    color:#6b7280;
    margin-bottom:22px;
}

.card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:22px;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.card-icon{
    width:48px;
    height:48px;
    border-radius:12px;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    margin-bottom:16px;
}

.card h3{
    font-size:19px;
    margin-bottom:8px;
}

.card p{
    color:#6b7280;
    font-size:14px;
    min-height:40px;
}

.status{
    display:inline-block;
    margin-top:16px;
    padding:5px 9px;
    border-radius:20px;
    background:#f3f4f6;
    color:#4b5563;
    font-size:12px;
    font-weight:600;
}

.card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid #f0f0f0;
}

.open-btn{
    text-decoration:none;
    color:#2563eb;
    font-size:14px;
    font-weight:700;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:16px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-box h2{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:12px;
    font-size:14px;
    outline:none;
    margin-bottom:17px;
}

input:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.cancel-btn{
    border:none;
    background:#f3f4f6;
    color:#374151;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
}

.create-btn{
    border:none;
    background:#2563eb;
    color:#fff;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.message{
    margin-bottom:20px;
    padding:12px 15px;
    border-radius:9px;
    display:none;
    font-size:14px;
}

.message.error{
    display:block;
    background:#fef2f2;
    color:#b91c1c;
}

.loading{
    text-align:center;
    color:#6b7280;
    padding:30px;
}

@media(max-width:700px){
    header{
        padding:0 15px;
    }

    .nav a{
        display:none;
    }

    .container{
        padding:28px 15px 50px;
    }

    .top{
        align-items:flex-start;
        flex-direction:column;
    }

    .title-area h1{
        font-size:28px;
    }

    .new-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <a href="dashboard.html" class="logo">
        ⚡ <span>ASIM TECH</span>
    </a>

    <div class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="repositories.html">Repositories</a>
        <a href="notifications.html">Notifications</a>
        <div class="avatar">AT</div>
    </div>
</header>

<main class="container">

    <div class="top">
        <div class="title-area">
            <h1>📱 Apps</h1>
            <p>Create, manage and publish your own apps with ASIM TECH.</p>
        </div>

        <button class="new-btn" onclick="openModal()">
            + New App
        </button>
    </div>

    <div id="message" class="message"></div>

    <div id="appsGrid" class="apps-grid">
        <div class="loading">
            Loading apps...
        </div>
    </div>

</main>

<!-- New App Modal -->

<div class="modal" id="newAppModal">

    <div class="modal-box">

        <h2>🚀 Create New App</h2>

        <label for="appName">App Name</label>
        <input
            id="appName"
            type="text"
            placeholder="e.g. My Calculator"
            maxlength="100"
        >

        <label for="appDescription">Description</label>
        <textarea
            id="appDescription"
            placeholder="Describe your app..."
            maxlength="500"
        ></textarea>

        <div class="modal-actions">

            <button
                class="cancel-btn"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button
                class="create-btn"
                onclick="createApp()"
            >
                Create App
            </button>

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// Check Login

async function checkLogin(){

    const {
        data:{session}
    } = await supabaseClient.auth.getSession();

    if(!session){

        window.location.href =
            "login.html";

        return null;
    }

    return session.user;
}


// Open Modal

function openModal(){

    document
        .getElementById("newAppModal")
        .classList.add("show");

    document
        .getElementById("appName")
        .focus();
}


// Close Modal

function closeModal(){

    document
        .getElementById("newAppModal")
        .classList.remove("show");

    document
        .getElementById("appName")
        .value = "";

    document
        .getElementById("appDescription")
        .value = "";
}


// Show Error

function showError(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message error";

}


// Load Apps

async function loadApps(){

    const user =
        await checkLogin();

    if(!user) return;

    const grid =
        document.getElementById("appsGrid");

    const {
        data,
        error
    } = await supabaseClient
        .from("apps")
        .select("*")
        .eq("owner_id", user.id)
        .order("created_at", {
            ascending:false
        });

    if(error){

        grid.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <h2>Unable to load apps</h2>
                <p>${escapeHtml(error.message)}</p>
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        grid.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    📱
                </div>

                <h2>No apps yet</h2>

                <p>
                    Create your first app and start building.
                </p>

                <button
                    class="new-btn"
                    onclick="openModal()"
                >
                    + Create Your First App
                </button>

            </div>
        `;

        return;
    }


    grid.innerHTML =
        data.map(app => `

            <div class="card">

                <div class="card-icon">
                    📱
                </div>

                <h3>
                    ${escapeHtml(app.name)}
                </h3>

                <p>
                    ${escapeHtml(
                        app.description || "No description"
                    )}
                </p>

                <span class="status">
                    ${app.is_published
                        ? "✓ Published"
                        : "Draft"
                    }
                </span>

                <div class="card-footer">

                    <span>
                        ${formatDate(app.created_at)}
                    </span>

                    <a
                        href="app-builder.html?id=${app.id}"
                        class="open-btn"
                    >
                        Open App →
                    </a>

                </div>

            </div>

        `).join("");
}


// Create App

async function createApp(){

    const user =
        await checkLogin();

    if(!user) return;


    const name =
        document
            .getElementById("appName")
            .value
            .trim();

    const description =
        document
            .getElementById("appDescription")
            .value
            .trim();


    if(!name){

        showError(
            "Please enter an App Name."
        );

        return;
    }


    const button =
        document.querySelector(".create-btn");

    button.disabled = true;

    button.textContent =
        "Creating...";


    const {
        data,
        error
    } = await supabaseClient
        .from("apps")
        .insert({
            owner_id:user.id,
            name:name,
            description:description
        })
        .select()
        .single();


    if(error){

        showError(
            error.message
        );

        button.disabled = false;

        button.textContent =
            "Create App";

        return;
    }


    closeModal();


    // Open App Builder

    window.location.href =
        "app-builder.html?id=" +
        encodeURIComponent(data.id);
}


// Escape HTML

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


// Date

function formatDate(value){

    if(!value)
        return "";

    const date =
        new Date(value);

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );
}


// Start

loadApps();

</script>

</body>
</html>
