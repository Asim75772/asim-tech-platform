<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   URL PARAMETERS
========================= */

const params =
new URLSearchParams(
window.location.search
);


const repoId =
params.get("repository_id") ||
params.get("id");


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let repository = null;

let allFiles = [];

let filteredFiles = [];

let selectedFile = null;


/* =========================
   INIT
========================= */

async function init(){

try{

if(!repoId){

throw new Error(
"Repository ID is missing."
);

}


/* USER */

const {
data:{user},
error:userError
} =
await supabaseClient.auth.getUser();


if(userError)
throw userError;


if(!user){

window.location.href =
"login.html";

return;

}


currentUser = user;


/* REPOSITORY */

const {
data:repo,
error:repoError
} =
await supabaseClient
.from("repositories")
.select("*")
.eq("id",repoId)
.single();


if(repoError)
throw repoError;


if(!repo)
throw new Error(
"Repository not found."
);


repository = repo;


/* HEADER */

document.getElementById(
"repoName"
).textContent =
repo.name;


document.getElementById(
"repoDescription"
).textContent =
repo.description ||
"Repository File Explorer";


/* BACK */

document.getElementById(
"backButton"
).href =
"repository-details.html?id=" +
encodeURIComponent(repo.id);


/* LOAD FILES */

await loadFiles();


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to load repository."
);

}

}


/* =========================
   LOAD FILES
========================= */

async function loadFiles(){

try{

document.getElementById(
"status"
).textContent =
"Loading files...";


const {
data,
error
} =
await supabaseClient
.from("repository_files")
.select("*")
.eq("repository_id",repoId)
.order(
"file_path",
{ascending:true}
);


if(error)
throw error;


allFiles =
data || [];


filteredFiles =
allFiles.slice();


renderTree(
filteredFiles
);


document.getElementById(
"status"
).textContent =
allFiles.length +
(
allFiles.length === 1
? " file"
: " files"
);


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to load files."
);

}

}


/* =========================
   SEARCH
========================= */

function searchFiles(){

const query =
document.getElementById(
"searchInput"
).value
.trim()
.toLowerCase();


if(!query){

filteredFiles =
allFiles.slice();

}else{

filteredFiles =
allFiles.filter(file =>

(file.file_path || "")
.toLowerCase()
.includes(query)

);

}


renderTree(
filteredFiles
);

}


/* =========================
   FILE ICON
========================= */

function getIcon(file){

if(file.is_binary){

const path =
(file.file_path || "")
.toLowerCase();


if(
path.endsWith(".png") ||
path.endsWith(".jpg") ||
path.endsWith(".jpeg") ||
path.endsWith(".gif") ||
path.endsWith(".webp") ||
path.endsWith(".svg")
){

return "🖼️";

}


if(
path.endsWith(".pdf")
){

return "📕";

}


return "📦";

}


return "📄";

}


/* =========================
   TREE
========================= */

function renderTree(files){

const tree =
document.getElementById(
"tree"
);


tree.innerHTML = "";


if(!files.length){

tree.innerHTML =
'<div class="empty" style="min-height:200px">' +
"No files found." +
"</div>";

return;

}


const root = {

folders:{},

files:[]

};


files.forEach(file => {

const parts =
(file.file_path || "")
.split("/")
.filter(Boolean);


if(!parts.length)
return;


let node = root;


parts.forEach(
(part,index)=>{

const last =
index ===
parts.length - 1;


if(last){

node.files.push({

name:part,

file:file

});

}else{

if(!node.folders[part]){

node.folders[part] = {

folders:{},

files:[]

};

}


node =
node.folders[part];

}

});

});


renderNode(
root,
tree,
""
);

}


/* =========================
   RENDER NODE
========================= */

function renderNode(
node,
container,
path
){

Object.keys(
node.folders
)
.sort()
.forEach(
folderName=>{

const folderPath =
path
?
path + "/" + folderName
:
folderName;


const wrapper =
document.createElement(
"div"
);


const row =
document.createElement(
"div"
);


row.className =
"tree-item folder";


row.innerHTML =

'<span class="folder-arrow">▶</span>' +

'<span class="file-icon">📁</span>' +

'<span class="file-name">' +

escapeHtml(
folderName
) +

'</span>';


const children =
document.createElement(
"div"
);


children.style.display =
"none";


children.style.paddingLeft =
"18px";


row.onclick =
function(){

const arrow =
row.querySelector(
".folder-arrow"
);


if(
children.style.display ===
"none"
){

children.style.display =
"block";

arrow.textContent =
"▼";

}else{

children.style.display =
"none";

arrow.textContent =
"▶";

}

};


wrapper.appendChild(row);

wrapper.appendChild(children);

container.appendChild(wrapper);


renderNode(
node.folders[folderName],
children,
folderPath
);

}

);


/* FILES */

node.files
.sort(
(a,b)=>
a.name.localeCompare(
b.name
)
)
.forEach(
item=>{

const row =
document.createElement(
"div"
);


row.className =
"tree-item";


row.style.paddingLeft =
"30px";


row.innerHTML =

'<span class="file-icon">' +

getIcon(
item.file
) +

'</span>' +

'<span class="file-name">' +

escapeHtml(
item.name
) +

'</span>';


row.onclick =
function(){

document
.querySelectorAll(
".tree-item.active"
)
.forEach(
el =>
el.classList.remove(
"active"
)
);


row.classList.add(
"active"
);


openFile(
item.file
);

};


container.appendChild(
row
);

}

);

}


/* =========================
   OPEN FILE
========================= */

async function openFile(file){

selectedFile =
file;


document.getElementById(
"viewerName"
).textContent =
file.file_path;


document.getElementById(
"viewerActions"
).innerHTML =
"";


document.getElementById(
"viewerBody"
).innerHTML =
'<div class="loading">' +
"Opening file..." +
"</div>";


if(file.is_binary){

await openBinaryFile(
file
);

return;

}


openTextFile(
file
);

}


/* =========================
   OPEN TEXT FILE
========================= */

function openTextFile(file){

const content =
file.content || "";


const editUrl =
"file-editor.html" +

"?file_id=" +
encodeURIComponent(
file.id
) +

"&repository_id=" +
encodeURIComponent(
repoId
);


document.getElementById(
"viewerActions"
).innerHTML =

'<a class="btn" href="' +
editUrl +
'">' +

"✏️ Edit" +

"</a>" +

'<button class="btn" onclick="downloadTextFile()">' +

"⬇ Download" +

"</button>" +

'<button class="btn rename-btn" onclick="renameFile()">' +

"✏️ Rename" +

"</button>" +

'<button class="btn delete-btn" onclick="deleteFile()">' +

"🗑️ Delete" +

"</button>";


document.getElementById(
"viewerBody"
).innerHTML =

"<pre>" +

escapeHtml(
content
) +

"</pre>";

}


/* =========================
   OPEN BINARY FILE
========================= */

async function openBinaryFile(
file
){

if(!file.storage_path){

document.getElementById(
"viewerBody"
).innerHTML =

'<div class="binary-box">' +

"⚠️ Storage path is missing." +

"</div>";

return;

}


try{

const {
data,
error
} =
await supabaseClient
.storage
.from("repository-files")
.createSignedUrl(
file.storage_path,
3600
);


if(error)
throw error;


const url =
data.signedUrl;


const mime =
file.mime_type || "";


document.getElementById(
"viewerActions"
).innerHTML =

'<a class="btn" target="_blank" href="' +
url +
'">' +

"↗ Open" +

"</a>" +

'<a class="btn" download href="' +
url +
'">' +

"⬇ Download" +

"</a>" +

'<button class="btn rename-btn" onclick="renameFile()">' +

"✏️ Rename" +

"</button>" +

'<button class="btn delete-btn" onclick="deleteFile()">' +

"🗑️ Delete" +

"</button>";


if(
mime.startsWith("image/") ||
isImage(file.file_path)
){

document.getElementById(
"viewerBody"
).innerHTML =

'<img class="preview-image" src="' +
url +
'" alt="Preview">';

return;

}


if(
mime === "application/pdf" ||
(file.file_path || "")
.toLowerCase()
.endsWith(".pdf")
){

document.getElementById(
"viewerBody"
).innerHTML =

'<iframe class="preview-frame" src="' +
url +
'"></iframe>';

return;

}


document.getElementById(
"viewerBody"
).innerHTML =

'<div class="binary-box">' +

'<div style="font-size:45px;margin-bottom:15px">' +

getIcon(file) +

"</div>" +

"<p>This file type cannot be previewed here.</p>" +

"<br>" +

'<a class="btn" target="_blank" href="' +
url +
'">' +

"⬇ Download / Open" +

"</a>" +

"</div>";


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to preview file."
);

}

}


/* =========================
   CREATE FOLDER
========================= */

async function createFolder(){

/*
ASK FOLDER NAME
*/

const folderName =
prompt(
"Enter new folder name:"
);


if(folderName === null){

return;

}


const name =
folderName.trim();


if(!name){

showError(
"Folder name cannot be empty."
);

return;

}


/*
INVALID CHARACTERS
*/

if(
name.includes("/") ||
name.includes("\\")
){

showError(
"Please enter only the folder name."
);

return;

}


/*
INVALID SPECIAL NAMES
*/

if(
name === "." ||
name === ".."
){

showError(
"Invalid folder name."
);

return;

}


/*
CHECK EXISTING FOLDER
*/

try{

const folderExists =
allFiles.some(
file => {

const path =
file.file_path || "";

const parts =
path.split("/");

return parts.includes(name);

}
);


if(folderExists){

showError(
"A folder or file with this name already exists."
);

return;

}


/*
CREATE FOLDER MARKER FILE

Supabase database does not store
empty folders directly.

So we create a hidden marker file.
*/

const markerPath =
name + "/.folder";


const {
data,
error
} =
await supabaseClient
.from("repository_files")
.insert({

repository_id:repoId,

file_path:markerPath,

content:"",

language:"text",

is_binary:false,

storage_path:null,

mime_type:"text/plain",

file_size:0

})
.select("*")
.single();


if(error)
throw error;


/*
SUCCESS
*/

showSuccess(
'Folder "' +
name +
'" created successfully.'
);


/*
RELOAD
*/

await loadFiles();


/*
OPEN NEW FOLDER
*/

setTimeout(
function(){

const folderRows =
document.querySelectorAll(
".tree-item.folder"
);


folderRows.forEach(
row=>{

const text =
row.querySelector(
".file-name"
);

if(
text &&
text.textContent ===
name
){

row.click();

}

});

},
300
);


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to create folder."
);

}

}


/* =========================
   DOWNLOAD TEXT FILE
========================= */

function downloadTextFile(){

if(!selectedFile)
return;


const blob =
new Blob(
[
selectedFile.content || ""
],
{
type:
"text/plain;charset=utf-8"
}
);


const url =
URL.createObjectURL(
blob
);


const a =
document.createElement(
"a"
);


a.href =
url;


a.download =
selectedFile.file_path
.split("/")
.pop();


document.body.appendChild(
a
);


a.click();


a.remove();


URL.revokeObjectURL(
url
);

}


/* =========================
   RENAME FILE
========================= */

async function renameFile(){

if(!selectedFile){

showError(
"No file selected."
);

return;

}


const oldPath =
selectedFile.file_path || "";


const oldName =
oldPath.split("/").pop();


const newName =
prompt(
"Enter new file name:",
oldName
);


if(newName === null){

return;

}


const trimmedName =
newName.trim();


if(!trimmedName){

showError(
"File name cannot be empty."
);

return;

}


if(
trimmedName.includes("/") ||
trimmedName.includes("\\")
){

showError(
"Please enter only the file name. Folder path cannot be changed here."
);

return;

}


if(trimmedName === oldName){

return;

}


const folderPath =
oldPath.includes("/")
?
oldPath.substring(
0,
oldPath.lastIndexOf("/")
)
:
"";


const newPath =
folderPath
?
folderPath + "/" + trimmedName
:
trimmedName;


try{

const {
data:existing,
error:checkError
} =
await supabaseClient
.from("repository_files")
.select("id")
.eq("repository_id",repoId)
.eq("file_path",newPath)
.maybeSingle();


if(checkError)
throw checkError;


if(existing){

showError(
"A file with the same name already exists in this folder."
);

return;

}


document.getElementById(
"viewerBody"
).innerHTML =

'<div class="loading">' +

"Renaming file..." +

"</div>";


let newStoragePath =
selectedFile.storage_path || null;


if(
selectedFile.is_binary &&
selectedFile.storage_path
){

const oldStoragePath =
selectedFile.storage_path;


const storageFolder =
oldStoragePath.includes("/")
?
oldStoragePath.substring(
0,
oldStoragePath.lastIndexOf("/")
)
:
"";


newStoragePath =
storageFolder
?
storageFolder + "/" + trimmedName
:
trimmedName;


const {
error:moveError
} =
await supabaseClient
.storage
.from("repository-files")
.move(
oldStoragePath,
newStoragePath
);


if(moveError)
throw moveError;

}


const updateData = {

file_path:newPath

};


if(
selectedFile.is_binary &&
selectedFile.storage_path
){

updateData.storage_path =
newStoragePath;

}


const {
data:updatedFile,
error:updateError
} =
await supabaseClient
.from("repository_files")
.update(updateData)
.eq(
"id",
selectedFile.id
)
.eq(
"repository_id",
repoId
)
.select("*")
.single();


if(updateError)
throw updateError;


selectedFile =
updatedFile;


showSuccess(
"File renamed successfully."
);


await loadFiles();


const renamedFile =
allFiles.find(
file =>
file.id ===
updatedFile.id
);


if(renamedFile){

await openFile(
renamedFile
);

}


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to rename file."
);


await loadFiles();

}

}


/* =========================
   DELETE FILE
========================= */

async function deleteFile(){

if(!selectedFile){

showError(
"No file selected."
);

return;

}


const fileName =
selectedFile.file_path;


const confirmed =
confirm(
'Are you sure you want to delete "' +
fileName +
'"?\n\nThis action cannot be undone.'
);


if(!confirmed){

return;

}


try{

document.getElementById(
"viewerBody"
).innerHTML =

'<div class="loading">' +

"Deleting file..." +

"</div>";


if(
selectedFile.is_binary &&
selectedFile.storage_path
){

const {
error:storageError
} =
await supabaseClient
.storage
.from("repository-files")
.remove([
selectedFile.storage_path
]);


if(storageError)
throw storageError;

}


const {
error
} =
await supabaseClient
.from("repository_files")
.delete()
.eq(
"id",
selectedFile.id
)
.eq(
"repository_id",
repoId
);


if(error)
throw error;


showSuccess(
"File deleted successfully."
);


selectedFile =
null;


document.getElementById(
"viewerName"
).textContent =
"Select a file";


document.getElementById(
"viewerActions"
).innerHTML =
"";


document.getElementById(
"viewerBody"
).innerHTML =

'<div class="empty">' +

"Select a file from the explorer to preview it." +

"</div>";


await loadFiles();


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to delete file."
);

}

}


/* =========================
   IMAGE CHECK
========================= */

function isImage(path){

const p =
(path || "")
.toLowerCase();


return [

".png",
".jpg",
".jpeg",
".gif",
".webp",
".svg"

].some(
ext =>
p.endsWith(ext)
);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
value
){

return String(
value || ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================
   ERROR MESSAGE
========================= */

function showError(
message
){

const box =
document.getElementById(
"error"
);


box.textContent =
"❌ " +
message;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
4000
);

}


/* =========================
   SUCCESS MESSAGE
========================= */

function showSuccess(
message
){

const box =
document.getElementById(
"success"
);


box.textContent =
"✅ " +
message;


box.style.display =
"block";


setTimeout(
function(){

box.style.display =
"none";

},
3000
);

}


/* =========================
   START
========================= */

init();

</script>
