<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   URL PARAMETERS
========================= */

const params =
new URLSearchParams(
window.location.search
);

const repoId =
params.get("repository_id") ||
params.get("id");


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let repository = null;
let allFiles = [];
let filteredFiles = [];
let selectedFile = null;


/* =========================
   INIT
========================= */

async function init(){

try{

if(!repoId){

throw new Error(
"Repository ID is missing."
);

}


/* USER */

const {
data:{user},
error:userError
} =
await supabaseClient.auth.getUser();


if(userError)
throw userError;


if(!user){

window.location.href =
"login.html";

return;

}

currentUser = user;


/* REPOSITORY */

const {
data:repo,
error:repoError
} =
await supabaseClient
.from("repositories")
.select("*")
.eq("id",repoId)
.single();


if(repoError)
throw repoError;


if(!repo)
throw new Error(
"Repository not found."
);


repository = repo;


/* OWNER CHECK */

if(
repo.owner_id !==
user.id
){

throw new Error(
"You are not the repository owner."
);

}


/* HEADER */

document.getElementById(
"repoName"
).textContent =
repo.name;


document.getElementById(
"repoDescription"
).textContent =
repo.description ||
"Repository File Explorer";


/* BACK BUTTON */

document.getElementById(
"backButton"
).href =
"repository-details.html?id=" +
encodeURIComponent(repo.id);


/* LOAD FILES */

await loadFiles();


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to load repository."
);

}

}


/* =========================
   LOAD FILES
========================= */

async function loadFiles(){

try{

document.getElementById(
"status"
).textContent =
"Loading files...";


const {
data,
error
} =
await supabaseClient
.from("repository_files")
.select("*")
.eq("repository_id",repoId)
.order(
"file_path",
{ascending:true}
);


if(error)
throw error;


allFiles =
data || [];


filteredFiles =
allFiles.slice();


renderTree(
filteredFiles
);


document.getElementById(
"status"
).textContent =
allFiles.length +
(
allFiles.length === 1
? " file"
: " files"
);


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to load files."
);

}

}


/* =========================
   SEARCH
========================= */

function searchFiles(){

const query =
document.getElementById(
"searchInput"
).value
.trim()
.toLowerCase();


if(!query){

filteredFiles =
allFiles.slice();

}else{

filteredFiles =
allFiles.filter(
file =>
(file.file_path || "")
.toLowerCase()
.includes(query)
);

}


renderTree(
filteredFiles
);

}


/* =========================
   FILE ICON
========================= */

function getIcon(file){

if(file.is_binary){

const path =
(file.file_path || "")
.toLowerCase();


if(
path.endsWith(".png") ||
path.endsWith(".jpg") ||
path.endsWith(".jpeg") ||
path.endsWith(".gif") ||
path.endsWith(".webp") ||
path.endsWith(".svg")
){

return "🖼️";

}


if(
path.endsWith(".pdf")
){

return "📕";

}


return "📦";

}


return "📄";

}


/* =========================
   TREE
========================= */

function renderTree(files){

const tree =
document.getElementById(
"tree"
);

tree.innerHTML = "";


if(!files.length){

tree.innerHTML =
'<div class="empty" style="min-height:200px">No files found.</div>';

return;

}


const root = {

folders:{},
files:[]

};


files.forEach(
file=>{

const parts =
(file.file_path || "")
.split("/")
.filter(Boolean);


if(!parts.length)
return;


let node = root;


parts.forEach(
(part,index)=>{

const last =
index ===
parts.length - 1;


if(last){

node.files.push({

name:part,
file:file

});

}else{

if(!node.folders[part]){

node.folders[part] = {

folders:{},
files:[]

};

}


node =
node.folders[part];

}

}

);

});


renderNode(
root,
tree,
""
);

}


/* =========================
   RENDER NODE
========================= */

function renderNode(
node,
container,
path
){

Object.keys(
node.folders
)
.sort()
.forEach(
folderName=>{

const folderPath =
path
?
path + "/" + folderName
:
folderName;


const wrapper =
document.createElement(
"div"
);


const row =
document.createElement(
"div"
);


row.className =
"tree-item folder";


row.innerHTML =

'<span class="folder-arrow">▶</span>' +

'<span class="file-icon">📁</span>' +

'<span class="file-name">' +

escapeHtml(
folderName
) +

'</span>';


const children =
document.createElement(
"div"
);


children.style.display =
"none";


children.style.paddingLeft =
"18px";


row.onclick =
function(){

const arrow =
row.querySelector(
".folder-arrow"
);


if(
children.style.display ===
"none"
){

children.style.display =
"block";

arrow.textContent =
"▼";

}else{

children.style.display =
"none";

arrow.textContent =
"▶";

}

};


wrapper.appendChild(
row
);

wrapper.appendChild(
children
);

container.appendChild(
wrapper
);


renderNode(
node.folders[folderName],
children,
folderPath
);

}

);


/* FILES */

node.files
.sort(
(a,b)=>
a.name.localeCompare(
b.name
)
)
.forEach(
item=>{

const row =
document.createElement(
"div"
);


row.className =
"tree-item";


row.style.paddingLeft =
"30px";


row.innerHTML =

'<span class="file-icon">' +

getIcon(
item.file
) +

'</span>' +

'<span class="file-name">' +

escapeHtml(
item.name
) +

'</span>';


row.onclick =
function(){

document
.querySelectorAll(
".tree-item.active"
)
.forEach(
el =>
el.classList.remove(
"active"
)
);


row.classList.add(
"active"
);


openFile(
item.file
);

};


container.appendChild(
row
);

}

);

}


/* =========================
   OPEN FILE
========================= */

async function openFile(file){

selectedFile =
file;


document.getElementById(
"viewerName"
).textContent =
file.file_path;


const actions =
document.getElementById(
"viewerActions"
);


actions.innerHTML = "";


/* =========================
   EDIT BUTTON
========================= */

const editButton =
document.createElement(
"a"
);


editButton.className =
"btn";


editButton.href =
"file-editor.html" +

"?repository_id=" +
encodeURIComponent(
repoId
) +

"&id=" +
encodeURIComponent(
repoId
) +

"&file_id=" +
encodeURIComponent(
file.id
);


editButton.textContent =
"✏️ Edit";


actions.appendChild(
editButton
);


/* =========================
   RENAME BUTTON
========================= */

const renameButton =
document.createElement(
"button"
);


renameButton.className =
"btn rename-btn";


renameButton.textContent =
"✏️ Rename";


renameButton.onclick =
function(){

renameFile(
file
);

};


actions.appendChild(
renameButton
);


/* =========================
   DELETE BUTTON
========================= */

const deleteButton =
document.createElement(
"button"
);


deleteButton.className =
"btn delete-btn";


deleteButton.textContent =
"🗑 Delete";


deleteButton.onclick =
function(){

deleteFile(
file
);

};


actions.appendChild(
deleteButton
);


/* =========================
   DOWNLOAD BUTTON
========================= */

const downloadButton =
document.createElement(
"button"
);


downloadButton.className =
"btn";


downloadButton.textContent =
"⬇ Download";


downloadButton.onclick =
function(){

downloadFile(
file
);

};


actions.appendChild(
downloadButton
);


/* =========================
   PREVIEW
========================= */

document.getElementById(
"viewerBody"
).innerHTML =
'<div class="loading">Opening file...</div>';


/* BINARY */

if(file.is_binary){

await openBinaryFile(
file
);

return;

}


/* TEXT */

const content =
file.content || "";


const path =
(file.file_path || "")
.toLowerCase();


/* HTML PREVIEW */

if(
path.endsWith(".html") ||
path.endsWith(".htm")
){

const frame =
document.createElement(
"iframe"
);


frame.className =
"preview-frame";


frame.sandbox =
"allow-scripts";


frame.srcdoc =
content;


document.getElementById(
"viewerBody"
).appendChild(
frame
);


return;

}


/* TEXT PREVIEW */

document.getElementById(
"viewerBody"
).innerHTML =

"<pre>" +

escapeHtml(
content
) +

"</pre>";

}


/* =========================
   RENAME FILE
========================= */

async function renameFile(file){

if(!file)
return;


if(
!repository ||
repository.owner_id !==
currentUser.id
){

alert(
"You are not allowed to rename this file."
);

return;

}


const oldPath =
file.file_path;


const newPath =
prompt(
"Enter new file name / path:",
oldPath
);


if(newPath === null)
return;


const cleanPath =
newPath.trim();


if(!cleanPath){

alert(
"File name is required."
);

return;

}


if(
cleanPath.startsWith("/") ||
cleanPath.endsWith("/") ||
cleanPath.includes("..")
){

alert(
"Please enter a valid file path."
);

return;

}


if(
cleanPath === oldPath
){

return;

}


try{


/* DUPLICATE CHECK */

const {
data:existing,
error:checkError
} =
await supabaseClient
.from("repository_files")
.select("id")
.eq("repository_id",repoId)
.eq("file_path",cleanPath);


if(checkError)
throw checkError;


if(
existing &&
existing.length > 0
){

alert(
"A file with this name already exists."
);

return;

}


/* UPDATE */

const {
error
} =
await supabaseClient
.from("repository_files")
.update({

file_path:
cleanPath,

updated_at:
new Date().toISOString()

})
.eq("id",file.id)
.eq(
"repository_id",
repoId
);


if(error)
throw error;


/* SUCCESS */

alert(
"File renamed successfully!"
);


/* REFRESH */

selectedFile =
null;


document.getElementById(
"viewerName"
).textContent =
"Select a file";


document.getElementById(
"viewerActions"
).innerHTML =
"";


document.getElementById(
"viewerBody"
).innerHTML =

'<div class="empty">' +

"File renamed successfully." +

"</div>";


await loadFiles();


}catch(error){

console.error(error);

alert(
"Unable to rename file.\n\n" +
(error.message || "")
);

}

}


/* =========================
   DELETE FILE
========================= */

async function deleteFile(file){

if(!file)
return;


if(
!repository ||
repository.owner_id !==
currentUser.id
){

alert(
"You are not allowed to delete this file."
);

return;

}


const confirmed =
confirm(
'Are you sure you want to delete "' +
file.file_path +
'"?\n\nThis action cannot be undone.'
);


if(!confirmed)
return;


try{


/* DELETE STORAGE FILE */

if(
file.is_binary &&
file.storage_path
){

const {
error:storageError
} =
await supabaseClient
.storage
.from("repository-files")
.remove([
file.storage_path
]);


if(storageError){

console.warn(
"Storage delete warning:",
storageError
);

}

}


/* DELETE DATABASE RECORD */

const {
error
} =
await supabaseClient
.from("repository_files")
.delete()
.eq("id",file.id)
.eq(
"repository_id",
repoId
);


if(error)
throw error;


/* RESET */

selectedFile =
null;


document.getElementById(
"viewerName"
).textContent =
"Select a file";


document.getElementById(
"viewerActions"
).innerHTML =
"";


document.getElementById(
"viewerBody"
).innerHTML =

'<div class="empty">' +

"File deleted successfully." +

"</div>";


/* REFRESH */

await loadFiles();


}catch(error){

console.error(error);

alert(
"Unable to delete file.\n\n" +
(error.message || "")
);

}

}


/* =========================
   BINARY PREVIEW
========================= */

async function openBinaryFile(
file
){

try{

if(!file.storage_path){

document.getElementById(
"viewerBody"
).innerHTML =

'<div class="binary-box">' +

"Binary file — no storage path available." +

"</div>";

return;

}


const {
data,
error
} =
await supabaseClient
.storage
.from("repository-files")
.createSignedUrl(
file.storage_path,
300
);


if(error)
throw error;


const url =
data.signedUrl;


const path =
(file.file_path || "")
.toLowerCase();


/* IMAGE */

if(
path.endsWith(".png") ||
path.endsWith(".jpg") ||
path.endsWith(".jpeg") ||
path.endsWith(".gif") ||
path.endsWith(".webp") ||
path.endsWith(".svg")
){

const img =
document.createElement(
"img"
);


img.className =
"preview-image";


img.src =
url;


document.getElementById(
"viewerBody"
).appendChild(
img
);


return;

}


/* PDF */

if(
path.endsWith(".pdf")
){

const frame =
document.createElement(
"iframe"
);


frame.className =
"preview-frame";


frame.src =
url;


document.getElementById(
"viewerBody"
).appendChild(
frame
);


return;

}


/* OTHER BINARY */

document.getElementById(
"viewerBody"
).innerHTML =

'<div class="binary-box">' +

"📦 Binary file<br><br>" +

'<a class="btn" href="' +

escapeAttribute(
url
) +

'" target="_blank">' +

"Open / Download" +

"</a>" +

"</div>";


}catch(error){

console.error(error);

document.getElementById(
"viewerBody"
).innerHTML =

'<div class="binary-box">' +

"Unable to preview this file." +

"</div>";

}

}


/* =========================
   DOWNLOAD
========================= */

async function downloadFile(
file
){

try{

if(file.is_binary){

if(!file.storage_path){

throw new Error(
"Storage path missing."
);

}


const {
data,
error
} =
await supabaseClient
.storage
.from("repository-files")
.createSignedUrl(
file.storage_path,
300
);


if(error)
throw error;


const link =
document.createElement(
"a"
);


link.href =
data.signedUrl;


link.target =
"_blank";


link.download =
file.file_path
.split("/")
.pop();


document.body.appendChild(
link
);


link.click();


link.remove();


return;

}


/* TEXT FILE */

const blob =
new Blob(
[
file.content || ""
],
{
type:
"text/plain;charset=utf-8"
}
);


const url =
URL.createObjectURL(
blob
);


const link =
document.createElement(
"a"
);


link.href =
url;


link.download =
file.file_path
.split("/")
.pop();


document.body.appendChild(
link
);


link.click();


link.remove();


URL.revokeObjectURL(
url
);


}catch(error){

console.error(error);

alert(
"Unable to download file."
);

}

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
value
){

return String(
value || ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(
value
){

return String(
value || ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
);

}

function showError(
message
){

const box =
document.getElementById(
"error"
);


box.textContent =
"❌ " + message;


box.style.display =
"block";

}
