<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repository Explorer — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#0d1117;
    color:#e6edf3;
    min-height:100vh;
}

.navbar{
    min-height:64px;
    background:#010409;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    padding:0 5%;
    gap:25px;
}

.logo{
    font-size:21px;
    font-weight:700;
    color:white;
}

.navbar a{
    color:#e6edf3;
    text-decoration:none;
    font-size:14px;
}

.navbar a:hover{
    color:#58a6ff;
}

.container{
    width:94%;
    max-width:1400px;
    margin:28px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.repo-title{
    font-size:28px;
    font-weight:600;
}

.repo-description{
    color:#8b949e;
    margin-top:7px;
    font-size:14px;
    line-height:1.5;
}

.btn{
    background:#21262d;
    border:1px solid #30363d;
    color:#e6edf3;
    padding:10px 14px;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
}

.btn:hover{
    background:#30363d;
}

.btn-blue{
    background:#1f6feb;
    border-color:#1f6feb;
    color:white;
}

.btn-blue:hover{
    background:#388bfd;
}

.btn-green{
    background:#238636;
    border-color:#238636;
    color:white;
}

.btn-green:hover{
    background:#2ea043;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.branch-select{
    background:#21262d;
    border:1px solid #30363d;
    color:#e6edf3;
    padding:10px 12px;
    border-radius:6px;
    font-size:14px;
    min-width:180px;
    cursor:pointer;
    outline:none;
}

.search{
    flex:1;
    min-width:220px;
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:6px;
    padding:10px 13px;
    color:#e6edf3;
    outline:none;
    font-size:14px;
}

.search:focus,
.branch-select:focus{
    border-color:#58a6ff;
}

.branch-info{
    color:#8b949e;
    margin-bottom:15px;
}

.status{
    display:none;
    padding:13px 15px;
    border-radius:6px;
    margin-bottom:15px;
}

.error{
    background:#3d1f25;
    border:1px solid #f85149;
    color:#ff7b72;
}

.success{
    background:#132b1b;
    border:1px solid #238636;
    color:#3fb950;
}

.layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:20px;
}

.panel{
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:8px;
    overflow:hidden;
}

.panel-header{
    background:#161b22;
    border-bottom:1px solid #30363d;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
}

.file-count{
    color:#8b949e;
    font-size:12px;
    font-weight:400;
}

.file-list{
    min-height:400px;
    max-height:650px;
    overflow:auto;
}

.file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px;
    border-bottom:1px solid #21262d;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:rgba(88,166,255,.2);
}

.file-row:hover{
    background:#161b22;
}

.file-row:active{
    background:#1f2937;
}

.file-row.selected{
    background:#09213d;
    border-left:3px solid #58a6ff;
}

.file-icon{
    width:30px;
    flex-shrink:0;
    text-align:center;
    font-size:22px;
}

.file-main{
    min-width:0;
    flex:1;
}

.file-name{
    color:#58a6ff;
    font-size:15px;
    word-break:break-word;
}

.file-size{
    color:#8b949e;
    font-size:12px;
    margin-top:3px;
}

.viewer{
    min-height:500px;
}

.viewer-header{
    background:#161b22;
    border-bottom:1px solid #30363d;
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.viewer-name{
    font-weight:600;
    word-break:break-word;
}

.viewer-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.viewer-body{
    min-height:440px;
}

pre{
    margin:0;
    padding:20px;
    min-height:440px;
    background:#0d1117;
    color:#c9d1d9;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    font-size:13px;
    line-height:1.6;
}

.empty{
    padding:60px 20px;
    text-align:center;
    color:#8b949e;
}

.binary-box{
    padding:60px 20px;
    text-align:center;
    color:#8b949e;
}

.binary-icon{
    font-size:55px;
    margin-bottom:15px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:480px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:8px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:12px;
}

.modal-box p{
    color:#8b949e;
    margin-bottom:18px;
}

.input{
    width:100%;
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:6px;
    padding:11px 12px;
    color:#e6edf3;
    outline:none;
    margin-bottom:15px;
}

.input:focus{
    border-color:#58a6ff;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

@media(max-width:800px){

    .layout{
        grid-template-columns:1fr;
    }

    .file-list{
        max-height:450px;
    }
}

@media(max-width:600px){

    .container{
        width:92%;
        margin:20px auto;
    }

    .navbar{
        padding:0 4%;
        gap:15px;
    }

    .navbar a{
        font-size:12px;
    }

    .logo{
        font-size:19px;
    }

    .repo-title{
        font-size:23px;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .branch-select,
    .search,
    .toolbar .btn{
        width:100%;
    }

    .file-row{
        min-height:64px;
        padding:16px 12px;
    }

    .viewer-actions{
        width:100%;
    }

    .viewer-actions .btn{
        flex:1;
        text-align:center;
    }

    pre{
        font-size:12px;
        padding:15px;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">⚡ ASIM TECH</div>

    <a href="index.html">Home</a>

    <a href="repositories.html">Repositories</a>

    <a href="dashboard.html">Dashboard</a>

</nav>


<div class="container">

    <div class="header">

        <div>

            <div class="repo-title">
                📁 <span id="repoName">Repository</span>
            </div>

            <div
                id="repoDescription"
                class="repo-description">
                Repository File Explorer
            </div>

        </div>

        <a
            id="backButton"
            class="btn"
            href="#">
            ← Repository
        </a>

    </div>


    <div
        id="error"
        class="status error">
    </div>


    <div
        id="success"
        class="status success">
    </div>


    <div class="branch-info">

        Current branch:
        <strong id="branchLabel">Loading...</strong>

    </div>


    <div class="toolbar">

        <select
            id="branchSelect"
            class="branch-select"
            onchange="switchBranch(this.value)">
        </select>


        <button
            class="btn btn-green"
            onclick="openCreateBranch()">
            ＋ New Branch
        </button>


        <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="🔎 Search files..."
            oninput="filterFiles()">


        <button
            class="btn"
            onclick="loadFiles()">
            ↻ Refresh
        </button>

    </div>


    <div class="layout">


        <!-- FILE LIST -->

        <div class="panel">

            <div class="panel-header">

                <div>
                    📂 Files &amp; Folders
                </div>

                <div
                    id="fileCount"
                    class="file-count">
                    0 files
                </div>

            </div>


            <div
                id="fileList"
                class="file-list">

                <div class="empty">
                    Loading files...
                </div>

            </div>

        </div>


        <!-- VIEWER -->

        <div class="panel viewer">

            <div class="viewer-header">

                <div
                    id="viewerName"
                    class="viewer-name">
                    Select a file
                </div>


                <div
                    id="viewerActions"
                    class="viewer-actions">
                </div>

            </div>


            <div
                id="viewerBody"
                class="viewer-body">

                <div class="empty">
                    Select a file from the explorer to preview it.
                </div>

            </div>

        </div>

    </div>

</div>


<!-- CREATE BRANCH MODAL -->

<div
    id="branchModal"
    class="modal">

    <div class="modal-box">

        <h2>🌿 Create New Branch</h2>

        <p>
            Create a separate branch for this repository.
        </p>

        <input
            id="branchNameInput"
            class="input"
            type="text"
            placeholder="Enter branch name">

        <div class="modal-actions">

            <button
                class="btn"
                onclick="closeCreateBranch()">
                Cancel
            </button>

            <button
                class="btn btn-green"
                onclick="createBranch()">
                Create Branch
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let repoId = null;
let repo = null;
let user = null;

let branches = [];
let currentBranch = null;

let files = [];
let selectedFile = null;


/* =====================================================
   GET PARAMETERS
===================================================== */

function getRepositoryId(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    return (
        params.get("repository_id") ||
        params.get("repo_id") ||
        params.get("repository") ||
        params.get("id")
    );
}


function getBranchId(){

    const params =
    new URLSearchParams(
        window.location.search
    );

    return (
        params.get("branch_id") ||
        params.get("branch")
    );
}


/* =====================================================
   STATUS
===================================================== */

function showError(message){

    const box =
    document.getElementById("error");

    box.textContent =
    "❌ " + message;

    box.style.display =
    "block";
}


function showSuccess(message){

    const box =
    document.getElementById("success");

    box.textContent =
    "✓ " + message;

    box.style.display =
    "block";

    setTimeout(() => {

        box.style.display =
        "none";

    },3000);
}


function hideError(){

    document.getElementById(
        "error"
    ).style.display =
    "none";
}


/* =====================================================
   INIT
===================================================== */

async function init(){

    hideError();

    repoId =
    getRepositoryId();

    if(!repoId){

        showError(
            "Repository ID is missing."
        );

        return;
    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getUser();

        if(!error){

            user =
            data?.user || null;

        }


        await loadRepository();

        await loadBranches();

        await loadFiles();

    }
    catch(error){

        console.error(error);

        showError(
            error.message ||
            "Unable to load repository."
        );
    }
}


/* =====================================================
   LOAD REPOSITORY
===================================================== */

async function loadRepository(){

    const {
        data,
        error
    } =
    await supabaseClient

    .from("repositories")

    .select("*")

    .eq(
        "id",
        repoId
    )

    .single();


    if(error){

        throw error;
    }


    if(!data){

        throw new Error(
            "Repository not found."
        );
    }


    repo =
    data;


    document.getElementById(
        "repoName"
    ).textContent =
    data.name;


    document.getElementById(
        "repoDescription"
    ).textContent =
    data.description ||
    "Repository File Explorer";


    document.getElementById(
        "backButton"
    ).href =
    "repository-details.html?id=" +
    encodeURIComponent(repoId);
}


/* =====================================================
   LOAD BRANCHES
===================================================== */

async function loadBranches(){

    const {
        data,
        error
    } =
    await supabaseClient

    .from("repository_branches")

    .select("*")

    .eq(
        "repository_id",
        repoId
    )

    .order(
        "created_at",
        {
            ascending:true
        }
    );


    if(error){

        throw error;
    }


    branches =
    data || [];


    if(branches.length === 0){

        throw new Error(
            "No branches found for this repository."
        );
    }


    const urlBranchId =
    getBranchId();


    let selectedBranch = null;


    if(urlBranchId){

        selectedBranch =
        branches.find(
            branch =>
            branch.id === urlBranchId
        );
    }


    if(!selectedBranch){

        selectedBranch =
        branches.find(
            branch =>
            branch.name === repo.default_branch
        );
    }


    if(!selectedBranch){

        selectedBranch =
        branches.find(
            branch =>
            branch.name === "main"
        );
    }


    if(!selectedBranch){

        selectedBranch =
        branches[0];
    }


    currentBranch =
    selectedBranch;


    const select =
    document.getElementById(
        "branchSelect"
    );


    select.innerHTML =
    "";


    branches.forEach(
        branch => {

            const option =
            document.createElement(
                "option"
            );

            option.value =
            branch.id;

            option.textContent =
            "🌿 " + branch.name;


            if(
                branch.id ===
                currentBranch.id
            ){

                option.selected =
                true;
            }


            select.appendChild(
                option
            );
        }
    );


    updateBranchLabel();
}


/* =====================================================
   BRANCH LABEL
===================================================== */

function updateBranchLabel(){

    document.getElementById(
        "branchLabel"
    ).textContent =
    currentBranch
    ? currentBranch.name
    : "Unknown";
}


/* =====================================================
   SWITCH BRANCH
===================================================== */

async function switchBranch(branchId){

    const branch =
    branches.find(
        b => b.id === branchId
    );


    if(!branch){

        return;
    }


    currentBranch =
    branch;


    selectedFile =
    null;


    updateBranchLabel();

    clearViewer();

    await loadFiles();
}


/* =====================================================
   LOAD FILES
===================================================== */

async function loadFiles(){

    if(!currentBranch){

        return;
    }


    const fileList =
    document.getElementById(
        "fileList"
    );


    fileList.innerHTML =
    '<div class="empty">Loading files...</div>';


    const {
        data,
        error
    } =
    await supabaseClient

    .from("repository_files")

    .select("*")

    .eq(
        "repository_id",
        repoId
    )

    .eq(
        "branch_id",
        currentBranch.id
    )

    .order(
        "file_path",
        {
            ascending:true
        }
    );


    if(error){

        showError(
            error.message
        );

        return;
    }


    files =
    data || [];


    renderFiles(files);
}


/* =====================================================
   RENDER FILES
===================================================== */

function renderFiles(fileData){

    const fileList =
    document.getElementById(
        "fileList"
    );


    fileList.innerHTML =
    "";


    document.getElementById(
        "fileCount"
    ).textContent =
    fileData.length +
    (
        fileData.length === 1
        ? " file"
        : " files"
    );


    if(fileData.length === 0){

        fileList.innerHTML =
        '<div class="empty">' +
        '📂<br><br>' +
        'No files in this branch.' +
        '</div>';

        return;
    }


    fileData.forEach(
        file => {

            const row =
            document.createElement(
                "div"
            );


            row.className =
            "file-row";


            row.dataset.fileId =
            file.id;


            row.innerHTML =

            '<div class="file-icon">' +
            getFileIcon(file) +
            '</div>' +

            '<div class="file-main">' +

            '<div class="file-name">' +
            escapeHtml(
                file.file_path
            ) +
            '</div>' +

            '<div class="file-size">' +
            formatFileSize(
                file.file_size
            ) +
            '</div>' +

            '</div>';


            row.addEventListener(
                "click",
                function(){

                    selectFile(
                        file.id
                    );

                }
            );


            fileList.appendChild(
                row
            );
        }
    );
}


/* =====================================================
   SELECT FILE
===================================================== */

function selectFile(fileId){

    const file =
    files.find(
        f => f.id === fileId
    );


    if(!file){

        showError(
            "File not found."
        );

        return;
    }


    selectedFile =
    file;


    document.querySelectorAll(
        ".file-row"
    ).forEach(
        row => {

            row.classList.remove(
                "selected"
            );


            if(
                row.dataset.fileId ===
                file.id
            ){

                row.classList.add(
                    "selected"
                );
            }
        }
    );


    showFileViewer(file);
}


/* =====================================================
   SHOW FILE VIEWER
===================================================== */

function showFileViewer(file){

    document.getElementById(
        "viewerName"
    ).textContent =
    "📄 " + file.file_path;


    const actions =
    document.getElementById(
        "viewerActions"
    );


    actions.innerHTML =
    "";


    /* EDIT */

    const editButton =
    document.createElement(
        "a"
    );


    editButton.className =
    "btn btn-blue";


    editButton.textContent =
    "✏️ Edit";


    let editUrl =
    "file-editor.html" +

    "?file_id=" +
    encodeURIComponent(
        file.id
    ) +

    "&repository_id=" +
    encodeURIComponent(
        repoId
    );


    if(
        currentBranch &&
        currentBranch.id
    ){

        editUrl +=
        "&branch_id=" +
        encodeURIComponent(
            currentBranch.id
        );
    }


    editButton.href =
    editUrl;


    actions.appendChild(
        editButton
    );


    /* DOWNLOAD */

    const downloadButton =
    document.createElement(
        "button"
    );


    downloadButton.className =
    "btn";


    downloadButton.textContent =
    "⬇️ Download";


    downloadButton.onclick =
    function(){

        downloadFile(file);

    };


    actions.appendChild(
        downloadButton
    );


    /* PREVIEW */

    if(
        isHtmlFile(
            file.file_path
        )
    ){

        const previewButton =
        document.createElement(
            "button"
        );


        previewButton.className =
        "btn";


        previewButton.textContent =
        "👁️ Preview";


        previewButton.onclick =
        function(){

            previewHtmlFile(file);

        };


        actions.appendChild(
            previewButton
        );
    }


    /* VIEW CONTENT */

    const body =
    document.getElementById(
        "viewerBody"
    );


    body.innerHTML =
    "";


    if(file.is_binary){

        body.innerHTML =

        '<div class="binary-box">' +

        '<div class="binary-icon">📦</div>' +

        '<h3>Binary File</h3>' +

        '<p style="margin-top:10px">' +

        escapeHtml(
            file.file_path
        ) +

        '</p>' +

        '<p style="margin-top:8px">' +

        formatFileSize(
            file.file_size
        ) +

        '</p>' +

        '</div>';

        return;
    }


    const pre =
    document.createElement(
        "pre"
    );


    pre.textContent =
    file.content || "";


    body.appendChild(
        pre
    );
}


/* =====================================================
   ⭐ REAL HTML PREVIEW
===================================================== */

function previewHtmlFile(file){

    if(
        !file ||
        file.is_binary
    ){

        return;
    }


    const html =
    file.content || "";


    if(!html.trim()){

        alert(
            "This HTML file is empty."
        );

        return;
    }


    /*
       Create a temporary HTML document
       directly from repository_files content.
    */

    const blob =
    new Blob(
        [html],
        {
            type:"text/html;charset=utf-8"
        }
    );


    const previewUrl =
    URL.createObjectURL(
        blob
    );


    /*
       Open actual rendered website
       in a new browser tab.
    */

    const newWindow =
    window.open(
        previewUrl,
        "_blank"
    );


    if(!newWindow){

        /*
           Popup blocked fallback.
        */

        const link =
        document.createElement(
            "a"
        );

        link.href =
        previewUrl;

        link.target =
        "_blank";

        link.rel =
        "noopener";

        link.click();
    }


    /*
       Keep URL alive long enough for
       mobile browser to load it.
    */

    setTimeout(
        function(){

            URL.revokeObjectURL(
                previewUrl
            );

        },
        60000
    );
}


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadFile(file){

    if(file.is_binary){

        alert(
            "Binary file download is not available from this viewer."
        );

        return;
    }


    const blob =
    new Blob(
        [
            file.content || ""
        ],
        {
            type:
            "text/plain;charset=utf-8"
        }
    );


    const url =
    URL.createObjectURL(
        blob
    );


    const link =
    document.createElement(
        "a"
    );


    link.href =
    url;


    link.download =
    file.file_path
    .split("/")
    .pop();


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );
}

/* =====================================================
   SEARCH
===================================================== */

function filterFiles(){

    const query =
    document.getElementById(
        "searchInput"
    ).value
    .trim()
    .toLowerCase();


    if(!query){

        renderFiles(files);

        return;
    }


    const filtered =
    files.filter(
        file =>
        file.file_path
        .toLowerCase()
        .includes(query)
    );


    renderFiles(
        filtered
    );
}

/* =====================================================
   CREATE BRANCH
===================================================== */

async function createBranch(){

    const input =
    document.getElementById(
        "branchNameInput"
    );


    const branchName =
    input.value.trim();


    if(!branchName){

        alert(
            "Please enter a branch name."
        );

        return;
    }


    if(
        branchName.includes(" ")
    ){

        alert(
            "Branch name cannot contain spaces."
        );

        return;
    }


    if(!user){

        alert(
            "Please login first."
        );

        return;
    }


    const {
        data:existing,
        error:checkError
    } =
    await supabaseClient

    .from("repository_branches")

    .select("id")

    .eq(
        "repository_id",
        repoId
    )

    .eq(
        "name",
        branchName
    );


    if(checkError){

        alert(
            checkError.message
        );

        return;
    }


    if(
        existing &&
        existing.length > 0
    ){

        alert(
            "This branch already exists."
        );

        return;
    }


    const {
        data:newBranch,
        error
    } =
    await supabaseClient

    .from("repository_branches")

    .insert({

        repository_id:
        repoId,

        name:
        branchName,

        created_by:
        user.id

    })

    .select()

    .single();


    if(error){

        alert(
            error.message
        );

        return;
    }


    showSuccess(
        "Branch created successfully."
    );


    closeCreateBranch();


    await loadBranches();


    if(newBranch){

        currentBranch =
        newBranch;


        document.getElementById(
            "branchSelect"
        ).value =
        newBranch.id;


        updateBranchLabel();

        await loadFiles();
    }
}


/* =====================================================
   FILE ICON
===================================================== */

function getFileIcon(file){

    if(file.is_binary){

        return "📦";
    }


    const path =
    file.file_path
    .toLowerCase();


    if(
        path.endsWith(".html") ||
        path.endsWith(".htm")
    ){

        return "🌐";
    }


    if(
        path.endsWith(".css")
    ){

        return "🎨";
    }


    if(
        path.endsWith(".js")
    ){

        return "📜";
    }


    if(
        path.endsWith(".json")
    ){

        return "🧩";
    }


    if(
        path.endsWith(".md")
    ){

        return "📝";
    }


    if(
        path.endsWith(".png") ||
        path.endsWith(".jpg") ||
        path.endsWith(".jpeg") ||
        path.endsWith(".webp") ||
        path.endsWith(".gif")
    ){

        return "🖼️";
    }


    return "📄";
}


/* =====================================================
   HTML CHECK
===================================================== */

function isHtmlFile(path){

    const lower =
    String(path)
    .toLowerCase();


    return (
        lower.endsWith(".html") ||
        lower.endsWith(".htm")
    );
}


/* =====================================================
   FILE SIZE
===================================================== */

function formatFileSize(size){

    if(
        size === null ||
        size === undefined ||
        size === ""
    ){

        return "Text file";
    }


    const number =
    Number(size);


    if(isNaN(number)){

        return "Text file";
    }


    if(number < 1024){

        return number + " B";
    }


    if(
        number <
        1024 * 1024
    ){

        return (
            number / 1024
        ).toFixed(1) +
        " KB";
    }


    return (
        number /
        (1024 * 1024)
    ).toFixed(1) +
    " MB";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}
