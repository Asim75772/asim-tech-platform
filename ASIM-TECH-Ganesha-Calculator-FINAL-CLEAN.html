<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ASIM TECH Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
.app{
 width:100%;height:100vh;max-width:520px;margin:auto;position:relative;
 background:url("https://upload.wikimedia.org/wikipedia/commons/5/58/Lord_Ganesha.jpg") center center/cover no-repeat;
 padding:12px 14px 8px;overflow:hidden
}
.app:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:0}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
h1{margin:0;text-align:center;color:#fff;font-size:29px;line-height:1.15;text-shadow:0 2px 5px #000}
.sub{margin:4px 0 10px;text-align:center;color:#fff;font-size:16px;text-shadow:0 2px 4px #000}
.display{
 height:92px;flex:none;border:1px solid rgba(255,255,255,.55);border-radius:30px;
 background:rgba(5,15,25,.58);color:#fff;display:flex;align-items:center;
 justify-content:flex-end;padding:10px 24px;font-size:50px;overflow:hidden;
 box-shadow:0 5px 14px rgba(0,0,0,.3)
}
.keys{
 flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
 grid-template-rows:repeat(5,1fr);gap:9px;margin-top:12px
}
button{
 min-height:0;border:1px solid rgba(255,255,255,.4);border-radius:22px;
 background:rgba(8,18,28,.78);color:white;font-size:27px;font-weight:bold;
 box-shadow:0 4px 9px rgba(0,0,0,.3)
}
button:active{transform:scale(.96)}
.ac{background:rgba(245,0,0,.94)}.op{background:rgba(255,145,0,.95)}
.eq{background:rgba(0,205,55,.95)}.zero{grid-column:span 2}
.footer{height:23px;flex:none;text-align:center;color:#fff;font-size:13px;font-weight:bold;text-shadow:0 2px 4px #000}
@media(min-height:800px){
 .display{height:105px}.keys{gap:11px;margin-top:14px}button{font-size:29px}
 .footer{height:27px;font-size:14px}
}
</style>
</head>
<body>
<div class="app"><div class="content">
<h1>ASIM TECH Calculator</h1>
<div class="sub">Calculate with Positive Vibes</div>
<div id="display" class="display">0</div>
<div class="keys">
<button class="ac" onclick="clearAll()">AC</button>
<button onclick="backspace()">⌫</button>
<button onclick="percent()">%</button>
<button class="op" onclick="press('/')">÷</button>
<button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('*')">×</button>
<button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('-')">−</button>
<button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button>
<button class="zero" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="eq" onclick="calculate()">=</button>
</div>
<div class="footer">|| गणेशाय नमः || • ASIM TECH</div>
</div></div>
<script>
let expr="",d=document.getElementById("display");
function update(){d.textContent=expr||"0"}
function press(v){expr+=v;update()}
function clearAll(){expr="";update()}
function backspace(){expr=expr.slice(0,-1);update()}
function percent(){if(expr){let n=parseFloat(expr);if(!isNaN(n)){expr=String(n/100);update()}}}
function calculate(){
 try{if(!expr)return;if(!/^[0-9+\-*\/().\s]+$/.test(expr))throw 0;
 expr=String(Function("return ("+expr+")")());update()}
 catch(e){d.textContent="Error";setTimeout(clearAll,900)}
}
</script>
</body>
</html>
