<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - ASIM TECH</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #39d353;
        }

        .tagline {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
        }

        .box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #c9d1d9;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #39d353;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #8b949e;
        }

        .login a {
            color: #58a6ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>ASIM</span> TECH
    </div>

    <p class="tagline">
        Code. Create. Innovate.
    </p>

    <div class="box">

        <h2>Set New Password</h2>

        <form id="passwordForm">

            <label for="password">
                New Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button
                type="submit"
                id="updateBtn">
                Update Password
            </button>

        </form>

        <div id="message"></div>

    </div>

    <div class="login">
        Remember your password?
        <a href="login.html">
            Sign In
        </a>
    </div>

</div>


<script>

/* ==============================
   SUPABASE CONFIGURATION
   ============================== */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


/* ==============================
   SUPABASE CLIENT
   ============================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==============================
   ELEMENTS
   ============================== */

const passwordForm =
    document.getElementById("passwordForm");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const updateBtn =
    document.getElementById("updateBtn");

const message =
    document.getElementById("message");


/* ==============================
   UPDATE PASSWORD
   ============================== */

passwordForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        message.textContent = "";


        /* Check password */

        if (password.length < 6) {

            message.style.color =
                "#ff7b72";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        /* Check matching passwords */

        if (password !== confirmPassword) {

            message.style.color =
                "#ff7b72";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        updateBtn.disabled = true;

        updateBtn.textContent =
            "Updating...";


        try {

            const { error } =
                await supabaseClient.auth
                    .updateUser({
                        password: password
                    });


            if (error) {
                throw error;
            }


            message.style.color =
                "#39d353";

            message.textContent =
                "Password updated successfully!";


            passwordForm.reset();


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);


        } catch (error) {

            message.style.color =
                "#ff7b72";

            message.textContent =
                error.message ||
                "Unable to update password.";

            updateBtn.disabled = false;

            updateBtn.textContent =
                "Update Password";
        }

    }
);

</script>

</body>
</html>
