<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ASIM TECH</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .container {
            width: 100%;
            max-width: 420px;
        }


        .logo {
            text-align: center;

            font-size: 34px;
            font-weight: bold;

            margin-bottom: 8px;
        }


        .logo .green {
            color: #39d353;
        }


        .tagline {
            text-align: center;

            color: #8b949e;

            margin-bottom: 25px;
        }


        .box {
            background: #161b22;

            border: 1px solid #30363d;

            border-radius: 10px;

            padding: 28px;
        }


        h2 {
            margin-bottom: 22px;

            font-size: 24px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #c9d1d9;
        }


        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            background: #0d1117;

            border: 1px solid #30363d;

            border-radius: 6px;

            color: white;

            font-size: 16px;
        }


        input:focus {
            outline: none;

            border-color: #39d353;
        }


        button {
            width: 100%;

            padding: 13px;

            background: #238636;

            border: none;

            border-radius: 6px;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {
            background: #2ea043;
        }


        .signup {
            text-align: center;

            margin-top: 20px;

            color: #8b949e;
        }


        .signup a {
            color: #58a6ff;

            text-decoration: none;
        }


        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #8b949e;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        <span class="green">ASIM</span> TECH

    </div>


    <p class="tagline">

        Code. Create. Innovate.

    </p>



    <div class="box">


        <h2>

            Sign in to ASIM TECH

        </h2>


        <form>


            <label>

                Username or Email

            </label>


            <input
                type="text"
                placeholder="Username or email"
                required
            >



            <label>

                Password

            </label>


            <input
                type="password"
                placeholder="Password"
                required
            >



            <button type="submit">

                Sign In

            </button>


        </form>



        <div class="signup">

            New to ASIM TECH?

            <a href="signup.html">

                Create an account

            </a>

        </div>



        <a href="index.html" class="back">

            ← Back to Home

        </a>


    </div>


</div>


</body>

</html>
