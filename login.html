<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - ASIM TECH</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #39d353;
        }

        .tagline {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
        }

        .box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #c9d1d9;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #39d353;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .forgot {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 18px;
        }

        .forgot a,
        .signup a {
            color: #58a6ff;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot a:hover,
        .signup a:hover {
            text-decoration: underline;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #8b949e;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>ASIM</span> TECH
    </div>

    <p class="tagline">
        Code. Create. Innovate.
    </p>

    <div class="box">

        <h2 id="pageTitle">
            Sign in to ASIM TECH
        </h2>

        <!-- LOGIN FORM -->

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                placeholder="Your password"
                required
            >

            <div class="forgot">
                <a id="forgotLink">
                    Forgot password?
                </a>
            </div>

            <button
                type="submit"
                id="loginBtn">
                Sign In
            </button>

        </form>


        <!-- RESET PASSWORD FORM -->

        <form id="resetForm" class="hidden">

            <label for="resetEmail">
                Enter your email
            </label>

            <input
                id="resetEmail"
                type="email"
                placeholder="you@example.com"
                required
            >

            <button
                type="submit"
                id="resetBtn">
                Send Reset Link
            </button>

            <div style="text-align:center; margin-top:15px;">
                <a id="backToLogin"
                   style="color:#58a6ff; cursor:pointer;">
                    Back to Sign In
                </a>
            </div>

        </form>


        <div id="message"></div>

    </div>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">
            Create account
        </a>
    </div>

</div>


<script>

/* =================================
   SUPABASE CONFIGURATION
   ================================= */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


/* =================================
   CREATE SUPABASE CLIENT
   ================================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =================================
   ELEMENTS
   ================================= */

const loginForm =
    document.getElementById("loginForm");

const resetForm =
    document.getElementById("resetForm");

const loginBtn =
    document.getElementById("loginBtn");

const resetBtn =
    document.getElementById("resetBtn");

const message =
    document.getElementById("message");

const forgotLink =
    document.getElementById("forgotLink");

const backToLogin =
    document.getElementById("backToLogin");

const pageTitle =
    document.getElementById("pageTitle");


/* =================================
   FORGOT PASSWORD PAGE
   ================================= */

forgotLink.addEventListener(
    "click",
    function () {

        loginForm.classList.add("hidden");
        resetForm.classList.remove("hidden");

        pageTitle.textContent =
            "Reset your password";

        message.textContent = "";

        const email =
            document.getElementById("email").value.trim();

        if (email) {
            document.getElementById("resetEmail").value =
                email;
        }
    }
);


/* =================================
   BACK TO LOGIN
   ================================= */

backToLogin.addEventListener(
    "click",
    function () {

        resetForm.classList.add("hidden");
        loginForm.classList.remove("hidden");

        pageTitle.textContent =
            "Sign in to ASIM TECH";

        message.textContent = "";
    }
);


/* =================================
   LOGIN
   ================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        message.style.color = "#8b949e";

        message.textContent =
            "Signing in...";

        loginBtn.disabled = true;

        loginBtn.textContent =
            "Signing in...";


        try {

            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            if (error) {
                throw error;
            }


            message.style.color =
                "#39d353";

            message.textContent =
                "Login successful!";


            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                800
            );


        } catch (error) {

            message.style.color =
                "#ff7b72";

            message.textContent =
                error.message ||
                "Login failed.";

            loginBtn.disabled = false;

            loginBtn.textContent =
                "Sign In";
        }

    }
);


/* =================================
   SEND PASSWORD RESET EMAIL
   ================================= */

resetForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const email =
            document
                .getElementById("resetEmail")
                .value
                .trim();

        message.style.color =
            "#8b949e";

        message.textContent =
            "Sending reset link...";

        resetBtn.disabled = true;

        resetBtn.textContent =
            "Sending...";


        try {

            const { error } =
                await supabaseClient.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                window.location.pathname
                        }
                    );


            if (error) {
                throw error;
            }


            message.style.color =
                "#39d353";

            message.textContent =
                "Password reset link sent. Please check your email.";


        } catch (error) {

            message.style.color =
                "#ff7b72";

            message.textContent =
                error.message ||
                "Unable to send reset link.";

        }


        resetBtn.disabled = false;

        resetBtn.textContent =
            "Send Reset Link";

    }
);

</script>

</body>
</html>
