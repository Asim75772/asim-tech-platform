.blue{

.orange{

input,

<nav>

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   APP ID
===================================================== */

const appId =
  new URLSearchParams(
    location.search
  ).get("id");


let user = null;
let app = null;


/* =====================================================
   SHORT DOM FUNCTION
===================================================== */

const $ =
  id => document.getElementById(id);


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  className = ""
){

  $("status").textContent = text;

  $("status").className =
    "status " + className;

}


function sourceStatus(
  text,
  className = ""
){

  $("webAppStatus").textContent =
    text;

  $("webAppStatus").className =
    "status " + className;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


/* =====================================================
   PACKAGE NAME
===================================================== */

function makePackage(name){

  let x =
    String(name || "myapp")
      .toLowerCase()
      .replace(
        /[^a-z0-9]+/g,
        ""
      );

  if(!x){
    x = "myapp";
  }

  return "com.asimtech." + x;

}


function validPackage(x){

  return /^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/
    .test(x);

}


/* =====================================================
   SOURCE MODE
===================================================== */

function changeSourceMode(){

  const isCode =
    $("sourceMode").value === "code";

  $("codeSource").style.display =
    isCode
      ? "block"
      : "none";

  $("urlSource").style.display =
    isCode
      ? "none"
      : "block";

}


/* =====================================================
   PREVIEW
===================================================== */

function previewWebApp(){

  const mode =
    $("sourceMode").value;


  if(mode === "code"){

    const code =
      $("webAppCode").value.trim();


    if(!code){

      sourceStatus(
        "Please paste HTML code first.",
        "error"
      );

      return;
    }


    const blob =
      new Blob(
        [code],
        {
          type:"text/html"
        }
      );


    const url =
      URL.createObjectURL(blob);


    $("previewBox").innerHTML =
      `<iframe src="${url}"></iframe>`;


    sourceStatus(
      "Code preview loaded ✓",
      "success"
    );

    return;

  }


  const url =
    $("webAppUrl").value.trim();


  if(!url){

    sourceStatus(
      "Please enter a Web App URL.",
      "error"
    );

    return;
  }


  try{

    new URL(url);

  }catch{

    sourceStatus(
      "Please enter a valid URL.",
      "error"
    );

    return;

  }


  $("previewBox").innerHTML =
    `<iframe src="${esc(url)}"></iframe>`;


  sourceStatus(
    "URL preview loaded ✓",
    "success"
  );

}


/* =====================================================
   LOAD SETTING
===================================================== */

async function loadSetting(key){

  const r =
    await sb
      .from("app_files")
      .select("content")
      .eq(
        "app_id",
        appId
      )
      .eq(
        "file_path",
        "android-settings.json"
      )
      .maybeSingle();


  if(
    r.error ||
    !r.data?.content
  ){

    return null;

  }


  try{

    const settings =
      JSON.parse(
        r.data.content
      );

    return settings[key] ?? null;

  }catch{

    return null;

  }

}


/* =====================================================
   LOAD SOURCE
===================================================== */

async function loadSource(){

  let r =
    await sb
      .from("app_files")
      .select("content")
      .eq(
        "app_id",
        appId
      )
      .eq(
        "file_path",
        "index.html"
      )
      .maybeSingle();


  if(
    !r.error &&
    r.data?.content
  ){

    $("sourceMode").value =
      "code";

    $("webAppCode").value =
      r.data.content;

    changeSourceMode();

    return;

  }


  r =
    await sb
      .from("app_files")
      .select("content")
      .eq(
        "app_id",
        appId
      )
      .eq(
        "file_path",
        "webapp-url.txt"
      )
      .maybeSingle();


  if(
    !r.error &&
    r.data?.content
  ){

    $("sourceMode").value =
      "url";

    $("webAppUrl").value =
      r.data.content;

    changeSourceMode();

  }

}


/* =====================================================
   SAVE SETTINGS
===================================================== */

async function saveSettings(){

  const settings = {

    appName:
      $("appName").value.trim()
      ||
      app?.name
      ||
      "ASIM TECH App",

    packageName:
      $("packageName").value.trim()
      ||
      makePackage(app?.name),

    versionName:
      $("versionName").value.trim()
      ||
      "1.0.0",

    versionCode:
      Math.max(
        1,
        parseInt(
          $("versionCode").value,
          10
        ) || 1
      )

  };


  if(
    !validPackage(
      settings.packageName
    )
  ){

    throw new Error(
      "Invalid package name. Example: com.asimtech.myapp"
    );

  }


  let r =
    await sb
      .from("app_files")
      .upsert(
        {
          app_id:appId,

          file_path:
            "android-settings.json",

          content:
            JSON.stringify(
              settings,
              null,
              2
            ),

          language:"json",

          updated_at:
            new Date().toISOString()

        },
        {
          onConflict:
            "app_id,file_path"
        }
      );


  if(r.error){
    throw r.error;
  }


  r =
    await sb
      .from("apps")
      .update(
        {
          name:
            settings.appName,

          updated_at:
            new Date().toISOString()
        }
      )
      .eq(
        "id",
        appId
      )
      .eq(
        "owner_id",
        user.id
      );


  if(r.error){
    throw r.error;
  }


  if(app){
    app.name =
      settings.appName;
  }


  return settings;

}


/* =====================================================
   SAVE SOURCE
===================================================== */

async function saveWebAppSource(){

  const mode =
    $("sourceMode").value;


  const content =
    (
      mode === "code"
        ? $("webAppCode").value
        : $("webAppUrl").value
    ).trim();


  if(!content){

    sourceStatus(
      "Nothing to save.",
      "error"
    );

    return false;

  }


  if(mode === "url"){

    try{

      new URL(content);

    }catch{

      sourceStatus(
        "Invalid URL.",
        "error"
      );

      return false;

    }

  }


  const filePath =
    mode === "code"
      ? "index.html"
      : "webapp-url.txt";


  const otherPath =
    mode === "code"
      ? "webapp-url.txt"
      : "index.html";


  const r =
    await sb
      .from("app_files")
      .upsert(
        {
          app_id:appId,

          file_path:filePath,

          content:content,

          language:
            mode === "code"
              ? "HTML"
              : "URL",

          updated_at:
            new Date().toISOString()

        },
        {
          onConflict:
            "app_id,file_path"
        }
      );


  if(r.error){
    throw r.error;
  }


  await sb
    .from("app_files")
    .delete()
    .eq(
      "app_id",
      appId
    )
    .eq(
      "file_path",
      otherPath
    );


  sourceStatus(
    "Source saved successfully ✓",
    "success"
  );


  return true;

}


/* =====================================================
   SAVE PROJECT
===================================================== */

async function save(){

  try{

    await saveSettings();

    await saveWebAppSource();

    setStatus(
      "Project saved ✓",
      "success"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Save failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   REQUEST APK BUILD
===================================================== */

async function requestBuild(){

  try{

    const settings =
      await saveSettings();


    const saved =
      await saveWebAppSource();


    if(!saved){

      throw new Error(
        "Please save a valid source first."
      );

    }


    const r =
      await sb
        .from("app_builds")
        .insert(
          {
            app_id:appId,

            version_name:
              settings.versionName,

            version_code:
              settings.versionCode,

            status:"queued",

            created_by:user.id,

            queued_at:
              new Date().toISOString(),

            source_file_count:1
          }
        )
        .select("*")
        .single();


    if(r.error){
      throw r.error;
    }


    setStatus(
      "APK build request queued ✓",
      "success"
    );


    await loadBuilds();

    startBuildPolling();

  }catch(error){

    console.error(error);

    setStatus(
      "Build request failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   APK DOWNLOAD
   IMPORTANT:
   NO fetch()
   NO blob()
   NO object URL

   Uses native browser download.
===================================================== */

function downloadAPK(
  storagePath,
  fileName
){

  try{

    if(!storagePath){

      alert(
        "APK file path not found."
      );

      return;

    }


    const name =
      fileName ||
      "ASIM-TECH-Calculator.apk";


    const encodedPath =
      storagePath
        .split("/")
        .map(
          part =>
            encodeURIComponent(part)
        )
        .join("/");


    /*
      Supabase public storage URL.

      ?download=filename forces
      download behaviour.
    */

    const url =
      SUPABASE_URL +
      "/storage/v1/object/public/" +
      "android-apks/" +
      encodedPath +
      "?download=" +
      encodeURIComponent(name);


    setStatus(
      "Starting APK download…",
      "warn"
    );


    /*
      Native browser download.
    */

    const link =
      document.createElement("a");


    link.href = url;

    link.download = name;

    link.target = "_blank";

    link.rel = "noopener";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    setTimeout(
      ()=>{
        setStatus(
          "APK download started ✓",
          "success"
        );
      },
      800
    );


  }catch(error){

    console.error(
      "APK Download Error:",
      error
    );


    setStatus(
      "APK download failed: " +
      error.message,
      "error"
    );

  }

}


/* =====================================================
   BUILD HISTORY
===================================================== */

async function loadBuilds(){

  const r =
    await sb
      .from("app_builds")
      .select("*")
      .eq(
        "app_id",
        appId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(10);


  if(r.error){

    $("builds").innerHTML =
      "<span class='error'>" +
      "Unable to load builds" +
      "</span>";

    return;

  }


  if(!r.data?.length){

    $("builds").textContent =
      "No build requested yet.";

    return;

  }


  $("builds").innerHTML =
    r.data
      .map(
        build => {

          const cls =
            build.status === "success"
              ? "success"
              : build.status === "failed"
                ? "error"
                : "warn";


          let downloadHTML = "";


          if(
            build.status === "success" &&
            build.storage_path
          ){

            const fileName =
              build.file_name ||
              "ASIM-TECH-Calculator.apk";


            downloadHTML = `

              <div class="downloadbox">

                <div class="small">
                  ✅ APK ready
                </div>


                <div
                  style="
                    margin-top:8px;
                    font-weight:700;
                    word-break:break-all;
                  "
                >

                  ${esc(fileName)}

                </div>


                <div class="small">

                  ${
                    build.file_size
                      ? (
                          Number(
                            build.file_size
                          ) / 1024
                        ).toFixed(2) +
                        " KB"
                      : ""
                  }

                </div>


                <div
                  style="
                    margin-top:10px;
                    display:flex;
                    gap:8px;
                    flex-wrap:wrap;
                  "
                >

                  <button
                    class="btn download"
                    onclick="
                      downloadAPK(
                        '${esc(build.storage_path)}',
                        '${esc(fileName)}'
                      )
                    "
                  >
                    ⬇️ Download APK
                  </button>


                  <button
                    class="btn blue"
                    onclick="
                      openAPK(
                        '${esc(build.storage_path)}'
                      )
                    "
                  >
                    🔗 Open APK
                  </button>

                </div>

              </div>

            `;

          }


          return `

            <div class="buildrow">

              <b>
                v${esc(
                  build.version_name ||
                  "1.0.0"
                )}
              </b>

              —

              <span class="${cls}">
                ${esc(
                  build.status ||
                  "queued"
                )}
              </span>


              <br>


              <span class="small">

                ${
                  build.created_at
                    ? new Date(
                        build.created_at
                      ).toLocaleString()
                    : ""
                }

              </span>


              ${
                build.file_name
                  ? `
                    <br>
                    📦 ${esc(
                      build.file_name
                    )}
                  `
                  : ""
              }


              <br>


              <span class="buildid">

                Build ID:
                ${esc(build.id)}

              </span>


              ${downloadHTML}

            </div>

          `;

        }
      )
      .join("");

}


/* =====================================================
   OPEN APK
===================================================== */

function openAPK(
  storagePath
){

  if(!storagePath){
    return;
  }


  const encodedPath =
    storagePath
      .split("/")
      .map(
        part =>
          encodeURIComponent(part)
      )
      .join("/");


  const url =
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    "android-apks/" +
    encodedPath;


  window.open(
    url,
    "_blank"
  );

}


/* =====================================================
   BUILD POLLING
===================================================== */

let pollingTimer = null;


function startBuildPolling(){

  if(pollingTimer){

    clearInterval(
      pollingTimer
    );

  }


  let checks = 0;


  pollingTimer =
    setInterval(
      async () => {

        checks++;


        await loadBuilds();


        /*
          60 checks × 10 seconds
          = approximately 10 minutes.
        */

        if(checks >= 60){

          clearInterval(
            pollingTimer
          );

          pollingTimer = null;

        }

      },
      10000
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

async function init(){

  try{

    if(!appId){

      setStatus(
        "Missing app ID.",
        "error"
      );

      return;

    }


    const {
      data:{
        user:u
      },
      error:authError
    } =
      await sb.auth.getUser();


    if(authError){
      throw authError;
    }


    if(!u){

      location.href =
        "login.html";

      return;

    }


    user = u;


    let r =
      await sb
        .from("apps")
        .select("*")
        .eq(
          "id",
          appId
        )
        .eq(
          "owner_id",
          user.id
        )
        .single();


    if(r.error){
      throw r.error;
    }


    app =
      r.data;


    $("appName").value =
      app.name || "";


    $("packageName").value =
      await loadSetting(
        "packageName"
      )
      ||
      makePackage(
        app.name
      );


    $("versionName").value =
      await loadSetting(
        "versionName"
      )
      ||
      "1.0.0";


    $("versionCode").value =
      await loadSetting(
        "versionCode"
      )
      ||
      1;


    await loadSource();

    await loadBuilds();


    setStatus(
      "Android project loaded.",
      "success"
    );


    /*
      Continue checking queued/building
      builds after page reload.
    */

    startBuildPolling();


  }catch(error){

    console.error(error);


    setStatus(
      error.message ||
      "Unable to load app.",
      "error"
    );

  }

}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
