<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIM TECH Android Builder</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:21px;
}

header span{
  font-size:13px;
  opacity:.8;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input,textarea,select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:10px;
  font-size:14px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2563eb;
}

textarea{
  min-height:180px;
  resize:vertical;
  font-family:monospace;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.btn-warning{
  background:#f59e0b;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-secondary{
  background:#6b7280;
  color:white;
}

.btn-dark{
  background:#111827;
  color:white;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:15px;
}

.status{
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  font-size:14px;
  font-weight:bold;
  display:none;
}

.status.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.status.warn{
  display:block;
  background:#fef3c7;
  color:#92400e;
}

.preview{
  width:100%;
  min-height:450px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  border-bottom:1px solid #e5e7eb;
  padding:10px 7px;
  text-align:left;
}

th{
  background:#f3f4f6;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge-success{
  background:#dcfce7;
  color:#166534;
}

.badge-building{
  background:#fef3c7;
  color:#92400e;
}

.badge-queued{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-failed{
  background:#fee2e2;
  color:#991b1b;
}

.small{
  font-size:12px;
  color:#6b7280;
}

.hidden{
  display:none !important;
}

.url-box{
  margin-top:12px;
  padding:12px;
  background:#f9fafb;
  border-radius:8px;
  word-break:break-all;
  font-size:12px;
}

.app-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:10px;
  object-fit:cover;
  background:#e5e7eb;
}

.app-info{
  display:flex;
  align-items:center;
  gap:12px;
}

hr{
  border:0;
  border-top:1px solid #e5e7eb;
  margin:18px 0;
}
</style>
</head>

<body>

<header>
  <div>
    <h1>ASIM TECH Android Builder</h1>
    <span>Build • Preview • Download • Manage Apps</span>
  </div>
</header>

<div class="container">

  <!-- APP SETTINGS -->
  <div class="card">
    <div class="app-title">
      <h2>App Settings</h2>
      <img id="appLogo" class="logo" src="" alt="">
    </div>

    <div class="grid">

      <div>
        <label>App Name</label>
        <input id="appName" placeholder="My Android App">
      </div>

      <div>
        <label>Package Name</label>
        <input id="packageName" placeholder="com.asimtech.myapp">
      </div>

      <div>
        <label>Version Name</label>
        <input id="versionName" value="1.0.0">
      </div>

      <div>
        <label>Version Code</label>
        <input id="versionCode" type="number" value="1">
      </div>

      <div>
        <label>App Description</label>
        <input id="appDescription" placeholder="My Android application">
      </div>

      <div>
        <label>App Image URL</label>
        <input id="appImageUrl" placeholder="https://...">
      </div>

    </div>

    <div class="actions">
      <button class="btn-primary" onclick="saveApp()">💾 Save App</button>
      <button class="btn-success" onclick="buildAPK()">🏗️ Build APK</button>
      <button class="btn-secondary" onclick="loadApp()">🔄 Refresh</button>
      <button class="btn-danger" onclick="deleteCurrentApp()">🗑️ Delete App</button>
    </div>

    <div id="status" class="status"></div>
  </div>


  <!-- SOURCE CODE -->
  <div class="card">

    <h2>App Source</h2>

    <div class="grid">

      <div>
        <label>Source Mode</label>

        <select id="sourceMode" onchange="sourceModeChanged()">
          <option value="code">HTML Code</option>
          <option value="url">Website URL</option>
        </select>
      </div>

      <div>
        <label>File Name</label>
        <input id="fileName" value="index.html">
      </div>

    </div>

    <div id="codeArea">
      <label style="margin-top:14px;">HTML Code</label>

      <textarea id="sourceCode" placeholder="Paste your HTML code here..."></textarea>
    </div>

    <div id="urlArea" class="hidden">

      <label style="margin-top:14px;">Website URL</label>

      <input
        id="websiteUrl"
        placeholder="https://example.com"
      >

    </div>

    <div class="actions">

      <button class="btn-dark" onclick="previewApp()">
        👁️ Preview
      </button>

      <button class="btn-primary" onclick="saveApp()">
        💾 Save
      </button>

    </div>

  </div>


  <!-- PREVIEW -->
  <div class="card">

    <h2>Preview</h2>

    <iframe
      id="previewFrame"
      class="preview"
      sandbox="allow-scripts allow-forms allow-modals allow-popups"
    ></iframe>

  </div>


  <!-- BUILD HISTORY -->
  <div class="card">

    <h2>Build History</h2>

    <div style="overflow-x:auto;">

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Version</th>
            <th>Status</th>
            <th>File</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="buildHistory">
          <tr>
            <td colspan="5" class="small">
              No builds found.
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>


<script type="module">

/* ============================================================
   SUPABASE
============================================================ */

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://lgwaeqgiqrsjprsecwxx.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const sb = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ============================================================
   GLOBAL
============================================================ */

let currentAppId = null;

let pollTimer = null;


/* ============================================================
   DOM HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}


function setStatus(message,type="success"){

  const box = $("status");

  box.className =
    "status " + type;

  box.textContent =
    message;

}


/* ============================================================
   SOURCE MODE
============================================================ */

window.sourceModeChanged = function(){

  const mode =
    $("sourceMode").value;

  if(mode === "url"){

    $("codeArea")
      .classList
      .add("hidden");

    $("urlArea")
      .classList
      .remove("hidden");

  }else{

    $("codeArea")
      .classList
      .remove("hidden");

    $("urlArea")
      .classList
      .add("hidden");

  }

};


/* ============================================================
   LOAD APP
============================================================ */

window.loadApp = async function(){

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const appId =
      params.get("id");

    if(!appId){

      setStatus(
        "No app selected.",
        "warn"
      );

      return;

    }

    currentAppId =
      appId;

    const {
      data,
      error
    } = await sb
      .from("apps")
      .select("*")
      .eq("id",appId)
      .single();

    if(error)
      throw error;


    $("appName").value =
      data.name || "";

    $("appDescription").value =
      data.description || "";

    $("appImageUrl").value =
      data.app_image_url || "";


    if(data.app_image_url){

      $("appLogo").src =
        data.app_image_url;

    }


    /* LOAD FILE */

    const {
      data:files,
      error:fileError
    } = await sb
      .from("app_files")
      .select("*")
      .eq("app_id",appId)
      .order("file_path");


    if(fileError)
      throw fileError;


    if(files && files.length){

      const htmlFile =
        files.find(
          f =>
          f.file_path === "index.html"
        ) || files[0];


      $("sourceCode").value =
        htmlFile.content || "";

      $("fileName").value =
        htmlFile.file_path ||
        "index.html";

      $("sourceMode").value =
        "code";

      sourceModeChanged();

    }


    await loadBuildHistory();

    setStatus(
      "App loaded ✓",
      "success"
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Load failed: " +
      error.message,
      "error"
    );

  }

};


/* ============================================================
   SAVE APP
============================================================ */

window.saveApp = async function(){

  try{

    if(!currentAppId){

      setStatus(
        "App ID not found.",
        "error"
      );

      return;

    }


    const name =
      $("appName").value.trim();

    const description =
      $("appDescription").value.trim();

    const imageUrl =
      $("appImageUrl").value.trim();


    if(!name){

      setStatus(
        "Please enter App Name.",
        "error"
      );

      return;

    }


    setStatus(
      "Saving app…",
      "warn"
    );


    const {
      error
    } = await sb
      .from("apps")
      .update({

        name:name,

        description:
          description,

        app_image_url:
          imageUrl || null,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        currentAppId
      );


    if(error)
      throw error;


    if(imageUrl){

      $("appLogo").src =
        imageUrl;

    }


    /* SAVE SOURCE */

    const mode =
      $("sourceMode").value;


    let filePath =
      $("fileName").value.trim();

    if(!filePath)
      filePath = "index.html";


    let content = "";


    if(mode === "url"){

      const website =
        $("websiteUrl")
          .value
          .trim();

      if(!website){

        setStatus(
          "Please enter Website URL.",
          "error"
        );

        return;

      }


      content = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(name)}</title>
<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
}
iframe{
width:100%;
height:100%;
border:0;
}
</style>
</head>
<body>
<iframe src="${escapeAttribute(website)}"></iframe>
</body>
</html>`;

    }else{

      content =
        $("sourceCode").value;

      if(!content.trim()){

        setStatus(
          "Please enter HTML code.",
          "error"
        );

        return;

      }

    }


    const {
      data:existing
    } = await sb
      .from("app_files")
      .select("id")
      .eq(
        "app_id",
        currentAppId
      )
      .eq(
        "file_path",
        filePath
      )
      .maybeSingle();


    if(existing){

      const {
        error:updateError
      } = await sb
        .from("app_files")
        .update({

          content:content,

          language:"html",

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          existing.id
        );

      if(updateError)
        throw updateError;

    }else{

      const {
        error:insertError
      } = await sb
        .from("app_files")
        .insert({

          app_id:
            currentAppId,

          file_path:
            filePath,

          content:
            content,

          language:
            "html"

        });

      if(insertError)
        throw insertError;

    }


    setStatus(
      "App saved successfully ✓",
      "success"
    );


  }catch(error){

    console.error(error);

    setStatus(
      "Save failed: " +
      error.message,
      "error"
    );

  }

};


/* ============================================================
   BUILD APK
============================================================ */

window.buildAPK = async function(){

  try{

    if(!currentAppId){

      setStatus(
        "App ID not found.",
        "error"
      );

      return;

    }


    /* SAVE FIRST */

    await saveApp();


    setStatus(
      "Requesting APK build…",
      "warn"
    );


    const {
      data,
      error
    } = await sb.functions.invoke(
      "request-apk-build",
      {
        body:{
          appId:
            currentAppId,

          versionName:
            $("versionName")
              .value
              .trim() ||
            "1.0.0",

          versionCode:
            parseInt(
              $("versionCode").value
            ) || 1
        }
      }
    );


    if(error)
      throw error;


    if(data && data.error)
      throw new Error(data.error);


    setStatus(
      "APK build queued ✓",
      "success"
    );


    await loadBuildHistory();


    startBuildPolling();


  }catch(error){

    console.error(error);

    setStatus(
      "Build request failed: " +
      error.message,
      "error"
    );

  }

};


/* ============================================================
   BUILD POLLING
============================================================ */

function startBuildPolling(){

  if(pollTimer)
    clearInterval(pollTimer);


  pollTimer =
    setInterval(
      async ()=>{
        await loadBuildHistory();
      },
      5000
    );


  setTimeout(
    ()=>{
      if(pollTimer){

        clearInterval(
          pollTimer
        );

        pollTimer =
          null;

      }
    },
    15 * 60 * 1000
  );

}


/* ============================================================
   BUILD HISTORY
============================================================ */

async function loadBuildHistory(){

  if(!currentAppId)
    return;


  try{

    const {
      data,
      error
    } = await sb
      .from("app_builds")
      .select("*")
      .eq(
        "app_id",
        currentAppId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(20);


    if(error)
      throw error;


    const tbody =
      $("buildHistory");


    if(!data || !data.length){

      tbody.innerHTML = `
        <tr>
          <td colspan="5"
              class="small">
            No builds found.
          </td>
        </tr>
      `;

      return;

    }


    tbody.innerHTML =
      data.map(
        build =>
          buildRow(build)
      ).join("");


  }catch(error){

    console.error(
      "History error:",
      error
    );

  }

}


/* ============================================================
   BUILD ROW
============================================================ */

function buildRow(build){

  const date =
    build.created_at
      ? new Date(
          build.created_at
        ).toLocaleString()
      : "-";


  let badgeClass =
    "badge-queued";


  if(build.status === "success")
    badgeClass =
      "badge-success";

  if(build.status === "building")
    badgeClass =
      "badge-building";

  if(build.status === "failed")
    badgeClass =
      "badge-failed";


  let action = "-";


  if(
    build.status === "success" &&
    build.storage_path
  ){

    const storagePath =
      build.storage_path
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

    const fileName =
      (
        build.file_name ||
        "ASIM-TECH-App.apk"
      )
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");


    action = `

      <button
        class="btn-success"
        onclick="downloadAPK('${storagePath}','${fileName}')">
        ⬇️ Download
      </button>

      <button
        class="btn-dark"
        onclick="openAPK('${storagePath}','${fileName}')">
        📂 Open
      </button>

    `;

  }


  return `

    <tr>

      <td>${escapeHtml(date)}</td>

      <td>
        ${escapeHtml(
          build.version_name ||
          "-"
        )}
      </td>

      <td>
        <span class="badge ${badgeClass}">
          ${escapeHtml(
            build.status ||
            "-"
          )}
        </span>
      </td>

      <td>
        ${escapeHtml(
          build.file_name ||
          "-"
        )}
      </td>

      <td>
        ${action}
      </td>

    </tr>

  `;

}


/* ============================================================
   ⭐ FIXED APK DOWNLOAD
============================================================ */

window.downloadAPK = function(
  storagePath,
  fileName
){

  if(!storagePath){

    alert(
      "APK file path not found."
    );

    return;

  }


  const name =
    fileName ||
    "ASIM-TECH-App.apk";


  const url =
    SUPABASE_URL +
    "/functions/v1/download-apk" +
    "?path=" +
    encodeURIComponent(
      storagePath
    ) +
    "&name=" +
    encodeURIComponent(
      name
    );


  setStatus(
    "Downloading APK…",
    "warn"
  );


  /*
   * IMPORTANT:
   * Do NOT use the HTML download attribute here.
   * The Edge Function sends:
   *
   * Content-Disposition:
   * attachment
   *
   * so Chrome will handle the APK as a real download.
   */

  window.location.href =
    url;


  setTimeout(
    ()=>{
      setStatus(
        "APK download started ✓",
        "success"
      );
    },
    1200
  );

};


/* ============================================================
   OPEN APK
============================================================ */

window.openAPK = function(
  storagePath,
  fileName
){

  if(!storagePath){

    alert(
      "APK file path not found."
    );

    return;

  }


  const name =
    fileName ||
    "ASIM-TECH-App.apk";


  const url =
    SUPABASE_URL +
    "/functions/v1/download-apk" +
    "?path=" +
    encodeURIComponent(
      storagePath
    ) +
    "&name=" +
    encodeURIComponent(
      name
    );


  window.open(
    url,
    "_blank"
  );

};


/* ============================================================
   PREVIEW
============================================================ */

window.previewApp = function(){

  const mode =
    $("sourceMode").value;


  if(mode === "url"){

    const url =
      $("websiteUrl")
        .value
        .trim();


    if(!url){

      setStatus(
        "Please enter Website URL.",
        "error"
      );

      return;

    }


    $("previewFrame").src =
      url;

    return;

  }


  const code =
    $("sourceCode").value;


  if(!code.trim()){

    setStatus(
      "No HTML code to preview.",
      "error"
    );

    return;

  }


  const blob =
    new Blob(
      [code],
      {
        type:
          "text/html"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  $("previewFrame").src =
    url;

};


/* ============================================================
   DELETE APP
============================================================ */

window.deleteCurrentApp =
  async function(){

  if(!currentAppId){

    setStatus(
      "No app selected.",
      "error"
    );

    return;

  }


  const ok =
    confirm(
      "Are you sure you want to delete this app and its builds?"
    );


  if(!ok)
    return;


  try{

    setStatus(
      "Deleting app…",
      "warn"
    );


    const {
      data,
      error
    } = await sb.functions.invoke(
      "delete-app",
      {
        body:{
          appId:
            currentAppId
        }
      }
    );


    if(error)
      throw error;


    if(data && data.error)
      throw new Error(
        data.error
      );


    setStatus(
      "App deleted successfully ✓",
      "success"
    );


    setTimeout(
      ()=>{
        window.location.href =
          "android-builder.html";
      },
      1000
    );


  }catch(error){

    console.error(error);

    setStatus(
      "Delete failed: " +
      error.message,
      "error"
    );

  }

};


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}


/* ============================================================
   INITIAL LOAD
============================================================ */

window.addEventListener(
  "DOMContentLoaded",
  ()=>{
    loadApp();
  }
);

</script>

</body>
</html>
