<html lang="en">

body{

nav{

}

<nav>

  </div>

    <a href="android-apps.html">My Apps</a>
    <a href="dashboard.html">Dashboard</a>
  </div>

<main class="wrap">

  <div class="topactions">

    <button class="btn orange" onclick="requestBuild()">

  </div>


  <!-- APP SETTINGS -->

<script>

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const appId =
new URLSearchParams(location.search).get("id");


let user = null;
let app = null;


const $ =
id => document.getElementById(id);



/* -----------------------------------------
   STATUS
----------------------------------------- */

function setStatus(t,c=""){

  $("status").textContent = t;

  $("status").className =
    "status " + c;

}


function sourceStatus(t,c=""){

  $("webAppStatus").textContent = t;

  $("webAppStatus").className =
    "status " + c;

}



/* -----------------------------------------
   ESCAPE HTML
----------------------------------------- */

function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}



/* -----------------------------------------
   PACKAGE
----------------------------------------- */

function makePackage(name){

  let x =
    String(name || "myapp")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,"");

  if(!x)
    x="myapp";

  return "com.asimtech."+x;

}


function validPackage(x){

  return /^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/
    .test(x);

}



/* -----------------------------------------
   SOURCE MODE
----------------------------------------- */

function changeSourceMode(){

  const code =
    $("sourceMode").value === "code";

  $("codeSource").style.display =
    code ? "block" : "none";

  $("urlSource").style.display =
    code ? "none" : "block";

}



/* -----------------------------------------
   PREVIEW
----------------------------------------- */

function previewWebApp(){

  const mode =
    $("sourceMode").value;


  if(mode === "code"){

    const code =
      $("webAppCode").value.trim();

    if(!code){

      sourceStatus(
        "Please paste HTML code first.",
        "error"
      );

      return;
    }


    const blob =
      new Blob(
        [code],
        {type:"text/html"}
      );


    const u =
      URL.createObjectURL(blob);


    $("previewBox").innerHTML =
      `<iframe src="${u}"></iframe>`;


    sourceStatus(
      "Code preview loaded ✓",
      "success"
    );

  }

  else{

    const url =
      $("webAppUrl").value.trim();


    if(!url){

      sourceStatus(
        "Please enter a Web App URL.",
        "error"
      );

      return;
    }


    try{

      new URL(url);

    }catch{

      sourceStatus(
        "Please enter a valid URL.",
        "error"
      );

      return;
    }


    $("previewBox").innerHTML =
      `<iframe src="${esc(url)}"></iframe>`;


    sourceStatus(
      "URL preview loaded ✓",
      "success"
    );

  }

}



/* -----------------------------------------
   LOAD SETTING
----------------------------------------- */

async function loadSetting(key){

  const r =
    await sb
      .from("app_files")
      .select("content")
      .eq("app_id",appId)
      .eq(
        "file_path",
        "android-settings.json"
      )
      .maybeSingle();


  if(
    r.error ||
    !r.data?.content
  )
    return null;


  try{

    return JSON.parse(
      r.data.content
    )[key] ?? null;

  }catch{

    return null;

  }

}



/* -----------------------------------------
   LOAD SOURCE
----------------------------------------- */

async function loadSource(){

  let r =
    await sb
      .from("app_files")
      .select("content")
      .eq("app_id",appId)
      .eq(
        "file_path",
        "index.html"
      )
      .maybeSingle();


  if(
    !r.error &&
    r.data?.content
  ){

    $("sourceMode").value =
      "code";

    $("webAppCode").value =
      r.data.content;

    changeSourceMode();

    return;

  }


  r =
    await sb
      .from("app_files")
      .select("content")
      .eq("app_id",appId)
      .eq(
        "file_path",
        "webapp-url.txt"
      )
      .maybeSingle();


  if(
    !r.error &&
    r.data?.content
  ){

    $("sourceMode").value =
      "url";

    $("webAppUrl").value =
      r.data.content;

    changeSourceMode();

  }

}



/* -----------------------------------------
   SAVE SETTINGS
----------------------------------------- */

async function saveSettings(){

  const settings = {

    appName:
      $("appName").value.trim()
      ||
      app?.name
      ||
      "ASIM TECH App",

    packageName:
      $("packageName").value.trim()
      ||
      makePackage(app?.name),

    versionName:
      $("versionName").value.trim()
      ||
      "1.0.0",

    versionCode:
      Math.max(
        1,
        parseInt(
          $("versionCode").value,
          10
        ) || 1
      )

  };


  if(
    !validPackage(
      settings.packageName
    )
  ){

    throw new Error(
      "Invalid package name. Example: com.asimtech.myapp"
    );

  }


  let r =
    await sb
      .from("app_files")
      .upsert({

        app_id:appId,

        file_path:
          "android-settings.json",

        content:
          JSON.stringify(
            settings,
            null,
            2
          ),

        language:"json",

        updated_at:
          new Date().toISOString()

      },{
        onConflict:
          "app_id,file_path"
      });


  if(r.error)
    throw r.error;


  r =
    await sb
      .from("apps")
      .update({

        name:
          settings.appName,

        updated_at:
          new Date().toISOString()

      })
      .eq("id",appId)
      .eq("owner_id",user.id);


  if(r.error)
    throw r.error;


  app.name =
    settings.appName;


  return settings;

}



/* -----------------------------------------
   SAVE SOURCE
----------------------------------------- */

async function saveWebAppSource(){

  const mode =
    $("sourceMode").value;


  const content =
    (
      mode === "code"
        ? $("webAppCode").value
        : $("webAppUrl").value
    ).trim();


  if(!content){

    sourceStatus(
      "Nothing to save.",
      "error"
    );

    return false;

  }


  if(mode === "url"){

    try{

      new URL(content);

    }catch{

      sourceStatus(
        "Invalid URL.",
        "error"
      );

      return false;

    }

  }


  const filePath =
    mode === "code"
      ? "index.html"
      : "webapp-url.txt";


  const otherPath =
    mode === "code"
      ? "webapp-url.txt"
      : "index.html";


  let r =
    await sb
      .from("app_files")
      .upsert({

        app_id:appId,

        file_path:filePath,

        content:content,

        language:
          mode === "code"
            ? "HTML"
            : "URL",

        updated_at:
          new Date().toISOString()

      },{
        onConflict:
          "app_id,file_path"
      });


  if(r.error)
    throw r.error;


  await sb
    .from("app_files")
    .delete()
    .eq("app_id",appId)
    .eq(
      "file_path",
      otherPath
    );


  sourceStatus(
    "Source saved successfully ✓",
    "success"
  );


  return true;

}



/* -----------------------------------------
   SAVE
----------------------------------------- */

async function save(){

  try{

    await saveSettings();

    await saveWebAppSource();

    setStatus(
      "Project saved ✓",
      "success"
    );

  }catch(e){

    setStatus(
      "Save failed: " +
      e.message,
      "error"
    );

  }

}



/* -----------------------------------------
   REQUEST BUILD
----------------------------------------- */

async function requestBuild(){

  try{

    const settings =
      await saveSettings();


    const saved =
      await saveWebAppSource();


    if(!saved){

      throw new Error(
        "Please save a valid source first."
      );

    }


    const r =
      await sb
        .from("app_builds")
        .insert({

          app_id:appId,

          version_name:
            settings.versionName,

          version_code:
            settings.versionCode,

          status:"queued",

          created_by:user.id,

          queued_at:
            new Date().toISOString(),

          source_file_count:1

        })
        .select("*")
        .single();


    if(r.error)
      throw r.error;


    setStatus(
      "APK build request queued ✓",
      "success"
    );


    await loadBuilds();


    /*
      Automatically check build status.
    */

    startBuildPolling();

  }catch(e){

    setStatus(
      "Build request failed: " +
      e.message,
      "error"
    );

  }

}



/* -----------------------------------------
   APK DOWNLOAD
----------------------------------------- */

async function downloadAPK(
  storagePath,
  fileName
){

  try{

    if(!storagePath){

      throw new Error(
        "APK storage path is missing."
      );

    }


    setStatus(
      "Preparing APK download…",
      "warn"
    );


    const encodedPath =
      storagePath
        .split("/")
        .map(
          part => encodeURIComponent(part)
        )
        .join("/");


    const url =
      SUPABASE_URL +
      "/storage/v1/object/public/android-apks/" +
      encodedPath;


    /*
      IMPORTANT:
      Fetch APK as Blob first.
      This prevents Chrome from hanging on
      the Supabase direct download response.
    */

    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "APK download failed. HTTP " +
        response.status
      );

    }


    const blob =
      await response.blob();


    if(!blob.size){

      throw new Error(
        "Downloaded APK is empty."
      );

    }


    const blobUrl =
      URL.createObjectURL(
        new Blob(
          [blob],
          {
            type:
              "application/vnd.android.package-archive"
          }
        )
      );


    const a =
      document.createElement("a");


    a.href =
      blobUrl;


    a.download =
      fileName ||
      "ASIM-TECH.apk";


    a.style.display =
      "none";


    document.body.appendChild(a);


    a.click();


    setTimeout(
      ()=>{
        a.remove();
        URL.revokeObjectURL(blobUrl);
      },
      5000
    );


    setStatus(
      "APK download started ✓",
      "success"
    );


  }catch(e){

    console.error(e);


    setStatus(
      "Download failed: " +
      e.message,
      "error"
    );


    /*
      Fallback:
      Open direct APK URL.
    */

    if(storagePath){

      const encodedPath =
        storagePath
          .split("/")
          .map(
            part =>
              encodeURIComponent(part)
          )
          .join("/");


      const fallback =
        SUPABASE_URL +
        "/storage/v1/object/public/android-apks/" +
        encodedPath;


      setTimeout(
        ()=>{
          window.location.href =
            fallback;
        },
        800
      );

    }

  }

}



/* -----------------------------------------
   BUILD HISTORY
----------------------------------------- */

async function loadBuilds(){

  const r =
    await sb
      .from("app_builds")
      .select("*")
      .eq("app_id",appId)
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(10);


  if(r.error){

    $("builds").innerHTML =
      "<span class='error'>" +
      "Unable to load builds" +
      "</span>";

    return;

  }


  if(!r.data?.length){

    $("builds").textContent =
      "No build requested yet.";

    return;

  }


  $("builds").innerHTML =
    r.data.map(
      b => {

        const cls =
          b.status === "success"
            ? "success"
            : b.status === "failed"
              ? "error"
              : "warn";


        let downloadHTML = "";


        /*
          Show DOWNLOAD button only
          when APK build is successful.
        */

        if(
          b.status === "success" &&
          b.storage_path
        ){

          downloadHTML = `

            <div class="downloadbox">

              <div class="small">
                ✅ APK ready
              </div>

              <div
                style="
                  margin-top:8px;
                  font-weight:700;
                  word-break:break-all;
                ">

                ${esc(
                  b.file_name ||
                  "ASIM-TECH.apk"
                )}

              </div>


              <div class="small">

                ${
                  b.file_size
                    ? (
                        Number(
                          b.file_size
                        ) / 1024
                      ).toFixed(2)
                      + " KB"
                    : ""
                }

              </div>


              <div
                style="
                  margin-top:10px;
                  display:flex;
                  gap:8px;
                  flex-wrap:wrap;
                ">

                <button
                  class="btn download"
                  onclick="downloadAPK(
                    '${esc(
                      b.storage_path
                    )}',
                    '${esc(
                      b.file_name ||
                      "ASIM-TECH.apk"
                    )}'
                  )">

                  ⬇️ Download APK

                </button>


                <button
                  class="btn blue"
                  onclick="openAPK(
                    '${esc(
                      b.storage_path
                    )}'
                  )">

                  🔗 Open APK

                </button>

              </div>

            </div>

          `;

        }


        return `

          <div class="buildrow">

            <b>
              v${esc(
                b.version_name ||
                "1.0.0"
              )}
            </b>

            —

            <span
              class="${cls}">

              ${esc(
                b.status ||
                "queued"
              )}

            </span>


            <br>


            <span class="small">

              ${
                b.created_at
                  ? new Date(
                      b.created_at
                    ).toLocaleString()
                  : ""
              }

            </span>


            ${
              b.file_name
                ? `
                  <br>
                  📦 ${esc(
                    b.file_name
                  )}
                `
                : ""
            }


            <br>


            <span class="buildid">

              Build ID:
              ${esc(b.id)}

            </span>


            ${downloadHTML}

          </div>

        `;

      }
    ).join("");

}



/* -----------------------------------------
   OPEN APK
----------------------------------------- */

function openAPK(storagePath){

  if(!storagePath)
    return;


  const encodedPath =
    storagePath
      .split("/")
      .map(
        part =>
          encodeURIComponent(part)
      )
      .join("/");


  const url =
    SUPABASE_URL +
    "/storage/v1/object/public/android-apks/" +
    encodedPath;


  window.open(
    url,
    "_blank"
  );

}



/* -----------------------------------------
   BUILD POLLING
----------------------------------------- */

let pollingTimer = null;


function startBuildPolling(){

  if(pollingTimer)
    clearInterval(pollingTimer);


  let checks = 0;


  pollingTimer =
    setInterval(
      async ()=>{

        checks++;


        await loadBuilds();


        /*
          Poll for approximately
          10 minutes.
        */

        if(checks >= 60){

          clearInterval(
            pollingTimer
          );

          pollingTimer = null;

        }

      },
      10000
    );

}



/* -----------------------------------------
   INITIALIZE
----------------------------------------- */

async function init(){

  try{

    if(!appId){

      setStatus(
        "Missing app ID.",
        "error"
      );

      return;

    }


    const {
      data:{
        user:u
      },
      error:ue
    } =
      await sb.auth.getUser();


    if(ue)
      throw ue;


    if(!u){

      location.href =
        "login.html";

      return;

    }


    user = u;


    let r =
      await sb
        .from("apps")
        .select("*")
        .eq("id",appId)
        .eq(
          "owner_id",
          user.id
        )
        .single();


    if(r.error)
      throw r.error;


    app =
      r.data;


    $("appName").value =
      app.name || "";


    $("packageName").value =
      await loadSetting(
        "packageName"
      )
      ||
      makePackage(
        app.name
      );


    $("versionName").value =
      await loadSetting(
        "versionName"
      )
      ||
      "1.0.0";


    $("versionCode").value =
      await loadSetting(
        "versionCode"
      )
      ||
      1;


    await loadSource();


    await loadBuilds();


    setStatus(
      "Android project loaded.",
      "success"
    );


    /*
      Keep checking existing queued/building
      requests after page reload.
    */

    startBuildPolling();


  }catch(e){

    console.error(e);


    setStatus(
      e.message ||
      "Unable to load app.",
      "error"
    );

  }

}


init();

</script>

</body>
</html>
