<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Android App Builder — ASIM TECH</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0d1117;color:#fff}nav{height:62px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{font-weight:700;font-size:20px}.green{color:#39d353}nav a{color:#58a6ff;text-decoration:none;margin-left:14px}.layout{display:grid;grid-template-columns:270px 1fr 330px;min-height:calc(100vh - 62px)}.panel{background:#161b22;border-right:1px solid #30363d;padding:16px;overflow:auto}.right{border-left:1px solid #30363d;border-right:0}.btn{border:0;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer;color:#fff}.greenbtn{background:#238636}.blue{background:#1f6feb}.dark{background:#21262d;border:1px solid #30363d}.topactions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.status{font-size:12px;color:#8b949e}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{background:#21262d;border:1px solid #30363d;color:#fff;border-radius:7px;padding:10px;cursor:pointer}.pages{margin-top:20px}.page{padding:9px;border:1px solid #30363d;border-radius:7px;margin-bottom:7px;cursor:pointer}.page.active{border-color:#58a6ff;background:#0d1117}.stage{padding:25px;display:flex;justify-content:center;background:radial-gradient(circle at top,#182238,#0d1117);overflow:auto}.phone{width:360px;max-width:92vw;min-height:700px;background:#fff;color:#111;border:10px solid #050505;border-radius:32px;overflow:hidden}.phonebar{height:28px;background:#050505}.canvas{min-height:672px;padding:16px}.el{position:relative;border:1px dashed transparent;padding:6px;margin:3px 0;cursor:pointer}.el:hover,.el.sel{border-color:#1f6feb}.el img{max-width:100%;border-radius:8px}.btnel{display:inline-block;background:#1f6feb;color:#fff;padding:9px 14px;border-radius:7px;text-decoration:none}.props label{font-size:13px;color:#8b949e}.props input{width:100%;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:7px;padding:9px;margin:5px 0 12px}.hidden{display:none}.row{display:flex;gap:7px}.row>*{flex:1}@media(max-width:1000px){.layout{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:700px){.layout{grid-template-columns:1fr}.panel{display:none}.stage{padding:12px}}</style></head><body><nav><div class="logo"><span class="green">ASIM</span> TECH — Android Builder</div><div><a href="android-apps.html">My Apps</a><a href="dashboard.html">Dashboard</a></div></nav><div class="layout"><aside class="panel"><div class="topactions"><button class="btn greenbtn" onclick="save()">💾 Save</button><button class="btn blue" onclick="exportApp()">📦 Export</button></div><div id="status" class="status">Loading…</div><hr><h3>Elements</h3><div class="toolgrid"><button class="tool" onclick="add('heading')">H Heading</button><button class="tool" onclick="add('text')">T Text</button><button class="tool" onclick="add('button')">🔘 Button</button><button class="tool" onclick="add('link')">🔗 Link</button><button class="tool" onclick="add('input')">⌨ Input</button><button class="tool" onclick="add('image')">🖼 Image</button><button class="tool" onclick="add('container')">▣ Container</button></div><div class="pages"><h3>Pages</h3><div id="pages"></div><button class="btn dark" onclick="newPage()">＋ New Page</button></div></aside><section class="stage"><div class="phone"><div class="phonebar"></div><div id="canvas" class="canvas"></div></div></section><aside class="panel right"><h3>Element Properties</h3><div id="emptyProps" class="status">Select an element to edit it.</div><div id="form" class="hidden"><label>Text</label><input id="ptext"><label>Link / URL</label><input id="plink" placeholder="https://example.com"><label>Image URL</label><input id="pimage"><label>Placeholder</label><input id="pplaceholder"><div class="row"><div><label>Font size</label><input id="psize" type="number"></div><div><label>Padding</label><input id="ppad" type="number"></div></div><div class="row"><button class="btn blue" onclick="applyProps()">Apply</button><button class="btn dark" onclick="removeEl()">Delete</button></div></div></aside></div><script>const U="https://lgwaeqgiqrsjprsecwxx.supabase.co",K="sb_publishable_DEoJ1PlONjxqa3eqqXH8Q_uc0hlemT",sb=supabase.createClient(U,K);const id=new URLSearchParams(location.search).get("id");let user,app,pages=[],active,selected=null;const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));async function init(){if(!id)return location.href="android-apps.html";const{data:{user:u}}=await sb.auth.getUser();if(!u)return location.href="login.html";user=u;let r=await sb.from("apps").select("*").eq("id",id).eq("owner_id",user.id).single();if(r.error)return alert(r.error.message);app=r.data;r=await sb.from("android_app_pages").select("*").eq("app_id",id).order("created_at");if(r.error)return alert(r.error.message);pages=r.data||[];if(!pages.length)await newPage(true);else{active=pages[0];await load()}renderPages();render()}async function newPage(first=false){let title=first?"Home":"Page "+(pages.length+1),slug=title.toLowerCase().replace(/[^a-z0-9]+/g,"-");let r=await sb.from("android_app_pages").insert({app_id:id,title,slug,is_published:true}).select("*").single();if(r.error)return alert(r.error.message);pages.push(r.data);active=r.data;await saveFile([]);renderPages();render()}async function load(){let r=await sb.from("app_files").select("content").eq("app_id",id).eq("file_path",`builder-${active.id}.json`).maybeSingle();try{active.elements=r.data?JSON.parse(r.data.content||"[]"):[]}catch{active.elements=[]}}async function switchPage(pid){active=pages.find(p=>p.id===pid);selected=null;await load();renderPages();render()}function renderPages(){$("pages").innerHTML=pages.map(p=>`<div class="page ${p.id===active?.id?"active":""}" onclick="switchPage('${p.id}')">${esc(p.title)}</div>`).join("")}function add(type){let text={heading:"Heading",text:"Your text",button:"Button",link:"Open link",input:"",image:"",container:"Container"}[type]||"";let e={id:crypto.randomUUID(),type,text,href:type==='button'||type==='link'?"https://example.com":"",image:type==='image'?"https://placehold.co/600x300":"",placeholder:type==='input'?"Enter text…":"",fontSize:type==='heading'?28:16,padding:10};active.elements=[...(active.elements||[]),e];selected=e.id;render()}function render(){let els=active?.elements||[];$('canvas').innerHTML=els.map(e=>{let x=e.type==='heading'?`<h1 style="font-size:${e.fontSize}px">${esc(e.text)}</h1>`:e.type==='text'?`<div style="font-size:${e.fontSize}px">${esc(e.text)}</div>`:e.type==='button'?`<a class="btnel" href="#">${esc(e.text)}</a>`:e.type==='link'?`<a href="#">${esc(e.text)}</a>`:e.type==='input'?`<input style="width:100%;padding:${e.padding}px" placeholder="${esc(e.placeholder)}">`:e.type==='image'?`<img src="${esc(e.image)}">`:`<div style="border:1px solid #ddd;border-radius:8px;padding:${e.padding}px">${esc(e.text)}</div>`;return `<div class="el ${selected===e.id?'sel':''}" onclick="selectEl('${e.id}',event)">${x}</div>`}).join('');if(selected)fill();else{$('form').classList.add('hidden');$('emptyProps').classList.remove('hidden')}}function selectEl(id,e){e.stopPropagation();selected=id;render()}function fill(){let e=active.elements.find(x=>x.id===selected);$('emptyProps').classList.add('hidden');$('form').classList.remove('hidden');$('ptext').value=e.text||'';$('plink').value=e.href||'';$('pimage').value=e.image||'';$('pplaceholder').value=e.placeholder||'';$('psize').value=e.fontSize||16;$('ppad').value=e.padding??10}function applyProps(){let e=active.elements.find(x=>x.id===selected);Object.assign(e,{text:$('ptext').value,href:$('plink').value,image:$('pimage').value,placeholder:$('pplaceholder').value,fontSize:+$('psize').value||16,padding:+$('ppad').value||0});render()}function removeEl(){active.elements=active.elements.filter(e=>e.id!==selected);selected=null;render()}async function saveFile(elements){let r=await sb.from("app_files").upsert({app_id:id,file_path:`builder-${active.id}.json`,content:JSON.stringify(elements),language:"json",updated_at:new Date().toISOString()},{onConflict:"app_id,file_path"});if(r.error)throw r.error}async function save(){try{await saveFile(active.elements||[]);await sb.from("apps").update({updated_at:new Date().toISOString()}).eq("id",id).eq("owner_id",user.id);$('status').textContent='Saved ✓'}catch(e){$('status').textContent='Save failed';alert(e.message)}}function exportApp(){let body=(active.elements||[]).map(e=>e.type==='heading'?`<h1>${esc(e.text)}</h1>`:e.type==='text'?`<p>${esc(e.text)}</p>`:e.type==='button'?`<a class="button" href="${esc(e.href||'#')}">${esc(e.text)}</a>`:e.type==='link'?`<p><a href="${esc(e.href||'#')}">${esc(e.text)}</a></p>`:e.type==='input'?`<input placeholder="${esc(e.placeholder)}">`:e.type==='image'?`<img src="${esc(e.image)}">`:`<div class="box">${esc(e.text)}</div>`).join('');let html=`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f6feb"><title>${esc(app.name)}</title><style>body{font-family:Arial;margin:auto;padding:20px;max-width:680px}img{max-width:100%;border-radius:10px}input{width:100%;padding:12px;box-sizing:border-box}.button{display:inline-block;background:#1f6feb;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none}.box{border:1px solid #ddd;padding:15px;border-radius:10px}</style></head><body>${body}</body></html>`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=(app.name||'asim-app').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.html';a.click()}init();</script></body></html>
