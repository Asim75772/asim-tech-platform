<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
}


/* =====================================================
   NAV

nav{

  border-bottom:1px solid #263646;

  display:flex;

}

}

.green{
  color:#36e0b5;
}

   WRAPPER
===================================================== */

   CARD
===================================================== */

  border:1px solid #263646;

  padding:16px;

/* =====================================================

===================================================== */

.topactions{

  gap:10px;

  flex-wrap:wrap;

  position:sticky;

  top:0;

  z-index:5;

  background:#07111f;

  padding:8px 0;

/* =====================================================
   BUTTON
===================================================== */

.btn{
  border:0;

  border-radius:9px;

  padding:13px 18px;

  font-weight:700;

  font-size:16px;

  cursor:pointer;

  color:#fff;
}

  opacity:.6;
  cursor:not-allowed;
}

.greenbtn{
  background:#238636;
}

.blue{
  background:#1f6feb;
}

.orange{
  background:#d97706;
}

.red{
  background:#dc3545;
}

.gray{
  background:#475569;
}


/* =====================================================
   FORM
===================================================== */

label{
  display:block;

  font-size:15px;

  color:#9fb0bf;

  margin:12px 0 6px;
}

input,
select,
textarea{

  width:100%;

  background:#07111f;

  color:#fff;

  border:1px solid #304354;

  border-radius:9px;

  padding:12px;

  font-size:16px;
}

textarea{

  min-height:320px;

  resize:vertical;

  font-family:monospace;

  font-size:14px;

  line-height:1.5;
}

.row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}


/* =====================================================
   STATUS
===================================================== */

.status{

  margin-top:10px;

  font-size:14px;

  line-height:1.5;
}

.success{
  color:#36e0b5;
}

.error{
  color:#ff7b72;
}

.warn{
  color:#fbbf24;
}


/* =====================================================
   PREVIEW
===================================================== */

.preview{

  background:#050c16;

  border:1px solid #304354;

  border-radius:10px;

  padding:12px;
}

.preview iframe{

  width:100%;

  height:650px;

  border:0;

  border-radius:8px;

  background:#fff;
}


/* =====================================================
   BUILD HISTORY
===================================================== */

.build-item{

  padding:14px 0;

  border-bottom:1px solid #263646;
}

.build-item:last-child{

  border-bottom:0;
}


/* =====================================================
   DOWNLOAD
===================================================== */

.download-area{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:12px;
}

.download-btn{

  display:inline-block;

  color:#fff;

  padding:13px 20px;

  border-radius:9px;

  text-decoration:none;

  font-weight:700;

  font-size:16px;
}

.download{
  background:#238636;
}

.open{
  background:#1f6feb;
}

.small{

  font-size:13px;

  color:#9fb0bf;
}


/* =====================================================
   URL BOX
===================================================== */

.url-help{

  margin-top:7px;

  color:#9fb0bf;

  font-size:13px;
}

.url-box{

  width:100%;

  background:#07111f;

  color:#fff;

  border:1px solid #304354;

  border-radius:9px;

  padding:14px;

  font-size:16px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .wrap{
    padding:10px;
  }

  .row{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:16px;
  }

  nav{
    padding:10px 12px;
  }

  .btn{
    width:100%;
  }

  .topactions .btn{
    width:auto;
    flex:1;
  }

  textarea{
    min-height:360px;
  }

  .download-btn{
    width:100%;
    text-align:center;
  }

}

</style>

</head>


<body>

<script>


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://lgwaeqgiqrsjprsecwxx.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================================
   APP ID
===================================================== */

const appId =
  new URLSearchParams(
    location.search
  ).get("id");



let user = null;

let app = null;

let pollingTimer = null;



/* =====================================================
   SHORTCUT
===================================================== */

const $ =
  id =>
    document.getElementById(id);



/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  cls = ""
){

  $("status").textContent =
    text;

  $("status").className =
    "status " + cls;

}



function sourceStatus(
  text,
  cls = ""
){

  $("webAppStatus").textContent =
    text;

  $("webAppStatus").className =
    "status " + cls;

}



/* =====================================================
   HTML ESCAPE
===================================================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    m => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m])

  );

}



/* =====================================================
   PACKAGE NAME
===================================================== */

function makePackage(name){

  let x =
    String(
      name || "myapp"
    )
    .toLowerCase()
    .replace(
      /[^a-z0-9]+/g,
      ""
    );


  if(!x){

    x =
      "myapp";

  }


  return (
    "com.asimtech." +
    x
  );

}



function validPackage(x){

  return /^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/
    .test(x);

}



/* =====================================================
   SOURCE MODE
===================================================== */

function changeSourceMode(){

  const mode =
    $("sourceMode").value;


  if(mode === "url"){

    $("codeSource").style.display =
      "none";

    $("urlSource").style.display =
      "block";

  }else{

    $("codeSource").style.display =
      "block";

    $("urlSource").style.display =
      "none";

  }

}



/* =====================================================
   PREVIEW
===================================================== */

function previewWebApp(){

  const mode =
    $("sourceMode").value;



  /* =================================================
     CODE PREVIEW
  ================================================== */

  if(mode === "code"){

    const code =
      $("webAppCode")
        .value
        .trim();


    if(!code){

      sourceStatus(
        "Please paste HTML code first.",
        "error"
      );

      return;

    }


    const blob =
      new Blob(
        [code],
        {
          type:"text/html"
        }
      );


    const url =
      URL.createObjectURL(blob);


    $("previewBox").innerHTML =

      `<iframe
        src="${url}">
       </iframe>`;


    sourceStatus(
      "Code preview loaded ✓",
      "success"
    );


    return;

  }



  /* =================================================
     URL PREVIEW
  ================================================== */

  const url =
    $("webAppUrl")
      .value
      .trim();


  if(!url){

    sourceStatus(
      "Please enter a Web App URL.",
      "error"
    );

    return;

  }


  try{

    const parsed =
      new URL(url);


    if(
      parsed.protocol !== "http:" &&
      parsed.protocol !== "https:"
    ){

      throw new Error();

    }

  }catch{

    sourceStatus(
      "Please enter a valid HTTP/HTTPS URL.",
      "error"
    );

    return;

  }


  $("previewBox").innerHTML =

    `<iframe
      src="${esc(url)}">
     </iframe>`;


  sourceStatus(
    "URL preview loaded ✓",
    "success"
  );

}



/* =====================================================
   LOAD SETTING
===================================================== */

async function loadSetting(key){

  const r =
    await sb
      .from("app_files")
      .select("content")
      .eq(
        "app_id",
        appId
      )
      .eq(
        "file_path",
        "android-settings.json"
      )
      .maybeSingle();


  if(
    r.error ||
    !r.data?.content
  ){

    return null;

  }


  try{

    const json =
      JSON.parse(
        r.data.content
      );


    return (
      json[key] ??
      null
    );

  }catch{

    return null;

  }

}



/* =====================================================
   LOAD SOURCE
===================================================== */

async function loadSource(){


  /*
     First check URL source.

     URL Mode intentionally stores
     BOTH webapp-url.txt and index.html.
  */

  let r =
    await sb
      .from("app_files")
      .select("content")
      .eq(
        "app_id",
        appId
      )
      .eq(
        "file_path",
        "webapp-url.txt"
      )
      .maybeSingle();


  if(
    !r.error &&
    r.data?.content
  ){

    $("sourceMode").value =
      "url";


    $("webAppUrl").value =
      r.data.content.trim();


    changeSourceMode();


    return;

  }



  /*
     Otherwise load Code Mode.
  */

  r =
    await sb
      .from("app_files")
      .select("content")
      .eq(
        "app_id",
        appId
      )
      .eq(
        "file_path",
        "index.html"
      )
      .maybeSingle();


  if(
    !r.error &&
    r.data?.content
  ){

    $("sourceMode").value =
      "code";


    $("webAppCode").value =
      r.data.content;


    changeSourceMode();


    return;

  }



  changeSourceMode();

}



/* =====================================================
   SAVE SETTINGS
===================================================== */

async function saveSettings(){

  const settings = {

    appName:
      $("appName")
        .value
        .trim()
      ||
      app?.name
      ||
      "ASIM TECH App",


    packageName:
      $("packageName")
        .value
        .trim()
      ||
      makePackage(
        app?.name
      ),


    versionName:
      $("versionName")
        .value
        .trim()
      ||
      "1.0.0",


    versionCode:
      Math.max(
        1,
        parseInt(
          $("versionCode")
            .value,
          10
        ) || 1
      )

  };



  if(
    !validPackage(
      settings.packageName
    )
  ){

    throw new Error(
      "Invalid package name. Example: com.asimtech.myapp"
    );

  }



  let r =
    await sb
      .from("app_files")
      .upsert(
        {

          app_id:
            appId,

          file_path:
            "android-settings.json",

          content:
            JSON.stringify(
              settings,
              null,
              2
            ),

          language:
            "json",

          updated_at:
            new Date()
              .toISOString()

        },
        {

          onConflict:
            "app_id,file_path"

        }
      );


  if(r.error){

    throw r.error;

  }



  r =
    await sb
      .from("apps")
      .update(
        {

          name:
            settings.appName,

          updated_at:
            new Date()
              .toISOString()

        }
      )
      .eq(
        "id",
        appId
      )
      .eq(
        "owner_id",
        user.id
      );


  if(r.error){

    throw r.error;

  }



  app.name =
    settings.appName;


  return settings;

}



/* =====================================================
   AUTOMATIC URL INDEX.HTML WRAPPER
===================================================== */

/*
   IMPORTANT:

   There is NO JavaScript <script> tag here.

   This prevents the outer android-builder.html
   from being broken by a nested script tag.

   The generated index.html uses a normal
   meta refresh to open the Web App URL.
*/

function makeUrlWrapper(url){

  const safeUrl =
    esc(url);


  return `<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>ASIM TECH App</title>

<meta
  http-equiv="refresh"
  content="0;url=${safeUrl}">

<style>

html,
body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  background:#07111f;

  color:#fff;

  font-family:Arial,sans-serif;

}

.loading{

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  text-align:center;

}

.loading h2{

  margin:0 0 10px;

}

.loading p{

  margin:6px 0;

}

a{

  color:#36e0b5;

}

</style>

</head>

<body>


<div class="loading">

  <h2>
    ⚡ ASIM TECH
  </h2>

  <p>
    Loading application…
  </p>

  <p>

    <a href="${safeUrl}">
      Open App
    </a>

  </p>

</div>


</body>

</html>`;

}



/* =====================================================
   SAVE WEB APP SOURCE
===================================================== */

async function saveWebAppSource(){

  const mode =
    $("sourceMode").value;


  const content =
    (
      mode === "code"
      ?
      $("webAppCode").value
      :
      $("webAppUrl").value
    )
    .trim();



  if(!content){

    sourceStatus(
      "Nothing to save.",
      "error"
    );

    return false;

  }



  /* =================================================
     CODE MODE
  ================================================== */

  if(mode === "code"){

    let r =
      await sb
        .from("app_files")
        .upsert(
          {

            app_id:
              appId,

            file_path:
              "index.html",

            content:
              content,

            language:
              "HTML",

            updated_at:
              new Date()
                .toISOString()

          },
          {

            onConflict:
              "app_id,file_path"

          }
        );


    if(r.error){

      throw r.error;

    }



    /*
       Remove URL source when switching
       back to Code Mode.
    */

    const del =
      await sb
        .from("app_files")
        .delete()
        .eq(
          "app_id",
          appId
        )
        .eq(
          "file_path",
          "webapp-url.txt"
        );


    if(del.error){

      console.warn(
        "Unable to remove old URL source:",
        del.error
      );

    }



    sourceStatus(
      "HTML source saved successfully ✓",
      "success"
    );


    return true;

  }



  /* =================================================
     URL MODE
  ================================================== */

  let parsedUrl;


  try{

    parsedUrl =
      new URL(content);

  }catch{

    sourceStatus(
      "Invalid URL. Example: https://example.com",
      "error"
    );

    return false;

  }



  /*
     Only HTTP and HTTPS.
  */

  if(
    parsedUrl.protocol !== "http:" &&
    parsedUrl.protocol !== "https:"
  ){

    sourceStatus(
      "Only HTTP/HTTPS URLs are supported.",
      "error"
    );

    return false;

  }



  const cleanUrl =
    parsedUrl.href;



  /* =================================================
     SAVE ORIGINAL URL
  ================================================== */

  let r =
    await sb
      .from("app_files")
      .upsert(
        {

          app_id:
            appId,

          file_path:
            "webapp-url.txt",

          content:
            cleanUrl,

          language:
            "URL",

          updated_at:
            new Date()
              .toISOString()

        },
        {

          onConflict:
            "app_id,file_path"

        }
      );


  if(r.error){

    throw r.error;

  }



  /* =================================================
     CREATE AUTOMATIC INDEX.HTML
  ================================================== */

  const wrapper =
    makeUrlWrapper(
      cleanUrl
    );


  r =
    await sb
      .from("app_files")
      .upsert(
        {

          app_id:
            appId,

          file_path:
            "index.html",

          content:
            wrapper,

          language:
            "HTML",

          updated_at:
            new Date()
              .toISOString()

        },
        {

          onConflict:
            "app_id,file_path"

        }
      );


  if(r.error){

    throw r.error;

  }



  /*
     IMPORTANT:

     DO NOT DELETE index.html.

     URL Mode keeps BOTH:

       webapp-url.txt
       index.html

     Therefore the existing
     request-apk-build function
     will find index.html.
  */


  sourceStatus(
    "Web App URL saved and APK wrapper created ✓",
    "success"
  );


  return true;

}



/* =====================================================
   SAVE PROJECT
===================================================== */

async function save(){

  try{

    if(!user){

      throw new Error(
        "Login session not available."
      );

    }



    await saveSettings();



    const saved =
      await saveWebAppSource();



    if(!saved){

      throw new Error(
        "Please provide a valid source."
      );

    }



    setStatus(
      "Project saved ✓",
      "success"
    );


  }catch(e){

    console.error(
      "Save error:",
      e
    );


    setStatus(
      "Save failed: " +
      e.message,
      "error"
    );

  }

}



/* =====================================================
   AUTOMATIC APK BUILD
===================================================== */

async function requestBuild(){

  const buildBtn =
    $("buildBtn");


  try{


    if(!user){

      throw new Error(
        "Please login first."
      );

    }



    /*
       Save settings first.
    */

    await saveSettings();



    /*
       Save source.

       In URL Mode this creates
       index.html automatically.
    */

    const saved =
      await saveWebAppSource();



    if(!saved){

      throw new Error(
        "Please save a valid source first."
      );

    }



    buildBtn.disabled =
      true;


    buildBtn.textContent =
      "⏳ Starting Build…";


    setStatus(
      "Connecting to APK build service…",
      "warn"
    );



    /* =================================================
       GET LOGIN SESSION
    ================================================== */

    const sessionResult =
      await sb.auth.getSession();



    if(
      sessionResult.error
    ){

      throw sessionResult.error;

    }



    const session =
      sessionResult
        .data
        ?.session;



    if(
      !session ||
      !session.access_token
    ){

      throw new Error(
        "Login session expired. Please login again."
      );

    }



    /* =================================================
       REQUEST APK BUILD
    ================================================== */

    const response =
      await fetch(

        SUPABASE_URL +
        "/functions/v1/request-apk-build",

        {

          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              session.access_token,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              {

                app_id:
                  appId,

                version_name:
                  $("versionName")
                    .value
                    .trim()

              }
            )

        }

      );



    let result = {};



    try{

      result =
        await response.json();

    }catch{

      result = {};

    }



    if(!response.ok){

      throw new Error(

        result.error ||
        result.message ||
        result.detail ||
        "Automatic APK build could not be started."

      );

    }



    setStatus(
      "APK build started automatically ✓",
      "success"
    );



    await loadBuilds();



    /*
       Poll every 10 seconds.
    */

    startBuildPolling();



  }catch(e){

    console.error(
      "APK build request error:",
      e
    );


    setStatus(
      "Build request failed: " +
      e.message,
      "error"
    );


  }finally{

    buildBtn.disabled =
      false;


    buildBtn.textContent =
      "🏗️ Build APK";

  }

}



/* =====================================================
   BUILD POLLING
===================================================== */

function startBuildPolling(){

  if(pollingTimer){

    clearInterval(
      pollingTimer
    );

  }



  let count = 0;



  pollingTimer =
    setInterval(

      async () => {

        count++;


        await loadBuilds();



        if(count >= 30){

          clearInterval(
            pollingTimer
          );


          pollingTimer =
            null;

        }

      },

      10000

    );

}



/* =====================================================
   DOWNLOAD URL
===================================================== */

function getDownloadUrl(build){

  if(
    !build ||
    !build.storage_path
  ){

    return null;

  }



  return (

    SUPABASE_URL +

    "/functions/v1/download-apk" +

    "?path=" +

    encodeURIComponent(
      build.storage_path
    ) +

    "&name=" +

    encodeURIComponent(

      build.file_name ||
      "ASIM-TECH-App.apk"

    )

  );

}



/* =====================================================
   BUILD HISTORY
===================================================== */

async function loadBuilds(){

  const r =
    await sb
      .from("app_builds")
      .select("*")
      .eq(
        "app_id",
        appId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      )
      .limit(10);



  if(r.error){

    $("builds").innerHTML =

      `<div class="error">

        Unable to load builds.

      </div>`;

    return;

  }



  if(
    !r.data ||
    !r.data.length
  ){

    $("builds").textContent =
      "No build requested yet.";

    return;

  }



  $("builds").innerHTML =

    r.data

      .map(

        build => {


          let cls =
            "warn";



          if(
            build.status ===
            "success"
          ){

            cls =
              "success";

          }



          if(
            build.status ===
            "failed"
          ){

            cls =
              "error";

          }



          let buttons =
            "";



          /* =================================================
             DOWNLOAD BUTTONS
          ================================================== */

          if(

            build.status ===
              "success" &&

            build.storage_path

          ){

            const url =
              getDownloadUrl(
                build
              );



            buttons = `

              <div class="download-area">

                <a
                  class="download-btn download"
                  href="${url}"
                  target="_blank"
                  rel="noopener">

                  📥 Download APK

                </a>


                <a
                  class="download-btn open"
                  href="${url}"
                  target="_blank"
                  rel="noopener">

                  📱 Open APK

                </a>

              </div>

            `;

          }



          /* =================================================
             BUILD LOG
          ================================================== */

          let log =
            "";



          if(
            build.build_log
          ){

            log = `

              <br><br>

              <span class="small">

                ${esc(
                  build.build_log
                )}

              </span>

            `;

          }



          return `

            <div class="build-item">


              <b>

                v${esc(
                  build.version_name ||
                  "1.0.0"
                )}

              </b>


              —


              <span
                class="${cls}">

                ${esc(
                  build.status ||
                  "queued"
                )}

              </span>


              <br>


              ${
                build.created_at

                ?

                new Date(
                  build.created_at
                ).toLocaleString()

                :

                ""

              }


              ${
                build.file_name

                ?

                `
                  <br>
                  📦
                  ${esc(
                    build.file_name
                  )}
                `

                :

                ""

              }


              ${
                build.file_size

                ?

                `
                  <br>
                  📏
                  ${(
                    build.file_size /
                    1024
                  ).toFixed(2)}
                  KB
                `

                :

                ""

              }


              ${log}


              ${buttons}


            </div>

          `;

        }

      )

      .join("");

}



/* =====================================================
   INITIALIZE
===================================================== */

async function init(){

  try{


    if(!appId){

      setStatus(
        "Missing app ID.",
        "error"
      );

      return;

    }



    /* =================================================
       GET LOGGED IN USER
    ================================================== */

    const {

      data:{
        user:u
      },

      error:userError

    } =
      await sb.auth.getUser();



    if(userError){

      throw userError;

    }



    if(!u){

      location.href =
        "login.html";

      return;

    }



    user =
      u;



    /* =================================================
       LOAD APP
    ================================================== */

    const r =
      await sb
        .from("apps")
        .select("*")
        .eq(
          "id",
          appId
        )
        .eq(
          "owner_id",
          user.id
        )
        .single();



    if(r.error){

      throw r.error;

    }



    app =
      r.data;



    /* =================================================
       APP NAME
    ================================================== */

    $("appName").value =
      app.name ||
      "";



    /* =================================================
       PACKAGE
    ================================================== */

    $("packageName").value =
      await loadSetting(
        "packageName"
      )
      ||
      makePackage(
        app.name
      );



    /* =================================================
       VERSION NAME
    ================================================== */

    $("versionName").value =
      await loadSetting(
        "versionName"
      )
      ||
      "1.0.0";



    /* =================================================
       VERSION CODE
    ================================================== */

    $("versionCode").value =
      await loadSetting(
        "versionCode"
      )
      ||
      1;



    /* =================================================
       LOAD SOURCE
    ================================================== */

    await loadSource();



    /* =================================================
       LOAD BUILD HISTORY
    ================================================== */

    await loadBuilds();



    setStatus(
      "Builder ready ✓",
      "success"
    );


  }catch(e){

    console.error(
      "Builder init error:",
      e
    );


    setStatus(
      "Unable to load builder: " +
      e.message,
      "error"
    );

  }

}



/* =====================================================
   START
===================================================== */

changeSourceMode();

init();


</script>
