<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Switch Test</title>

<style>
body{
    margin:0;
    padding:30px 20px;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
}

.box{
    max-width:450px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    text-align:center;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 0;
    border-bottom:1px solid #ddd;
}

.switch{
    position:relative;
    width:58px;
    height:32px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.slider{
    position:absolute;
    inset:0;
    background:#999;
    border-radius:20px;
    cursor:pointer;
}

.slider:before{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    left:3px;
    top:3px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

input:checked + .slider{
    background:#16a34a;
}

input:checked + .slider:before{
    transform:translateX(26px);
}

#status{
    margin-top:25px;
    padding:15px;
    text-align:center;
    background:#fee2e2;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>ASIM TECH Switch Test</h2>

<div class="row">
    <span>Test Switch 1</span>

    <label class="switch">
        <input type="checkbox" id="switch1">
        <span class="slider"></span>
    </label>
</div>

<div class="row">
    <span>Test Switch 2</span>

    <label class="switch">
        <input type="checkbox" id="switch2">
        <span class="slider"></span>
    </label>
</div>

<div id="status">
    ❌ Switch is OFF
</div>

</div>

<script>

const switch1 =
document.getElementById("switch1");

const switch2 =
document.getElementById("switch2");

const status =
document.getElementById("status");


switch1.addEventListener("change", function(){

    if(this.checked){

        status.innerHTML =
        "✅ Switch 1 is ON";

        status.style.background =
        "#dcfce7";

        status.style.color =
        "#166534";

    }else{

        status.innerHTML =
        "❌ Switch 1 is OFF";

        status.style.background =
        "#fee2e2";

        status.style.color =
        "#991b1b";
    }

});


switch2.addEventListener("change", function(){

    if(this.checked){

        status.innerHTML =
        "✅ Switch 2 is ON";

        status.style.background =
        "#dcfce7";

        status.style.color =
        "#166534";

    }else{

        status.innerHTML =
        "❌ Switch 2 is OFF";

        status.style.background =
        "#fee2e2";

        status.style.color =
        "#991b1b";
    }

});

</script>

</body>
</html>
