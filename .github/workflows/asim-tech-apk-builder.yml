            gradle assembleDebug \
              --no-daemon \
              --stacktrace

            echo "Checking APK output..."

            test -f \
              app/build/outputs/apk/debug/app-debug.apk

            echo "APK BUILD COMPLETED."

            ls -lh \
              app/build/outputs/apk/debug/

            echo \
              "OUTPUT_FILE=app/build/outputs/apk/debug/app-debug.apk" \
              >> "$GITHUB_ENV"

            echo "OUTPUT_EXT=apk" >> "$GITHUB_ENV"

          fi


      # =========================================================
      # RENAME APK / AAB
      # =========================================================

      - name: Rename APK/AAB
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          FINAL_FILE="ASIM-TECH-${BUILD_ID}.${OUTPUT_EXT}"

