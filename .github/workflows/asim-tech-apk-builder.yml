          echo ""
          echo "Android project verification completed."


      # =====================================================
      # BUILD APK
      # =====================================================

      - name: Build APK
        if: steps.queue.outputs.has_build == 'true'
        working-directory: android-project
        run: |

          echo "======================================"
          echo "STARTING APK BUILD"
          echo "======================================"


          gradle assembleDebug \
            --no-daemon \
            --stacktrace


          echo ""
          echo "======================================"
          echo "APK BUILD COMPLETED"
          echo "======================================"


          ls -lh \
            app/build/outputs/apk/debug/


      # =====================================================
      # RENAME APK
      # =====================================================

      - name: Rename APK
        if: steps.queue.outputs.has_build == 'true'
        run: |

          BUILD_ID="${{ steps.queue.outputs.build_id }}"


          cp \
            android-project/app/build/outputs/apk/debug/app-debug.apk \
            "ASIM-TECH-${BUILD_ID}.apk"


          ls -lh \
            "ASIM-TECH-${BUILD_ID}.apk"


      # =====================================================
      # SHA256
      # =====================================================

      - name: Calculate SHA256
        if: steps.queue.outputs.has_build == 'true'
        id: sha
        run: |

          BUILD_ID="${{ steps.queue.outputs.build_id }}"


          SHA=$(
            sha256sum \
              "ASIM-TECH-${BUILD_ID}.apk" |
            awk '{print $1}'
          )


          SIZE=$(
            stat -c%s \
              "ASIM-TECH-${BUILD_ID}.apk"
          )


          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"


          echo "SHA256=$SHA"

          echo "SIZE=$SIZE"


      # =====================================================
      # UPLOAD APK TO SUPABASE
      # =====================================================

      - name: Upload APK
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"

          STORAGE_PATH="${BUILD_ID}/${FILE_NAME}"


          curl -fL -X POST \
            "${SUPABASE_URL}/storage/v1/object/android-apks/${STORAGE_PATH}?upsert=true" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${FILE_NAME}"


          echo "STORAGE_PATH=${STORAGE_PATH}" \
            >> "$GITHUB_ENV"


          echo "APK uploaded successfully."


      # =====================================================
      # MARK SUCCESS
      # =====================================================

      - name: Mark build successful
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"


          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"success\",
              \"storage_path\": \"${STORAGE_PATH}\",
              \"file_name\": \"${FILE_NAME}\",
              \"mime_type\": \"application/vnd.android.package-archive\",
              \"file_size\": ${{ steps.sha.outputs.size }},
              \"sha256\": \"${{ steps.sha.outputs.sha256 }}\",
              \"completed_at\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"


          echo "BUILD SUCCESS."


      # =====================================================
      # GITHUB ARTIFACT
      # =====================================================

      - name: Upload APK artifact
        if: steps.queue.outputs.has_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ASIM-TECH-${{ steps.queue.outputs.build_id }}
          path: ASIM-TECH-${{ steps.queue.outputs.build_id }}.apk
          if-no-files-found: error


      # =====================================================
      # MARK FAILED
      # =====================================================

      - name: Mark build failed
        if: failure() && steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          echo "Build failed."


          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"failed\",
              \"build_log\": \"GitHub Actions Android build failed. Check the Actions log for details.\",
              \"completed_at\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"
