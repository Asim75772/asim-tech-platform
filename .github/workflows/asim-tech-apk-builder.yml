name: ASIM TECH Android APK Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: android-apk-builder
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # TOOLS
      # =====================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq imagemagick


      # =====================================================
      # GRADLE
      # =====================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # =====================================================
      # GET QUEUED BUILD
      # =====================================================

      - name: Get queued build
        id: queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          echo "Checking queued builds..."

          RESPONSE=$(curl -sS \
            "${SUPABASE_URL}/rest/v1/app_builds?status=eq.queued&order=queued_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "$RESPONSE"

          BUILD_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')
          APP_ID=$(echo "$RESPONSE" | jq -r '.[0].app_id // empty')

          if [ -z "$BUILD_ID" ] || [ -z "$APP_ID" ]; then
            echo "No queued build found."
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "BUILD_ID=$BUILD_ID"
          echo "APP_ID=$APP_ID"

          echo "has_build=true" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"


      # =====================================================
      # STOP IF NO BUILD
      # =====================================================

      - name: Stop if queue empty
        if: steps.queue.outputs.has_build != 'true'
        run: |
          echo "No queued APK build."
          exit 0


      # =====================================================
      # MARK BUILDING
      # =====================================================

      - name: Mark build as building
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"building\",
              \"started_at\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"

          echo "Build marked as building."


      # =====================================================
      # DOWNLOAD APP FILES
      # =====================================================

      - name: Download app files
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ID: ${{ steps.queue.outputs.app_id }}
        run: |

          mkdir -p source

          curl -sS \
            "${SUPABASE_URL}/rest/v1/app_files?app_id=eq.${APP_ID}&select=file_path,content,language" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > source/files.json

          echo "Downloaded app files."

          jq 'length' source/files.json


      # =====================================================
      # CREATE WEB FILES
      # =====================================================

      - name: Create source files
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p webapp

          jq -c '.[]' source/files.json | while read -r item
          do

            FILE_PATH=$(echo "$item" | jq -r '.file_path')
            CONTENT=$(echo "$item" | jq -r '.content')

            if [ -z "$FILE_PATH" ] || [ "$FILE_PATH" = "null" ]; then
              continue
            fi

            mkdir -p "webapp/$(dirname "$FILE_PATH")"

            printf '%s' "$CONTENT" > "webapp/$FILE_PATH"

          done

          echo "Source files created."

          find webapp -type f -print


      # =====================================================
      # PREPARE INDEX
      # =====================================================

      - name: Prepare web application
        if: steps.queue.outputs.has_build == 'true'
        run: |

          echo "Checking index.html..."

          if [ ! -f "webapp/index.html" ]; then

            if [ -f "webapp/webapp-url.txt" ]; then

              URL=$(cat "webapp/webapp-url.txt" | tr -d '\r\n')

              cat > webapp/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport"
                content="width=device-width,
                         initial-scale=1.0,
                         maximum-scale=1.0,
                         user-scalable=no">
          <title>ASIM TECH App</title>
          </head>
          <body>
          <script>
          window.location.replace("__ASIM_TECH_URL__");
          </script>
          </body>
          </html>
          EOF

              sed -i "s|__ASIM_TECH_URL__|${URL}|g" webapp/index.html

            else

              echo "ERROR: index.html not found."
              exit 1

            fi

          fi

          echo "index.html ready."


      # =====================================================
      # READ ANDROID SETTINGS
      # =====================================================

      - name: Read Android settings
        if: steps.queue.outputs.has_build == 'true'
        run: |

          if [ -f "webapp/android-settings.json" ]; then

            cp \
              "webapp/android-settings.json" \
              android-settings.json

          else

            cat > android-settings.json <<'EOF'
          {
            "appName": "ASIM TECH APP",
            "packageName": "com.asimtech.app",
            "versionName": "1.0.0",
            "versionCode": 1
          }
          EOF

          fi

          cat android-settings.json

          APP_NAME=$(jq -r '.appName // "ASIM TECH APP"' android-settings.json)

          PACKAGE_NAME=$(jq -r '.packageName // "com.asimtech.app"' android-settings.json)

          VERSION_NAME=$(jq -r '.versionName // "1.0.0"' android-settings.json)

          VERSION_CODE=$(jq -r '.versionCode // 1' android-settings.json)

          APP_ICON_URL=$(jq -r '.appIconUrl // empty' android-settings.json)

          APP_ICON_PATH=$(jq -r '.appIconPath // empty' android-settings.json)

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_ICON_URL=$APP_ICON_URL" >> "$GITHUB_ENV"
          echo "APP_ICON_PATH=$APP_ICON_PATH" >> "$GITHUB_ENV"


      # =====================================================
      # CREATE ANDROID PROJECT
      # =====================================================

      - name: Create Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p android-project/app/src/main/assets

          cp -r \
            webapp/. \
            android-project/app/src/main/assets/

          echo "Android project created."


      # =====================================================
      # ICON
      # =====================================================

      - name: Prepare launcher icon
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

          ICON_FILE="launcher-icon.png"

          if [ -n "$APP_ICON_PATH" ]; then

            curl -fL \
              "${SUPABASE_URL}/storage/v1/object/website-images/${APP_ICON_PATH}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o "$ICON_FILE" || true

          fi

          if [ ! -s "$ICON_FILE" ] && [ -n "$APP_ICON_URL" ]; then

            curl -fL \
              "$APP_ICON_URL" \
              -o "$ICON_FILE" || true

          fi

          if [ ! -s "$ICON_FILE" ]; then

            convert \
              -size 512x512 \
              xc:"#18A558" \
              -gravity center \
              -fill white \
              -draw "rectangle 160,110 352,402" \
              "$ICON_FILE"

          fi

          convert "$ICON_FILE" \
            -resize 48x48 \
            android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 72x72 \
            android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 96x96 \
            android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 144x144 \
            android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 192x192 \
            android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            cp \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher.png" \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher_round.png"

          done


      # =====================================================
      # GRADLE PROPERTIES
      # =====================================================

      - name: Create Gradle properties
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # =====================================================
      # SETTINGS.GRADLE
      # =====================================================

      - name: Create settings.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "GeneratedApp"

          include(":app")
          EOF


      # =====================================================
      # ROOT BUILD.GRADLE
      # =====================================================

      - name: Create root build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/build.gradle <<'EOF'
          plugins {

              id 'com.android.application' version '8.7.3' apply false

          }
          EOF


      # =====================================================
      # APP BUILD.GRADLE
      # =====================================================

      - name: Create app build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/app/build.gradle <<'EOF'
          plugins {

              id 'com.android.application'

          }

          android {

              namespace '__PACKAGE_NAME__'

              compileSdk 35

              defaultConfig {

                  applicationId '__PACKAGE_NAME__'

                  minSdk 23

                  targetSdk 35

                  versionCode __VERSION_CODE__

                  versionName '__VERSION_NAME__'

              }

          }

          dependencies {

              implementation 'androidx.webkit:webkit:1.12.1'

          }
          EOF

          sed -i "s|__PACKAGE_NAME__|${PACKAGE_NAME}|g" \
            android-project/app/build.gradle

          sed -i "s|__VERSION_CODE__|${VERSION_CODE}|g" \
            android-project/app/build.gradle

          sed -i "s|__VERSION_NAME__|${VERSION_NAME}|g" \
            android-project/app/build.gradle


      # =====================================================
      # ANDROID MANIFEST
      # CAMERA PERMISSION
      # =====================================================

      - name: Create Android Manifest
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p android-project/app/src/main

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="__APP_NAME__"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          sed -i "s|__APP_NAME__|${APP_NAME}|g" \
            android-project/app/src/main/AndroidManifest.xml


      # =====================================================
      # MAIN ACTIVITY
      # =====================================================

      - name: Create MainActivity
        if: steps.queue.outputs.has_build == 'true'
        run: |

          JAVA_PATH="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          mkdir -p "$JAVA_PATH"

          cat > "$JAVA_PATH/MainActivity.java" <<'EOF'
          package __PACKAGE_NAME__;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends Activity {

              private WebView webView;

              private PermissionRequest pendingPermissionRequest;

              private static final int CAMERA_PERMISSION_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(
                      Color.rgb(180, 35, 0)
                  );

                  getWindow().setNavigationBarColor(
                      Color.BLACK
                  );

                  webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setUseWideViewPort(true);

                  settings.setLoadWithOverviewMode(true);

                  settings.setSupportZoom(false);

                  final WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()

                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader
                                  .AssetsPathHandler(this)
                          )

                          .build();

                  webView.setWebViewClient(
                      new WebViewClientCompat() {

                          @Override
                          public WebResourceResponse
                          shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              return assetLoader
                                  .shouldInterceptRequest(
                                      request.getUrl()
                                  );

                          }

                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(() -> {

                                  boolean cameraRequested = false;

                                  String[] resources =
                                      request.getResources();

                                  if (resources != null) {

                                      for (
                                          String resource :
                                          resources
                                      ) {

                                          if (
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                                  .equals(resource)
                                          ) {

                                              cameraRequested = true;

                                              break;

                                          }

                                      }

                                  }

                                  if (!cameraRequested) {

                                      request.deny();

                                      return;

                                  }

                                  if (
                                      checkSelfPermission(
                                          Manifest.permission.CAMERA
                                      )
                                      ==
                                      PackageManager.PERMISSION_GRANTED
                                  ) {

                                      request.grant(
                                          new String[] {
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                          }
                                      );

                                      return;

                                  }

                                  pendingPermissionRequest =
                                      request;

                                  requestPermissions(
                                      new String[] {
                                          Manifest.permission.CAMERA
                                      },
                                      CAMERA_PERMISSION_REQUEST
                                  );

                              });

                          }

                          @Override
                          public void onPermissionRequestCanceled(
                              PermissionRequest request
                          ) {

                              if (
                                  pendingPermissionRequest == request
                              ) {

                                  pendingPermissionRequest = null;

                              }

                              super.onPermissionRequestCanceled(
                                  request
                              );

                          }

                      }
                  );

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );

                  setContentView(webView);

              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (
                      requestCode ==
                      CAMERA_PERMISSION_REQUEST
                  ) {

                      if (
                          pendingPermissionRequest != null
                      ) {

                          if (
                              grantResults.length > 0
                              &&
                              grantResults[0]
                              ==
                              PackageManager.PERMISSION_GRANTED
                          ) {

                              pendingPermissionRequest.grant(
                                  new String[] {
                                      PermissionRequest
                                          .RESOURCE_VIDEO_CAPTURE
                                  }
                              );

                          } else {

                              pendingPermissionRequest.deny();

                          }

                          pendingPermissionRequest = null;

                      }

                  }

              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null
                      &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.destroy();

                  }

                  super.onDestroy();

              }

          }
          EOF

          sed -i "s|__PACKAGE_NAME__|${PACKAGE_NAME}|g" \
            "$JAVA_PATH/MainActivity.java"


      # =====================================================
      # APP STYLE
      # =====================================================

      - name: Create styles
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p \
            android-project/app/src/main/res/values

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#18A558</item>

                  <item name="android:statusBarColor">#B42300</item>

                  <item name="android:navigationBarColor">#000000</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:windowLightNavigationBar">false</item>

              </style>

          </resources>
          EOF


      # =====================================================
      # VERIFY ANDROID PROJECT
      # =====================================================

      - name: Verify Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          echo "======================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "======================================"

          test -f android-project/build.gradle

          test -f android-project/settings.gradle

          test -f android-project/app/build.gradle

          test -f android-project/app/src/main/AndroidManifest.xml

          test -f android-project/app/src/main/res/values/styles.xml

          echo ""
          echo "Checking CAMERA permission..."

          grep \
            "android.permission.CAMERA" \
            android-project/app/src/main/AndroidManifest.xml

          echo ""
          echo "Checking package..."

          grep \
            "applicationId" \
            android-project/app/build.gradle

          echo ""
          echo "Checking Gradle plugin..."

          grep \
            "com.android.application" \
            android-project/build.gradle

          echo ""
          echo "Checking MainActivity..."

          test -f \
            "android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"

          echo ""
          echo "Project verification completed."


      # =====================================================
      # BUILD APK
      # =====================================================

      - name: Build APK
        if: steps.queue.outputs.has_build == 'true'
        working-directory: android-project
        run: |

          echo "======================================"
          echo "STARTING APK BUILD"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo "APK BUILD COMPLETED"
          echo "======================================"

          ls -lh \
            app/build/outputs/apk/debug/


      # =====================================================
      # RENAME APK
      # =====================================================

      - name: Rename APK
        if: steps.queue.outputs.has_build == 'true'
        run: |

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          cp \
            android-project/app/build/outputs/apk/debug/app-debug.apk \
            "ASIM-TECH-${BUILD_ID}.apk"

          ls -lh \
            "ASIM-TECH-${BUILD_ID}.apk"


      # =====================================================
      # SHA256
      # =====================================================

      - name: Calculate SHA256
        if: steps.queue.outputs.has_build == 'true'
        id: sha
        run: |

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          SHA=$(
            sha256sum \
              "ASIM-TECH-${BUILD_ID}.apk" |
            awk '{print $1}'
          )

          SIZE=$(
            stat -c%s \
              "ASIM-TECH-${BUILD_ID}.apk"
          )

          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          echo "SHA256=$SHA"

          echo "SIZE=$SIZE"


      # =====================================================
      # UPLOAD APK TO SUPABASE
      # =====================================================

      - name: Upload APK
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"

          STORAGE_PATH="${BUILD_ID}/${FILE_NAME}"

          curl -fL -X POST \
            "${SUPABASE_URL}/storage/v1/object/android-apks/${STORAGE_PATH}?upsert=true" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${FILE_NAME}"

          echo "STORAGE_PATH=${STORAGE_PATH}" \
            >> "$GITHUB_ENV"

          echo "APK uploaded successfully."


      # =====================================================
      # MARK SUCCESS
      # =====================================================

      - name: Mark build successful
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"success\",
              \"storage_path\": \"${STORAGE_PATH}\",
              \"file_name\": \"${FILE_NAME}\",
              \"mime_type\": \"application/vnd.android.package-archive\",
              \"file_size\": ${{ steps.sha.outputs.size }},
              \"sha256\": \"${{ steps.sha.outputs.sha256 }}\",
              \"completed_at\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"

          echo "BUILD SUCCESS."


      # =====================================================
      # GITHUB ARTIFACT
      # =====================================================

      - name: Upload APK artifact
        if: steps.queue.outputs.has_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ASIM-TECH-${{ steps.queue.outputs.build_id }}
          path: ASIM-TECH-${{ steps.queue.outputs.build_id }}.apk
          if-no-files-found: error


      # =====================================================
      # MARK FAILED
      # =====================================================

      - name: Mark build failed
        if: failure() && steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          echo "Build failed."

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"failed\",
              \"build_log\": \"GitHub Actions Android build failed.\",
              \"completed_at\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"
