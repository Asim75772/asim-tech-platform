name: ASIM TECH Android APK Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: android-apk-builder
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # TOOLS
      # =========================================================

      - name: Install dependencies
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            imagemagick \
            python3


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # =========================================================
      # GET QUEUED BUILD
      # =========================================================

      - name: Get queued build
        id: queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          set -e

          RESPONSE=$(curl -sS \
            --fail-with-body \
            "${SUPABASE_URL}/rest/v1/app_builds?status=eq.queued&order=queued_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")

          echo "$RESPONSE"

          BUILD_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')

          if [ -z "$BUILD_ID" ]; then
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_build=true" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"


      # =========================================================
      # STOP IF EMPTY
      # =========================================================

      - name: Stop if queue empty
        if: steps.queue.outputs.has_build != 'true'
        run: |

          echo "No queued build."
          exit 0


      # =========================================================
      # RESOLVE BUILD
      # =========================================================

      - name: Resolve build information
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          set -e

          RESPONSE=$(curl -sS \
            --fail-with-body \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}&select=id,app_id,status,version_name,version_code,build_type,created_by&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")

          APP_ID=$(echo "$RESPONSE" | jq -r '.[0].app_id // empty')
          VERSION_NAME=$(echo "$RESPONSE" | jq -r '.[0].version_name // "1.0.0"')
          VERSION_CODE=$(echo "$RESPONSE" | jq -r '.[0].version_code // 1')
          BUILD_TYPE=$(echo "$RESPONSE" | jq -r '.[0].build_type // "apk"')

          if [ "$BUILD_TYPE" != "apk" ] && [ "$BUILD_TYPE" != "aab" ]; then
            BUILD_TYPE="apk"
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: APP_ID missing."
            exit 1
          fi

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"

          echo "APP_ID=$APP_ID"
          echo "VERSION_NAME=$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE"
          echo "BUILD_TYPE=$BUILD_TYPE"


      # =========================================================
      # MARK BUILDING
      # =========================================================

      - name: Mark build as building
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\":\"building\",
              \"started_at\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"


      # =========================================================
      # DOWNLOAD APP FILES
      # =========================================================

      - name: Download app files
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          set -e

          mkdir -p source

          curl -sS \
            --fail-with-body \
            "${SUPABASE_URL}/rest/v1/app_files?app_id=eq.${APP_ID}&select=file_path,content,language" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            > source/files.json

          COUNT=$(jq 'length' source/files.json)

          echo "FILE COUNT=$COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No source files."
            exit 1
          fi


      # =========================================================
      # CREATE SOURCE FILES
      # =========================================================

      - name: Create source files
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          rm -rf webapp
          mkdir -p webapp

          python3 <<'PY'

          import json
          import os
          import sys

          with open("source/files.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for item in data:

              file_path = item.get("file_path")
              content = item.get("content", "")

              if not file_path:
                  continue

              normalized = os.path.normpath(file_path)

              if normalized.startswith("/") or normalized == ".." or normalized.startswith("../"):
                  print("Unsafe path:", file_path)
                  sys.exit(1)

              destination = os.path.join(
                  "webapp",
                  normalized
              )

              os.makedirs(
                  os.path.dirname(destination),
                  exist_ok=True
              )

              with open(
                  destination,
                  "w",
                  encoding="utf-8"
              ) as out:
                  out.write(str(content))

              print("Created:", destination)

          PY


      # =========================================================
      # PREPARE WEB APP
      # =========================================================

      - name: Prepare web application
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          if [ ! -f webapp/index.html ]; then

            if [ -f webapp/webapp-url.txt ]; then

              URL=$(tr -d '\r\n' < webapp/webapp-url.txt)

              cat > webapp/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport"
                    content="width=device-width,initial-scale=1.0">
              <title>ASIM TECH</title>
          </head>
          <body>
          <script>
          window.location.replace("${URL}");
          </script>
          </body>
          </html>
          EOF

            else

              echo "ERROR: index.html not found."
              exit 1

            fi

          fi


      # =========================================================
      # ANDROID SETTINGS
      # =========================================================

      - name: Read Android settings
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          if [ -f webapp/android-settings.json ]; then

            cp webapp/android-settings.json android-settings.json

          else

            cat > android-settings.json <<'EOF'
          {
            "appName": "CineReel Video Editor",
            "packageName": "com.asimtech.cinereel",
            "versionName": "1.0.0",
            "versionCode": 1
          }
          EOF

          fi

          APP_NAME=$(jq -r '.appName // "CineReel Video Editor"' android-settings.json)

          PACKAGE_NAME=$(jq -r '.packageName // "com.asimtech.cinereel"' android-settings.json)

          APP_ICON_URL=$(jq -r '.appIconUrl // empty' android-settings.json)

          APP_ICON_PATH=$(jq -r '.appIconPath // empty' android-settings.json)

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "APP_ICON_URL=$APP_ICON_URL" >> "$GITHUB_ENV"
          echo "APP_ICON_PATH=$APP_ICON_PATH" >> "$GITHUB_ENV"


      # =========================================================
      # CREATE ANDROID PROJECT
      # =========================================================

      - name: Create Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          mkdir -p android-project/app/src/main/assets

          cp -r webapp/. \
            android-project/app/src/main/assets/


      # =========================================================
      # LAUNCHER ICON
      # =========================================================

      - name: Prepare launcher icon
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          set -e

          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

          ICON_FILE="launcher-icon.png"

          if [ -n "$APP_ICON_PATH" ]; then

            curl -fL \
              "${SUPABASE_URL}/storage/v1/object/website-images/${APP_ICON_PATH}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o "$ICON_FILE" || true

          fi

          if [ ! -s "$ICON_FILE" ] && [ -n "$APP_ICON_URL" ]; then

            curl -fL \
              "$APP_ICON_URL" \
              -o "$ICON_FILE" || true

          fi

          if [ ! -s "$ICON_FILE" ]; then

            convert \
              -size 512x512 \
              xc:"#087FF5" \
              -gravity center \
              -fill white \
              -draw "circle 256,256 256,100" \
              "$ICON_FILE"

          fi

          convert "$ICON_FILE" -resize 48x48 \
            android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 72x72 \
            android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 96x96 \
            android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 144x144 \
            android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 192x192 \
            android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            cp \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher.png" \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher_round.png"

          done
                # =========================================================
      # GRADLE PROPERTIES
      # =========================================================

      - name: Create gradle.properties
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          cat > android-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


      # =========================================================
      # SETTINGS GRADLE
      # =========================================================

      - name: Create settings.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ASIMTECH"
          include ':app'
          EOF


      # =========================================================
      # ROOT BUILD GRADLE
      # =========================================================

      - name: Create root build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          cat > android-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF


      # =========================================================
      # PREPARE APP JAVA DIRECTORY
      # =========================================================

      - name: Prepare Java directory
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          JAVA_DIR="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          mkdir -p "$JAVA_DIR"
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi


      # =========================================================
      # APP BUILD.GRADLE
      # =========================================================

      - name: Create app build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          cat > android-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '__PACKAGE_NAME__'
              compileSdk 36

              defaultConfig {
                  applicationId '__PACKAGE_NAME__'
                  minSdk 24
                  targetSdk 35
                  versionCode __VERSION_CODE__
                  versionName "__VERSION_NAME__"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.webkit:webkit:1.12.1'

              implementation 'androidx.media3:media3-transformer:1.10.1'

              implementation 'androidx.media3:media3-common:1.10.1'
          }
          EOF

          sed -i \
            "s|__PACKAGE_NAME__|${PACKAGE_NAME}|g; \
             s|__VERSION_CODE__|${VERSION_CODE}|g; \
             s|__VERSION_NAME__|${VERSION_NAME}|g" \
            android-project/app/build.gradle


      # =========================================================
      # MAIN ACTIVITY
      # =========================================================

      - name: Create MainActivity
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          JAVA_DIR="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'

          package __PACKAGE_NAME__;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.transformer.Composition;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.Transformer;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {

              private static final int PICK_VIDEO = 1001;
              private static final int CAMERA_PERMISSION = 1002;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;

              private Transformer transformer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  setupWebView();
              }

              private void setupWebView() {

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView webView,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          filePathCallback = callback;

                          Intent intent =
                                  new Intent(Intent.ACTION_OPEN_DOCUMENT);

                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("video/*");

                          startActivityForResult(
                                  Intent.createChooser(
                                          intent,
                                          "Select Video"),
                                  PICK_VIDEO);

                          return true;
                      }
                  });

                  webView.addJavascriptInterface(
                          new AndroidBridge(),
                          "AndroidExport");

                  webView.loadUrl(
                          "file:///android_asset/index.html");
              }


              // =================================================
              // JAVASCRIPT BRIDGE
              // =================================================

              private class AndroidBridge {

                  @JavascriptInterface
                  public void exportVideo(String sourcePath) {

                      runOnUiThread(() -> {

                          try {

                              if (sourcePath == null ||
                                      sourcePath.trim().isEmpty()) {

                                  Toast.makeText(
                                          MainActivity.this,
                                          "Video file not found",
                                          Toast.LENGTH_SHORT
                                  ).show();

                                  return;
                              }

                              startExport(sourcePath);

                          } catch (Exception e) {

                              Toast.makeText(
                                      MainActivity.this,
                                      "Export error: " + e.getMessage(),
                                      Toast.LENGTH_LONG
                              ).show();
                          }
                      });
                  }
              }


              // =================================================
              // VIDEO EXPORT
              // =================================================

              private void startExport(String sourcePath) {

                  try {

                      Uri inputUri = Uri.parse(sourcePath);

                      MediaItem mediaItem =
                              MediaItem.fromUri(inputUri);

                      EditedMediaItem editedMediaItem =
                              new EditedMediaItem.Builder(mediaItem)
                                      .build();

                      File outputDir =
                              new File(
                                      getExternalFilesDir(
                                              Environment.DIRECTORY_MOVIES),
                                      "ASIMTECH");

                      if (!outputDir.exists()) {
                          outputDir.mkdirs();
                      }

                      File outputFile =
                              new File(
                                      outputDir,
                                      "ASIMTECH_" +
                                      System.currentTimeMillis() +
                                      ".mp4");

                      transformer =
                              new Transformer.Builder(this)

                                      .setVideoMimeType(
                                              MimeTypes.VIDEO_H264)

                                      .setAudioMimeType(
                                              MimeTypes.AUDIO_AAC)

                                      .addListener(
                                              new Transformer.Listener() {

                                          @Override
                                          public void onCompleted(
                                                  Composition composition,
                                                  ExportResult result) {

                                              runOnUiThread(() -> {

                                                  saveToGallery(
                                                          outputFile);

                                                  Toast.makeText(
                                                          MainActivity.this,
                                                          "Video exported successfully",
                                                          Toast.LENGTH_LONG
                                                  ).show();

                                                  notifyJavascript(
                                                          "success",
                                                          outputFile.getAbsolutePath());
                                              });
                                          }


                                          @Override
                                          public void onError(
                                                  Composition composition,
                                                  ExportResult result,
                                                  ExportException exception) {

                                              runOnUiThread(() -> {

                                                  Toast.makeText(
                                                          MainActivity.this,
                                                          "Export failed: " +
                                                          exception.getMessage(),
                                                          Toast.LENGTH_LONG
                                                  ).show();

                                                  notifyJavascript(
                                                          "error",
                                                          exception.getMessage());
                                              });
                                          }
                                      })
                                      .build();


                      transformer.start(
                              editedMediaItem,
                              outputFile.getAbsolutePath());

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Export error: " + e.getMessage(),
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }


              // =================================================
              // SAVE VIDEO TO GALLERY
              // =================================================

              private void saveToGallery(File sourceFile) {

                  try {

                      if (!sourceFile.exists()) {
                          return;
                      }

                      ContentValues values =
                              new ContentValues();

                      values.put(
                              MediaStore.Video.Media.DISPLAY_NAME,
                              sourceFile.getName());

                      values.put(
                              MediaStore.Video.Media.MIME_TYPE,
                              "video/mp4");

                      if (Build.VERSION.SDK_INT >=
                              Build.VERSION_CODES.Q) {

                          values.put(
                                  MediaStore.Video.Media.RELATIVE_PATH,
                                  Environment.DIRECTORY_MOVIES +
                                  "/ASIM TECH");

                          values.put(
                                  MediaStore.Video.Media.IS_PENDING,
                                  1);

                          Uri uri =
                                  getContentResolver().insert(
                                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                                          values);

                          if (uri == null) {
                              return;
                          }

                          try (InputStream input =
                                      new FileInputStream(sourceFile);
                               OutputStream output =
                                      getContentResolver()
                                              .openOutputStream(uri)) {

                              byte[] buffer =
                                      new byte[8192];

                              int length;

                              while ((length =
                                      input.read(buffer)) > 0) {

                                  output.write(buffer, 0, length);
                              }
                          }

                          ContentValues complete =
                                  new ContentValues();

                          complete.put(
                                  MediaStore.Video.Media.IS_PENDING,
                                  0);

                          getContentResolver().update(
                                  uri,
                                  complete,
                                  null,
                                  null);

                      } else {

                          File movies =
                                  Environment.getExternalStoragePublicDirectory(
                                          Environment.DIRECTORY_MOVIES);

                          File folder =
                                  new File(
                                          movies,
                                          "ASIM TECH");

                          if (!folder.exists()) {
                              folder.mkdirs();
                          }

                          File destination =
                                  new File(
                                          folder,
                                          sourceFile.getName());

                          try (InputStream input =
                                      new FileInputStream(sourceFile);
                               OutputStream output =
                                      new FileOutputStream(destination)) {

                              byte[] buffer =
                                      new byte[8192];

                              int length;

                              while ((length =
                                      input.read(buffer)) > 0) {

                                  output.write(buffer, 0, length);
                              }
                          }

                          Intent scanIntent =
                                  new Intent(
                                          Intent.ACTION_MEDIA_SCANNER_SCAN_FILE);

                          scanIntent.setData(
                                  Uri.fromFile(destination));

                          sendBroadcast(scanIntent);
                      }

                  } catch (Exception e) {

                      e.printStackTrace();
                  }
              }


              // =================================================
              // JAVASCRIPT CALLBACK
              // =================================================

              private void notifyJavascript(
                      String status,
                      String message) {

                  if (webView == null) {
                      return;
                  }

                  String safeStatus =
                          status == null
                                  ? ""
                                  : status.replace(
                                          "\\",
                                          "\\\\")
                                      .replace(
                                          "'",
                                          "\\'");

                  String safeMessage =
                          message == null
                                  ? ""
                                  : message.replace(
                                          "\\",
                                          "\\\\")
                                      .replace(
                                          "'",
                                          "\\'");

                  String script =
                          "window.dispatchEvent(" +
                          "new CustomEvent('androidExport'," +
                          "{detail:{status:'" +
                          safeStatus +
                          "',message:'" +
                          safeMessage +
                          "'}}));";

                  runOnUiThread(() ->
                          webView.evaluateJavascript(
                                  script,
                                  null));
              }


              // =================================================
              // FILE PICKER RESULT
              // =================================================

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if (requestCode == PICK_VIDEO) {

                      if (filePathCallback == null) {
                          return;
                      }

                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK &&
                              data != null) {

                          Uri uri = data.getData();

                          if (uri != null) {
                              results =
                                      new Uri[]{uri};
                          }
                      }

                      filePathCallback.onReceiveValue(
                              results);

                      filePathCallback = null;
                  }
              }


              // =================================================
              // CAMERA PERMISSION
              // =================================================

              private void requestCameraPermission() {

                  if (Build.VERSION.SDK_INT >= 23) {

                      if (ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.CAMERA)
                              != PackageManager.PERMISSION_GRANTED) {

                          ActivityCompat.requestPermissions(
                                  this,
                                  new String[]{
                                          Manifest.permission.CAMERA
                                  },
                                  CAMERA_PERMISSION);
                      }
                  }
              }


              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults);

                  if (requestCode == CAMERA_PERMISSION) {

                      if (grantResults.length > 0 &&
                              grantResults[0] ==
                                      PackageManager.PERMISSION_GRANTED) {

                          Toast.makeText(
                                  this,
                                  "Camera permission granted",
                                  Toast.LENGTH_SHORT
                          ).show();

                      } else {

                          Toast.makeText(
                                  this,
                                  "Camera permission denied",
                                  Toast.LENGTH_SHORT
                          ).show();
                      }
                  }
              }


              // =================================================
              // BACK BUTTON
              // =================================================

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }

          EOF

          sed -i \
            "s|__PACKAGE_NAME__|${PACKAGE_NAME}|g" \
            "$JAVA_DIR/MainActivity.java"


      # =========================================================
      # IMPORTANT MEDIA3 IMPORT FIX
      # =========================================================

      - name: Verify MainActivity
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          JAVA_DIR="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          echo "Checking MainActivity..."

          test -f "$JAVA_DIR/MainActivity.java"

          grep -q "class MainActivity" \
            "$JAVA_DIR/MainActivity.java"

          grep -q "Transformer.Builder" \
            "$JAVA_DIR/MainActivity.java"

          grep -q "setVideoMimeType" \
            "$JAVA_DIR/MainActivity.java"

          grep -q "setAudioMimeType" \
            "$JAVA_DIR/MainActivity.java"

          if grep -q "EncoderFactory" \
            "$JAVA_DIR/MainActivity.java"; then

              echo "ERROR: Old EncoderFactory API found"

              exit 1
          fi

          if grep -q "activity.runOnUiThread" \
            "$JAVA_DIR/MainActivity.java"; then

              echo "ERROR: Undefined activity variable found"

              exit 1
          fi

          echo "MainActivity verification passed."


      # =========================================================
      # STYLES
      # =========================================================

      - name: Create styles.xml
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>

              </style>

          </resources>
          EOF


      # =========================================================
      # ANDROID MANIFEST
      # =========================================================

      - name: Create AndroidManifest.xml
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.READ_MEDIA_VIDEO" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="__APP_NAME__"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          sed -i \
            "s|__APP_NAME__|${APP_NAME}|g" \
            android-project/app/src/main/AndroidManifest.xml


      # =========================================================
      # VERIFY ANDROID PROJECT
      # =========================================================

      - name: Verify Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT VERIFICATION"
          echo "=========================================="

          test -f android-project/settings.gradle
          test -f android-project/build.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml

          JAVA_FILE="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"

          test -f "$JAVA_FILE"

          echo ""
          echo "Package:"
          echo "$PACKAGE_NAME"

          echo ""
          echo "Version:"
          echo "$VERSION_NAME"

          echo ""
          echo "Version Code:"
          echo "$VERSION_CODE"

          echo ""
          echo "Build Type:"
          echo "$BUILD_TYPE"

          echo ""
          echo "Java file:"
          echo "$JAVA_FILE"

          echo ""
          echo "Android project verification completed."
                # =========================================================
      # BUILD APK / AAB
      # =========================================================

      - name: Build APK/AAB
        if: steps.queue.outputs.has_build == 'true'
        working-directory: android-project
        run: |
          set -e

          echo "=========================================="
          echo "ASIM TECH ANDROID BUILDER"
          echo "=========================================="

          echo "APP NAME   : $APP_NAME"
          echo "PACKAGE    : $PACKAGE_NAME"
          echo "VERSION    : $VERSION_NAME"
          echo "BUILD TYPE : $BUILD_TYPE"

          

          if [ "$BUILD_TYPE" = "aab" ]; then

              echo ""
              echo "Building Android App Bundle..."
              echo ""

              gradle bundleDebug --no-daemon --stacktrace
              

              OUTPUT_FILE="app/build/outputs/bundle/debug/app-debug.aab"
              OUTPUT_EXT="aab"

          else

              echo ""
              echo "Building Android APK..."
              echo ""

              gradle assembleDebug --no-daemon --stacktrace

              OUTPUT_FILE="app/build/outputs/apk/debug/app-debug.apk"
              OUTPUT_EXT="apk"

          fi

          echo ""
          echo "Checking output..."

          if [ ! -f "$OUTPUT_FILE" ]; then

              echo "ERROR: Build output not found:"
              echo "$OUTPUT_FILE"

              exit 1
          fi

          echo ""
          echo "BUILD SUCCESSFUL"
          echo "OUTPUT FILE:"
          echo "$OUTPUT_FILE"

          echo "OUTPUT_FILE=$OUTPUT_FILE" >> "$GITHUB_ENV"
          echo "OUTPUT_EXT=$OUTPUT_EXT" >> "$GITHUB_ENV"


      # =========================================================
      # RENAME FINAL FILE
      # =========================================================

      - name: Prepare final file
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          mkdir -p final-output

          SAFE_APP_NAME=$(echo "$APP_NAME" | \
            tr '[:space:]' '_' | \
            tr -cd '[:alnum:]_.-')

          if [ "$BUILD_TYPE" = "aab" ]; then

              FINAL_NAME="${SAFE_APP_NAME}_v${VERSION_NAME}.aab"

          else

              FINAL_NAME="${SAFE_APP_NAME}_v${VERSION_NAME}.apk"

          fi

          FINAL_FILE="final-output/$FINAL_NAME"

          cp "android-project/$OUTPUT_FILE" "$FINAL_FILE"

          echo "FINAL_FILE=$FINAL_FILE" >> "$GITHUB_ENV"
          echo "FINAL_NAME=$FINAL_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Final file:"
          echo "$FINAL_FILE"

          ls -lh "$FINAL_FILE"


      # =========================================================
      # SHA256
      # =========================================================

      - name: Calculate SHA256
        if: steps.queue.outputs.has_build == 'true'
        run: |
          set -e

          SHA256=$(sha256sum "$FINAL_FILE" | awk '{print $1}')

          FILE_SIZE=$(stat -c%s "$FINAL_FILE")

          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "FILE_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"

          echo ""
          echo "SHA256:"
          echo "$SHA256"

          echo ""
          echo "FILE SIZE:"
          echo "$FILE_SIZE bytes"


      # =========================================================
      # UPLOAD TO SUPABASE STORAGE
      # =========================================================

      - name: Upload build to Supabase Storage
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          echo "Uploading build to Supabase..."

          STORAGE_BUCKET="apk-builds"

          STORAGE_PATH="${APP_ID}/${FINAL_NAME}"

          MIME_TYPE="application/vnd.android.package-archive"

          if [ "$BUILD_TYPE" = "aab" ]; then
              MIME_TYPE="application/octet-stream"
          fi

          echo "Bucket:"
          echo "$STORAGE_BUCKET"

          echo "Storage path:"
          echo "$STORAGE_PATH"

          curl --fail-with-body \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: ${MIME_TYPE}" \
            -H "x-upsert: true" \
            --data-binary "@${FINAL_FILE}"

          echo "Storage upload successful."

          echo "STORAGE_PATH=$STORAGE_PATH" >> "$GITHUB_ENV"
          echo "MIME_TYPE=$MIME_TYPE" >> "$GITHUB_ENV"


      # =========================================================
      # MARK BUILD SUCCESS
      # =========================================================

      - name: Mark build successful
        if: steps.queue.outputs.has_build == 'true' && success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          echo "Updating app_builds..."

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          curl --fail-with-body \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"success\",
              \"storage_path\": \"${STORAGE_PATH}\",
              \"file_name\": \"${FINAL_NAME}\",
              \"mime_type\": \"${MIME_TYPE}\",
              \"file_size\": ${FILE_SIZE},
              \"sha256\": \"${SHA256}\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"build_log\": \"Build completed successfully as ${BUILD_TYPE}\"
            }"

          echo ""
          echo "=========================================="
          echo "BUILD STATUS: SUCCESS"
          echo "=========================================="


      # =========================================================
      # GITHUB ARTIFACT
      # =========================================================

      - name: Upload GitHub artifact
        if: steps.queue.outputs.has_build == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: asim-tech-${{ env.BUILD_TYPE }}-${{ env.VERSION_NAME }}
          path: ${{ env.FINAL_FILE }}
          if-no-files-found: error


      # =========================================================
      # MARK BUILD FAILED
      # =========================================================

      - name: Mark build failed
        if: steps.queue.outputs.has_build == 'true' && failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          echo "=========================================="
          echo "BUILD FAILED"
          echo "=========================================="

          curl --fail-with-body \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"failed\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"build_log\": \"GitHub Actions build failed. Check workflow logs for details.\"
            }"

          echo "Build failure recorded in Supabase."
          
