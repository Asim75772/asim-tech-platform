name: ASIM TECH Android APK Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: android-apk-build-queue
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. INSTALL DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq imagemagick


      # ==================================================
      # 4. GRADLE
      # ==================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==================================================
      # 5. GET QUEUED BUILD
      # ==================================================

      - name: Get queued build
        id: queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          echo "Checking queued builds..."

          RESPONSE=$(curl -sS \
            "${SUPABASE_URL}/rest/v1/app_builds?status=eq.queued&order=queued_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "Supabase response:"
          echo "$RESPONSE"

          BUILD_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')

          APP_ID=$(echo "$RESPONSE" | jq -r '.[0].app_id // empty')

          if [ -z "$BUILD_ID" ] || [ -z "$APP_ID" ]; then

            echo "No queued build found."

            echo "has_build=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "Build ID: $BUILD_ID"
          echo "App ID: $APP_ID"

          echo "has_build=true" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 6. STOP IF QUEUE EMPTY
      # ==================================================

      - name: Stop if queue empty
        if: steps.queue.outputs.has_build != 'true'
        run: |

          echo "No queued APK build."

          exit 0


      # ==================================================
      # 7. MARK BUILDING
      # ==================================================

      - name: Mark build as building
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "status": "building",
              "started_at": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
            }'

          echo "Build marked as building."


      # ==================================================
      # 8. DOWNLOAD APP FILES
      # ==================================================

      - name: Download app files
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ID: ${{ steps.queue.outputs.app_id }}

        run: |

          mkdir -p source

          curl -sS \
            "${SUPABASE_URL}/rest/v1/app_files?app_id=eq.${APP_ID}&select=file_path,content,language" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > source/files.json

          echo "Downloaded app files."

          jq 'length' source/files.json


      # ==================================================
      # 9. CREATE SOURCE FILES
      # ==================================================

      - name: Create source files
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p webapp

          jq -c '.[]' source/files.json | while read -r item
          do

            FILE_PATH=$(echo "$item" | jq -r '.file_path')

            CONTENT=$(echo "$item" | jq -r '.content')

            mkdir -p "webapp/$(dirname "$FILE_PATH")"

            printf '%s' "$CONTENT" > "webapp/$FILE_PATH"

          done

          echo "Source files created."

          find webapp -type f -print


      # ==================================================
      # 10. PREPARE WEB APPLICATION
      # ==================================================

      - name: Prepare web application
        if: steps.queue.outputs.has_build == 'true'
        run: |

          if [ ! -f "webapp/index.html" ]; then

            if [ -f "webapp/webapp-url.txt" ]; then

              URL=$(cat "webapp/webapp-url.txt" | tr -d '\r\n')

              echo "Creating URL wrapper."

              cat > webapp/index.html <<EOF
          <!DOCTYPE html>
          <html>

          <head>

          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width,
                         initial-scale=1.0,
                         maximum-scale=1.0,
                         user-scalable=no">

          <title>ASIM TECH App</title>

          <style>

          html,
          body {
              margin: 0;
              padding: 0;
              width: 100%;
              min-height: 100%;
              overflow-x: hidden;
          }

          </style>

          </head>

          <body>

          <script>

          window.location.replace("$URL");

          </script>

          </body>

          </html>
          EOF

            else

              echo "ERROR: index.html is required."

              exit 1

            fi

          fi

          echo "index.html ready."


      # ==================================================
      # 11. READ ANDROID SETTINGS
      # ==================================================

      - name: Read Android settings
        if: steps.queue.outputs.has_build == 'true'
        run: |

          if [ -f "webapp/android-settings.json" ]; then

            cp \
              "webapp/android-settings.json" \
              android-settings.json

          else

            cat > android-settings.json <<EOF
          {
            "appName": "ASIM TECH APP",
            "packageName": "com.asimtech.app",
            "versionName": "1.0.0",
            "versionCode": 1
          }
          EOF

          fi

          echo "Android settings:"

          cat android-settings.json

          APP_NAME=$(jq -r '.appName // "ASIM TECH APP"' android-settings.json)

          PACKAGE_NAME=$(jq -r '.packageName // "com.asimtech.app"' android-settings.json)

          VERSION_NAME=$(jq -r '.versionName // "1.0.0"' android-settings.json)

          VERSION_CODE=$(jq -r '.versionCode // 1' android-settings.json)

          APP_ICON_URL=$(jq -r '.appIconUrl // empty' android-settings.json)

          APP_ICON_PATH=$(jq -r '.appIconPath // empty' android-settings.json)

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_ICON_URL=$APP_ICON_URL" >> "$GITHUB_ENV"
          echo "APP_ICON_PATH=$APP_ICON_PATH" >> "$GITHUB_ENV"


      # ==================================================
      # 12. PREPARE LAUNCHER ICON
      # ==================================================

      - name: Prepare launcher icon
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

          ICON_FILE="launcher-icon.png"

          if [ -n "$APP_ICON_PATH" ]; then

            echo "Downloading custom icon..."

            curl -fL \
              "${SUPABASE_URL}/storage/v1/object/website-images/${APP_ICON_PATH}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o "$ICON_FILE" || true

          fi


          if [ ! -s "$ICON_FILE" ] && [ -n "$APP_ICON_URL" ]; then

            echo "Trying public icon URL..."

            curl -fL \
              "$APP_ICON_URL" \
              -o "$ICON_FILE" || true

          fi


          if [ -s "$ICON_FILE" ]; then

            if identify "$ICON_FILE" >/dev/null 2>&1; then

              echo "Custom launcher icon found."

            else

              echo "Invalid icon."

              rm -f "$ICON_FILE"

            fi

          fi


          if [ ! -s "$ICON_FILE" ]; then

            echo "Creating default icon."

            convert \
              -size 512x512 \
              xc:"#18A558" \
              -gravity center \
              -fill white \
              -draw "rectangle 160,110 352,402" \
              "$ICON_FILE"

          fi


          convert "$ICON_FILE" \
            -resize 48x48 \
            android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 72x72 \
            android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 96x96 \
            android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 144x144 \
            android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 192x192 \
            android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            cp \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher.png" \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher_round.png"

          done

          echo "Launcher icons prepared."


      # ==================================================
      # 13. CREATE ANDROID PROJECT
      # ==================================================

      - name: Create Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p android-project/app/src/main/java
          mkdir -p android-project/app/src/main/assets

          cp -r webapp/* \
            android-project/app/src/main/assets/


      # ==================================================
      # 14. CREATE GRADLE FILES
      # ==================================================

      - name: Create Gradle files
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/settings.gradle <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GeneratedApp"

          include(":app")
          EOF


          cat > android-project/build.gradle <<EOF
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > android-project/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {

              namespace '${PACKAGE_NAME}'

              compileSdk 35

              defaultConfig {

                  applicationId '${PACKAGE_NAME}'

                  minSdk 23

                  targetSdk 35

                  versionCode ${VERSION_CODE}

                  versionName '${VERSION_NAME}'
              }
          }

          dependencies {

              implementation 'androidx.webkit:webkit:1.12.1'

          }
          EOF


      # ==================================================
      # 15. ANDROID MANIFEST
      # CAMERA PERMISSION
      # ==================================================

      - name: Create Android Manifest
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p android-project/app/src/main

          cat > android-project/app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Internet -->
              <uses-permission
                  android:name="android.permission.INTERNET" />

              <!-- CAMERA PERMISSION -->
              <uses-permission
                  android:name="android.permission.CAMERA" />

              <!-- Camera feature -->
              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="${APP_NAME}"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ==================================================
      # 16. MAIN ACTIVITY
      # WEBVIEW + CAMERA PERMISSION
      # ==================================================

      - name: Create MainActivity
        if: steps.queue.outputs.has_build == 'true'
        run: |

          JAVA_PATH="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          mkdir -p "$JAVA_PATH"

          cat > "$JAVA_PATH/MainActivity.java" <<EOF
          package ${PACKAGE_NAME};

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Insets;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.WindowInsets;

          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import android.webkit.JavascriptInterface;

          import android.speech.tts.TextToSpeech;

          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          import java.util.Locale;


          public class MainActivity extends Activity {


              private WebView webView;

              private TextToSpeech textToSpeech;

              private PermissionRequest pendingPermissionRequest;

              private static final int CAMERA_PERMISSION_REQUEST = 1001;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  // ==========================================
                  // SYSTEM BAR COLORS
                  // ==========================================

                  getWindow().setStatusBarColor(
                      Color.rgb(180, 35, 0)
                  );

                  getWindow().setNavigationBarColor(
                      Color.BLACK
                  );


                  // ==========================================
                  // WEBVIEW
                  // ==========================================

                  webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();


                  // ==========================================
                  // JAVASCRIPT
                  // ==========================================

                  settings.setJavaScriptEnabled(true);


                  // ==========================================
                  // DOM STORAGE
                  // ==========================================

                  settings.setDomStorageEnabled(true);


                  // ==========================================
                  // FILE ACCESS
                  // ==========================================

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);


                  // ==========================================
                  // VIEWPORT
                  // ==========================================

                  settings.setUseWideViewPort(true);

                  settings.setLoadWithOverviewMode(true);

                  settings.setSupportZoom(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setTextZoom(100);


                  // ==========================================
                  // MEDIA
                  // ==========================================

                  settings.setMediaPlaybackRequiresUserGesture(false);


                  // ==========================================
                  // WEBVIEW ASSET LOADER
                  // ==========================================

                  final WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()
                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader.AssetsPathHandler(
                                  this
                              )
                          )
                          .build();


                  // ==========================================
                  // WEBVIEW CLIENT
                  // ==========================================

                  webView.setWebViewClient(
                      new WebViewClientCompat() {

                          @Override
                          public WebResourceResponse
                          shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              return assetLoader
                                  .shouldInterceptRequest(
                                      request.getUrl()
                                  );
                          }

                          @Override
                          public WebResourceResponse
                          shouldInterceptRequest(
                              WebView view,
                              String url
                          ) {

                              return assetLoader
                                  .shouldInterceptRequest(
                                      Uri.parse(url)
                                  );
                          }
                      }
                  );


                  // ==========================================
                  // CAMERA PERMISSION
                  // ==========================================

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(() -> {

                                  boolean cameraRequested =
                                      false;

                                  String[] resources =
                                      request.getResources();


                                  if (resources != null) {

                                      for (
                                          String resource :
                                          resources
                                      ) {

                                          if (
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                                  .equals(resource)
                                          ) {

                                              cameraRequested = true;

                                              break;
                                          }
                                      }
                                  }


                                  if (!cameraRequested) {

                                      request.deny();

                                      return;
                                  }


                                  // ==================================
                                  // CAMERA ALREADY GRANTED
                                  // ==================================

                                  if (
                                      checkSelfPermission(
                                          Manifest.permission.CAMERA
                                      ) ==
                                      PackageManager.PERMISSION_GRANTED
                                  ) {

                                      request.grant(
                                          new String[] {
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                          }
                                      );

                                      return;
                                  }


                                  // ==================================
                                  // SAVE REQUEST
                                  // ==================================

                                  pendingPermissionRequest =
                                      request;


                                  // ==================================
                                  // ASK ANDROID PERMISSION
                                  // ==================================

                                  requestPermissions(
                                      new String[] {
                                          Manifest.permission.CAMERA
                                      },
                                      CAMERA_PERMISSION_REQUEST
                                  );

                              });
                          }


                          @Override
                          public void onPermissionRequestCanceled(
                              PermissionRequest request
                          ) {

                              if (
                                  pendingPermissionRequest ==
                                  request
                              ) {

                                  pendingPermissionRequest =
                                      null;
                              }

                              super.onPermissionRequestCanceled(
                                  request
                              );
                          }

                      }
                  );


                  // ==========================================
                  // SYSTEM WINDOW INSETS
                  // ==========================================

                  webView.setOnApplyWindowInsetsListener(
                      (view, insets) -> {

                          int top = 0;

                          int bottom = 0;


                          if (
                              android.os.Build.VERSION.SDK_INT >= 30
                          ) {

                              Insets systemInsets =
                                  insets.getInsets(
                                      WindowInsets.Type.systemBars()
                                  );

                              top =
                                  systemInsets.top;

                              bottom =
                                  systemInsets.bottom;

                          } else {

                              top =
                                  insets.getSystemWindowInsetTop();

                              bottom =
                                  insets.getSystemWindowInsetBottom();

                          }


                          view.setPadding(
                              0,
                              top,
                              0,
                              bottom
                          );


                          return insets;

                      }
                  );


                  // ==========================================
                  // BENGALI TEXT TO SPEECH
                  // ==========================================

                  textToSpeech =
                      new TextToSpeech(
                          this,
                          status -> {

                              if (
                                  status ==
                                  TextToSpeech.SUCCESS
                              ) {

                                  int result =
                                      textToSpeech.setLanguage(
                                          new Locale(
                                              "bn",
                                              "IN"
                                          )
                                      );


                                  if (
                                      result ==
                                      TextToSpeech.LANG_MISSING_DATA
                                      ||
                                      result ==
                                      TextToSpeech.LANG_NOT_SUPPORTED
                                  ) {

                                      textToSpeech.setLanguage(
                                          Locale.US
                                      );

                                  }

                              }

                          }
                      );


                  // ==========================================
                  // JAVASCRIPT TTS BRIDGE
                  // ==========================================

                  webView.addJavascriptInterface(
                      new AndroidTTS(),
                      "AndroidTTS"
                  );


                  // ==========================================
                  // LOAD LOCAL APP
                  // ==========================================

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );


                  // ==========================================
                  // DISPLAY
                  // ==========================================

                  setContentView(webView);

              }


              // ==========================================
              // CAMERA PERMISSION RESULT
              // ==========================================

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );


                  if (
                      requestCode ==
                      CAMERA_PERMISSION_REQUEST
                  ) {

                      if (
                          pendingPermissionRequest !=
                          null
                      ) {

                          if (
                              grantResults.length > 0
                              &&
                              grantResults[0] ==
                                  PackageManager.PERMISSION_GRANTED
                          ) {

                              pendingPermissionRequest.grant(
                                  new String[] {
                                      PermissionRequest
                                          .RESOURCE_VIDEO_CAPTURE
                                  }
                              );

                          } else {

                              pendingPermissionRequest.deny();

                          }


                          pendingPermissionRequest =
                              null;
                      }
                  }
              }


              // ==========================================
              // ANDROID TTS
              // ==========================================

              public class AndroidTTS {


                  @JavascriptInterface
                  public void speak(
                      String text,
                      String language,
                      float rate,
                      float pitch
                  ) {

                      if (
                          textToSpeech == null
                      ) {

                          return;
                      }


                      Locale locale;


                      if (
                          language != null
                          &&
                          language
                              .toLowerCase()
                              .startsWith("bn")
                      ) {

                          locale =
                              new Locale(
                                  "bn",
                                  "IN"
                              );

                      } else {

                          locale =
                              Locale.US;
                      }


                      int result =
                          textToSpeech.setLanguage(
                              locale
                          );


                      if (
                          result ==
                          TextToSpeech.LANG_MISSING_DATA
                          ||
                          result ==
                          TextToSpeech.LANG_NOT_SUPPORTED
                      ) {

                          textToSpeech.setLanguage(
                              Locale.US
                          );
                      }


                      textToSpeech.setSpeechRate(rate);

                      textToSpeech.setPitch(pitch);


                      textToSpeech.speak(
                          text,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "ASIM_TTS"
                      );

                  }


                  @JavascriptInterface
                  public void cancel() {

                      if (
                          textToSpeech != null
                      ) {

                          textToSpeech.stop();

                      }

                  }

              }


              // ==========================================
              // BACK BUTTON
              // ==========================================

              @Override
              public void onBackPressed() {

                  if (
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }


              // ==========================================
              // CLEANUP
              // ==========================================

              @Override
              protected void onDestroy() {

                  if (
                      textToSpeech != null
                  ) {

                      textToSpeech.stop();

                      textToSpeech.shutdown();

                  }


                  if (
                      webView != null
                  ) {

                      webView.destroy();

                  }


                  super.onDestroy();

              }

          }
          EOF


      # ==================================================
      # 17. STYLES
      # ==================================================

      - name: Create styles
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p android-project/app/src/main/res/values

          cat > android-project/app/src/main/res/values/styles.xml <<EOF
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #18A558
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowLightNavigationBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      #B42300
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

              </style>

          </resources>
          EOF


      # ==================================================
      # 18. BUILD APK
      # ==================================================

      - name: Build APK
        if: steps.queue.outputs.has_build == 'true'
        working-directory: android-project
        run: |

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK build completed."

          ls -lh app/build/outputs/apk/debug/


      # ==================================================
      # 19. RENAME APK
      # ==================================================

      - name: Rename APK
        if: steps.queue.outputs.has_build == 'true'
        run: |

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          cp \
            android-project/app/build/outputs/apk/debug/app-debug.apk \
            "ASIM-TECH-${BUILD_ID}.apk"

          ls -lh "ASIM-TECH-${BUILD_ID}.apk"


      # ==================================================
      # 20. SHA256
      # ==================================================

      - name: Calculate SHA256
        if: steps.queue.outputs.has_build == 'true'
        id: sha
        run: |

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          SHA=$(sha256sum \
            "ASIM-TECH-${BUILD_ID}.apk" |
            awk '{print $1}')

          SIZE=$(stat -c%s \
            "ASIM-TECH-${BUILD_ID}.apk")

          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          echo "SHA256: $SHA"

          echo "SIZE: $SIZE"


      # ==================================================
      # 21. UPLOAD APK
      # ==================================================

      - name: Upload APK
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"

          STORAGE_PATH="${BUILD_ID}/${FILE_NAME}"

          echo "Uploading APK..."

          curl -fL -X POST \
            "${SUPABASE_URL}/storage/v1/object/android-apks/${STORAGE_PATH}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${FILE_NAME}"

          echo "STORAGE_PATH=${STORAGE_PATH}" \
            >> "$GITHUB_ENV"

          echo "APK uploaded successfully."


      # ==================================================
      # 22. MARK BUILD SUCCESSFUL
      # ==================================================

      - name: Mark build successful
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "status": "success",
              "storage_path": "'"${STORAGE_PATH}"'",
              "file_name": "'"${FILE_NAME}"'",
              "mime_type": "application/vnd.android.package-archive",
              "file_size": '"${{ steps.sha.outputs.size }}"',
              "sha256": "'"${{ steps.sha.outputs.sha256 }}"'",
              "completed_at": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
            }'

          echo "Build marked SUCCESS."


      # ==================================================
      # 23. GITHUB ARTIFACT
      # ==================================================

      - name: Upload APK artifact
        if: steps.queue.outputs.has_build == 'true'
        uses: actions/upload-artifact@v4

        with:
          name: ASIM-TECH-${{ steps.queue.outputs.build_id }}

          path: ASIM-TECH-${{ steps.queue.outputs.build_id }}.apk


      # ==================================================
      # 24. MARK BUILD FAILED
      # ==================================================

      - name: Mark build failed
        if: failure() && steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "status": "failed",
              "build_log": "GitHub Actions build failed.",
              "completed_at": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
            }'

          echo "Build marked FAILED."
