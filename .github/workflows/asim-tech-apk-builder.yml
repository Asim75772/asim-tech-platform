name: ASIM TECH Android APK Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: android-apk-builder
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # TOOLS
      # =========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            imagemagick \
            python3


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # =========================================================
      # GET QUEUED BUILD
      # =========================================================

      - name: Get queued build
        id: queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          set -e

          echo "======================================"
          echo "CHECKING QUEUED BUILDS"
          echo "======================================"

          RESPONSE=$(curl -sS \
            --fail-with-body \
            "${SUPABASE_URL}/rest/v1/app_builds?status=eq.queued&order=queued_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")

          echo "$RESPONSE"

          if ! echo "$RESPONSE" | jq empty; then
            echo "ERROR: Invalid JSON received from Supabase."
            exit 1
          fi

          if ! echo "$RESPONSE" | jq -e 'type == "array"' >/dev/null; then
            echo "ERROR: app_builds response is not an array."
            exit 1
          fi

          BUILD_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "No queued build found."
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "BUILD_ID=$BUILD_ID"

          echo "has_build=true" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"


      # =========================================================
      # STOP IF NO QUEUE
      # =========================================================

      - name: Stop if queue empty
        if: steps.queue.outputs.has_build != 'true'
        run: |
          echo "No queued build."
          exit 0


      # =========================================================
      # RESOLVE BUILD INFORMATION
      # =========================================================

      - name: Resolve build information
        if: steps.queue.outputs.has_build == 'true'
        id: buildinfo
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          set -e

          echo "======================================"
          echo "RESOLVING BUILD INFORMATION"
          echo "======================================"

          if [ -z "$BUILD_ID" ]; then
            echo "ERROR: BUILD_ID is empty."
            exit 1
          fi

          RESPONSE=$(curl -sS \
            --fail-with-body \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}&select=id,app_id,status,version_name,version_code,build_type,created_by&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")

          echo "$RESPONSE"

          if ! echo "$RESPONSE" | jq empty; then
            echo "ERROR: Invalid JSON."
            exit 1
          fi

          if ! echo "$RESPONSE" | jq -e 'type == "array"' >/dev/null; then
            echo "ERROR: Build response is not an array."
            exit 1
          fi

          APP_ID=$(echo "$RESPONSE" | jq -r '.[0].app_id // empty')
          VERSION_NAME=$(echo "$RESPONSE" | jq -r '.[0].version_name // "1.0.0"')
          VERSION_CODE=$(echo "$RESPONSE" | jq -r '.[0].version_code // 1')
          BUILD_TYPE=$(echo "$RESPONSE" | jq -r '.[0].build_type // "apk"')

          if [ "$BUILD_TYPE" != "apk" ] && [ "$BUILD_TYPE" != "aab" ]; then
            echo "Invalid build_type '$BUILD_TYPE'; defaulting to apk."
            BUILD_TYPE="apk"
          fi

          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "ERROR: APP_ID is empty."
            exit 1
          fi

          if ! echo "$APP_ID" | grep -Eq \
            '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          then
            echo "ERROR: Invalid APP_ID:"
            echo "$APP_ID"
            exit 1
          fi

          echo "APP_ID=$APP_ID"
          echo "VERSION_NAME=$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE"
          echo "BUILD_TYPE=$BUILD_TYPE"

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"


      # =========================================================
      # MARK BUILDING
      # =========================================================

      - name: Mark build as building
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\":\"building\",
              \"started_at\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"


      # =========================================================
      # DOWNLOAD APP FILES
      # =========================================================

      - name: Download app files
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          set -e

          mkdir -p source

          FILES_URL="${SUPABASE_URL}/rest/v1/app_files?app_id=eq.${APP_ID}&select=file_path,content,language"

          curl -sS \
            --fail-with-body \
            "$FILES_URL" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            > source/files.json

          echo "Supabase app_files response:"
          cat source/files.json

          if ! jq empty source/files.json; then
            echo "ERROR: Invalid JSON."
            exit 1
          fi

          if ! jq -e 'type == "array"' source/files.json >/dev/null; then
            echo "ERROR: Supabase response is not an array."
            exit 1
          fi

          COUNT=$(jq 'length' source/files.json)

          echo "FILE COUNT=$COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No source files found."
            exit 1
          fi

          jq -r '.[].file_path' source/files.json


      # =========================================================
      # CREATE SOURCE FILES
      # =========================================================

      - name: Create source files
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          rm -rf webapp
          mkdir -p webapp

          python3 <<'PY'

          import json
          import os
          import sys

          source_file = "source/files.json"
          output_dir = "webapp"

          with open(source_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              print("ERROR: Supabase response is not a list.")
              sys.exit(1)

          created = 0

          for item in data:

              if not isinstance(item, dict):
                  continue

              file_path = item.get("file_path")
              content = item.get("content", "")

              if not file_path:
                  continue

              file_path = str(file_path)
              normalized = os.path.normpath(file_path)

              if (
                  normalized.startswith("/")
                  or normalized == ".."
                  or normalized.startswith("../")
                  or os.path.isabs(normalized)
              ):
                  print("ERROR: Unsafe path:", file_path)
                  sys.exit(1)

              destination = os.path.join(
                  output_dir,
                  normalized
              )

              os.makedirs(
                  os.path.dirname(destination),
                  exist_ok=True
              )

              with open(
                  destination,
                  "w",
                  encoding="utf-8"
              ) as out:
                  out.write(str(content))

              print("Created:", destination)
              created += 1

          if created == 0:
              print("ERROR: No files created.")
              sys.exit(1)

          print("Created", created, "files.")

          PY

          find webapp -type f -print


      # =========================================================
      # PREPARE WEB APP
      # =========================================================

      - name: Prepare web application
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          if [ ! -f webapp/index.html ]; then

            if [ -f webapp/webapp-url.txt ]; then

              URL=$(tr -d '\r\n' < webapp/webapp-url.txt)

              if [ -z "$URL" ]; then
                echo "ERROR: URL is empty."
                exit 1
              fi

              cat > webapp/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width,initial-scale=1.0">
              <title>ASIM TECH</title>
          </head>
          <body>
          <script>
          window.location.replace("${URL}");
          </script>
          </body>
          </html>
          EOF

            else

              echo "ERROR: index.html not found."
              exit 1

            fi

          fi

          echo "index.html ready."


      # =========================================================
      # ANDROID SETTINGS
      # =========================================================

      - name: Read Android settings
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          if [ -f webapp/android-settings.json ]; then

            cp webapp/android-settings.json android-settings.json

          else

            cat > android-settings.json <<'EOF'
          {
            "appName": "CineReel Video Editor",
            "packageName": "com.asimtech.cinereel",
            "versionName": "1.0.0",
            "versionCode": 1
          }
          EOF

          fi

          APP_NAME=$(jq -r '.appName // "CineReel Video Editor"' android-settings.json)

          PACKAGE_NAME=$(jq -r '.packageName // "com.asimtech.cinereel"' android-settings.json)

          SETTINGS_VERSION_NAME=$(jq -r '.versionName // "1.0.0"' android-settings.json)

          SETTINGS_VERSION_CODE=$(jq -r '.versionCode // 1' android-settings.json)

          APP_ICON_URL=$(jq -r '.appIconUrl // empty' android-settings.json)

          APP_ICON_PATH=$(jq -r '.appIconPath // empty' android-settings.json)

          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="$SETTINGS_VERSION_NAME"
          fi

          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="$SETTINGS_VERSION_CODE"
          fi

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_ICON_URL=$APP_ICON_URL" >> "$GITHUB_ENV"
          echo "APP_ICON_PATH=$APP_ICON_PATH" >> "$GITHUB_ENV"

          echo "APP NAME: $APP_NAME"
          echo "PACKAGE: $PACKAGE_NAME"
          echo "VERSION: $VERSION_NAME"


      # =========================================================
      # CREATE ANDROID PROJECT
      # =========================================================

      - name: Create Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          mkdir -p android-project/app/src/main/assets

          cp -r webapp/. android-project/app/src/main/assets/

          echo "Web application copied."


      # =========================================================
      # LAUNCHER ICON
      # =========================================================

      - name: Prepare launcher icon
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          set -e

          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

          ICON_FILE="launcher-icon.png"

          if [ -n "$APP_ICON_PATH" ]; then

            curl -fL \
              "${SUPABASE_URL}/storage/v1/object/website-images/${APP_ICON_PATH}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o "$ICON_FILE" || true

          fi

          if [ ! -s "$ICON_FILE" ] && [ -n "$APP_ICON_URL" ]; then

            curl -fL \
              "$APP_ICON_URL" \
              -o "$ICON_FILE" || true

          fi

          if [ ! -s "$ICON_FILE" ]; then

            convert \
              -size 512x512 \
              xc:"#087FF5" \
              -gravity center \
              -fill white \
              -draw "circle 256,256 256,100" \
              "$ICON_FILE"

          fi

          convert "$ICON_FILE" -resize 48x48 \
            android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 72x72 \
            android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 96x96 \
            android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 144x144 \
            android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON_FILE" -resize 192x192 \
            android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do
            cp \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher.png" \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done


      # =========================================================
      # GRADLE PROPERTIES
      # =========================================================

      - name: Create Gradle properties
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # =========================================================
      # SETTINGS GRADLE
      # =========================================================

      - name: Create settings.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/settings.gradle <<'EOF'

          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }

          }

          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }

          }

          rootProject.name = "ASIMTECHGeneratedApp"

          include(":app")

          EOF


      # =========================================================
      # ROOT BUILD GRADLE
      # =========================================================

      - name: Create root build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.10.0' apply false
          }

          EOF


      # =========================================================
      # APP BUILD GRADLE
      # =========================================================

      - name: Create app build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          mkdir -p android-project/app

          cat > android-project/app/build.gradle <<'EOF'

          plugins {
              id 'com.android.application'
          }

          android {

              namespace '__PACKAGE_NAME__'

              compileSdk 36

              defaultConfig {

                  applicationId '__PACKAGE_NAME__'

                  minSdk 23

                  targetSdk 36

                  versionCode __VERSION_CODE__

                  versionName '__VERSION_NAME__'
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_1_8

                  targetCompatibility JavaVersion.VERSION_1_8
              }

          }

          dependencies {
          implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.webkit:webkit:1.12.1'

              implementation 'androidx.media3:media3-transformer:1.10.1'

              implementation 'androidx.media3:media3-common:1.10.1'
          }

          EOF

          sed -i \
            "s|__PACKAGE_NAME__|${PACKAGE_NAME}|g" \
            android-project/app/build.gradle

          sed -i \
            "s|__VERSION_CODE__|${VERSION_CODE}|g" \
            android-project/app/build.gradle

          sed -i \
            "s|__VERSION_NAME__|${VERSION_NAME}|g" \
            android-project/app/build.gradle


      # =========================================================
      # ANDROID MANIFEST
      # =========================================================

      - name: Create Android Manifest
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          mkdir -p android-project/app/src/main

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:label="__APP_NAME__"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF

          sed -i \
            "s|__APP_NAME__|${APP_NAME}|g" \
            android-project/app/src/main/AndroidManifest.xml


      # =========================================================
      # JAVA DIRECTORY
      # =========================================================

      - name: Prepare Java directory
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          JAVA_DIR="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          mkdir -p "$JAVA_DIR"

          echo "JAVA_DIR=$JAVA_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # MAIN ACTIVITY
      # =========================================================

      cat > "$JAVA_DIR/MainActivity.java" <<'EOF'

package __PACKAGE_NAME__;

import android.Manifest;
import android.app.Activity;
import android.content.ContentValues;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.os.Environment;
import android.provider.MediaStore;
import android.view.ViewGroup;
import android.webkit.PermissionRequest;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

import androidx.annotation.NonNull;
import androidx.appcompat.app.AppCompatActivity;
import androidx.media3.common.MediaItem;
import androidx.media3.common.MimeTypes;
import androidx.media3.transformer.Composition;
import androidx.media3.transformer.EditedMediaItem;
import androidx.media3.transformer.ExportException;
import androidx.media3.transformer.ExportResult;
import androidx.media3.transformer.Transformer;

import java.io.File;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.InputStream;
import java.io.OutputStream;


public class MainActivity
        extends AppCompatActivity {


    private WebView webView;


    private static final int
            FILE_CHOOSER_REQUEST = 1001;


    private static final int
            CAMERA_PERMISSION_REQUEST = 1002;


    private ValueCallback<Uri[]>
            filePathCallback;


    private PermissionRequest
            pendingPermissionRequest;


    private Transformer transformer;


    private File nativeInputFile;


    private File nativeOutputFile;


    private InputStream nativeInputStream;


    private boolean exporting = false;


    @Override
    protected void onCreate(
            Bundle savedInstanceState
    ) {

        super.onCreate(savedInstanceState);


        webView =
                new WebView(this);


        webView.setLayoutParams(
                new ViewGroup.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        ViewGroup.LayoutParams.MATCH_PARENT
                )
        );


        setContentView(webView);


        WebSettings settings =
                webView.getSettings();


        settings.setJavaScriptEnabled(true);

        settings.setDomStorageEnabled(true);

        settings.setAllowFileAccess(true);

        settings.setAllowContentAccess(true);

        settings.setMediaPlaybackRequiresUserGesture(false);

        settings.setBuiltInZoomControls(false);

        settings.setDisplayZoomControls(false);

        settings.setSupportZoom(false);

        settings.setLoadWithOverviewMode(true);

        settings.setUseWideViewPort(true);


        webView.setWebViewClient(
                new WebViewClient()
        );


        webView.setWebChromeClient(
                new WebChromeClient() {

                    @Override
                    public boolean onShowFileChooser(
                            WebView webView,
                            ValueCallback<Uri[]> callback,
                            FileChooserParams params
                    ) {

                        if (
                                filePathCallback != null
                        ) {

                            filePathCallback
                                    .onReceiveValue(null);
                        }


                        filePathCallback =
                                callback;


                        Intent intent =
                                params.createIntent();


                        intent.addCategory(
                                Intent.CATEGORY_OPENABLE
                        );


                        intent.setType(
                                "video/*"
                        );


                        try {

                            startActivityForResult(
                                    intent,
                                    FILE_CHOOSER_REQUEST
                            );

                        } catch (Exception e) {

                            filePathCallback = null;

                            return false;
                        }


                        return true;
                    }


                    @Override
                    public void onPermissionRequest(
                            PermissionRequest request
                    ) {

                        runOnUiThread(() -> {

                            pendingPermissionRequest =
                                    request;


                            if (
                                    Build.VERSION.SDK_INT >=
                                            Build.VERSION_CODES.M &&
                                    checkSelfPermission(
                                            Manifest.permission.CAMERA
                                    ) !=
                                            PackageManager.PERMISSION_GRANTED
                            ) {

                                requestPermissions(
                                        new String[]{
                                                Manifest.permission.CAMERA
                                        },
                                        CAMERA_PERMISSION_REQUEST
                                );

                            } else {

                                request.grant(
                                        new String[]{
                                                PermissionRequest
                                                        .RESOURCE_VIDEO_CAPTURE
                                        }
                                );
                            }

                        });
                    }
                }
        );


        webView.addJavascriptInterface(
                new AndroidExport(this),
                "AndroidExport"
        );


        webView.loadUrl(
                "file:///android_asset/index.html"
        );
    }


    public class AndroidExport {


        private final Activity activity;


        AndroidExport(
                Activity activity
        ) {

            this.activity = activity;
        }


        @android.webkit.JavascriptInterface
        public void exportVideo(
                String sourcePath
        ) {

            activity.runOnUiThread(() -> {

                startExport(
                        sourcePath
                );

            });
        }
    }


    private void startExport(
            String sourcePath
    ) {

        if (exporting) {

            notifyJavascript(
                    false,
                    "Export already running."
            );

            return;
        }


        exporting = true;


        try {

            Uri sourceUri =
                    Uri.parse(sourcePath);


            nativeInputFile =
                    new File(
                            getCacheDir(),
                            "input_video.mp4"
                    );


            try (
                    InputStream input =
                            getContentResolver()
                                    .openInputStream(
                                            sourceUri
                                    );

                    FileOutputStream output =
                            new FileOutputStream(
                                    nativeInputFile
                            )
            ) {

                if (input == null) {

                    throw new Exception(
                            "Unable to open input video."
                    );
                }


                byte[] buffer =
                        new byte[1024 * 1024];


                int count;


                while (
                        (count = input.read(buffer)) != -1
                ) {

                    output.write(
                            buffer,
                            0,
                            count
                    );
                }

            }


            nativeOutputFile =
                    new File(
                            getCacheDir(),
                            "exported_video.mp4"
                    );


            MediaItem mediaItem =
                    MediaItem.fromUri(
                            Uri.fromFile(
                                    nativeInputFile
                            )
                    );


            EditedMediaItem editedMediaItem =
                    new EditedMediaItem.Builder(
                            mediaItem
                    ).build();


            /*
             * Media3 1.10.1
             *
             * Do NOT use EncoderFactory here.
             * Use Transformer Builder directly.
             */

            transformer =
                    new Transformer.Builder(
                            this
                    )
                    .setVideoMimeType(
                            MimeTypes.VIDEO_H264
                    )
                    .setAudioMimeType(
                            MimeTypes.AUDIO_AAC
                    )
                    .addListener(
                            new Transformer.Listener() {

                                @Override
                                public void onCompleted(
                                        Composition composition,
                                        ExportResult result
                                ) {

                                    runOnUiThread(
                                            () -> {

                                                try {

                                                    saveToGallery();

                                                } catch (Exception e) {

                                                    exporting = false;

                                                    notifyJavascript(
                                                            false,
                                                            "Gallery save failed: "
                                                                    + e.getMessage()
                                                    );
                                                }

                                            }
                                    );
                                }


                                @Override
                                public void onError(
                                        Composition composition,
                                        ExportResult result,
                                        ExportException exception
                                ) {

                                    runOnUiThread(
                                            () -> {

                                                exporting = false;

                                                notifyJavascript(
                                                        false,
                                                        "Video export failed: "
                                                                + exception.getMessage()
                                                );

                                            }
                                    );
                                }

                            }
                    )
                    .build();


            transformer.start(
                    editedMediaItem,
                    nativeOutputFile
                            .getAbsolutePath()
            );


        } catch (Exception e) {

            exporting = false;

            notifyJavascript(
                    false,
                    "Export failed: "
                            + e.getMessage()
            );
        }
    }


    private void saveToGallery()
            throws Exception {


        if (
                nativeOutputFile == null ||
                !nativeOutputFile.exists()
        ) {

            throw new Exception(
                    "Exported file not found."
            );
        }


        ContentValues values =
                new ContentValues();


        values.put(
                MediaStore.Video.Media.DISPLAY_NAME,
                "ASIM-TECH-"
                        + System.currentTimeMillis()
                        + ".mp4"
        );


        values.put(
                MediaStore.Video.Media.MIME_TYPE,
                "video/mp4"
        );


        values.put(
                MediaStore.Video.Media.RELATIVE_PATH,
                Environment.DIRECTORY_MOVIES
                        + "/ASIM TECH"
        );


        if (
                Build.VERSION.SDK_INT >=
                        Build.VERSION_CODES.Q
        ) {

            values.put(
                    MediaStore.Video.Media.IS_PENDING,
                    1
            );
        }


        Uri uri =
                getContentResolver().insert(
                        MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                        values
                );


        if (uri == null) {

            throw new Exception(
                    "Unable to create Gallery entry."
            );
        }


        try (
                InputStream input =
                        new FileInputStream(
                                nativeOutputFile
                        );

                OutputStream output =
                        getContentResolver()
                                .openOutputStream(uri)
        ) {

            if (output == null) {

                throw new Exception(
                        "Unable to open Gallery output."
                );
            }


            byte[] buffer =
                    new byte[1024 * 1024];


            int count;


            while (
                    (count = input.read(buffer)) != -1
            ) {

                output.write(
                        buffer,
                        0,
                        count
                );
            }


            output.flush();
        }


        if (
                Build.VERSION.SDK_INT >=
                        Build.VERSION_CODES.Q
        ) {

            ContentValues completed =
                    new ContentValues();


            completed.put(
                    MediaStore.Video.Media.IS_PENDING,
                    0
            );


            getContentResolver().update(
                    uri,
                    completed,
                    null,
                    null
            );
        }


        exporting = false;


        notifyJavascript(
                true,
                "MP4 saved to Gallery: Movies/ASIM TECH"
        );


        cleanupFiles();
    }


    private void notifyJavascript(
            boolean success,
            String message
    ) {

        String safe =
                message == null
                        ? ""
                        : message
                        .replace("\\", "\\\\")
                        .replace("'", "\\'")
                        .replace("\n", "\\n")
                        .replace("\r", "\\r");


        String js =
                "window.__nativeExportDone && " +
                        "window.__nativeExportDone(" +
                        success +
                        ",'" +
                        safe +
                        "');";


        sendJavascript(js);
    }


    private void sendJavascript(
            String javascript
    ) {

        runOnUiThread(() -> {

            if (webView != null) {

                webView.evaluateJavascript(
                        javascript,
                        null
                );
            }

        });
    }


    private void stopExport() {

        try {

            if (
                    transformer != null
            ) {

                transformer.cancel();
            }

        } catch (Exception ignored) {}


        transformer = null;


        try {

            if (
                    nativeInputStream != null
            ) {

                nativeInputStream.close();
            }

        } catch (Exception ignored) {}


        nativeInputStream = null;


        exporting = false;
    }


    private void cleanupFiles() {

        try {

            if (
                    nativeInputFile != null &&
                    nativeInputFile.exists()
            ) {

                nativeInputFile.delete();
            }

        } catch (Exception ignored) {}


        try {

            if (
                    nativeOutputFile != null &&
                    nativeOutputFile.exists()
            ) {

                nativeOutputFile.delete();
            }

        } catch (Exception ignored) {}
    }


    @Override
    protected void onActivityResult(
            int requestCode,
            int resultCode,
            Intent data
    ) {

        super.onActivityResult(
                requestCode,
                resultCode,
                data
        );


        if (
                requestCode ==
                        FILE_CHOOSER_REQUEST
        ) {

            if (
                    filePathCallback == null
            ) {

                return;
            }


            Uri[] results = null;


            if (
                    resultCode == Activity.RESULT_OK &&
                    data != null
            ) {

                results =
                        WebChromeClient
                                .FileChooserParams
                                .parseResult(
                                        resultCode,
                                        data
                                );
            }


            filePathCallback
                    .onReceiveValue(results);


            filePathCallback = null;
        }
    }


    @Override
    public void onRequestPermissionsResult(
            int requestCode,
            @NonNull String[] permissions,
            @NonNull int[] grantResults
    ) {

        super.onRequestPermissionsResult(
                requestCode,
                permissions,
                grantResults
        );


        if (
                requestCode ==
                        CAMERA_PERMISSION_REQUEST
        ) {

            if (
                    pendingPermissionRequest != null
            ) {

                if (
                        grantResults.length > 0 &&
                        grantResults[0] ==
                                PackageManager.PERMISSION_GRANTED
                ) {

                    pendingPermissionRequest.grant(
                            new String[]{
                                    PermissionRequest
                                            .RESOURCE_VIDEO_CAPTURE
                            }
                    );

                } else {

                    pendingPermissionRequest.deny();
                }


                pendingPermissionRequest = null;
            }
        }
    }


    @Override
    public void onBackPressed() {

        if (
                webView != null &&
                webView.canGoBack()
        ) {

            webView.goBack();

        } else {

            super.onBackPressed();
        }
    }


    @Override
    protected void onDestroy() {

        stopExport();

        cleanupFiles();


        if (
                webView != null
        ) {

            webView.destroy();
        }


        super.onDestroy();
    }

}

