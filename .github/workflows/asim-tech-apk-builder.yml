          EOF


      # =====================================================
      # VERIFY ANDROID PROJECT
      # =====================================================

      - name: Verify Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          echo "======================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "======================================"


          test -f android-project/build.gradle

          test -f android-project/settings.gradle

          test -f android-project/app/build.gradle

          test -f android-project/app/src/main/AndroidManifest.xml

          test -f android-project/app/src/main/res/values/styles.xml


          echo ""
          echo "Checking CAMERA permission..."

          grep \
            "android.permission.CAMERA" \
            android-project/app/src/main/AndroidManifest.xml


          echo ""
          echo "Checking WRITE_EXTERNAL_STORAGE..."

          grep \
            "android.permission.WRITE_EXTERNAL_STORAGE" \
            android-project/app/src/main/AndroidManifest.xml


          echo ""
          echo "Checking Media3 Transformer..."

          grep \
            "media3-transformer" \
            android-project/app/build.gradle


          echo ""
          echo "Checking Media3 Common..."

          grep \
            "media3-common" \
            android-project/app/build.gradle


          echo ""
          echo "Checking Media3 Effect..."

          grep \
            "media3-effect" \
            android-project/app/build.gradle


          echo ""
          echo "Checking H264..."

          grep \
            "MimeTypes.VIDEO_H264" \
            "android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"


          echo ""
          echo "Checking AAC..."

          grep \
            "MimeTypes.AUDIO_AAC" \
            "android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"


          echo ""
          echo "Checking AndroidExport bridge..."

          grep \
            "AndroidExport" \
            "android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"


          echo ""
          echo "Checking startExport..."

          grep \
            "startExport" \
            "android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"


          echo ""
          echo "Checking appendChunk..."

          grep \
            "appendChunk" \
            "android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"


          echo ""
          echo "Checking finishExport..."

          grep \
            "finishExport" \
            "android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"


          echo ""
          echo "Checking Gallery save..."

          grep \
            "MediaStore.Video.Media" \
