          echo "CREATING FINAL FILE"
          echo "======================================"

          echo "OUTPUT_FILE=${OUTPUT_FILE}"
          echo "OUTPUT_EXT=${OUTPUT_EXT}"
          echo "FINAL_FILE=${FINAL_FILE}"

          cp \
            "android-project/${OUTPUT_FILE}" \
            "$FINAL_FILE"

          test -f "$FINAL_FILE"

          echo "FINAL_FILE=$FINAL_FILE" >> "$GITHUB_ENV"

          echo "======================================"
          echo "FINAL FILE CREATED"
          echo "======================================"

          ls -lh "$FINAL_FILE"


      # =========================================================
      # SHA256
      # =========================================================

      - name: Calculate SHA256
        if: steps.queue.outputs.has_build == 'true'
        id: sha
        run: |

          set -e

          echo "======================================"
          echo "CALCULATING SHA256"
          echo "======================================"

          SHA=$(sha256sum \
            "$FINAL_FILE" |
            awk '{print $1}')

          SIZE=$(stat \
            -c%s \
            "$FINAL_FILE")

          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          echo "FILE=$FINAL_FILE"

          echo "SHA256=$SHA"

          echo "SIZE=$SIZE"


      # =========================================================
      # UPLOAD APK / AAB TO SUPABASE STORAGE
      # =========================================================

      - name: Upload APK/AAB
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          set -e

          STORAGE_PATH="${BUILD_ID}/${FINAL_FILE}"


          # =====================================================
          # MIME TYPE
          # =====================================================

          if [ "$OUTPUT_EXT" = "aab" ]; then

            MIME_TYPE="application/octet-stream"

          else

            MIME_TYPE="application/vnd.android.package-archive"

          fi


          echo "======================================"
          echo "UPLOADING BUILD"
          echo "======================================"

          echo "BUILD_TYPE=${BUILD_TYPE}"

          echo "FILE_NAME=${FINAL_FILE}"

          echo "STORAGE_PATH=${STORAGE_PATH}"

          echo "MIME_TYPE=${MIME_TYPE}"


          curl -fL \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/android-apks/${STORAGE_PATH}?upsert=true" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: ${MIME_TYPE}" \
            --data-binary "@${FINAL_FILE}"


          echo "STORAGE_PATH=${STORAGE_PATH}" \
