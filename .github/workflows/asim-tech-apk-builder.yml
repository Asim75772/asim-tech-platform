name: ASIM TECH Android APK Builder

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: android-apk-builder
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # TOOLS
      # =====================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq imagemagick


      # =====================================================
      # GRADLE
      # =====================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # =====================================================
      # GET QUEUED BUILD
      # =====================================================

      - name: Get queued build
        id: queue
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          echo "Checking queued builds..."

          RESPONSE=$(curl -sS \
            "${SUPABASE_URL}/rest/v1/app_builds?status=eq.queued&order=queued_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "$RESPONSE"

          BUILD_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')
          APP_ID=$(echo "$RESPONSE" | jq -r '.[0].app_id // empty')

          if [ -z "$BUILD_ID" ] || [ -z "$APP_ID" ]; then
            echo "No queued build found."
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "BUILD_ID=$BUILD_ID"
          echo "APP_ID=$APP_ID"

          echo "has_build=true" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID"


      # =====================================================
      # STOP IF NO BUILD
      # =====================================================

      - name: Stop if queue empty
        if: steps.queue.outputs.has_build != 'true'
        run: |
          echo "No queued APK build."
          exit 0


      # =====================================================
      # MARK BUILDING
      # =====================================================

      - name: Mark build as building
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"building\",
              \"started_at\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"

          echo "Build marked as building."


      # =====================================================
      # DOWNLOAD APP FILES
      # =====================================================

      - name: Download app files
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ID: ${{ steps.queue.outputs.app_id }}
        run: |

          mkdir -p source

          curl -sS \
            "${SUPABASE_URL}/rest/v1/app_files?app_id=eq.${APP_ID}&select=file_path,content,language" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > source/files.json

          echo "Downloaded app files."

          jq 'length' source/files.json


      # =====================================================
      # CREATE WEB FILES
      # =====================================================

      - name: Create source files
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p webapp

          jq -c '.[]' source/files.json | while read -r item
          do

            FILE_PATH=$(echo "$item" | jq -r '.file_path')
            CONTENT=$(echo "$item" | jq -r '.content')

            if [ -z "$FILE_PATH" ] || [ "$FILE_PATH" = "null" ]; then
              continue
            fi

            mkdir -p "webapp/$(dirname "$FILE_PATH")"

            printf '%s' "$CONTENT" > "webapp/$FILE_PATH"

          done

          echo "Source files created."

          find webapp -type f -print


      # =====================================================
      # PREPARE INDEX
      # =====================================================

      - name: Prepare web application
        if: steps.queue.outputs.has_build == 'true'
        run: |

          echo "Checking index.html..."

          if [ ! -f "webapp/index.html" ]; then

            if [ -f "webapp/webapp-url.txt" ]; then

              URL=$(cat "webapp/webapp-url.txt" | tr -d '\r\n')

              cat > webapp/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>

          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width,
                         initial-scale=1.0,
                         maximum-scale=1.0,
                         user-scalable=no">

          <title>ASIM TECH App</title>

          </head>

          <body>

          <script>
          window.location.replace("__ASIM_TECH_URL__");
          </script>

          </body>
          </html>
          EOF

              sed -i "s|__ASIM_TECH_URL__|${URL}|g" \
                webapp/index.html

            else

              echo "ERROR: index.html not found."
              exit 1

            fi

          fi

          echo "index.html ready."


      # =====================================================
      # READ ANDROID SETTINGS
      # =====================================================

      - name: Read Android settings
        if: steps.queue.outputs.has_build == 'true'
        run: |

          if [ -f "webapp/android-settings.json" ]; then

            cp \
              "webapp/android-settings.json" \
              android-settings.json

          else

            cat > android-settings.json <<'EOF'
          {
            "appName": "ASIM TECH APP",
            "packageName": "com.asimtech.app",
            "versionName": "1.0.0",
            "versionCode": 1
          }
          EOF

          fi

          cat android-settings.json

          APP_NAME=$(jq -r '.appName // "ASIM TECH APP"' android-settings.json)

          PACKAGE_NAME=$(jq -r '.packageName // "com.asimtech.app"' android-settings.json)

          VERSION_NAME=$(jq -r '.versionName // "1.0.0"' android-settings.json)

          VERSION_CODE=$(jq -r '.versionCode // 1' android-settings.json)

          APP_ICON_URL=$(jq -r '.appIconUrl // empty' android-settings.json)

          APP_ICON_PATH=$(jq -r '.appIconPath // empty' android-settings.json)

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_ICON_URL=$APP_ICON_URL" >> "$GITHUB_ENV"
          echo "APP_ICON_PATH=$APP_ICON_PATH" >> "$GITHUB_ENV"


      # =====================================================
      # CREATE ANDROID PROJECT
      # =====================================================

      - name: Create Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p android-project/app/src/main/assets

          cp -r \
            webapp/. \
            android-project/app/src/main/assets/

          echo "Android project created."


      # =====================================================
      # ICON
      # =====================================================

      - name: Prepare launcher icon
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |

          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi

          ICON_FILE="launcher-icon.png"


          if [ -n "$APP_ICON_PATH" ]; then

            curl -fL \
              "${SUPABASE_URL}/storage/v1/object/website-images/${APP_ICON_PATH}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o "$ICON_FILE" || true

          fi


          if [ ! -s "$ICON_FILE" ] && [ -n "$APP_ICON_URL" ]; then

            curl -fL \
              "$APP_ICON_URL" \
              -o "$ICON_FILE" || true

          fi


          if [ ! -s "$ICON_FILE" ]; then

            convert \
              -size 512x512 \
              xc:"#18A558" \
              -gravity center \
              -fill white \
              -draw "rectangle 160,110 352,402" \
              "$ICON_FILE"

          fi


          convert "$ICON_FILE" \
            -resize 48x48 \
            android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 72x72 \
            android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 96x96 \
            android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 144x144 \
            android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$ICON_FILE" \
            -resize 192x192 \
            android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png


          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi
          do

            cp \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher.png" \
              "android-project/app/src/main/res/mipmap-${density}/ic_launcher_round.png"

          done


      # =====================================================
      # GRADLE PROPERTIES
      # =====================================================

      - name: Create Gradle properties
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF


      # =====================================================
      # SETTINGS.GRADLE
      # =====================================================

      - name: Create settings.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }

          dependencyResolutionManagement {

              repositories {

                  google()

                  mavenCentral()

              }

          }

          rootProject.name = "GeneratedApp"

          include(":app")
          EOF


      # =====================================================
      # ROOT BUILD.GRADLE
      # =====================================================

      - name: Create root build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/build.gradle <<'EOF'
          plugins {

              id 'com.android.application' version '8.7.3' apply false

          }
          EOF


      # =====================================================
      # APP BUILD.GRADLE
      # =====================================================

      - name: Create app build.gradle
        if: steps.queue.outputs.has_build == 'true'
        run: |

          cat > android-project/app/build.gradle <<'EOF'
          plugins {

              id 'com.android.application'

          }


          android {

              namespace '__PACKAGE_NAME__'

              compileSdk 35


              defaultConfig {

                  applicationId '__PACKAGE_NAME__'

                  minSdk 23

                  targetSdk 35

                  versionCode __VERSION_CODE__

                  versionName '__VERSION_NAME__'

              }


              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_1_8

                  targetCompatibility JavaVersion.VERSION_1_8

              }

          }


          dependencies {

              implementation 'androidx.webkit:webkit:1.12.1'

              implementation 'androidx.media3:media3-transformer:1.11.1'

              implementation 'androidx.media3:media3-effect:1.11.1'

              implementation 'androidx.media3:media3-common:1.11.1'

          }
          EOF


          sed -i "s|__PACKAGE_NAME__|${PACKAGE_NAME}|g" \
            android-project/app/build.gradle

          sed -i "s|__VERSION_CODE__|${VERSION_CODE}|g" \
            android-project/app/build.gradle

          sed -i "s|__VERSION_NAME__|${VERSION_NAME}|g" \
            android-project/app/build.gradle


      # =====================================================
      # ANDROID MANIFEST
      # =====================================================

      - name: Create Android Manifest
        if: steps.queue.outputs.has_build == 'true'
        run: |

          mkdir -p android-project/app/src/main


          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <uses-permission
                  android:name="android.permission.CAMERA" />


              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />


              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false" />


              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="__APP_NAME__"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">


                  <activity
                      android:name=".MainActivity"
                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>
          EOF


          sed -i "s|__APP_NAME__|${APP_NAME}|g" \
            android-project/app/src/main/AndroidManifest.xml


      # =====================================================
      # MAIN ACTIVITY
      # =====================================================

      - name: Create MainActivity
        if: steps.queue.outputs.has_build == 'true'
        run: |

          JAVA_PATH="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')"

          mkdir -p "$JAVA_PATH"


          cat > "$JAVA_PATH/MainActivity.java" <<'EOF'
          package __PACKAGE_NAME__;


          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.annotation.Nullable;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.Transformer;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.Base64;


          public class MainActivity extends Activity {


              private WebView webView;

              private PermissionRequest pendingPermissionRequest;

              private ValueCallback<Uri[]> filePathCallback;

              private static final int FILE_CHOOSER_REQUEST = 2001;

              private static final int CAMERA_PERMISSION_REQUEST = 1001;


              // =================================================
              // VIDEO EXPORT
              // =================================================

              private File nativeInputFile;

              private File nativeOutputFile;

              private FileOutputStream nativeInputStream;

              private Transformer transformer;


              // =================================================
              // ACTIVITY CREATE
              // =================================================

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  getWindow().setStatusBarColor(
                      Color.rgb(180, 35, 0)
                  );

                  getWindow().setNavigationBarColor(
                      Color.BLACK
                  );


                  webView = new WebView(this);


                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setUseWideViewPort(true);

                  settings.setLoadWithOverviewMode(true);

                  settings.setSupportZoom(false);


                  final WebViewAssetLoader assetLoader =
                      new WebViewAssetLoader.Builder()

                          .addPathHandler(
                              "/assets/",
                              new WebViewAssetLoader
                                  .AssetsPathHandler(this)
                          )

                          .build();


                  webView.setWebViewClient(
                      new WebViewClientCompat() {

                          @Override
                          public WebResourceResponse
                          shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              return assetLoader
                                  .shouldInterceptRequest(
                                      request.getUrl()
                                  );

                          }

                      }
                  );


                  // =================================================
                  // NATIVE EXPORT BRIDGE
                  // =================================================

                  webView.addJavascriptInterface(
                      new AndroidExportBridge(),
                      "AndroidExport"
                  );


                  webView.setWebChromeClient(
                      new WebChromeClient() {


                          @Override
                          public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params
                          ) {

                              if (filePathCallback != null) {

                                  filePathCallback
                                      .onReceiveValue(null);

                              }

                              filePathCallback = callback;


                              try {

                                  Intent intent =
                                      params.createIntent();

                                  startActivityForResult(
                                      intent,
                                      FILE_CHOOSER_REQUEST
                                  );

                              } catch (Exception e) {

                                  filePathCallback = null;

                                  return false;

                              }

                              return true;

                          }


                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(() -> {

                                  boolean cameraRequested =
                                      false;

                                  String[] resources =
                                      request.getResources();

                                  if (resources != null) {

                                      for (
                                          String resource :
                                          resources
                                      ) {

                                          if (
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                                  .equals(resource)
                                          ) {

                                              cameraRequested =
                                                  true;

                                              break;

                                          }

                                      }

                                  }


                                  if (!cameraRequested) {

                                      request.deny();

                                      return;

                                  }


                                  if (
                                      checkSelfPermission(
                                          Manifest.permission.CAMERA
                                      )
                                      ==
                                      PackageManager
                                          .PERMISSION_GRANTED
                                  ) {

                                      request.grant(
                                          new String[] {
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                          }
                                      );

                                      return;

                                  }


                                  pendingPermissionRequest =
                                      request;

                                  requestPermissions(
                                      new String[] {
                                          Manifest.permission.CAMERA
                                      },
                                      CAMERA_PERMISSION_REQUEST
                                  );

                              });

                          }


                          @Override
                          public void onPermissionRequestCanceled(
                              PermissionRequest request
                          ) {

                              if (
                                  pendingPermissionRequest
                                  == request
                              ) {

                                  pendingPermissionRequest =
                                      null;

                              }

                              super
                                  .onPermissionRequestCanceled(
                                      request
                                  );

                          }

                      }
                  );


                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );


                  setContentView(webView);

              }


              // =================================================
              // JAVASCRIPT NATIVE EXPORT BRIDGE
              // =================================================

              private class AndroidExportBridge {


                  @JavascriptInterface
                  public synchronized void startExport(
                      String fileName
                  ) {

                      runOnUiThread(() -> {

                          try {

                              stopCurrentExport();


                              nativeInputFile =
                                  new File(
                                      getCacheDir(),
                                      "cine_input_" +
                                      System.currentTimeMillis() +
                                      ".webm"
                                  );


                              nativeOutputFile =
                                  new File(
                                      getCacheDir(),
                                      "cine_output_" +
                                      System.currentTimeMillis() +
                                      ".mp4"
                                  );


                              nativeInputStream =
                                  new FileOutputStream(
                                      nativeInputFile
                                  );


                              sendJavascript(
                                  "window.__nativeExportStarted && window.__nativeExportStarted();"
                              );


                          } catch (Exception e) {

                              sendExportResult(
                                  false,
                                  e.getMessage()
                              );

                          }

                      });

                  }


                  @JavascriptInterface
                  public synchronized void appendChunk(
                      String base64Data
                  ) {

                      try {

                          if (nativeInputStream == null) {

                              throw new Exception(
                                  "Export has not been started."
                              );

                          }


                          byte[] data =
                              Base64.getDecoder().decode(
                                  base64Data
                              );


                          nativeInputStream.write(data);


                      } catch (Exception e) {

                          sendExportResult(
                              false,
                              e.getMessage()
                          );

                      }

                  }


                  @JavascriptInterface
                  public synchronized void finishExport() {

                      runOnUiThread(() -> {

                          try {

                              if (
                                  nativeInputStream != null
                              ) {

                                  nativeInputStream.flush();

                                  nativeInputStream.close();

                                  nativeInputStream = null;

                              }


                              transformToMp4();


                          } catch (Exception e) {

                              sendExportResult(
                                  false,
                                  e.getMessage()
                              );

                          }

                      });

                  }


                  @JavascriptInterface
                  public synchronized void cancelExport() {

                      runOnUiThread(() -> {

                          stopCurrentExport();

                          sendExportResult(
                              false,
                              "Export cancelled."
                          );

                      });

                  }

              }


              // =================================================
              // TRANSFORM WEBM -> H264/AAC MP4
              // =================================================

              private void transformToMp4() {

                  try {

                      if (
                          nativeInputFile == null
                          ||
                          !nativeInputFile.exists()
                      ) {

                          throw new Exception(
                              "Input video not found."
                          );

                      }


                      MediaItem inputMediaItem =
                          MediaItem.fromUri(
                              Uri.fromFile(nativeInputFile)
                          );


                      EditedMediaItem editedMediaItem =
                          new EditedMediaItem.Builder(
                              inputMediaItem
                          ).build();


                      transformer =
                          new Transformer.Builder(this)

                              .setVideoMimeType(
                                  MimeTypes.VIDEO_H264
                              )

                              .setAudioMimeType(
                                  MimeTypes.AUDIO_AAC
                              )

                              .addListener(
                                  new Transformer.Listener() {

                                      @Override
                                      public void onCompleted(
                                          androidx.media3.transformer.Composition composition,
                                          ExportResult result
                                      ) {

                                          saveMp4ToGallery();

                                      }


                                      @Override
                                      public void onError(
                                          androidx.media3.transformer.Composition composition,
                                          ExportResult result,
                                          ExportException exception
                                      ) {

                                          sendExportResult(
                                              false,
                                              "MP4 conversion failed: " +
                                              exception.getMessage()
                                          );

                                      }

                                  }
                              )

                              .build();


                      transformer.start(
                          editedMediaItem,
                          nativeOutputFile.getAbsolutePath()
                      );


                  } catch (Exception e) {

                      sendExportResult(
                          false,
                          e.getMessage()
                      );

                  }

              }


              // =================================================
              // SAVE MP4 TO ANDROID GALLERY
              // =================================================

              private void saveMp4ToGallery() {

                  try {

                      if (
                          nativeOutputFile == null
                          ||
                          !nativeOutputFile.exists()
                      ) {

                          throw new Exception(
                              "MP4 output file not found."
                          );

                      }


                      String displayName =
                          "CineReel_" +
                          System.currentTimeMillis() +
                          ".mp4";


                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.Q
                      ) {

                          ContentValues values =
                              new ContentValues();


                          values.put(
                              MediaStore.Video.Media.DISPLAY_NAME,
                              displayName
                          );


                          values.put(
                              MediaStore.Video.Media.MIME_TYPE,
                              "video/mp4"
                          );


                          values.put(
                              MediaStore.Video.Media.RELATIVE_PATH,
                              Environment.DIRECTORY_MOVIES +
                              "/ASIM TECH"
                          );


                          values.put(
                              MediaStore.Video.Media.IS_PENDING,
                              1
                          );


                          Uri uri =
                              getContentResolver()
                                  .insert(
                                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                                      values
                                  );


                          if (uri == null) {

                              throw new Exception(
                                  "Could not create Gallery item."
                              );

                          }


                          try (
                              InputStream input =
                                  new FileInputStream(
                                      nativeOutputFile
                                  );

                              OutputStream output =
                                  getContentResolver()
                                      .openOutputStream(uri)
                          ) {

                              byte[] buffer =
                                  new byte[1024 * 1024];

                              int length;

                              while (
                                  (length =
                                      input.read(buffer))
                                  > 0
                              ) {

                                  output.write(
                                      buffer,
                                      0,
                                      length
                                  );

                              }

                              output.flush();

                          }


                          ContentValues completeValues =
                              new ContentValues();

                          completeValues.put(
                              MediaStore.Video.Media.IS_PENDING,
                              0
                          );


                          getContentResolver()
                              .update(
                                  uri,
                                  completeValues,
                                  null,
                                  null
                              );


                          sendExportResult(
                              true,
                              "MP4 video saved to Gallery."
                          );


                      } else {

                          File moviesDir =
                              new File(
                                  Environment
                                      .getExternalStoragePublicDirectory(
                                          Environment.DIRECTORY_MOVIES
                                      ),
                                  "ASIM TECH"
                              );


                          if (!moviesDir.exists()) {

                              moviesDir.mkdirs();

                          }


                          File destination =
                              new File(
                                  moviesDir,
                                  displayName
                              );


                          copyFile(
                              nativeOutputFile,
                              destination
                          );


                          Intent scanIntent =
                              new Intent(
                                  Intent.ACTION_MEDIA_SCANNER_SCAN_FILE
                              );


                          scanIntent.setData(
                              Uri.fromFile(destination)
                          );


                          sendBroadcast(
                              scanIntent
                          );


                          sendExportResult(
                              true,
                              "MP4 video saved to Gallery."
                          );

                      }


                  } catch (Exception e) {

                      sendExportResult(
                          false,
                          "Gallery save failed: " +
                          e.getMessage()
                      );

                  }

              }


              // =================================================
              // FILE COPY
              // =================================================

              private void copyFile(
                  File source,
                  File destination
              ) throws Exception {

                  try (
                      InputStream input =
                          new FileInputStream(source);

                      OutputStream output =
                          new FileOutputStream(destination)
                  ) {

                      byte[] buffer =
                          new byte[1024 * 1024];

                      int length;

                      while (
                          (length =
                              input.read(buffer))
                          > 0
                      ) {

                          output.write(
                              buffer,
                              0,
                              length
                          );

                      }

                      output.flush();

                  }

              }


              // =================================================
              // JAVASCRIPT RESULT
              // =================================================

              private void sendExportResult(
                  boolean success,
                  String message
              ) {

                  String safeMessage =
                      message == null
                      ? ""
                      : message
                          .replace(
                              "\\",
                              "\\\\"
                          )
                          .replace(
                              "'",
                              "\\'"
                          )
                          .replace(
                              "\n",
                              "\\n"
                          )
                          .replace(
                              "\r",
                              "\\r"
                          );


                  String javascript =
                      "window.__nativeExportDone && " +
                      "window.__nativeExportDone(" +
                      success +
                      ",'" +
                      safeMessage +
                      "');";


                  runOnUiThread(() -> {

                      if (webView != null) {

                          webView.evaluateJavascript(
                              javascript,
                              null
                          );

                      }

                  });


                  cleanupExportFiles();

              }


              // =================================================
              // STOP EXPORT
              // =================================================

              private void stopCurrentExport() {

                  try {

                      if (transformer != null) {

                          transformer.cancel();

                      }

                  } catch (Exception ignored) {
                  }


                  transformer = null;


                  try {

                      if (
                          nativeInputStream != null
                      ) {

                          nativeInputStream.close();

                      }

                  } catch (Exception ignored) {
                  }


                  nativeInputStream = null;

              }


              // =================================================
              // CLEANUP
              // =================================================

              private void cleanupExportFiles() {

                  try {

                      if (
                          nativeInputFile != null
                          &&
                          nativeInputFile.exists()
                      ) {

                          nativeInputFile.delete();

                      }

                  } catch (Exception ignored) {
                  }


                  try {

                      if (
                          nativeOutputFile != null
                          &&
                          nativeOutputFile.exists()
                      ) {

                          nativeOutputFile.delete();

                      }

                  } catch (Exception ignored) {
                  }

              }


              // =================================================
              // JAVASCRIPT HELPER
              // =================================================

              private void sendJavascript(
                  String javascript
              ) {

                  runOnUiThread(() -> {

                      if (webView != null) {

                          webView.evaluateJavascript(
                              javascript,
                              null
                          );

                      }

                  });

              }


              // =================================================
              // FILE PICKER RESULT
              // =================================================

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );


                  if (
                      requestCode ==
                      FILE_CHOOSER_REQUEST
                  ) {

                      if (
                          filePathCallback == null
                      ) {

                          return;

                      }


                      Uri[] results = null;


                      if (
                          resultCode ==
                          Activity.RESULT_OK
                          &&
                          data != null
                      ) {

                          results =
                              WebChromeClient
                                  .FileChooserParams
                                  .parseResult(
                                      resultCode,
                                      data
                                  );

                      }


                      filePathCallback
                          .onReceiveValue(results);


                      filePathCallback = null;

                  }

              }


              // =================================================
              // CAMERA PERMISSION RESULT
              // =================================================

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );


                  if (
                      requestCode ==
                      CAMERA_PERMISSION_REQUEST
                  ) {


                      if (
                          pendingPermissionRequest
                          != null
                      ) {


                          if (
                              grantResults.length > 0
                              &&
                              grantResults[0]
                              ==
                              PackageManager
                                  .PERMISSION_GRANTED
                          ) {

                              pendingPermissionRequest.grant(
                                  new String[] {
                                      PermissionRequest
                                          .RESOURCE_VIDEO_CAPTURE
                                  }
                              );

                          } else {

                              pendingPermissionRequest.deny();

                          }


                          pendingPermissionRequest =
                              null;

                      }

                  }

              }


              // =================================================
              // BACK BUTTON
              // =================================================

              @Override
              public void onBackPressed() {

                  if (
                      webView != null
                      &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }


              // =================================================
              // DESTROY
              // =================================================

              @Override
              protected void onDestroy() {

                  stopCurrentExport();

                  cleanupExportFiles();


                  if (webView != null) {

                      webView.destroy();

                  }


                  super.onDestroy();

              }

          }
          EOF


          sed -i "s|__PACKAGE_NAME__|${PACKAGE_NAME}|g" \
