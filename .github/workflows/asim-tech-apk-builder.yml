          echo "======================================"


      # =========================================================
      # BUILD APK / AAB
      # =========================================================

      - name: Build APK/AAB
        if: steps.queue.outputs.has_build == 'true'
        working-directory: android-project
        run: |

          set -e

          echo "======================================"
          echo "BUILD TYPE: ${BUILD_TYPE}"
          echo "======================================"

          echo "Gradle version:"
          gradle --version

          echo "======================================"
          echo "APP BUILD.GRADLE"
          echo "======================================"

          cat app/build.gradle

          echo "======================================"
          echo "ROOT BUILD.GRADLE"
          echo "======================================"

          cat build.gradle


          # =====================================================
          # AAB BUILD
          # =====================================================

          if [ "$BUILD_TYPE" = "aab" ]; then

            echo "======================================"
            echo "BUILDING AAB"
            echo "======================================"

            gradle bundleDebug \
              --no-daemon \
              --stacktrace

            echo "Checking AAB output..."

            test -f \
              app/build/outputs/bundle/debug/app-debug.aab

            echo "AAB BUILD COMPLETED."

            ls -lh \
              app/build/outputs/bundle/debug/

            echo \
              "OUTPUT_FILE=app/build/outputs/bundle/debug/app-debug.aab" \
              >> "$GITHUB_ENV"

