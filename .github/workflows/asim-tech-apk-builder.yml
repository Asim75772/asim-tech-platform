      # =========================================================

      - name: Create styles
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          mkdir -p android-project/app/src/main/res/values

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:colorAccent">#087FF5</item>

                  <item name="android:statusBarColor">#050B11</item>

                  <item name="android:navigationBarColor">#050B11</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:windowLightNavigationBar">false</item>

              </style>

          </resources>

          EOF


      # =========================================================
      # VERIFY ANDROID PROJECT
      # =========================================================

      - name: Verify Android project
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          echo "======================================"
          echo "VERIFYING PROJECT"
          echo "======================================"

          test -f android-project/settings.gradle

          test -f android-project/build.gradle

          test -f android-project/app/build.gradle

          test -f android-project/app/src/main/AndroidManifest.xml

          test -f android-project/app/src/main/res/values/styles.xml

          JAVA_FILE="android-project/app/src/main/java/$(echo "$PACKAGE_NAME" | tr '.' '/')/MainActivity.java"

          test -f "$JAVA_FILE"


          echo "Checking Android Gradle Plugin..."

          grep \
            "com.android.application.*8.7.3" \
            android-project/build.gradle


          echo "Checking compileSdk..."

          grep \
            "compileSdk 35" \
            android-project/app/build.gradle


          echo "Checking Media3 Transformer..."

          grep \
            "media3-transformer:1.10.1" \
            android-project/app/build.gradle


          echo "Checking Media3 Common..."

          grep \
            "media3-common:1.10.1" \
            android-project/app/build.gradle


          echo "Checking H264..."

          grep \
            "MimeTypes.VIDEO_H264" \
            "$JAVA_FILE"


          echo "Checking AAC..."

          grep \
            "MimeTypes.AUDIO_AAC" \
            "$JAVA_FILE"


          echo "Checking AndroidExport..."

          grep \
            "AndroidExport" \
            "$JAVA_FILE"


          echo "Checking Gallery..."

          grep \
            "MediaStore.Video.Media" \
            "$JAVA_FILE"


          echo "======================================"
          echo "PROJECT VERIFICATION PASSED"
          echo "======================================"


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build APK
        if: steps.queue.outputs.has_build == 'true'
        working-directory: android-project
        run: |

          set -e

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          echo "Gradle version:"
          gradle --version

          echo "======================================"
          echo "APP BUILD.GRADLE"
          echo "======================================"

          cat app/build.gradle

          echo "======================================"
          echo "STARTING GRADLE BUILD"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "======================================"
          echo "APK BUILD COMPLETED"
          echo "======================================"

          ls -lh \
            app/build/outputs/apk/debug/


      # =========================================================
      # RENAME APK
      # =========================================================

      - name: Rename APK
        if: steps.queue.outputs.has_build == 'true'
        run: |

          set -e

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          cp \
            android-project/app/build/outputs/apk/debug/app-debug.apk \
            "ASIM-TECH-${BUILD_ID}.apk"

          ls -lh \
            "ASIM-TECH-${BUILD_ID}.apk"


      # =========================================================
      # SHA256
      # =========================================================

      - name: Calculate SHA256
        if: steps.queue.outputs.has_build == 'true'
        id: sha
        run: |

          set -e

          BUILD_ID="${{ steps.queue.outputs.build_id }}"

          SHA=$(sha256sum \
            "ASIM-TECH-${BUILD_ID}.apk" |
            awk '{print $1}')

          SIZE=$(stat -c%s \
            "ASIM-TECH-${BUILD_ID}.apk")

          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          echo "SHA256=$SHA"

          echo "SIZE=$SIZE"


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          set -e

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"

          STORAGE_PATH="${BUILD_ID}/${FILE_NAME}"

          curl -fL \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/android-apks/${STORAGE_PATH}?upsert=true" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@${FILE_NAME}"

          echo "STORAGE_PATH=${STORAGE_PATH}" >> "$GITHUB_ENV"

          echo "APK uploaded."


      # =========================================================
      # MARK SUCCESS
      # =========================================================

      - name: Mark build successful
        if: steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          FILE_NAME="ASIM-TECH-${BUILD_ID}.apk"

          curl -sS \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\":\"success\",
              \"storage_path\":\"${STORAGE_PATH}\",
              \"file_name\":\"${FILE_NAME}\",
              \"mime_type\":\"application/vnd.android.package-archive\",
              \"file_size\":${{ steps.sha.outputs.size }},
              \"sha256\":\"${{ steps.sha.outputs.sha256 }}\",
              \"completed_at\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"


      # =========================================================
      # GITHUB APK ARTIFACT
      # =========================================================

      - name: Upload APK artifact
        if: steps.queue.outputs.has_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ASIM-TECH-${{ steps.queue.outputs.build_id }}
          path: ASIM-TECH-${{ steps.queue.outputs.build_id }}.apk
          if-no-files-found: error


      # =========================================================
      # MARK FAILED
      # =========================================================

      - name: Mark build failed
        if: failure() && steps.queue.outputs.has_build == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}
        run: |

          curl -sS \
            -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\":\"failed\",
              \"build_log\":\"GitHub Actions Android build failed. Check Actions log.\",
              \"completed_at\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
            }"
