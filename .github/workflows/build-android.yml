name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: android-apk-build-queue
  cancel-in-progress: false

jobs:

  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        run: |

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER=$(find \
              "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -1)

          fi

          if [ -z "$SDKMANAGER" ]; then

            echo "ERROR: sdkmanager not found."

            find "$ANDROID_HOME" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1

          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup completed."


      # ==================================================
      # 4. INSTALL DEPENDENCIES
      # ==================================================

      - name: Install dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            unzip


      # ==================================================
      # 5. FIND QUEUED BUILD
      # ==================================================

      - name: Find queued build
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

        run: |

          echo "Checking Supabase build queue..."

          RESPONSE=$(curl -sS \
            "${SUPABASE_URL}/rest/v1/app_builds?status=eq.queued&order=created_at.asc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "Queue response:"
          echo "$RESPONSE"

          BUILD_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')

          APP_ID=$(echo "$RESPONSE" | jq -r '.[0].app_id // empty')

          if [ -z "$BUILD_ID" ]; then

            echo "No queued build found."

            echo "found=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo "Queued Build ID:"
          echo "$BUILD_ID"

          echo "App ID:"
          echo "$APP_ID"

          echo "found=true" >> "$GITHUB_OUTPUT"

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 6. STOP IF NO QUEUE
      # ==================================================

      - name: Stop when queue is empty
        if: steps.queue.outputs.found != 'true'
        run: |

          echo "No queued APK build."

          exit 0


      # ==================================================
      # 7. MARK BUILDING
      # ==================================================

      - name: Mark build as building
        if: steps.queue.outputs.found == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          echo "Marking build as building..."

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data-binary @- <<EOF
          {
            "status": "building",
            "started_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          echo "Build status = building"


      # ==================================================
      # 8. DOWNLOAD APP FILES
      # ==================================================

      - name: Download app files
        if: steps.queue.outputs.found == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ID: ${{ steps.queue.outputs.app_id }}

        run: |

          mkdir -p source

          echo "Downloading app files..."

          curl -sS \
            "${SUPABASE_URL}/rest/v1/app_files?app_id=eq.${APP_ID}&select=file_path,content" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            > source/files.json

          echo "App files response:"

          cat source/files.json | jq .

          COUNT=$(jq 'length' source/files.json)

          echo "Number of files: $COUNT"

          if [ "$COUNT" -eq 0 ]; then

            echo "ERROR: No app files found."

            exit 1

          fi

          jq -c '.[]' source/files.json | while read -r ITEM
          do

            FILE_PATH=$(echo "$ITEM" | jq -r '.file_path')

            CONTENT=$(echo "$ITEM" | jq -r '.content')

            mkdir -p "source/$(dirname "$FILE_PATH")"

            printf '%s' "$CONTENT" > "source/$FILE_PATH"

            echo "Created: source/$FILE_PATH"

          done


      # ==================================================
      # 9. READ ANDROID SETTINGS
      # ==================================================

      - name: Read Android settings
        if: steps.queue.outputs.found == 'true'
        run: |

          if [ ! -f source/android-settings.json ]; then

            echo "ERROR: android-settings.json not found."

            exit 1

          fi

          echo "Android settings:"

          cat source/android-settings.json

          APP_NAME=$(jq -r \
            '.appName // "ASIM TECH App"' \
            source/android-settings.json)

          PACKAGE_NAME=$(jq -r \
            '.packageName // "com.asimtech.app"' \
            source/android-settings.json)

          VERSION_NAME=$(jq -r \
            '.versionName // "1.0.0"' \
            source/android-settings.json)

          VERSION_CODE=$(jq -r \
            '.versionCode // 1' \
            source/android-settings.json)

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo ""
          echo "App Name      : $APP_NAME"
          echo "Package Name  : $PACKAGE_NAME"
          echo "Version Name  : $VERSION_NAME"
          echo "Version Code  : $VERSION_CODE"


      # ==================================================
      # 10. VALIDATE PACKAGE
      # ==================================================

      - name: Validate package name
        if: steps.queue.outputs.found == 'true'
        run: |

          echo "Validating package name..."

          if ! echo "$PACKAGE_NAME" | grep -Eq \
            '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$'
          then

            echo "ERROR: Invalid package name:"
            echo "$PACKAGE_NAME"

            exit 1

          fi

          echo "Package name is valid."


      # ==================================================
      # 11. CREATE ANDROID PROJECT
      # ==================================================

      - name: Create Android project
        if: steps.queue.outputs.found == 'true'
        run: |

          mkdir -p android

          mkdir -p android/app

          mkdir -p android/app/src/main

          mkdir -p android/app/src/main/java

          mkdir -p android/app/src/main/res

          mkdir -p android/app/src/main/res/values

          mkdir -p android/app/src/main/assets

          echo "Android project directories created."


      # ==================================================
      # 12. CREATE SETTINGS.GRADLE
      # ==================================================

      - name: Create Gradle settings
        if: steps.queue.outputs.found == 'true'
        run: |

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ASIMTECH"

          include(":app")
          EOF

          echo "settings.gradle created."


      # ==================================================
      # 13. CREATE ROOT BUILD.GRADLE
      # ==================================================

      - name: Create root Gradle
        if: steps.queue.outputs.found == 'true'
        run: |

          cat > android/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          echo "Root build.gradle created."


      # ==================================================
      # 14. CREATE GRADLE PROPERTIES
      # ==================================================

      - name: Create Gradle properties
        if: steps.queue.outputs.found == 'true'
        run: |

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          echo "gradle.properties created."


      # ==================================================
      # 15. GENERATE PACKAGE PATH
      # ==================================================

      - name: Generate package path
        if: steps.queue.outputs.found == 'true'
        run: |

          PACKAGE_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"

          mkdir -p \
            "android/app/src/main/java/$PACKAGE_PATH"

          echo "Java package path:"
          echo "$PACKAGE_PATH"


      # ==================================================
      # 16. CREATE MAIN ACTIVITY
      # ==================================================

      - name: Create MainActivity
        if: steps.queue.outputs.found == 'true'
        run: |

          cat > \
            "android/app/src/main/java/$PACKAGE_PATH/MainActivity.java" \
            <<EOF

          package $PACKAGE_NAME;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }
          }

          EOF

          echo "MainActivity.java created."


      # ==================================================
      # 17. CREATE MANIFEST
      # ==================================================

      - name: Create AndroidManifest
        if: steps.queue.outputs.found == 'true'
        run: |

          cat > android/app/src/main/AndroidManifest.xml <<EOF

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="$APP_NAME"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF

          echo "AndroidManifest.xml created."


      # ==================================================
      # 18. CREATE APP THEME
      # ==================================================

      - name: Create Android styles
        if: steps.queue.outputs.found == 'true'
        run: |

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #238636
                  </item>

              </style>

          </resources>
          EOF

          echo "styles.xml created."


      # ==================================================
      # 19. PREPARE HTML
      # ==================================================

      - name: Prepare HTML assets
        if: steps.queue.outputs.found == 'true'
        run: |

          mkdir -p android/app/src/main/assets

          if [ -f source/index.html ]; then

            echo "Using index.html"

            cp \
              source/index.html \
              android/app/src/main/assets/index.html

          elif [ -f source/webapp-url.txt ]; then

            echo "Using webapp URL"

            URL=$(cat source/webapp-url.txt)

            cat > android/app/src/main/assets/index.html <<EOF

          <!doctype html>

          <html>

          <head>

              <meta charset="utf-8">

              <meta
                  name="viewport"
                  content="width=device-width,initial-scale=1">

              <style>

                  html,
                  body,
                  iframe {

                      margin:0;

                      padding:0;

                      width:100%;

                      height:100%;

                      border:0;

                  }

              </style>

          </head>

          <body>

              <iframe
                  src="$URL"
                  style="width:100%;height:100%;border:0;">
              </iframe>

          </body>

          </html>

          EOF

          else

            echo "ERROR:"
            echo "Neither index.html nor webapp-url.txt exists."

            exit 1

          fi

          echo "HTML assets prepared."


      # ==================================================
      # 20. CREATE APP BUILD.GRADLE
      # ==================================================

      - name: Create app Gradle
        if: steps.queue.outputs.found == 'true'
        run: |

          cat > android/app/build.gradle <<EOF

          plugins {
              id "com.android.application"
          }

          android {

              namespace "$PACKAGE_NAME"

              compileSdk 35

              defaultConfig {

                  applicationId "$PACKAGE_NAME"

                  minSdk 23

                  targetSdk 35

                  versionCode $VERSION_CODE

                  versionName "$VERSION_NAME"

              }

          }

          EOF

          echo "app/build.gradle created."


      # ==================================================
      # 21. SETUP GRADLE
      # ==================================================

      - name: Setup Gradle
        if: steps.queue.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==================================================
      # 22. BUILD APK
      # ==================================================

      - name: Build APK
        if: steps.queue.outputs.found == 'true'
        working-directory: android
        run: |

          echo "Starting Android APK build..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "APK build completed."


      # ==================================================
      # 23. LOCATE APK
      # ==================================================

      - name: Locate APK
        if: steps.queue.outputs.found == 'true'
        run: |

          APK=$(find \
            android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK not found."

            find android/app/build \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK found:"
          echo "$APK"


      # ==================================================
      # 24. SHA256 AND FILE SIZE
      # ==================================================

      - name: Calculate SHA256
        if: steps.queue.outputs.found == 'true'
        run: |

          SHA256=$(sha256sum "$APK" | awk '{print $1}')

          FILE_SIZE=$(stat -c%s "$APK")

          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

          echo "FILE_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"

          echo "APK SHA256:"
          echo "$SHA256"

          echo "APK file size:"
          echo "$FILE_SIZE bytes"


      # ==================================================
      # 25. UPLOAD APK TO SUPABASE
      # ==================================================

      - name: Upload APK to Supabase
        if: steps.queue.outputs.found == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ID: ${{ steps.queue.outputs.app_id }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          STORAGE_PATH="${APP_ID}/${BUILD_ID}/ASIM-TECH-${BUILD_ID}.apk"

          echo "Supabase storage path:"
          echo "$STORAGE_PATH"

          curl -f -sS -X POST \
            "${SUPABASE_URL}/storage/v1/object/android-apks/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK}"

          echo "STORAGE_PATH=$STORAGE_PATH" >> "$GITHUB_ENV"

          echo "APK uploaded successfully."


      # ==================================================
      # 26. MARK BUILD SUCCESS
      # ==================================================

      - name: Mark build successful
        if: steps.queue.outputs.found == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          echo "Updating build record..."

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data-binary @- <<EOF

          {
            "status": "success",
            "storage_path": "$STORAGE_PATH",
            "file_name": "ASIM-TECH-${BUILD_ID}.apk",
            "mime_type": "application/vnd.android.package-archive",
            "file_size": $FILE_SIZE,
            "sha256": "$SHA256",
            "completed_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "build_log": "APK build completed successfully."
          }

          EOF

          echo "Build status updated to SUCCESS."


      # ==================================================
      # 27. UPLOAD GITHUB ARTIFACT
      # ==================================================

      - name: Upload APK artifact
        if: steps.queue.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ASIM-TECH-${{ steps.queue.outputs.build_id }}
          path: ${{ env.APK }}


      # ==================================================
      # 28. MARK BUILD FAILED
      # ==================================================

      - name: Mark build failed
        if: failure() && steps.queue.outputs.found == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_ID: ${{ steps.queue.outputs.build_id }}

        run: |

          echo "Build failed."

          curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_builds?id=eq.${BUILD_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data-binary @- <<EOF

          {
            "status": "failed",
            "completed_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "build_log": "Android APK build failed. Check GitHub Actions logs."
          }

          EOF

          echo "Build status updated to FAILED."
