name: Build Android APK

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      app_id:
        description: "ASIM TECH app UUID"
        required: true
        type: string

      build_id:
        description: "ASIM TECH build UUID"
        required: true
        type: string


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read


    env:

      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}


    steps:


      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout

        uses: actions/checkout@v4


      # ==========================================
      # 2. FIND BUILD
      # ==========================================

      - name: Find queued build

        id: job

        shell: bash

        run: |

          set -euo pipefail

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then

            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing."

            exit 1

          fi


          INPUT_BUILD_ID="${{ inputs.build_id }}"

          INPUT_APP_ID="${{ inputs.app_id }}"


          if [ -n "$INPUT_BUILD_ID" ]; then

            echo "Manual workflow selected build."

            JOB=$(curl -sS --fail \
              "$SUPABASE_URL/rest/v1/app_builds?id=eq.$INPUT_BUILD_ID&select=id,app_id,status" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")

          else

            echo "Scheduled workflow: finding queued build."

            JOB=$(curl -sS --fail \
              "$SUPABASE_URL/rest/v1/app_builds?status=eq.queued&order=created_at.asc&limit=1&select=id,app_id,status" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")

          fi


          BUILD_ID=$(python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          print(data[0]['id'] if data else '')
          " <<< "$JOB")


          APP_ID=$(python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          print(data[0]['app_id'] if data else '')
          " <<< "$JOB")


          if [ -z "$BUILD_ID" ]; then

            echo "found=false" >> "$GITHUB_OUTPUT"

            echo "No build found."

            exit 0

          fi


          if [ -n "$INPUT_APP_ID" ] && [ "$APP_ID" != "$INPUT_APP_ID" ]; then

            echo "ERROR: App UUID does not match Build UUID."

            exit 1

          fi


          echo "found=true" >> "$GITHUB_OUTPUT"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"


          echo "=========================================="

          echo "BUILD ID: $BUILD_ID"

          echo "APP ID:   $APP_ID"

          echo "=========================================="


      # ==========================================
      # 3. STOP IF NO BUILD
      # ==========================================

      - name: Stop when queue is empty

        if: steps.job.outputs.found != 'true'

        run: |

          echo "No Android builds are waiting."


      # ==========================================
      # 4. SET UP JAVA
      # ==========================================

      - name: Set up Java

        if: steps.job.outputs.found == 'true'

        uses: actions/setup-java@v4

        with:

          distribution: "temurin"

          java-version: "17"


      # ==========================================
      # 5. SET UP GRADLE
      # ==========================================

      - name: Set up Gradle

        if: steps.job.outputs.found == 'true'

        uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: "8.10.2"

          cache-disabled: true


      # ==========================================
      # 6. SET UP ANDROID
      # ==========================================

      - name: Set up Android SDK

        if: steps.job.outputs.found == 'true'

        uses: android-actions/setup-android@v3


      # ==========================================
      # 7. INSTALL SDK COMPONENTS
      # ==========================================

      - name: Install Android SDK components

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"


          echo "Accepting Android SDK licenses..."


          yes | sdkmanager --licenses > /dev/null || true


          echo "Installing required Android SDK packages..."


          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          echo "Checking installed SDK packages..."


          sdkmanager --list_installed | head -100


          echo "Android SDK installation completed."


      # ==========================================
      # 8. MARK BUILDING
      # ==========================================

      - name: Mark build as building

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail


          curl -sS --fail \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{
              "status":"building",
              "started_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }'


          echo "Build marked as building."


      # ==========================================
      # 9. CREATE ANDROID PROJECT
      # ==========================================

      - name: Generate Android project

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "Generating ASIM TECH Android project..."


          mkdir -p android-project

          mkdir -p android-project/app/src/main/java/com/asimtech/asimtech

          mkdir -p android-project/app/src/main/res/values


          # ========================================
          # SETTINGS.GRADLE
          # ========================================

          cat > android-project/settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositories {

                  google()

                  mavenCentral()

              }

          }


          rootProject.name = "ASIMTECH"

          include(":app")

          EOF


          # ========================================
          # ROOT BUILD.GRADLE
          # ========================================

          cat > android-project/build.gradle <<'EOF'

          plugins {

              id "com.android.application" version "8.6.1" apply false

          }

          EOF


          # ========================================
          # GRADLE PROPERTIES
          # ========================================

          cat > android-project/gradle.properties <<'EOF'

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          org.gradle.jvmargs=-Xmx2048m

          EOF


          # ========================================
          # APP BUILD.GRADLE
          # ========================================

          cat > android-project/app/build.gradle <<'EOF'

          plugins {

              id "com.android.application"

          }


          android {

              namespace "com.asimtech.asimtech"

              compileSdk 35


              defaultConfig {

                  applicationId "com.asimtech.asimtech"

                  minSdk 23

                  targetSdk 35

                  versionCode 2

                  versionName "1.0.1"

              }

          }

          EOF


          # ========================================
          # STRINGS
          # ========================================

          cat > android-project/app/src/main/res/values/strings.xml <<'EOF'

          <resources>

              <string name="app_name">ASIM TECH</string>

          </resources>

          EOF


          # ========================================
          # STYLES
          # ========================================

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>

          EOF


          # ========================================
          # ANDROID MANIFEST
          # ========================================

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <application

                  android:theme="@style/AppTheme"

                  android:label="@string/app_name"

                  android:usesCleartextTraffic="true"

                  android:hardwareAccelerated="true">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>


          </manifest>

          EOF


          # ========================================
          # MAIN ACTIVITY
          # ========================================

          cat > android-project/app/src/main/java/com/asimtech/asimtech/MainActivity.java <<'EOF'

          package com.asimtech.asimtech;


          import android.app.Activity;

          import android.os.Bundle;

          import android.webkit.WebResourceRequest;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;


          public class MainActivity extends Activity {


              @Override

              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  WebView webView = new WebView(this);


                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override

                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              return false;

                          }

                      }
                  );


                  webView.getSettings()
                      .setJavaScriptEnabled(true);


                  webView.getSettings()
                      .setDomStorageEnabled(true);


                  webView.getSettings()
                      .setDatabaseEnabled(true);


                  webView.getSettings()
                      .setSupportZoom(false);


                  webView.getSettings()
                      .setBuiltInZoomControls(false);


                  webView.getSettings()
                      .setDisplayZoomControls(false);


                  webView.loadUrl(
                      "https://asim75772.github.io/asim-tech-platform/"
                  );


                  setContentView(webView);

              }

          }

          EOF


          echo "=========================================="

          echo "ASIM TECH Android project generated."

          echo "APK will open ASIM TECH Platform directly."

          echo "=========================================="


      # ==========================================
      # 10. BUILD APK
      # ==========================================

      - name: Build debug APK

        if: steps.job.outputs.found == 'true'

        working-directory: android-project

        shell: bash

        run: |

          set -euo pipefail


          echo "Creating Gradle wrapper..."


          gradle --no-daemon wrapper \
            --gradle-version 8.10.2


          echo "Building ASIM TECH APK..."


          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug


          echo "=========================================="

          echo "APK BUILD SUCCESSFUL"

          echo "=========================================="


      # ==========================================
      # 11. CHECK APK
      # ==========================================

      - name: Check APK

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail


          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"


          if [ ! -f "$APK" ]; then

              echo "ERROR: APK file not found."

              exit 1

          fi


          echo "APK found successfully."


          ls -lh "$APK"


      # ==========================================
      # 12. UPLOAD APK
      # ==========================================

      - name: Upload APK to Supabase Storage

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail


          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"


          test -f "$APK"


          SIZE=$(stat -c%s "$APK")


          SHA=$(sha256sum "$APK" | awk '{print $1}')


          FILE_NAME="ASIM-TECH-v1.0.1.apk"


          PATHNAME="$APP_ID/$BUILD_ID/$FILE_NAME"


          echo "=========================================="

          echo "Uploading APK..."

          echo "File: $FILE_NAME"

          echo "Path: $PATHNAME"

          echo "=========================================="


          curl -sS --fail \
            -X POST \
            "$SUPABASE_URL/storage/v1/object/android-apks/$PATHNAME" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK"


          echo "APK uploaded successfully."


          curl -sS --fail \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{
              "status":"success",
              "storage_path":"'"$PATHNAME"'",
              "file_name":"'"$FILE_NAME"'",
              "mime_type":"application/vnd.android.package-archive",
              "file_size":'"$SIZE"',
              "sha256":"'"$SHA"'",
              "completed_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }'


          echo "=========================================="

          echo "ASIM TECH APK READY"

          echo "File: $FILE_NAME"

          echo "Size: $SIZE bytes"

          echo "=========================================="


      # ==========================================
      # 13. MARK FAILED
      # ==========================================

      - name: Mark build failed on error

        if: failure() && steps.job.outputs.found == 'true'

        shell: bash

        run: |

          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{
              "status":"failed",
              "build_log":"Android APK build failed. Check GitHub Actions logs.",
              "completed_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }' || true
