name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -L -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q sdk.zip
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -R cmdline-tools/* "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Build
        id: find
        run: |
          API="$SUPABASE_URL/rest/v1"
          DATA=$(curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_builds?status=eq.queued&order=created_at.asc&limit=1")

          if [ "$(echo "$DATA" | jq length)" = "0" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "app_id=$(echo "$DATA" | jq -r '.[0].app_id')" >> "$GITHUB_OUTPUT"
          echo "build_id=$(echo "$DATA" | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"

      - name: Mark Building
        if: steps.find.outputs.found == 'true'
        run: |
          ID="${{ steps.find.outputs.build_id }}"
          curl -fsS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"status":"building"}'

      - name: Get App
        if: steps.find.outputs.found == 'true'
        run: |
          APP="${{ steps.find.outputs.app_id }}"
          API="$SUPABASE_URL/rest/v1"

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.index.html&select=content" \
            > html.json

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.android-settings.json&select=content" \
            > settings.json

      - name: Create Android Project
        if: steps.find.outputs.found == 'true'
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/java/com/asimtech/app

          jq -r '.[0].content // "<html><body><h1>ASIM TECH</h1></body></html>"' html.json > android-app/app/src/main/assets/index.html

          APP_NAME=$(jq -r '.[0].content | fromjson | .appName // "ASIM TECH App"' settings.json 2>/dev/null || echo "ASIM TECH App")
          PACKAGE=$(jq -r '.[0].content | fromjson | .packageName // "com.asimtech.app"' settings.json 2>/dev/null || echo "com.asimtech.app")
          VERSION=$(jq -r '.[0].content | fromjson | .versionName // "1.0"' settings.json 2>/dev/null || echo "1.0")

          mkdir -p "android-app/app/src/main/java/${PACKAGE//./\/}"

          printf '%s\n' \
            'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' \
            'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' \
            'rootProject.name="ASIMTECH"' \
            'include(":app")' \
            > android-app/settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.7.3" apply false' \
            '}' \
            > android-app/build.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '}' \
            'android {' \
            "    namespace \"$PACKAGE\"" \
            '    compileSdk 35' \
            '    defaultConfig {' \
            "        applicationId \"$PACKAGE\"" \
            '        minSdk 23' \
            '        targetSdk 35' \
            '        versionCode 1' \
            "        versionName \"$VERSION\"" \
            '    }' \
            '}' \
            > android-app/app/build.gradle

          printf '%s\n' \
            '<resources>' \
            "  <string name=\"app_name\">$APP_NAME</string>" \
            '</resources>' \
            > android-app/app/src/main/res/values/strings.xml

          printf '%s\n' \
            '<resources>' \
            '  <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/>' \
            '</resources>' \
            > android-app/app/src/main/res/values/styles.xml

          printf '%s\n' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '  <uses-permission android:name="android.permission.INTERNET"/>' \
            '  <application android:theme="@style/AppTheme" android:label="@string/app_name">' \
            '    <activity android:name=".MainActivity" android:exported="true">' \
            '      <intent-filter>' \
            '        <action android:name="android.intent.action.MAIN"/>' \
            '        <category android:name="android.intent.category.LAUNCHER"/>' \
            '      </intent-filter>' \
            '    </activity>' \
            '  </application>' \
            '</manifest>' \
            > android-app/app/src/main/AndroidManifest.xml

          printf '%s\n' \
            "package $PACKAGE;" \
            'import android.app.Activity;' \
            'import android.os.Bundle;' \
            'import android.webkit.WebView;' \
            'import android.webkit.WebSettings;' \
            'public class MainActivity extends Activity {' \
            '  public void onCreate(Bundle b) {' \
            '    super.onCreate(b);' \
            '    WebView w=new WebView(this);' \
            '    WebSettings s=w.getSettings();' \
            '    s.setJavaScriptEnabled(true);' \
            '    s.setDomStorageEnabled(true);' \
            '    w.setWebViewClient(new android.webkit.WebViewClient());' \
            '    w.loadUrl("file:///android_asset/index.html");' \
            '    setContentView(w);' \
            '  }' \
            '}' \
            > "android-app/app/src/main/java/${PACKAGE//./\/}/MainActivity.java"

      - name: Build APK
        id: apk
        if: steps.find.outputs.found == 'true'
        run: |
          cd android-app
          gradle --no-daemon assembleDebug
          cd ..
          mkdir -p output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk output/app.apk

      - name: Upload APK
        id: upload
        if: steps.find.outputs.found == 'true' && steps.apk.outcome == 'success'
        run: |
          APP="${{ steps.find.outputs.app_id }}"
          BUILD="${{ steps.find.outputs.build_id }}"
          PATHNAME="$APP/$BUILD.apk"

          curl -fsS -X POST \
            "$SUPABASE_URL/storage/v1/object/android-apks/$PATHNAME" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@output/app.apk"

          URL="$SUPABASE_URL/storage/v1/object/public/android-apks/$PATHNAME"

          curl -fsS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"status\":\"success\",\"apk_url\":\"$URL\"}"

      - name: Mark Failed
        if: |
          always() &&
          steps.find.outputs.found == 'true' &&
          (steps.apk.outcome == 'failure' || steps.upload.outcome == 'failure')
        run: |
          ID="${{ steps.find.outputs.build_id }}"
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"status":"failed"}' || true
          exit 1
