name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      app_id:
        description: App ID
        required: false
        type: string

      build_id:
        description: Build ID
        required: false
        type: string

  schedule:
    - cron: "*/5 * * * *"


permissions:
  contents: read


concurrency:
  group: asim-tech-android-build
  cancel-in-progress: false


jobs:

  build:

    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: "https://lgwaeqgiqrsjprsecwxx.supabase.co"
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}


    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # GRADLE
      # ==================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-disabled: true


      # ==================================================
      # ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          curl -fsSL \
            -o commandlinetools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          unzip -q \
            commandlinetools.zip \
            -d "$SDK/cmdline-tools/latest"

          if [ -d "$SDK/cmdline-tools/latest/cmdline-tools" ]; then

            cp -R \
              "$SDK/cmdline-tools/latest/cmdline-tools/." \
              "$SDK/cmdline-tools/latest/"

            rm -rf \
              "$SDK/cmdline-tools/latest/cmdline-tools"

          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==================================================
      # FIND QUEUED BUILD
      # ==================================================

      - name: Find queued build
        id: find
        shell: bash
        run: |
          set -e

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          fi

          API="$SUPABASE_URL/rest/v1"

          INPUT_APP="${{ inputs.app_id }}"
          INPUT_BUILD="${{ inputs.build_id }}"

          if [ -n "$INPUT_BUILD" ]; then

            QUERY="$API/app_builds?id=eq.$INPUT_BUILD&select=*"

          elif [ -n "$INPUT_APP" ]; then

            QUERY="$API/app_builds?app_id=eq.$INPUT_APP&status=eq.queued&order=created_at.asc&limit=1"

          else

            QUERY="$API/app_builds?status=eq.queued&order=created_at.asc&limit=1"

          fi

          echo "Checking for queued build..."

          DATA="$(curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$QUERY")"

          COUNT="$(echo "$DATA" | jq 'length')"

          if [ "$COUNT" = "0" ]; then

            echo "No queued build found."

            echo "found=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          APP_ID_VALUE="$(echo "$DATA" | jq -r '.[0].app_id')"

          BUILD_ID_VALUE="$(echo "$DATA" | jq -r '.[0].id')"

          echo "Build found."

          echo "App ID: $APP_ID_VALUE"

          echo "Build ID: $BUILD_ID_VALUE"

          echo "found=true" >> "$GITHUB_OUTPUT"

          echo "app_id=$APP_ID_VALUE" >> "$GITHUB_OUTPUT"

          echo "build_id=$BUILD_ID_VALUE" >> "$GITHUB_OUTPUT"


      # ==================================================
      # MARK BUILDING
      # ==================================================

      - name: Mark build as building
        id: mark_building
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          ID="${{ steps.find.outputs.build_id }}"

          curl -fsS \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"status":"building"}'

          echo "Build status changed to BUILDING."


      # ==================================================
      # READ APPLICATION DATA
      # ==================================================

      - name: Read application data
        id: read
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          APP="${{ steps.find.outputs.app_id }}"

          API="$SUPABASE_URL/rest/v1"

          echo "Reading application settings..."

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.android-settings.json&select=content" \
            > settings.json

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.index.html&select=content" \
            > html.json

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.webapp-url.txt&select=content" \
            > url.json

          SETTINGS_CONTENT="$(jq -r '.[0].content // "{}"' settings.json)"

          echo "$SETTINGS_CONTENT" > settings-content.json

          APP_NAME_VALUE="$(jq -r '.appName // "ASIM TECH App"' settings-content.json)"

          PACKAGE_VALUE="$(jq -r '.packageName // "com.asimtech.generatedapp"' settings-content.json)"

          VERSION_NAME_VALUE="$(jq -r '.versionName // "1.0.0"' settings-content.json)"

          VERSION_CODE_VALUE="$(jq -r '.versionCode // 1' settings-content.json)"

          echo "APP_NAME=$APP_NAME_VALUE" >> "$GITHUB_ENV"

          echo "PACKAGE_NAME=$PACKAGE_VALUE" >> "$GITHUB_ENV"

          echo "VERSION_NAME=$VERSION_NAME_VALUE" >> "$GITHUB_ENV"

          echo "VERSION_CODE=$VERSION_CODE_VALUE" >> "$GITHUB_ENV"

          echo "App Name: $APP_NAME_VALUE"

          echo "Package: $PACKAGE_VALUE"

          echo "Version: $VERSION_NAME_VALUE"


      # ==================================================
      # PREPARE WEB APP
      # ==================================================

      - name: Prepare Web App
        id: prepare
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          APP="${{ steps.find.outputs.app_id }}"

          mkdir -p android-app/app/src/main/assets

          HTML_CONTENT="$(jq -r '.[0].content // empty' html.json)"

          URL_CONTENT="$(jq -r '.[0].content // empty' url.json)"


          # ------------------------------------------------
          # SPECIAL ASIM TECH PLATFORM APP
          # ------------------------------------------------

          if [ "$APP" = "6b305668-ffb5-4e2d-94ff-0bda17978ac2" ]; then

            printf '%s' '' \
              | base64 -d \
              > android-app/app/src/main/assets/index.html

            echo "Special ASIM TECH platform app prepared."

          elif [ -n "$HTML_CONTENT" ]; then

            printf '%s' "$HTML_CONTENT" \
              > android-app/app/src/main/assets/index.html

            echo "HTML source prepared."

          elif [ -n "$URL_CONTENT" ]; then

            URL_CONTENT="$URL_CONTENT" \
            python3 -c 'import os; from pathlib import Path; u=os.environ["URL_CONTENT"]; p=Path("android-app/app/src/main/assets/index.html"); p.write_text("<!doctype html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style>\n</head>\n<body>\n<iframe src=\"" + u.replace("&","&amp;").replace("\"","&quot;") + "\" style=\"width:100%;height:100%;border:0\"></iframe>\n</body>\n</html>\n", encoding="utf-8")'

            echo "URL source prepared."

          else

            APP_NAME="$APP_NAME" \
            python3 -c 'import os; from pathlib import Path; n=os.environ.get("APP_NAME","ASIM TECH App"); Path("android-app/app/src/main/assets/index.html").write_text("<!doctype html>\n<html>\n<head><meta charset=\"UTF-8\"></head>\n<body style=\"font-family:Arial;text-align:center;padding:40px\"><h1>"+n+"</h1><p>No Web App source saved.</p></body>\n</html>\n",encoding="utf-8")'

            echo "No source found. Placeholder page prepared."

          fi


      # ==================================================
      # CREATE ANDROID PROJECT
      # ==================================================

      - name: Create Android project
        id: project
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          PKG="$PACKAGE_NAME"

          PKG_PATH="${PKG//./\/}"

          mkdir -p \
            "android-app/app/src/main/java/$PKG_PATH"

          mkdir -p \
            android-app/app/src/main/res/values


          # ------------------------------------------------
          # SETTINGS.GRADLE
          # ------------------------------------------------

          printf '%s' '' \
            | base64 -d \
            > android-app/settings.gradle


          # ------------------------------------------------
          # ROOT BUILD.GRADLE
          # ------------------------------------------------

          printf '%s' 'cGx1Z2lucyB7CiAgICBpZCAiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iIHZlcnNpb24gIjguNy4zIiBhcHBseSBmYWxzZQp9Cg==' \
            | base64 -d \
            > android-app/build.gradle


          # ------------------------------------------------
          # APP BUILD.GRADLE
          # ------------------------------------------------

          PKG="$PKG" \
          VERSION_CODE="$VERSION_CODE" \
          VERSION_NAME="$VERSION_NAME" \
          python3 -c 'import os; from pathlib import Path; p=Path("android-app/app/build.gradle"); p.write_text("""plugins {
    id "com.android.application"
}

android {
    namespace "%s"
    compileSdk 35

    defaultConfig {
        applicationId "%s"
        minSdk 23
        targetSdk 35
        versionCode %s
        versionName "%s"
    }
}
""" % (os.environ["PKG"],os.environ["PKG"],os.environ["VERSION_CODE"],os.environ["VERSION_NAME"]),encoding="utf-8")'


          # ------------------------------------------------
          # STRINGS.XML
          # ------------------------------------------------

          APP_NAME="$APP_NAME" \
          python3 -c 'import os,html; from pathlib import Path; n=html.escape(os.environ.get("APP_NAME","ASIM TECH App")); Path("android-app/app/src/main/res/values/strings.xml").write_text("<resources>\n    <string name=\"app_name\">"+n+"</string>\n</resources>\n",encoding="utf-8")'


          # ------------------------------------------------
          # STYLES.XML
          # ------------------------------------------------

          printf '%s' '' \
            | base64 -d \
            > android-app/app/src/main/res/values/styles.xml


          # ------------------------------------------------
          # ANDROID MANIFEST
          # ------------------------------------------------

          printf '%s' ' bWFuaWZlc3Q+Cg==' \
            | tr -d ' ' \
            | base64 -d \
            > android-app/app/src/main/AndroidManifest.xml


          # ------------------------------------------------
          # MAIN ACTIVITY
          # ------------------------------------------------

          printf '%s' '' \
            | base64 -d \
            | sed "s/__PKG__/$PKG/g" \
            > "android-app/app/src/main/java/$PKG_PATH/MainActivity.java"

          echo "Android project created."


      # ==================================================
      # BUILD APK
      # ==================================================

      - name: Build APK
        id: build
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e

          cd android-app

          echo "Starting Gradle build..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

          cd ..

          mkdir -p output

          cp \
            android-app/app/build/outputs/apk/debug/app-debug.apk \
            output/app-release.apk

          echo "APK build completed."


      # ==================================================
      # UPLOAD APK TO SUPABASE STORAGE
      # ==================================================

      - name: Upload APK
        id: upload
        if: steps.find.outputs.found == 'true' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -e

          APP_ID="${{ steps.find.outputs.app_id }}"

          BUILD_ID="${{ steps.find.outputs.build_id }}"

          APK_PATH="output/app-release.apk"

          STORAGE_PATH="$APP_ID/$BUILD_ID.apk"

          echo "Uploading APK..."

          curl -fsS \
            -X POST \
            "$SUPABASE_URL/storage/v1/object/android-apks/$STORAGE_PATH" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK_PATH"

          APK_URL="$SUPABASE_URL/storage/v1/object/public/android-apks/$STORAGE_PATH"

          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

          echo "APK uploaded successfully."

          echo "APK URL: $APK_URL"


      # ==================================================
      # MARK BUILD SUCCESS
      # ==================================================

      - name: Mark build success
        id: success
        if: steps.find.outputs.found == 'true' && steps.build.outcome == 'success' && steps.upload.outcome == 'success'
        shell: bash
        run: |
          set -e

          ID="${{ steps.find.outputs.build_id }}"

          curl -fsS \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"status\":\"success\",\"apk_url\":\"$APK_URL\"}"

          echo "BUILD SUCCESS."

          echo "APK: $APK_URL"


      # ==================================================
      # UPLOAD GITHUB ARTIFACT
      # ==================================================

      - name: Upload APK artifact
        if: steps.find.outputs.found == 'true' && steps.build.outcome == 'success' && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/app-release.apk
          if-no-files-found: error


      # ==================================================
      # MARK BUILD FAILED
      # ==================================================

      - name: Mark build failed
        if: |
          always() &&
          steps.find.outputs.found == 'true' &&
          (
            steps.mark_building.outcome == 'failure' ||
            steps.read.outcome == 'failure' ||
            steps.prepare.outcome == 'failure' ||
            steps.project.outcome == 'failure' ||
            steps.build.outcome == 'failure' ||
            steps.upload.outcome == 'failure'
          )
        shell: bash
        run: |
          ID="${{ steps.find.outputs.build_id }}"

          echo "Build failed."

          curl -sS \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"status":"failed"}' \
            || true

          exit 1
