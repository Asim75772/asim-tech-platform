
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Supabase App ID"
        required: true
        type: string
      build_id:
        description: "Supabase Build ID"
        required: true
        type: string

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Java
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # 3. Gradle
      # ------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true


      # ------------------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          unzip -q commandlinetools.zip \
            -d "$ANDROID_HOME/cmdline-tools/latest"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* \
               "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ------------------------------------------------------------
      # 5. Get build information
      # ------------------------------------------------------------
      - name: Get build information
        shell: bash
        run: |
          set -e

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          fi

          APP_ID="${{ inputs.app_id }}"
          BUILD_ID="${{ inputs.build_id }}"

          if [ -z "$APP_ID" ] || [ -z "$BUILD_ID" ]; then

            echo "No manual build inputs."

            RESPONSE=$(curl -sS \
              "$SUPABASE_URL/rest/v1/app_builds?status=eq.queued&order=created_at.asc&limit=1" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")

            APP_ID=$(echo "$RESPONSE" | python3 -c \
              'import sys,json; d=json.load(sys.stdin); print(d[0]["app_id"] if d else "")')

            BUILD_ID=$(echo "$RESPONSE" | python3 -c \
              'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")')

          fi

          if [ -z "$APP_ID" ] || [ -z "$BUILD_ID" ]; then
            echo "No queued build found."
            exit 0
          fi

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          echo "APP_ID = $APP_ID"
          echo "BUILD_ID = $BUILD_ID"


      # ------------------------------------------------------------
      # 6. Mark build as building
      # ------------------------------------------------------------
      - name: Mark build as building
        shell: bash
        run: |
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"building"}'


      # ------------------------------------------------------------
      # 7. Read App Settings
      # ------------------------------------------------------------
      - name: Read app settings
        shell: bash
        run: |
          set -e

          curl -sS \
            "$SUPABASE_URL/rest/v1/app_files?app_id=eq.$APP_ID&file_path=eq.android-settings.json&select=content" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o settings-response.json

          python3 <<'PY'
          import json

          try:
              data = json.load(open("settings-response.json"))
          except:
              data = []

          settings = {}

          if data:
              content = data[0].get("content", "")
              try:
                  settings = json.loads(content)
              except:
                  settings = {}

          app_name = settings.get("appName", "ASIM TECH App")
          package_name = settings.get("packageName", "com.asimtech.app")
          version_name = settings.get("versionName", "1.0.0")
          version_code = int(settings.get("versionCode", 1))

          print("App Name:", app_name)
          print("Package:", package_name)
          print("Version:", version_name)

          with open("app-settings.json", "w") as f:
              json.dump({
                  "appName": app_name,
                  "packageName": package_name,
                  "versionName": version_name,
                  "versionCode": version_code
              }, f)
          PY


      # ------------------------------------------------------------
      # 8. Download Web App Source
      # ------------------------------------------------------------
      - name: Download Web App Source
        shell: bash
        run: |
          set -e

          echo "Checking saved Web App source..."

          curl -sS \
            "$SUPABASE_URL/rest/v1/app_files?app_id=eq.$APP_ID&file_path=eq.index.html&select=content" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o index-response.json

          python3 <<'PY'
          import json

          try:
              data = json.load(open("index-response.json"))
          except:
              data = []

          html = ""

          if data:
              html = data[0].get("content", "") or ""

          if html.strip():
              open("webapp-index.html", "w", encoding="utf-8").write(html)
              print("HTML source found.")
          else:
              print("No index.html source found.")
          PY


      # ------------------------------------------------------------
      # 9. Download URL source if HTML does not exist
      # ------------------------------------------------------------
      - name: Download Web App URL
        shell: bash
        run: |
          set -e

          if [ -s webapp-index.html ]; then
            echo "HTML source will be used."
            exit 0
          fi

          curl -sS \
            "$SUPABASE_URL/rest/v1/app_files?app_id=eq.$APP_ID&file_path=eq.webapp-url.txt&select=content" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o url-response.json

          python3 <<'PY'
          import json

          try:
              data = json.load(open("url-response.json"))
          except:
              data = []

          url = ""

          if data:
              url = data[0].get("content", "") or ""

          open("webapp-url.txt", "w", encoding="utf-8").write(url.strip())

          if url.strip():
              print("URL source found:", url.strip())
          else:
              print("No URL source found.")
          PY


      # ------------------------------------------------------------
      # 10. Create Android project
      # ------------------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android-app/app/src/main/java
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi


      # ------------------------------------------------------------
      # 11. Generate Gradle files
      # ------------------------------------------------------------
      - name: Generate Gradle files
        shell: bash
        run: |
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ASIMTECH"
          include(":app")
          EOF


          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


      # ------------------------------------------------------------
      # 12. Generate Android app
      # ------------------------------------------------------------
      - name: Generate Android application
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import os
          import re

          settings=json.load(open("app-settings.json"))

          app_name=settings["appName"]
          package=settings["packageName"]
          version_name=settings["versionName"]
          version_code=settings["versionCode"]

          package_path=package.replace(".", "/")

          os.makedirs(
              f"android-app/app/src/main/java/{package_path}",
              exist_ok=True
          )

          # ------------------------------------------------------
          # Web source
          # ------------------------------------------------------

          if os.path.exists("webapp-index.html") and os.path.getsize("webapp-index.html") > 0:

              html=open(
                  "webapp-index.html",
                  encoding="utf-8"
              ).read()

              print("Using saved HTML application.")

          elif os.path.exists("webapp-url.txt"):

              url=open(
                  "webapp-url.txt",
                  encoding="utf-8"
              ).read().strip()

              if url:

                  html=f'''<!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          html,body,iframe {{
              margin:0;
              padding:0;
              width:100%;
              height:100%;
              border:0;
              overflow:hidden;
          }}
          </style>
          </head>
          <body>
          <iframe src="{url}"></iframe>
          </body>
          </html>'''

                  print("Using Web App URL.")

              else:
                  html="<html><body><h2>ASIM TECH</h2></body></html>"

          else:

              # Main ASIM TECH platform
              if package == "com.asimtech.asimtech":

                  html='''<!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          html,body,iframe {
              margin:0;
              padding:0;
              width:100%;
              height:100%;
              border:0;
              overflow:hidden;
          }
          </style>
          </head>
          <body>
          <iframe
            src="https://asim75772.github.io/asim-tech-platform/"
            allow="fullscreen">
          </iframe>
          </body>
          </html>'''

                  print("Using ASIM TECH Platform.")

              else:

                  html=f'''<!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          </head>
          <body>
          <h2>{app_name}</h2>
          <p>Welcome to {app_name}</p>
          </body>
          </html>'''

                  print("Using fallback HTML.")


          open(
              "android-app/app/src/main/assets/index.html",
              "w",
              encoding="utf-8"
          ).write(html)


          # ------------------------------------------------------
          # AndroidManifest
          # ------------------------------------------------------

          manifest=f'''<manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:label="{app_name}">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>'''

          os.makedirs(
              "android-app/app/src/main/res/values",
              exist_ok=True
          )

          open(
              "android-app/app/src/main/AndroidManifest.xml",
              "w"
          ).write(manifest)


          # ------------------------------------------------------
          # Styles
          # ------------------------------------------------------

          style='''<resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>

              </style>

          </resources>'''

          open(
              "android-app/app/src/main/res/values/styles.xml",
              "w"
          ).write(style)


          # ------------------------------------------------------
          # MainActivity
          # ------------------------------------------------------

          activity=f'''package {package};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {{

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setSupportZoom(false);

                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }}

              @Override
              public void onBackPressed() {{

                  if (webView.canGoBack()) {{
                      webView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}

              }}

          }}
          '''

          open(
              f"android-app/app/src/main/java/{package_path}/MainActivity.java",
              "w"
          ).write(activity)


          # ------------------------------------------------------
          # app/build.gradle
          # ------------------------------------------------------

          gradle=f'''plugins {{
              id 'com.android.application'
          }}

          android {{
              namespace '{package}'
              compileSdk 35

              defaultConfig {{
                  applicationId '{package}'
                  minSdk 23
                  targetSdk 35
                  versionCode {version_code}
                  versionName '{version_name}'
              }}

              buildTypes {{
                  debug {{
                      minifyEnabled false
                  }}

                  release {{
                      minifyEnabled false
                  }}
              }}
          }}
          '''

          open(
              "android-app/app/build.gradle",
              "w"
          ).write(gradle)

          PY


      # ------------------------------------------------------------
      # 13. Build APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd android-app

          gradle --no-daemon --stacktrace assembleDebug

          cd ..

          ls -lh \
            android-app/app/build/outputs/apk/debug/


      # ------------------------------------------------------------
      # 14. Prepare APK
      # ------------------------------------------------------------
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APP_NAME=$(python3 -c \
            'import json; print(json.load(open("app-settings.json"))["appName"])')

          VERSION=$(python3 -c \
            'import json; print(json.load(open("app-settings.json"))["versionName"])')

          SAFE_NAME=$(echo "$APP_NAME" | \
            sed 's/[^A-Za-z0-9._-]/-/g')

          FILE_NAME="${SAFE_NAME}-v${VERSION}.apk"

          cp \
            android-app/app/build/outputs/apk/debug/app-debug.apk \
            "$FILE_NAME"

          echo "APK_FILE=$FILE_NAME" >> "$GITHUB_ENV"

          echo "APK_FILE=$FILE_NAME"


      # ------------------------------------------------------------
      # 15. Calculate SHA256
      # ------------------------------------------------------------
      - name: Calculate SHA256
        shell: bash
        run: |
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')

          FILE_SIZE=$(stat -c%s "$APK_FILE")

          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"

          echo "SHA256=$SHA256"
          echo "SIZE=$FILE_SIZE"


      # ------------------------------------------------------------
      # 16. Upload APK to Supabase Storage
      # ------------------------------------------------------------
      - name: Upload APK to Supabase
        shell: bash
        run: |
          set -e

          STORAGE_PATH="android-apks/$APP_ID/$BUILD_ID/$APK_FILE"

          echo "Uploading:"
          echo "$STORAGE_PATH"

          curl -sS --fail-with-body \
            -X POST \
            "$SUPABASE_URL/storage/v1/object/$STORAGE_PATH" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK_FILE"

          echo "STORAGE_PATH=$STORAGE_PATH" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 17. Update build record
      # ------------------------------------------------------------
      - name: Mark build successful
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import os

          data={
              "status":"success",
              "storage_path":os.environ["STORAGE_PATH"],
              "file_name":os.environ["APK_FILE"],
              "file_size":int(os.environ["APK_SIZE"]),
              "sha256":os.environ["APK_SHA256"],
              "completed_at":"now()"
          }

          # completed_at cannot safely use now() through JSON.
          data.pop("completed_at")

          open("build-success.json","w").write(
              json.dumps(data)
          )
          PY

          curl -sS --fail-with-body \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d @build-success.json

          echo "Build marked SUCCESS."


      # ------------------------------------------------------------
      # 18. Upload APK as GitHub artifact too
      # ------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASIM-TECH-APK
          path: "*.apk"
          if-no-files-found: error
