name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: App ID
        required: false
        type: string
      build_id:
        description: Build ID
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://lgwaeqgiqrsjprsecwxx.supabase.co"
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          cache-disabled: true

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -fsSL -o tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          rm -rf "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/cmdline-tools/latest"
          unzip -q tools.zip -d "$SDK/cmdline-tools/latest"
          if [ -d "$SDK/cmdline-tools/latest/cmdline-tools" ]; then
            cp -R "$SDK/cmdline-tools/latest/cmdline-tools/." "$SDK/cmdline-tools/latest/"
            rm -rf "$SDK/cmdline-tools/latest/cmdline-tools"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find build
        id: find
        shell: bash
        run: |
          set -e
          if [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          fi

          API="$SUPABASE_URL/rest/v1"
          INPUT_APP="${{ inputs.app_id }}"
          INPUT_BUILD="${{ inputs.build_id }}"

          if [ -n "$INPUT_BUILD" ]; then
            QUERY="$API/app_builds?id=eq.$INPUT_BUILD&select=*"
          elif [ -n "$INPUT_APP" ]; then
            QUERY="$API/app_builds?app_id=eq.$INPUT_APP&status=eq.queued&order=created_at.asc&limit=1"
          else
            QUERY="$API/app_builds?status=eq.queued&order=created_at.asc&limit=1"
          fi

          DATA="$(curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$QUERY")"

          if [ "$(echo "$DATA" | jq 'length')" = "0" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "app_id=$(echo "$DATA" | jq -r '.[0].app_id')" >> "$GITHUB_OUTPUT"
          echo "build_id=$(echo "$DATA" | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"

      - name: Mark building
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          ID="${{ steps.find.outputs.build_id }}"
          curl -fsS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"status":"building"}'

      - name: Read app data
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          APP="${{ steps.find.outputs.app_id }}"
          API="$SUPABASE_URL/rest/v1"

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.android-settings.json&select=content" \
            > settings.json

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.index.html&select=content" \
            > html.json

          curl -fsS \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$API/app_files?app_id=eq.$APP&file_path=eq.webapp-url.txt&select=content" \
            > url.json

          jq -r '.[0].content // "{}"' settings.json > settings-content.json

          echo "APP_NAME=$(jq -r '.appName // "ASIM TECH App"' settings-content.json)" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$(jq -r '.packageName // "com.asimtech.generatedapp"' settings-content.json)" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(jq -r '.versionName // "1.0.0"' settings-content.json)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(jq -r '.versionCode // 1' settings-content.json)" >> "$GITHUB_ENV"

      - name: Prepare web app
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          APP="${{ steps.find.outputs.app_id }}"
          mkdir -p android-app/app/src/main/assets

          if [ "$APP" = "6b305668-ffb5-4e2d-94ff-0bda17978ac2" ]; then
            cat > android-app/app/src/main/assets/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style>
          </head>
          <body>
            <iframe src="https://asim75772.github.io/asim-tech-platform/"></iframe>
          </body>
          </html>
          HTML
            exit 0
          fi

          HTML_CONTENT="$(jq -r '.[0].content // empty' html.json)"
          URL_CONTENT="$(jq -r '.[0].content // empty' url.json)"

          if [ -n "$HTML_CONTENT" ]; then
            printf '%s' "$HTML_CONTENT" > android-app/app/src/main/assets/index.html
          elif [ -n "$URL_CONTENT" ]; then
            cat > android-app/app/src/main/assets/index.html <<HTML
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style>
          </head>
          <body>
            <iframe src="$URL_CONTENT" style="width:100%;height:100%;border:0"></iframe>
          </body>
          </html>
          HTML
          else
            cat > android-app/app/src/main/assets/index.html <<HTML
          <!doctype html>
          <html>
          <head><meta charset="UTF-8"></head>
          <body style="font-family:Arial;text-align:center;padding:40px">
            <h1>$APP_NAME</h1>
            <p>No Web App source saved.</p>
          </body>
          </html>
          HTML
          fi

      - name: Create Android project
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          PKG="$PACKAGE_NAME"
          PKG_PATH="${PKG//./\/}"

          mkdir -p "android-app/app/src/main/java/$PKG_PATH"
          mkdir -p android-app/app/src/main/res/values

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = "ASIMTECH"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
            id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > android-app/app/build.gradle <<EOF
          plugins {
            id "com.android.application"
          }

          android {
            namespace "$PKG"
            compileSdk 35

            defaultConfig {
              applicationId "$PKG"
              minSdk 23
              targetSdk 35
              versionCode $VERSION_CODE
              versionName "$VERSION_NAME"
            }
          }
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<EOF
          <resources>
            <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:colorAccent">#1565C0</item>
            </style>
          </resources>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
              android:allowBackup="true"
              android:label="@string/app_name"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "android-app/app/src/main/java/$PKG_PATH/MainActivity.java" <<JAVA
          package $PKG;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              webView = new WebView(this);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setAllowContentAccess(true);

              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("file:///android_asset/index.html");
              setContentView(webView);
            }

            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          JAVA

      - name: Build APK
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          cd android-app
          gradle --no-daemon --stacktrace assembleDebug
          cd ..
          mkdir -p output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk output/app-release.apk

      - name: Upload APK
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          APP="${{ steps.find.outputs.app_id }}"
          ID="${{ steps.find.outputs.build_id }}"
          FILE="ASIM-TECH-$ID.apk"
          STORAGE="$APP/$ID/$FILE"

          cp output/app-release.apk "output/$FILE"

          curl -fsS -X POST \
            "$SUPABASE_URL/storage/v1/object/android-apks/$STORAGE" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@output/$FILE"

          echo "FILE_NAME=$FILE" >> "$GITHUB_ENV"
          echo "STORAGE_PATH=$STORAGE" >> "$GITHUB_ENV"

      - name: Mark success
        if: success() && steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -e
          ID="${{ steps.find.outputs.build_id }}"
          SIZE="$(stat -c%s "output/$FILE_NAME")"
          SHA="$(sha256sum "output/$FILE_NAME" | awk '{print $1}')"
          NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          curl -fsS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"status\":\"success\",\"storage_path\":\"$STORAGE_PATH\",\"file_name\":\"$FILE_NAME\",\"file_size\":$SIZE,\"sha256\":\"$SHA\",\"completed_at\":\"$NOW\"}"

      - name: Upload artifact
        if: success() && steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ASIM-TECH-APK
          path: output/*.apk
          if-no-files-found: error

      - name: Mark failed
        if: failure() && steps.find.outputs.found == 'true'
        shell: bash
        run: |
          ID="${{ steps.find.outputs.build_id }}"
          curl -sS -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$ID" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"status":"failed"}' || true
