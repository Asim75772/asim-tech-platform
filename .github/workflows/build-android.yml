name: Build Android APK

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      app_id:
        description: "ASIM TECH app UUID"
        required: true
        type: string

      build_id:
        description: "ASIM TECH build UUID"
        required: true
        type: string


jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    env:

      SUPABASE_URL: https://lgwaeqgiqrsjprsecwxx.supabase.co

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}


    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. FIND BUILD
      # ==========================================

      - name: Find queued build
        id: job
        shell: bash

        run: |

          set -euo pipefail

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: SUPABASE_SERVICE_ROLE_KEY is missing."
            exit 1
          fi

          INPUT_BUILD_ID="${{ inputs.build_id }}"
          INPUT_APP_ID="${{ inputs.app_id }}"

          if [ -n "$INPUT_BUILD_ID" ]; then

            echo "Manual workflow selected."

            JOB=$(curl -sS --fail \
              "$SUPABASE_URL/rest/v1/app_builds?id=eq.$INPUT_BUILD_ID&select=id,app_id,status" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")

          else

            echo "Searching queued builds."

            JOB=$(curl -sS --fail \
              "$SUPABASE_URL/rest/v1/app_builds?status=eq.queued&order=created_at.asc&limit=1&select=id,app_id,status" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")

          fi


          BUILD_ID=$(python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d[0]['id'] if d else '')
          " <<< "$JOB")


          APP_ID=$(python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d[0]['app_id'] if d else '')
          " <<< "$JOB")


          if [ -z "$BUILD_ID" ]; then

            echo "found=false" >> "$GITHUB_OUTPUT"

            echo "No build found."

            exit 0

          fi


          if [ -n "$INPUT_APP_ID" ] && [ "$APP_ID" != "$INPUT_APP_ID" ]; then

            echo "ERROR: App UUID does not match Build UUID."

            exit 1

          fi


          echo "found=true" >> "$GITHUB_OUTPUT"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"


          echo "=========================================="

          echo "BUILD ID: $BUILD_ID"

          echo "APP ID:   $APP_ID"

          echo "=========================================="


      # ==========================================
      # 3. STOP IF NO BUILD
      # ==========================================

      - name: Stop when queue is empty

        if: steps.job.outputs.found != 'true'

        run: echo "No Android builds are waiting."


      # ==========================================
      # 4. JAVA
      # ==========================================

      - name: Set up Java

        if: steps.job.outputs.found == 'true'

        uses: actions/setup-java@v4

        with:

          distribution: "temurin"

          java-version: "17"


      # ==========================================
      # 5. GRADLE
      # ==========================================

      - name: Set up Gradle

        if: steps.job.outputs.found == 'true'

        uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: "8.10.2"

          cache-disabled: true


      # ==========================================
      # 6. ANDROID SDK
      # ==========================================

      - name: Prepare Android SDK

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
          fi

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null | head -1 || true)

          if [ -z "$SDKMANAGER" ]; then

            echo "ERROR: sdkmanager was not found."

            ls -la "$ANDROID_HOME" || true

            exit 1

          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # ==========================================
      # 7. MARK BUILDING
      # ==========================================

      - name: Mark build as building

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail

          curl -sS --fail \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{
              "status":"building",
              "started_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }'


      # ==========================================
      # 8. GENERATE ANDROID PROJECT
      # ==========================================

      - name: Generate Android project

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p android-project

          mkdir -p android-project/app/src/main/res/values


          # ----------------------------------------
          # GET APP SETTINGS
          # ----------------------------------------

          curl -sS --fail \
            "$SUPABASE_URL/rest/v1/app_files?app_id=eq.$APP_ID&file_path=eq.android-settings.json&select=content" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            > settings-response.json


          python3 <<'PY'

          import json

          data = json.load(open("settings-response.json"))

          if not data:
              settings = {}
          else:
              settings = json.loads(data[0].get("content") or "{}")

          app_name = settings.get("appName") or "ASIM TECH"
          package_name = settings.get("packageName") or "com.asimtech.myapp"
          version_name = settings.get("versionName") or "1.0.0"
          version_code = int(settings.get("versionCode") or 1)

          # Main ASIM TECH application
          if "${{ env.APP_ID }}" == "6b305668-ffb5-4e2d-94ff-0bda17978ac2":
              app_name = "ASIM TECH"
              package_name = "com.asimtech.asimtech"
              version_name = "1.0.1"
              version_code = 2

          import re

          if not re.match(
              r"^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$",
              package_name
          ):
              package_name = "com.asimtech.myapp"

          open("build-info.json","w").write(json.dumps({
              "appName": app_name,
              "packageName": package_name,
              "versionName": version_name,
              "versionCode": version_code
          }))

          print("App:", app_name)
          print("Package:", package_name)
          print("Version:", version_name)
          print("Version Code:", version_code)

          PY


          # ========================================
          # GET BUILDER PAGES
          # ========================================

          curl -sS --fail \
            "$SUPABASE_URL/rest/v1/android_app_pages?app_id=eq.$APP_ID&select=*&order=created_at.asc" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            > pages.json


          # ========================================
          # GENERATE CUSTOM HTML
          # ========================================

          python3 <<'PY'

          import json
          import urllib.request
          import html
          import os

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          KEY = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          APP_ID = os.environ["APP_ID"]

          info = json.load(open("build-info.json"))

          pages = json.load(open("pages.json"))

          def get_file(path):

              url = (
                  SUPABASE_URL
                  + "/rest/v1/app_files?app_id=eq."
                  + APP_ID
                  + "&file_path=eq."
                  + urllib.parse.quote(path)
                  + "&select=content"
              )

              req = urllib.request.Request(
                  url,
                  headers={"apikey":KEY}
              )

              try:

                  with urllib.request.urlopen(req) as r:
                      data=json.loads(r.read().decode())

                  if data:
                      return json.loads(data[0].get("content") or "[]")

              except Exception:
                  pass

              return []


          # ========================================
          # MAIN ASIM TECH PLATFORM
          # ========================================

          MAIN_APP = "6b305668-ffb5-4e2d-94ff-0bda17978ac2"

          if APP_ID == MAIN_APP:

              body = """
              <!doctype html>
              <html>
              <head>
              <meta charset="utf-8">
              <meta name="viewport"
                    content="width=device-width,initial-scale=1">
              <style>
              html,body{
                margin:0;
                padding:0;
                width:100%;
                height:100%;
              }
              iframe{
                width:100%;
                height:100%;
                border:0;
              }
              </style>
              </head>
              <body>
              <iframe
                src="https://asim75772.github.io/asim-tech-platform/"
                allow="clipboard-read; clipboard-write">
              </iframe>
              </body>
              </html>
              """

          else:

              # ====================================
              # BUILDER APP
              # ====================================

              nav = ""
              sections = ""

              for i,page in enumerate(pages):

                  page_id = page.get("id")

                  page_name = (
                      page.get("name")
                      or page.get("title")
                      or f"Page {i+1}"
                  )

                  file_path = f"builder-{page_id}.json"

                  elements = get_file(file_path)

                  safe_id = "page" + str(i)

                  nav += (
                      f'<button onclick="showPage(\'{safe_id}\')">'
                      f'{html.escape(str(page_name))}'
                      f'</button>'
                  )

                  content = ""

                  for el in elements:

                      typ = el.get("type","text")

                      text = html.escape(
                          str(el.get("text") or "")
                      )

                      href = html.escape(
                          str(el.get("href") or "#"),
                          quote=True
                      )

                      image = html.escape(
                          str(el.get("image") or ""),
                          quote=True
                      )

                      placeholder = html.escape(
                          str(el.get("placeholder") or ""),
                          quote=True
                      )

                      size = el.get("fontSize") or 16

                      padding = el.get("padding") or 10

                      style = (
                          f"font-size:{size}px;"
                          f"padding:{padding}px;"
                      )

                      if typ == "heading":

                          content += (
                              f'<h1 style="{style}">{text}</h1>'
                          )

                      elif typ == "text":

                          content += (
                              f'<p style="{style}">{text}</p>'
                          )

                      elif typ == "button":

                          content += (
                              f'<a class="button" '
                              f'href="{href}">{text}</a>'
                          )

                      elif typ == "link":

                          content += (
                              f'<p style="{style}">'
                              f'<a href="{href}">{text}</a>'
                              f'</p>'
                          )

                      elif typ == "input":

                          content += (
                              f'<input '
                              f'placeholder="{placeholder}" '
                              f'style="{style}">'
                          )

                      elif typ == "image" and image:

                          content += (
                              f'<img src="{image}" '
                              f'style="max-width:100%;'
                              f'padding:{padding}px;">'
                          )

                      elif typ == "container":

                          content += (
                              f'<div class="container" '
                              f'style="{style}">'
                              f'{text}</div>'
                          )

                  display = "block" if i == 0 else "none"

                  sections += (
                      f'<section id="{safe_id}" '
                      f'style="display:{display};">'
                      f'{content}'
                      f'</section>'
                  )


              body = f"""
              <!doctype html>

              <html>

              <head>

              <meta charset="utf-8">

              <meta name="viewport"
                    content="width=device-width,initial-scale=1">

              <title>{html.escape(info["appName"])}</title>

              <style>

              *{{box-sizing:border-box}}

              html,body{{
                margin:0;
                padding:0;
                font-family:Arial,sans-serif;
                background:#f5f7fa;
                color:#111;
              }}

              header{{
                background:#07111f;
                color:white;
                padding:16px;
                position:sticky;
                top:0;
                z-index:10;
              }}

              header h2{{
                margin:0 0 10px 0;
              }}

              nav{{
                display:flex;
                gap:6px;
                overflow-x:auto;
              }}

              nav button{{
                border:0;
                background:#238636;
                color:white;
                border-radius:7px;
                padding:8px 12px;
              }}

              main{{
                padding:18px;
                max-width:800px;
                margin:auto;
                background:white;
                min-height:calc(100vh - 100px);
              }}

              h1{{
                line-height:1.2;
              }}

              p{{
                line-height:1.6;
              }}

              .button{{
                display:inline-block;
                background:#1f6feb;
                color:white;
                text-decoration:none;
                padding:12px 18px;
                border-radius:8px;
                margin:6px;
              }}

              input{{
                display:block;
                width:100%;
                border:1px solid #ccc;
                border-radius:7px;
                margin:8px 0;
              }}

              .container{{
                border:1px solid #ddd;
                border-radius:8px;
                margin:8px 0;
              }}

              </style>

              <script>

              function showPage(id) {{

                document
                  .querySelectorAll("main section")
                  .forEach(function(x){{
                    x.style.display =
                      x.id === id ? "block" : "none";
                  }});

              }}

              </script>

              </head>

              <body>

              <header>

                <h2>{html.escape(info["appName"])}</h2>

                <nav>{nav}</nav>

              </header>

              <main>

                {sections}

              </main>

              </body>

              </html>
              """


          os.makedirs(
              "android-project/app/src/main/assets",
              exist_ok=True
          )

          open(
              "android-project/app/src/main/assets/index.html",
              "w",
              encoding="utf-8"
          ).write(body)

          print("Custom HTML generated.")

          PY


          # ========================================
          # GRADLE SETTINGS
          # ========================================

          cat > android-project/settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ASIMTECH"

          include(":app")

          EOF


          # ========================================
          # ROOT BUILD
          # ========================================

          cat > android-project/build.gradle <<'EOF'

          plugins {
              id "com.android.application" version "8.6.1" apply false
          }

          EOF


          # ========================================
          # GRADLE PROPERTIES
          # ========================================

          cat > android-project/gradle.properties <<'EOF'

          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m

          EOF


          # ========================================
          # CREATE APP BUILD.GRADLE
          # ========================================

          python3 <<'PY'

          import json

          x=json.load(open("build-info.json"))

          open(
              "android-project/app/build.gradle",
              "w"
          ).write(f'''
          plugins {{
              id "com.android.application"
          }}

          android {{
              namespace "{x["packageName"]}"

              compileSdk 35

              defaultConfig {{
                  applicationId "{x["packageName"]}"
                  minSdk 23
                  targetSdk 35
                  versionCode {x["versionCode"]}
                  versionName "{x["versionName"]}"
              }}
          }}
          ''')

          PY


          # ========================================
          # VALUES
          # ========================================

          python3 <<'PY'

          import json
          import html

          x=json.load(open("build-info.json"))

          name=html.escape(x["appName"])

          open(
              "android-project/app/src/main/res/values/strings.xml",
              "w"
          ).write(f'''
          <resources>
              <string name="app_name">{name}</string>
          </resources>
          ''')

          open(
              "android-project/app/src/main/res/values/styles.xml",
              "w"
          ).write('''
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          ''')

          PY


          # ========================================
          # MANIFEST
          # ========================================

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF


          # ========================================
          # MAIN ACTIVITY
          # ========================================

          python3 <<'PY'

          import json
          import os

          x=json.load(open("build-info.json"))

          package=x["packageName"]

          package_path=package.replace(".","/")

          directory=(
              "android-project/app/src/main/java/"
              + package_path
          )

          os.makedirs(directory,exist_ok=True)

          java=f'''
          package {package};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{

                  super.onCreate(savedInstanceState);

                  WebView webView =
                      new WebView(this);

                  webView.setWebViewClient(
                      new WebViewClient() {{

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {{

                              return false;

                          }}

                      }}
                  );

                  webView.getSettings()
                      .setJavaScriptEnabled(true);

                  webView.getSettings()
                      .setDomStorageEnabled(true);

                  webView.getSettings()
                      .setDatabaseEnabled(true);

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  setContentView(webView);

              }}

          }}
          '''

          open(
              directory + "/MainActivity.java",
              "w"
          ).write(java)

          PY


          echo "=========================================="

          echo "ANDROID PROJECT GENERATED"

          echo "=========================================="


      # ==========================================
      # 9. BUILD APK
      # ==========================================

      - name: Build debug APK

        if: steps.job.outputs.found == 'true'

        working-directory: android-project

        shell: bash

        run: |

          set -euo pipefail

          gradle --no-daemon wrapper \
            --gradle-version 8.10.2

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug


      # ==========================================
      # 10. CHECK APK
      # ==========================================

      - name: Check APK

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
              echo "ERROR: APK not found."
              exit 1
          fi

          ls -lh "$APK"


      # ==========================================
      # 11. UPLOAD APK
      # ==========================================

      - name: Upload APK to Supabase

        if: steps.job.outputs.found == 'true'

        shell: bash

        run: |

          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          APP_NAME=$(python3 -c \
            "import json; print(json.load(open('build-info.json'))['appName'])")

          VERSION_NAME=$(python3 -c \
            "import json; print(json.load(open('build-info.json'))['versionName'])")

          SIZE=$(stat -c%s "$APK")

          SHA=$(sha256sum "$APK" | awk '{print $1}')

          SAFE_NAME=$(echo "$APP_NAME" \
            | tr '[:lower:]' '[:upper:]' \
            | sed 's/[^A-Z0-9_-]/-/g')

          FILE_NAME="${SAFE_NAME}-v${VERSION_NAME}.apk"

          PATHNAME="$APP_ID/$BUILD_ID/$FILE_NAME"


          echo "Uploading:"
          echo "$FILE_NAME"


          curl -sS --fail \
            -X POST \
            "$SUPABASE_URL/storage/v1/object/android-apks/$PATHNAME" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK"


          curl -sS --fail \
            -X PATCH \
            "$SUPABASE_URL/rest/v1/app_builds?id=eq.$BUILD_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data '{
              "status":"success",
              "storage_path":"'"$PATHNAME"'",
              "file_name":"'"$FILE_NAME"'",
              "file_size":'"$SIZE"',
              "sha256":"'"$SHA"'",
              "completed_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }'


          echo "=========================================="

          echo "APK UPLOAD SUCCESSFUL"

          echo "File: $FILE_NAME"

          echo "Size: $SIZE bytes"

          echo "=========================================="


      # ==========================================
      # 12. FINAL
      # ==========================================

      - name: Build completed

        if: steps.job.outputs.found == 'true'

        run: |

          echo "=========================================="

          echo "ASIM TECH ANDROID BUILD COMPLETED"

          echo "=========================================="
