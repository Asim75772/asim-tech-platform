<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repository — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#07111f,#0b2233,#063b35);
color:#fff;
min-height:100vh;
}

nav{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
background:rgba(5,12,22,.95);
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:22px;
font-weight:bold;
color:#36e0b5;
}

.nav-links{
display:flex;
gap:18px;
}

.nav-links a{
color:#ddd;
text-decoration:none;
}

.nav-links a:hover{
color:#36e0b5;
}

.container{
width:90%;
max-width:900px;
margin:40px auto;
}

.back{
color:#8edfc9;
text-decoration:none;
display:inline-block;
margin-bottom:22px;
}

.card{
background:rgba(13,29,43,.95);
border:1px solid rgba(255,255,255,.1);
border-radius:16px;
padding:28px;
}

.repo-title{
font-size:32px;
margin-bottom:12px;
word-break:break-word;
}

.description{
color:#aab7c4;
font-size:17px;
line-height:1.6;
margin-bottom:20px;
}

.badges{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.badge{
display:inline-block;
padding:7px 12px;
border-radius:20px;
background:#17384a;
color:#8edfc9;
font-size:13px;
}

.private{
background:#46351c;
color:#ffd27a;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:25px;
}

.info-box{
background:#081a28;
border:1px solid #203746;
padding:17px;
border-radius:10px;
}

.info-label{
color:#71818d;
font-size:13px;
margin-bottom:7px;
}

.info-value{
font-size:14px;
word-break:break-all;
}

.buttons{
display:flex;
gap:12px;
margin-top:25px;
}

button{
flex:1;
padding:14px;
border:0;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.edit{
background:#36e0b5;
color:#06151a;
}

.delete{
background:#55252c;
color:#ffb5bd;
}

#loading{
text-align:center;
padding:50px;
color:#aab7c4;
}

#error{
display:none;
text-align:center;
padding:30px;
color:#ff8d8d;
}

footer{
text-align:center;
color:#71818d;
padding:40px 10px;
}

@media(max-width:600px){

nav{
padding:0 5%;
}

.nav-links{
gap:10px;
font-size:13px;
}

.container{
width:92%;
margin:25px auto;
}

.card{
padding:22px;
}

.repo-title{
font-size:27px;
}

.info{
grid-template-columns:1fr;
}

.buttons{
flex-direction:column;
}

}
</style>
</head>

<body>

<nav>

<div class="logo">
⚡ ASIM TECH
</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="repositories.html">Repositories</a>
<a href="dashboard.html">Dashboard</a>
</div>

</nav>


<div class="container">

<a class="back" href="repositories.html">
← Back to Repositories
</a>


<div id="loading">
Loading repository...
</div>


<div id="error"></div>


<div id="repository" class="card" style="display:none">


<div class="repo-title">
📦 <span id="name"></span>
</div>


<div id="description" class="description">
</div>


<div class="badges">

<span id="visibility" class="badge">
</span>

<span class="badge">
ASIM TECH
</span>

</div>


<div class="info">


<div class="info-box">

<div class="info-label">
👤 Owner ID
</div>

<div id="owner" class="info-value">
</div>

</div>


<div class="info-box">

<div class="info-label">
📅 Created
</div>

<div id="created" class="info-value">
</div>

</div>


<div class="info-box">

<div class="info-label">
🔄 Last Updated
</div>

<div id="updated" class="info-value">
</div>

</div>


<div class="info-box">

<div class="info-label">
🆔 Repository ID
</div>

<div id="repoid" class="info-value">
</div>

</div>


</div>


<div class="buttons">

<button
class="edit"
onclick="editRepo()">
✏️ Edit Repository
</button>


<button
class="delete"
onclick="deleteRepo()">
🗑️ Delete Repository
</button>

</div>


</div>

</div>


<footer>
© 2026 ASIM TECH — Code. Create. Innovate.
</footer>


<script>

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


const params =
new URLSearchParams(
window.location.search
);


const repoId =
params.get("id");


let repo=null;


async function loadRepo(){

try{


const {
data:{user},
error:userError
} =
await supabaseClient.auth.getUser();


if(userError){
throw userError;
}


if(!user){

window.location.href="login.html";
return;

}


if(!repoId){

throw new Error(
"Repository ID missing"
);

}


const {
data,
error
} =
await supabaseClient
.from("repositories")
.select("*")
.eq("id",repoId)
.single();


if(error){
throw error;
}


repo=data;


document.getElementById("name")
.textContent=
repo.name;


document.getElementById("description")
.textContent=
repo.description ||
"No description provided.";


document.getElementById("owner")
.textContent=
repo.owner_id;


document.getElementById("repoid")
.textContent=
repo.id;


document.getElementById("created")
.textContent=
formatDate(repo.created_at);


document.getElementById("updated")
.textContent=
formatDate(repo.updated_at);


const visibility=
document.getElementById("visibility");


if(repo.is_private){

visibility.textContent=
"🔒 Private";

visibility.classList.add(
"private"
);

}else{

visibility.textContent=
"🌐 Public";

}


document.getElementById("loading")
.style.display="none";


document.getElementById("repository")
.style.display="block";


}catch(error){

console.error(error);


document.getElementById("loading")
.style.display="none";


const errorBox=
document.getElementById("error");


errorBox.style.display="block";


errorBox.textContent=
"Repository not found or you do not have access.";

}

}


function formatDate(date){

if(!date){
return "Not available";
}


return new Date(date)
.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


/* EDIT REPOSITORY */

function editRepo(){

window.location.href=
"edit-repository.html?id="+
encodeURIComponent(repo.id);

}


/* DELETE REPOSITORY */

async function deleteRepo(){

if(!repo){
return;
}


const confirmed=
confirm(
"Are you sure you want to delete '" +
repo.name +
"'?"
);


if(!confirmed){
return;
}


try{


const {
error
} =
await supabaseClient
.from("repositories")
.delete()
.eq("id",repo.id);


if(error){
throw error;
}


alert(
"Repository deleted successfully."
);


window.location.href=
"repositories.html";


}catch(error){

console.error(error);


alert(
"Unable to delete repository."
);

}

}


loadRepo();

</script>

</body>
</html>
