<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Repository Details - ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#1f2937;
}

.navbar{
background:linear-gradient(135deg,#0f172a,#064e3b);
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.navbar a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:14px;
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:30px;
box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

h1{
font-size:30px;
margin-bottom:10px;
}

.description{
color:#6b7280;
margin-bottom:20px;
font-size:16px;
}

.badge{
display:inline-block;
padding:7px 14px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-bottom:25px;
}

.public{
background:#dcfce7;
color:#166534;
}

.private{
background:#fee2e2;
color:#991b1b;
}

.info{
background:#f8fafc;
padding:18px;
border-radius:12px;
margin-bottom:25px;
}

.info p{
margin:10px 0;
font-size:14px;
word-break:break-word;
}

.info strong{
display:inline-block;
width:120px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:12px;
}

button{
border:none;
padding:13px 18px;
border-radius:10px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.files-btn{
background:#2563eb;
color:white;
}

.edit-btn{
background:#f59e0b;
color:white;
}

.delete-btn{
background:#dc2626;
color:white;
}

.back-btn{
background:#64748b;
color:white;
}

.loading{
text-align:center;
padding:50px;
font-size:18px;
color:#64748b;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:20px;
border-radius:12px;
}

@media(max-width:600px){

.container{
margin:20px auto;
padding:15px;
}

.card{
padding:22px;
}

h1{
font-size:25px;
}

.buttons{
flex-direction:column;
}

button{
width:100%;
}

.info strong{
width:100%;
margin-bottom:4px;
}

}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">
ASIM TECH
</div>

<div>

<a href="index.html">Home</a>

<a href="repositories.html">
Repositories
</a>

</div>

</div>


<div class="container">

<div id="loading" class="loading">
Loading repository...
</div>


<div id="error"
class="error"
style="display:none;">
Unable to load repository.
</div>


<div id="repositoryCard"
class="card"
style="display:none;">

<h1 id="repoName"></h1>

<div id="repoDescription"
class="description">
</div>

<span id="repoVisibility"
class="badge">
</span>


<div class="info">

<p>
<strong>Owner ID:</strong>
<span id="ownerId"></span>
</p>

<p>
<strong>Created:</strong>
<span id="createdAt"></span>
</p>

<p>
<strong>Updated:</strong>
<span id="updatedAt"></span>
</p>

<p>
<strong>Repository ID:</strong>
<span id="repoId"></span>
</p>

</div>


<div class="buttons">

<button
class="files-btn"
onclick="openFiles()">

📁 Repository Files

</button>


<button
class="edit-btn"
onclick="editRepo()">

✏️ Edit Repository

</button>


<button
class="delete-btn"
onclick="deleteRepo()">

🗑️ Delete Repository

</button>


<button
class="back-btn"
onclick="goBack()">

← Back to Repositories

</button>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let repo = null;


/* LOAD REPOSITORY */

async function loadRepo(){

try{

const params =
new URLSearchParams(
window.location.search
);

const repoId =
params.get("id");


if(!repoId){

showError(
"Repository ID is missing."
);

return;

}


const result =
await supabaseClient
.from("repositories")
.select("*")
.eq("id",repoId)
.single();


if(result.error){

console.error(result.error);

showError(
"Unable to load repository."
);

return;

}


repo = result.data;


document.getElementById(
"repoName"
).textContent =
repo.name;


document.getElementById(
"repoDescription"
).textContent =
repo.description ||
"No description provided.";


const visibility =
document.getElementById(
"repoVisibility"
);


if(repo.is_private){

visibility.textContent =
"Private";

visibility.className =
"badge private";

}else{

visibility.textContent =
"Public";

visibility.className =
"badge public";

}


document.getElementById(
"ownerId"
).textContent =
repo.owner_id;


document.getElementById(
"repoId"
).textContent =
repo.id;


document.getElementById(
"createdAt"
).textContent =
formatDate(repo.created_at);


document.getElementById(
"updatedAt"
).textContent =
formatDate(repo.updated_at);


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"repositoryCard"
).style.display =
"block";


}catch(error){

console.error(error);

showError(
"Something went wrong while loading repository."
);

}

}


/* SHOW ERROR */

function showError(message){

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"error"
).textContent =
message;


document.getElementById(
"error"
).style.display =
"block";

}


/* FORMAT DATE */

function formatDate(date){

if(!date){

return "—";

}

return new Date(date)
.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


/* OPEN FILES */

function openFiles(){

if(!repo){

return;

}

window.location.href =
"repository-files.html?repository_id=" +
encodeURIComponent(repo.id);

}


/* EDIT REPOSITORY */

function editRepo(){

if(!repo){

return;

}

window.location.href =
"edit-repository.html?id=" +
encodeURIComponent(repo.id);

}


/* DELETE REPOSITORY */

async function deleteRepo(){

if(!repo){

return;

}


const confirmed =
confirm(
"Are you sure you want to delete '" +
repo.name +
"'?"
);


if(!confirmed){

return;

}


try{

const result =
await supabaseClient
.from("repositories")
.delete()
.eq("id",repo.id);


if(result.error){

throw result.error;

}


alert(
"Repository deleted successfully."
);


window.location.href =
"repositories.html";


}catch(error){

console.error(error);

alert(
"Unable to delete repository."
);

}

}


/* BACK */

function goBack(){

window.location.href =
"repositories.html";

}


loadRepo();

</script>

</body>

</html>
