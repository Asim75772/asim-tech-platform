<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Repository — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    min-height:100%;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

    background:#0d1117;
    color:#e6edf3;
    min-height:100vh;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    min-height:64px;

    background:#010409;

    border-bottom:1px solid #30363d;

    display:flex;
    align-items:center;

    padding:12px 5%;

    gap:24px;

    flex-wrap:wrap;
}

.logo{
    font-size:21px;
    font-weight:700;
    color:#fff;
}

.navbar a{
    color:#e6edf3;
    text-decoration:none;
    font-size:14px;
}

.navbar a:hover{
    color:#58a6ff;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:94%;
    max-width:1250px;
    margin:28px auto 60px;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    padding:100px 20px;
    text-align:center;
    color:#8b949e;
    font-size:20px;
}


/* =====================================================
   ERROR
===================================================== */

.error{
    display:none;

    background:#3d1f25;

    border:1px solid #f85149;

    color:#ff7b72;

    padding:18px;

    border-radius:8px;

    margin-bottom:20px;

    line-height:1.6;

    word-break:break-word;
}


/* =====================================================
   REPOSITORY HEADER
===================================================== */

.repo-header{
    margin-bottom:22px;
}

.repo-title{
    display:flex;

    align-items:center;

    gap:8px;

    flex-wrap:wrap;

    font-size:26px;

    margin-bottom:10px;
}

.owner{
    color:#58a6ff;
}

.repo-slash{
    color:#8b949e;
}

.visibility{
    border:1px solid #30363d;

    border-radius:20px;

    padding:4px 10px;

    font-size:12px;

    color:#8b949e;
}

.description{
    color:#8b949e;

    font-size:14px;

    margin-bottom:15px;
}

.repo-info{
    display:flex;

    align-items:center;

    gap:9px;

    flex-wrap:wrap;
}

.info-item{
    font-size:13px;

    color:#8b949e;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
    border:1px solid #30363d;

    background:#21262d;

    color:#e6edf3;

    padding:8px 13px;

    border-radius:7px;

    font-size:13px;

    cursor:pointer;

    text-decoration:none;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    white-space:nowrap;
}

.btn:hover{
    background:#30363d;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-green{
    background:#238636;

    border-color:#238636;

    color:#fff;
}

.btn-green:hover{
    background:#2ea043;
}

.btn-blue{
    background:#1f6feb;

    border-color:#1f6feb;

    color:#fff;
}

.btn-blue:hover{
    background:#388bfd;
}

.btn-red{
    background:#da3633;

    border-color:#da3633;

    color:#fff;
}


/* =====================================================
   TABS
===================================================== */

.tabs{
    display:flex;

    border-bottom:1px solid #30363d;

    overflow-x:auto;

    margin-bottom:18px;
}

.tab{
    padding:12px 16px;

    color:#8b949e;

    text-decoration:none;

    font-size:14px;

    white-space:nowrap;
}

.tab:hover{
    color:#fff;
}

.tab.active{
    color:#fff;

    font-weight:600;

    border-bottom:2px solid #f78166;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    margin-bottom:14px;

    flex-wrap:wrap;
}

.toolbar-left{
    display:flex;

    gap:8px;

    align-items:center;

    flex-wrap:wrap;
}

.toolbar-right{
    display:flex;

    flex:1;

    justify-content:flex-end;
}

.search{
    width:300px;

    max-width:100%;

    background:#0d1117;

    border:1px solid #30363d;

    border-radius:7px;

    padding:9px 12px;

    color:#fff;

    outline:none;
}

.search:focus{
    border-color:#58a6ff;
}


/* =====================================================
   BRANCH / ADD MENUS
===================================================== */

.branch-wrapper,
.add-wrapper{
    position:relative;
}

.branch-menu,
.add-menu{
    display:none;

    position:absolute;

    background:#161b22;

    border:1px solid #30363d;

    border-radius:8px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.5);

    z-index:3000;

    overflow:hidden;
}

.branch-menu{
    top:44px;
    left:0;
    width:280px;
}

.add-menu{
    top:44px;
    right:0;
    width:220px;
}

.branch-menu.show,
.add-menu.show{
    display:block;
}

.branch-item{
    display:block;

    width:100%;

    padding:12px 15px;

    border:0;

    background:transparent;

    color:#e6edf3;

    text-align:left;

    cursor:pointer;
}

.branch-item:hover{
    background:#21262d;
}

.add-menu a{
    display:block;

    padding:12px 15px;

    color:#e6edf3;

    text-decoration:none;
}

.add-menu a:hover{
    background:#21262d;

    color:#58a6ff;
}


/* =====================================================
   COMMIT BAR
===================================================== */

.commit-bar{
    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#161b22;

    border:1px solid #30363d;

    border-radius:7px 7px 0 0;

    padding:12px 15px;

    font-size:13px;

    color:#8b949e;

    gap:10px;

    flex-wrap:wrap;
}

.commit{
    color:#58a6ff;

    font-weight:600;
}


/* =====================================================
   FILE LIST
===================================================== */

.file-list{
    border:1px solid #30363d;

    border-top:0;

    background:#0d1117;

    border-radius:0 0 7px 7px;

    overflow:hidden;
}

.file-row{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    padding:13px 15px;

    border-bottom:1px solid #21262d;
}

.file-row:last-child{
    border-bottom:0;
}

.file-row:hover{
    background:#161b22;
}

.file-main{
    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;

    flex:1;
}

.file-icon{
    font-size:21px;

    width:28px;

    text-align:center;

    flex-shrink:0;
}

.file-name{
    color:#58a6ff;

    font-size:14px;

    word-break:break-word;
}

.file-sub{
    color:#8b949e;

    font-size:11px;

    margin-top:4px;
}

.file-meta{
    display:flex;

    align-items:center;

    gap:8px;

    flex-wrap:wrap;

    justify-content:flex-end;
}

.type-badge{
    border:1px solid #30363d;

    border-radius:15px;

    padding:3px 8px;

    font-size:10px;

    color:#8b949e;
}

.file-actions{
    display:flex;

    gap:5px;

    flex-wrap:wrap;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    padding:55px 20px;

    text-align:center;

    color:#8b949e;
}


/* =====================================================
   README
===================================================== */

.readme{
    margin-top:25px;

    border:1px solid #30363d;

    border-radius:7px;

    overflow:hidden;
}

.readme-header{
    background:#161b22;

    border-bottom:1px solid #30363d;

    padding:14px;

    font-weight:600;
}

.readme-body{
    padding:24px;

    line-height:1.7;

    color:#c9d1d9;

    overflow-wrap:anywhere;
}

.readme-body h1,
.readme-body h2,
.readme-body h3{
    color:#fff;

    margin-bottom:12px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    right:20px;

    bottom:20px;

    max-width:90%;

    background:#161b22;

    border:1px solid #30363d;

    color:#e6edf3;

    padding:13px 17px;

    border-radius:8px;

    display:none;

    z-index:10000;

    box-shadow:
    0 10px 30px rgba(0,0,0,.5);
}

.toast.show{
    display:block;
}

.toast.success{
    border-color:#238636;

    color:#56d364;
}

.toast.error{
    border-color:#f85149;

    color:#ff7b72;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .navbar{
        padding:12px 4%;

        gap:14px;
    }

    .container{
        width:94%;

        margin:20px auto 40px;
    }

    .repo-title{
        font-size:21px;
    }

    .toolbar-left,
    .toolbar-right{
        width:100%;
    }

    .toolbar-right{
        justify-content:flex-start;
    }

    .search{
        width:100%;
    }

    .file-row{
        flex-direction:column;

        align-items:flex-start;
    }

    .file-main{
        width:100%;
    }

    .file-meta{
        width:100%;

        justify-content:flex-start;
    }

    .file-actions{
        width:100%;
    }

    .file-actions .btn{
        flex:1;
    }

    .commit-bar{
        align-items:flex-start;

        flex-direction:column;
    }

}


/* =====================================================
   EXTRA MOBILE
===================================================== */

@media(max-width:420px){

    .logo{
        font-size:18px;
    }

    .navbar a{
        font-size:13px;
    }

    .btn{
        padding:8px 10px;

        font-size:12px;
    }

    .repo-title{
        font-size:19px;
    }

}

</style>

</head>


<body>

<nav class="navbar">

<!-- =====================================================

<div class="container">


    <div
    id="loading"
    class="loading">

        Loading repository...

    </div>


    <div
    id="error"
    class="error">
    </div>


    <div
    id="content"

        ================================================== -->

        <div class="repo-header">

            <div class="repo-title">

                    ASIM TECH
                </span>

                <span class="repo-slash">

                </span>

                <strong id="repoName">

                <span
                id="visibility"

                </span>

            </div>


            <div

            </div>

                <span class="info-item">

                    stars

     TOAST
===================================================== -->

<div
id="toast"
class="toast">

<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


const repoId =
params.get("repository_id") ||
params.get("id");


const branchIdFromUrl =
params.get("branch_id");


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let repository = null;

let allBranches = [];

let currentBranch = null;

let allFiles = [];

let isStarred = false;


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadRepository();

    }
);


/* =====================================================
   ERROR HANDLER
===================================================== */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "ASIM TECH ERROR:",
            event.error || event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "ASIM TECH PROMISE ERROR:",
            event.reason
        );

    }
);


/* =====================================================
   LOAD REPOSITORY
===================================================== */

async function loadRepository(){

    try{

        if(!repoId){

            throw new Error(
                "Repository ID is missing."
            );

        }


        /* ---------------------------------------------
           AUTH USER
        --------------------------------------------- */

        const {
            data:userData,
            error:userError
        } =
        await supabaseClient.auth.getUser();


        if(userError){

            throw userError;

        }


        currentUser =
            userData?.user || null;


        if(!currentUser){

            window.location.href =
                "login.html";

            return;

        }


        /* ---------------------------------------------
           LOAD REPOSITORY
        --------------------------------------------- */

        const {
            data:repo,
            error:repoError
        } =
        await supabaseClient

        .from("repositories")

        .select("*")

        .eq(
            "id",
            repoId
        )

        .single();


        if(repoError){

            throw repoError;

        }


        if(!repo){

            throw new Error(
                "Repository not found."
            );

        }


        repository =
            repo;


        renderRepository();


        /* ---------------------------------------------
           LOAD BRANCHES
        --------------------------------------------- */

        await loadBranches();


        /* ---------------------------------------------
           LOAD FILES
        --------------------------------------------- */

        await loadFiles();


        /* ---------------------------------------------
           README
        --------------------------------------------- */

        await loadReadme();


        /* ---------------------------------------------
           LINKS
        --------------------------------------------- */

        updatePageLinks();


        /* ---------------------------------------------
           PUBLISH
        --------------------------------------------- */

        updatePublishUI();


        /* ---------------------------------------------
           STAR
        --------------------------------------------- */

        await loadStarStatus();


        /* ---------------------------------------------
           SHOW PAGE
        --------------------------------------------- */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "content"
        ).style.display =
            "block";


    }

    catch(error){

        console.error(
            "Repository loading error:",
            error
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const box =
            document.getElementById(
                "error"
            );


        box.style.display =
            "block";


        box.innerHTML =
            "<strong>⚠️ Unable to load repository</strong><br><br>" +
            escapeHtml(
                error?.message ||
                "Unknown error"
            );

    }

}


/* =====================================================
   RENDER REPOSITORY
===================================================== */

function renderRepository(){

    document.getElementById(
        "repoOwner"
    ).textContent =
        "ASIM TECH";


    document.getElementById(
        "repoName"
    ).textContent =
        repository.name ||
        "Unnamed Repository";


    document.getElementById(
        "repoDescription"
    ).textContent =
        repository.description ||
        "No description";


    document.getElementById(
        "visibility"
    ).textContent =
        repository.is_private
        ? "Private"
        : "Public";


    document.getElementById(
        "starCount"
    ).textContent =
        repository.stars_count || 0;

}


/* =====================================================
   BRANCHES
===================================================== */

async function loadBranches(){

    const {
        data,
        error
    } =
    await supabaseClient

    .from("repository_branches")

    .select("*")

    .eq(
        "repository_id",
        repoId
    )

    .order(
        "name",
        {
            ascending:true
        }
    );


    if(error){

        throw error;

    }


    allBranches =
        data || [];


    if(!allBranches.length){

        throw new Error(
            "No branches found."
        );

    }


    let selected =
        null;


    /* ---------------------------------------------
       URL BRANCH
    --------------------------------------------- */

    if(branchIdFromUrl){

        selected =
            allBranches.find(
                branch =>
                    branch.id ===
                    branchIdFromUrl
            );

    }


    /* ---------------------------------------------
       DEFAULT BRANCH
    --------------------------------------------- */

    if(!selected){

        selected =
            allBranches.find(
                branch =>
                    branch.name ===
                    (
                        repository.default_branch ||
                        "main"
                    )
            );

    }


    /* ---------------------------------------------
       FIRST BRANCH
    --------------------------------------------- */

    if(!selected){

        selected =
            allBranches[0];

    }


    currentBranch =
        selected;


    renderBranchMenu();

    updateBranchUI();

}


/* =====================================================
   BRANCH MENU
===================================================== */

function renderBranchMenu(){

    const list =
        document.getElementById(
            "branchList"
        );


    list.innerHTML =
        "";


    allBranches.forEach(
        function(branch){

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "branch-item";


            button.textContent =
                "🌿 " +
                branch.name;


            button.onclick =
                async function(){

                    currentBranch =
                        branch;


                    updateBranchUI();


                    await loadFiles();


                    await loadReadme();


                    closeBranchMenu();

                };


            list.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   UPDATE BRANCH UI
===================================================== */

function updateBranchUI(){

    if(!currentBranch){

        return;

    }


    document.getElementById(
        "branchName"
    ).textContent =
        currentBranch.name;


    document.getElementById(
        "commitBranch"
    ).textContent =
        currentBranch.name;


    updatePageLinks();

}


/* =====================================================
   LOAD FILES
===================================================== */

async function loadFiles(){

    if(!currentBranch){

        return;

    }


    document.getElementById(
        "fileList"
    ).innerHTML =
        '<div class="empty">Loading files...</div>';


    const {
        data,
        error
    } =
    await supabaseClient

    .from("repository_files")

    .select("*")

    .eq(
        "repository_id",
        repoId
    )

    .eq(
        "branch_id",
        currentBranch.id
    )

    .order(
        "file_path",
        {
            ascending:true
        }
    );


    if(error){

        showToast(
            error.message,
            "error"
        );

        return;

    }


    allFiles =
        data || [];


    renderFiles(
        allFiles
    );

}


/* =====================================================
   RENDER FILES
===================================================== */

function renderFiles(files){

    const list =
        document.getElementById(
            "fileList"
        );


    list.innerHTML =
        "";


    document.getElementById(
        "fileCount"
    ).textContent =
        files.length +
        (
            files.length === 1
            ? " file"
            : " files"
        );


    if(!files.length){

        list.innerHTML =
        `
        <div class="empty">

            📁

            <br><br>

            No files found.

        </div>
        `;

        return;

    }


    files.forEach(
        function(file){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "file-row";


            const editUrl =
                "file-editor.html" +
                "?file_id=" +
                encodeURIComponent(
                    file.id
                ) +
                "&repository_id=" +
                encodeURIComponent(
                    repoId
                ) +
                "&branch_id=" +
                encodeURIComponent(
                    currentBranch.id
                );


            let previewButton =
                "";


            if(!file.is_binary){

                const path =
                    String(
                        file.file_path ||
                        ""
                    ).toLowerCase();


                if(
                    path.endsWith(".html") ||
                    path.endsWith(".htm")
                ){

                    previewButton =
                    `
                    <button
                    class="btn btn-blue"
                    type="button"
                    onclick="previewFile('${file.id}')">

                        👁 Preview

                    </button>
                    `;

                }

            }


            row.innerHTML =
            `

            <div class="file-main">

                <div class="file-icon">

                    ${getFileIcon(file)}

                </div>


                <div>

                    <div class="file-name">

                        ${escapeHtml(
                            file.file_path
                        )}

                    </div>


                    <div class="file-sub">

                        ${
                            file.is_binary
                            ? "Binary file"
                            : "Text file"
                        }

                        ${
                            file.updated_at
                            ? " • Updated " +
                              formatDate(
                                  file.updated_at
                              )
                            : ""
                        }

                    </div>

                </div>

            </div>


            <div class="file-meta">

                <span class="type-badge">

                    ${getFileType(
                        file.file_path
                    )}

                </span>


                <span>

                    ${formatFileSize(
                        file.file_size
                    )}

                </span>


                <div class="file-actions">


                    <a
                    class="btn"
                    href="${editUrl}">

                        ✏️ Edit

                    </a>


                    ${previewButton}


                    <button
                    class="btn"
                    onclick="downloadFile('${file.id}')">

                        ⬇️

                    </button>


                </div>

            </div>

            `;


            list.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   ⭐ HTML PREVIEW
   DIRECT BLOB VERSION
===================================================== */

async function previewFile(fileId){

    try{

        const file =
            allFiles.find(
                item =>
                    item.id ===
                    fileId
            );


        if(!file){

            showToast(
                "File not found.",
                "error"
            );

            return;

        }


        if(file.is_binary){

            showToast(
                "Binary files cannot be previewed.",
                "error"
            );

            return;

        }


        const path =
            String(
                file.file_path ||
                ""
            ).toLowerCase();


        if(
            !path.endsWith(".html") &&
            !path.endsWith(".htm")
        ){

            showToast(
                "Preview is available for HTML files only.",
                "error"
            );

            return;

        }


        let html =
            file.content ||
            "";


        /* -----------------------------------------
           LOAD FROM STORAGE IF NEEDED
        ----------------------------------------- */

        if(
            !html.trim() &&
            file.storage_path
        ){

            const {
                data,
                error
            } =
            await supabaseClient

            .storage

            .from(
                "repository-files"
            )

            .download(
                file.storage_path
            );


            if(error){

                showToast(
                    error.message,
                    "error"
                );

                return;

            }


            html =
                await data.text();

        }


        if(!html.trim()){

            showToast(
                "HTML file is empty.",
                "error"
            );

            return;

        }


        /* -----------------------------------------
           DIRECT BLOB
           
           IMPORTANT:
           DO NOT WRAP THE HTML.
           Original HTML remains intact.
        ----------------------------------------- */

        const blob =
            new Blob(
                [html],
                {
                    type:
                    "text/html;charset=utf-8"
                }
            );


        const previewURL =
            URL.createObjectURL(
                blob
            );


        const previewWindow =
            window.open(
                previewURL,
                "_blank"
            );


        if(!previewWindow){

            URL.revokeObjectURL(
                previewURL
            );


            showToast(
                "Please allow pop-ups for ASIM TECH.",
                "error"
            );

            return;

        }


        /* -----------------------------------------
           RELEASE MEMORY LATER
        ----------------------------------------- */

        setTimeout(
            function(){

                URL.revokeObjectURL(
                    previewURL
                );

            },
            60000
        );

    }

    catch(error){

        console.error(
            "Preview error:",
            error
        );


        showToast(
            error?.message ||
            "Unable to preview HTML file.",
            "error"
        );

    }

}


/* =====================================================
   DOWNLOAD FILE
===================================================== */

async function downloadFile(fileId){

    try{

        const file =
            allFiles.find(
                item =>
                    item.id ===
                    fileId
            );


        if(!file){

            return;

        }


        let blob;


        /* -----------------------------------------
           STORAGE FILE
        ----------------------------------------- */

        if(file.storage_path){

            const {
                data,
                error
            } =
            await supabaseClient

            .storage

            .from(
                "repository-files"
            )

            .download(
                file.storage_path
            );


            if(error){

                showToast(
                    error.message,
                    "error"
                );

                return;

            }


            blob =
                data;

        }

        /* -----------------------------------------
           DATABASE CONTENT
        ----------------------------------------- */

        else{

            blob =
                new Blob(
                    [
                        file.content ||
                        ""
                    ],
                    {
                        type:
                        file.mime_type ||
                        "text/plain"
                    }
                );

        }


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href =
            url;


        a.download =
            file.file_path
            .split("/")
            .pop();


        document.body.appendChild(
            a
        );


        a.click();


        a.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    }

    catch(error){

        showToast(
            error?.message ||
            "Download failed.",
            "error"
        );

    }

}


/* =====================================================
   SEARCH FILES
===================================================== */

function filterFiles(){

    const query =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    if(!query){

        renderFiles(
            allFiles
        );

        return;

    }


    const filtered =
        allFiles.filter(
            function(file){

                return String(
                    file.file_path ||
                    ""
                )
                .toLowerCase()
                .includes(
                    query
                );

            }
        );


    renderFiles(
        filtered
    );

}


/* =====================================================
   README
===================================================== */

async function loadReadme(){

    const body =
        document.getElementById(
            "readmeBody"
        );


    const readme =
        allFiles.find(
            function(file){

                const name =
                    String(
                        file.file_path ||
                        ""
                    )
                    .toLowerCase();


                return (
                    name === "readme.md" ||
                    name === "readme.txt" ||
                    name === "readme"
                );

            }
        );


    if(!readme){

        body.innerHTML =
        `
        <h2>

            ${escapeHtml(
                repository.name
            )}

        </h2>

        <p>

            No README file is available.

        </p>
        `;

        return;

    }


    if(readme.is_binary){

        body.innerHTML =
            "<p>This README is a binary file.</p>";

        return;

    }


    let content =
        readme.content ||
        "";


    /* -----------------------------------------
       STORAGE README
    ----------------------------------------- */

    if(
        !content.trim() &&
        readme.storage_path
    ){

        try{

            const {
                data,
                error
            } =
            await supabaseClient

            .storage

            .from(
                "repository-files"
            )

            .download(
                readme.storage_path
            );


            if(!error){

                content =
                    await data.text();

            }

        }

        catch(e){

            console.error(
                e
            );

        }

    }


    body.innerHTML =
        markdownToHtml(
            content
        );

}

/* =====================================================
   TOGGLE STAR
===================================================== */

async function toggleStar(){

    if(!currentUser){

        window.location.href =
            "login.html";

        return;

    }


    const button =
        document.getElementById(
            "starButton"
        );


    button.disabled =
        true;


    try{

        if(isStarred){

            const {
                error
            } =
            await supabaseClient

            .from("repository_stars")

            .delete()

            .eq(
                "repository_id",
                repoId
            )

            .eq(
                "user_id",
                currentUser.id
            );


            if(error){

                throw error;

            }


            isStarred =
                false;


            repository.stars_count =
                Math.max(
                    0,
                    (
                        repository.stars_count ||
                        0
                    ) - 1
                );

        }

        else{

            const {
                error
            } =
            await supabaseClient

            .from("repository_stars")

            .insert({

                repository_id:
                    repoId,

                user_id:
                    currentUser.id

            });


            if(error){

                throw error;

            }


            isStarred =
                true;


            repository.stars_count =
                (
                    repository.stars_count ||
                    0
                ) + 1;

        }


        document.getElementById(
            "starCount"
        ).textContent =
            repository.stars_count;


        button.textContent =
            isStarred
            ? "★ Starred"
            : "☆ Star";

    }

    catch(error){

        showToast(
            error.message,
            "error"
        );

    }

    finally{

        button.disabled =
            false;

    }

}

/* =====================================================
   PUBLISH REPOSITORY
===================================================== */

async function publishRepository(){

    if(!currentUser){

        return;

    }


    if(
        repository.owner_id !==
        currentUser.id
    ){

        showToast(
            "Only repository owner can publish.",
            "error"
        );

        return;

    }


    const branchName =
        repository.default_branch ||
        "main";


    const {
        data:branch,
        error:branchError
    } =
    await supabaseClient

    .from("repository_branches")

    .select("id,name")

    .eq(
        "repository_id",
        repoId
    )

    .eq(
        "name",
        branchName
    )

    .maybeSingle();


    if(branchError){

        showToast(
            branchError.message,
            "error"
        );

        return;

    }


    if(!branch){

        showToast(
            "Default branch not found.",
            "error"
        );

        return;

    }


    const {
        data:file,
        error:fileError
    } =
    await supabaseClient

    .from("repository_files")

    .select("*")

    .eq(
        "repository_id",
        repoId
    )

    .eq(
        "branch_id",
        branch.id
    )

    .eq(
        "file_path",
        "index.html"
    )

    .maybeSingle();


    if(fileError){

        showToast(
            fileError.message,
            "error"
        );

        return;

    }


    if(!file){

        showToast(
            "index.html not found.",
            "error"
        );

        return;

    }


    if(file.is_binary){

        showToast(
            "index.html is marked as binary.",
            "error"
        );

        return;

    }


    if(
        !file.content ||
        !file.content.trim()
    ){

        showToast(
            "index.html is empty.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Publish repository " +
            repository.name +
            "?\n\nDefault file: index.html"
        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
    await supabaseClient

    .from("repositories")

    .update({

        is_published:true,

        published_at:
            new Date().toISOString(),

        updated_at:
            new Date().toISOString()

    })

    .eq(
        "id",
        repoId
    );


    if(error){

        showToast(
            error.message,
            "error"
        );

        return;

    }


    repository.is_published =
        true;


    updatePublishUI();


    showToast(
        "Repository published successfully!",
        "success"
    );

}

async function createNewBranch(){

    const name =
        prompt(
            "Enter new branch name:"

    if(!name){

        return;

    }


    const branchName =
        name.trim();


    if(!branchName){

        return;

    }


    if(
        branchName.includes(" ")
    ){

        showToast(
            "Branch name cannot contain spaces.",
            "error"
        );

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient

    .from("repository_branches")

    .insert({

        repository_id:
            repoId,

        name:
            branchName,

        created_by:
            currentUser.id

    })

    .select()

    .single();


    if(error){

        showToast(
            error.message,
            "error"
        );

        return;

    }


    allBranches.push(
        data
    );


    currentBranch =

    renderBranchMenu();


    updateBranchUI();


    await loadFiles();


    await loadReadme();

        "Branch created successfully.",
        "success"
    );

}

/* =====================================================
   FILE ICON
===================================================== */

function getFileIcon(file){

    if(file.is_binary){

        return "📦";

    }


    const name =
        String(
            file.file_path ||
            ""
        ).toLowerCase();


    if(
        name.endsWith(".html") ||
        name.endsWith(".htm")
    ){

        return "🌐";

    }


    if(
        name.endsWith(".css")
    ){

        return "🎨";

    }


    if(
        name.endsWith(".js")
    ){

        return "⚡";

    }


    if(
        name.endsWith(".json")
    ){

        return "🔧";

    }


    if(
        name.endsWith(".md")
    ){

        return "📖";

    }


    if(
        name.endsWith(".png") ||
        name.endsWith(".jpg") ||
        name.endsWith(".jpeg") ||
        name.endsWith(".gif") ||
        name.endsWith(".webp")
    ){

        return "🖼️";

    }


    return "📄";

}


/* =====================================================
   FILE TYPE
===================================================== */

function getFileType(path){

    const parts =
        String(
            path || ""
        ).split(".");


    if(parts.length < 2){

        return "FILE";

    }


    return parts
        .pop()
        .toUpperCase();

}


/* =====================================================
   FILE SIZE
===================================================== */

function formatFileSize(bytes){

    if(
        bytes === null ||
        bytes === undefined ||
        bytes === ""
    ){

        return "";

    }


    const n =
        Number(bytes);


    if(!Number.isFinite(n)){

        return "";

    }


    if(n < 1024){

        return n + " B";

    }


    if(
        n < 1024 * 1024
    ){

        return (
            n / 1024
        ).toFixed(1) +
        " KB";

    }


    if(
        n < 1024 *
        1024 *
        1024
    ){

        return (
            n /
            (1024 * 1024)
        ).toFixed(1) +
        " MB";

    }


    return (
        n /
        (1024 *
         1024 *
         1024)
    ).toFixed(1) +
    " GB";

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

    if(!value){

        return "";

    }


    try{

        return new Date(
            value
        ).toLocaleString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }

    catch(e){

        return "";

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MARKDOWN
===================================================== */

function markdownToHtml(markdown){

    let text =
        escapeHtml(
            markdown || ""
        );


    text =
        text.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
        );


    text =
        text.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
        );


    text =
        text.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
        );


    text =
        text.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    text =
        text.replace(
            /\n\n/g,
            "</p><p>"
        );


    text =
        text.replace(
            /\n/g,
            "<br>"
        );


    return (
        "<p>" +
        text +
        "</p>"
    );

}

    );

}
