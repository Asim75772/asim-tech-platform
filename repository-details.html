<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Repository — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

    background:#0d1117;
    color:#e6edf3;
    min-height:100vh;
}

.navbar{
    min-height:64px;
    background:#010409;
    border-bottom:1px solid #30363d;

    display:flex;
    align-items:center;

    gap:24px;
    padding:12px 5%;

    flex-wrap:wrap;
}

.logo{
    font-size:21px;
    font-weight:700;
    color:#fff;
}

.navbar a{
    color:#e6edf3;
    text-decoration:none;
    font-size:14px;
}

.navbar a:hover{
    color:#58a6ff;
}

.container{
    width:94%;
    max-width:1250px;
    margin:28px auto;
}

.loading{
    padding:70px 20px;
    text-align:center;
    color:#8b949e;
}

.error{
    display:none;

    background:#3d1f25;
    border:1px solid #f85149;

    color:#ff7b72;

    padding:14px;
    border-radius:8px;

    margin-bottom:20px;
}

/* =========================
   REPOSITORY HEADER
========================= */

.repo-header{
    margin-bottom:20px;
}

.repo-title{
    display:flex;
    align-items:center;

    gap:8px;

    flex-wrap:wrap;

    font-size:26px;

    margin-bottom:10px;
}

.owner{
    color:#58a6ff;
}

.repo-slash{
    color:#8b949e;
}

.visibility{
    border:1px solid #30363d;

    border-radius:20px;

    padding:4px 10px;

    font-size:12px;

    color:#8b949e;
}

.description{
    color:#8b949e;

    font-size:14px;

    margin-bottom:15px;

    line-height:1.5;
}

.repo-info{
    display:flex;

    align-items:center;

    gap:9px;

    flex-wrap:wrap;
}

.info-item{
    font-size:13px;
    color:#8b949e;
}

/* =========================
   BUTTON
========================= */

.btn{
    border:1px solid #30363d;

    background:#21262d;

    color:#e6edf3;

    padding:8px 13px;

    border-radius:7px;

    font-size:13px;

    cursor:pointer;

    text-decoration:none;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    white-space:nowrap;
}

.btn:hover{
    background:#30363d;
}

.btn-green{
    background:#238636;

    border-color:#238636;

    color:#fff;
}

.btn-green:hover{
    background:#2ea043;
}

.btn-blue{
    background:#1f6feb;

    border-color:#1f6feb;

    color:#fff;
}

.btn-blue:hover{
    background:#388bfd;
}

/* =========================
   TABS
========================= */

.tabs{
    display:flex;

    border-bottom:1px solid #30363d;

    overflow-x:auto;

    margin-bottom:18px;
}

.tab{
    padding:12px 16px;

    color:#8b949e;

    text-decoration:none;

    font-size:14px;

    white-space:nowrap;
}

.tab.active{
    color:#fff;

    font-weight:600;

    border-bottom:2px solid #f78166;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    margin-bottom:14px;

    flex-wrap:wrap;
}

.toolbar-left{
    display:flex;

    align-items:center;

    gap:8px;

    flex-wrap:wrap;
}

.toolbar-right{
    display:flex;

    flex:1;

    justify-content:flex-end;
}

.search{
    width:300px;

    max-width:100%;

    background:#0d1117;

    border:1px solid #30363d;

    border-radius:7px;

    padding:9px 12px;

    color:#fff;

    outline:none;
}

.search:focus{
    border-color:#58a6ff;
}

/* =========================
   MENUS
========================= */

.branch-wrapper,
.add-wrapper{
    position:relative;
}

.branch-menu,
.add-menu{
    display:none;

    position:absolute;

    background:#161b22;

    border:1px solid #30363d;

    border-radius:8px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.5);

    z-index:3000;

    overflow:hidden;
}

.branch-menu{
    top:44px;
    left:0;
    width:280px;
}

.add-menu{
    top:44px;
    right:0;
    width:220px;
}

.branch-menu.show,
.add-menu.show{
    display:block;
}

.branch-item{
    display:block;

    width:100%;

    border:0;

    background:transparent;

    color:#e6edf3;

    text-align:left;

    padding:12px 15px;

    cursor:pointer;
}

.branch-item:hover{
    background:#21262d;
}

.add-menu a{
    display:block;

    padding:12px 15px;

    color:#e6edf3;

    text-decoration:none;
}

.add-menu a:hover{
    background:#21262d;

    color:#58a6ff;
}

/* =========================
   COMMIT
========================= */

.commit-bar{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    background:#161b22;

    border:1px solid #30363d;

    border-radius:7px 7px 0 0;

    padding:12px 15px;

    font-size:13px;

    color:#8b949e;
}

.commit{
    color:#58a6ff;

    font-weight:600;
}

/* =========================
   FILE LIST
========================= */

.file-list{
    border:1px solid #30363d;

    border-top:0;

    background:#0d1117;

    border-radius:0 0 7px 7px;

    overflow:hidden;
}

.file-row{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    padding:13px 15px;

    border-bottom:1px solid #21262d;
}

.file-row:last-child{
    border-bottom:0;
}

.file-row:hover{
    background:#161b22;
}

.file-main{
    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;
}

.file-icon{
    width:28px;

    flex-shrink:0;

    text-align:center;

    font-size:21px;
}

.file-name{
    color:#58a6ff;

    font-size:14px;

    word-break:break-word;
}

.file-sub{
    color:#8b949e;

    font-size:11px;

    margin-top:4px;
}

.file-meta{
    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:8px;

    flex-wrap:wrap;
}

.type-badge{
    border:1px solid #30363d;

    border-radius:15px;

    padding:3px 8px;

    font-size:10px;

    color:#8b949e;
}

.file-actions{
    display:flex;

    gap:5px;

    flex-wrap:wrap;
}

.empty{
    padding:55px 20px;

    text-align:center;

    color:#8b949e;
}

/* =========================
   README
========================= */

.readme{
    margin-top:25px;

    border:1px solid #30363d;

    border-radius:7px;

    overflow:hidden;
}

.readme-header{
    background:#161b22;

    border-bottom:1px solid #30363d;

    padding:14px;

    font-weight:600;
}

.readme-body{
    padding:24px;

    line-height:1.7;

    color:#c9d1d9;
}

.readme-body h1,
.readme-body h2,
.readme-body h3{
    color:#fff;

    margin:15px 0 10px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    right:20px;

    bottom:20px;

    background:#161b22;

    border:1px solid #30363d;

    color:#e6edf3;

    padding:13px 17px;

    border-radius:8px;

    display:none;

    z-index:10000;
}

.toast.show{
    display:block;
}

.toast.success{
    border-color:#238636;

    color:#56d364;
}

.toast.error{
    border-color:#f85149;

    color:#ff7b72;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{
        padding:12px 4%;
        gap:14px;
    }

    .container{
        width:94%;
        margin:20px auto;
    }

    .repo-title{
        font-size:21px;
    }

    .toolbar-left,
    .toolbar-right{
        width:100%;
    }

    .toolbar-right{
        justify-content:flex-start;
    }

    .search{
        width:100%;
    }

    .file-row{
        flex-direction:column;

        align-items:flex-start;
    }

    .file-meta{
        width:100%;

        justify-content:flex-start;
    }
}

</style>
</head>


<body>

     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">

    </div>

    </a>

    <a href="dashboard.html">

    </a>

</nav>


<div class="container">

    <div
        id="loading"
        class="loading">

    </div>


    <div
        id="error"
        class="error">
    </div>


    <div
        id="content"
        style="display:none;">


        <!-- =========================
             REPOSITORY HEADER
        ========================== -->

        <div class="repo-header">

            <div class="repo-title">

                <span
                    id="repoOwner"
                    class="owner">

                    ASIM TECH

                </span>


                <span class="repo-slash">
                    /
                </span>


                <strong id="repoName">
                    —
                </strong>


                <span
                    id="visibility"
                    class="visibility">

                    —

                </span>

            </div>


            <div
                id="repoDescription"

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const repoId =
    params.get("repository_id") ||
    params.get("id");


const branchIdFromUrl =
    params.get("branch_id");


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let repository = null;

let allBranches = [];

let currentBranch = null;

let allFiles = [];

let isStarred = false;


/* =====================================================
   LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadRepository
);


async function loadRepository(){

    try{

        if(!repoId){

            throw new Error(
                "Repository ID is missing."
            );

        }


        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getUser();


        if(error){
            throw error;
        }


        currentUser =
            data?.user || null;


        if(!currentUser){

            window.location.href =
                "login.html";

            return;
        }


        const {
            data:repo,
            error:repoError
        } =
        await supabaseClient

        .from("repositories")

        .select("*")

        .eq(
            "id",
            repoId
        )

        .single();


        if(repoError){
            throw repoError;
        }


        repository =
            repo;


        renderRepository();

        await loadBranches();

        await loadFiles();

        await loadReadme();

        await loadStarStatus();

        updatePageLinks();

        updatePublishUI();


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "content"
        ).style.display =
            "block";


    }catch(error){

        console.error(error);


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const box =
        document.getElementById(
            "error"
        );


        box.style.display =
            "block";


        box.textContent =
            error.message ||
            "Unable to load repository.";

    }

}


/* =====================================================
   REPOSITORY
===================================================== */

function renderRepository(){

    document.getElementById(
        "repoOwner"
    ).textContent =
        "ASIM TECH";


    document.getElementById(
        "repoName"
    ).textContent =
        repository.name;


    document.getElementById(
        "repoDescription"
    ).textContent =
        repository.description ||
        "No description";


    document.getElementById(
        "visibility"
    ).textContent =
        repository.is_private
        ? "Private"
        : "Public";


    document.getElementById(
        "starCount"
    ).textContent =
        repository.stars_count || 0;

}


/* =====================================================
   BRANCHES
===================================================== */

async function loadBranches(){

    const {
        data,
        error
    } =
    await supabaseClient

    .from("repository_branches")

    .select("*")

    .eq(
        "repository_id",
        repoId
    )

    .order(
        "name",
        {
            ascending:true
        }
    );


    if(error){
        throw error;
    }


    allBranches =
        data || [];


    if(!allBranches.length){

        throw new Error(
            "No branches found."
        );

    }


    let selected = null;


    if(branchIdFromUrl){

        selected =
        allBranches.find(
            branch =>
            branch.id ===
            branchIdFromUrl
        );

    }


    if(!selected){

        selected =
        allBranches.find(
            branch =>
            branch.name ===
            (
                repository.default_branch ||
                "main"
            )
        );

    }


    if(!selected){

        selected =
        allBranches[0];

    }


    currentBranch =
        selected;


    renderBranchMenu();

    updateBranchUI();

}


/* =====================================================
   BRANCH MENU
===================================================== */

function renderBranchMenu(){

    const list =
    document.getElementById(
        "branchList"
    );


    list.innerHTML = "";


    allBranches.forEach(
        branch => {

            const button =
            document.createElement(
                "button"
            );


            button.className =
                "branch-item";


            button.textContent =
                "🌿 " +
                branch.name;


            button.onclick =
            function(){

                currentBranch =
                    branch;


                updateBranchUI();

                closeBranchMenu();

                loadFiles();

                loadReadme();

            };


            list.appendChild(
                button
            );

        }
    );

}


function updateBranchUI(){

    if(!currentBranch){
        return;
    }


    document.getElementById(
        "branchName"
    ).textContent =
        currentBranch.name;


    document.getElementById(
        "commitBranch"
    ).textContent =
        currentBranch.name;


    updatePageLinks();

}


/* =====================================================
   LOAD FILES
===================================================== */

async function loadFiles(){

    if(!currentBranch){
        return;
    }


    document.getElementById(
        "fileList"
    ).innerHTML =
    `
        <div class="empty">
            Loading files...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient

    .from("repository_files")

    .select("*")

    .eq(
        "repository_id",
        repoId
    )

    .eq(
        "branch_id",
        currentBranch.id
    )

    .order(
        "file_path",
        {
            ascending:true
        }
    );


    if(error){

        showToast(
            error.message,
            "error"
        );

        return;
    }


    allFiles =
        data || [];


    renderFiles(
        allFiles
    );

}


/* =====================================================
   RENDER FILES
===================================================== */

function renderFiles(files){

    const list =
    document.getElementById(
        "fileList"
    );


    list.innerHTML = "";


    document.getElementById(
        "fileCount"
    ).textContent =
        files.length +
        (
            files.length === 1
            ? " file"
            : " files"
        );


    if(!files.length){

        list.innerHTML =
        `
            <div class="empty">
                📁<br><br>
                No files found.
            </div>
        `;

        return;
    }


    files.forEach(
        file => {

            const row =
            document.createElement(
                "div"
            );


            row.className =
                "file-row";


            const editUrl =
                "file-editor.html" +
                "?file_id=" +
                encodeURIComponent(
                    file.id
                ) +
                "&repository_id=" +
                encodeURIComponent(
                    repoId
                ) +
                "&branch_id=" +
                encodeURIComponent(
                    currentBranch.id
                );


            let previewButton = "";


            if(!file.is_binary){

                const name =
                String(
                    file.file_path || ""
                ).toLowerCase();


                if(
                    name.endsWith(".html") ||
                    name.endsWith(".htm")
                ){

                    previewButton =
                    `
                        <button
                            class="btn btn-blue"
                            onclick="previewFile('${file.id}')">

                            👁 Preview

                        </button>
                    `;

                }

            }


            row.innerHTML =
            `

                <div class="file-main">

                    <div class="file-icon">
                        ${getFileIcon(file)}
                    </div>

                    <div>

                        <div class="file-name">

                            ${escapeHtml(
                                file.file_path
                            )}

                        </div>

                        <div class="file-sub">

                            ${
                                file.is_binary
                                ? "Binary file"
                                : "Text file"
                            }

                        </div>

                    </div>

                </div>


                <div class="file-meta">

                    <span class="type-badge">

                        ${getFileType(
                            file.file_path
                        )}

                    </span>


                    <div class="file-actions">

                        <a
                            class="btn"
                            href="${editUrl}">

                            ✏️ Edit

                        </a>


                        ${previewButton}


                        <button
                            class="btn"
                            onclick="downloadFile('${file.id}')">

                            ⬇️

                        </button>

                    </div>

                </div>

            `;


            list.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   ⭐⭐⭐ PREVIEW
   IMPORTANT PART
===================================================== */

async function previewFile(fileId){

    console.log(
        "ASIM TECH PREVIEW START"
    );


    const file =
    allFiles.find(
        item =>
        item.id === fileId
    );


    if(!file){

        showToast(
            "File not found.",
            "error"
        );

        return;
    }


    if(file.is_binary){

        showToast(
            "Binary files cannot be previewed.",
            "error"
        );

        return;
    }


    const fileName =
    String(
        file.file_path || ""
    ).toLowerCase();


    if(
        !fileName.endsWith(".html") &&
        !fileName.endsWith(".htm")
    ){

        showToast(
            "Only HTML files can be previewed.",
            "error"
        );

        return;
    }


    /* =========================================
       GET CONTENT FROM DATABASE
    ========================================= */

    let html =
        file.content || "";


    /* =========================================
       FALLBACK TO STORAGE
    ========================================= */

    if(
        !html.trim() &&
        file.storage_path
    ){

        const {
            data,
            error
        } =
        await supabaseClient

        .storage

        .from(
            "repository-files"
        )

        .download(
            file.storage_path
        );


        if(error){

            showToast(
                "Could not load file: " +
                error.message,
                "error"
            );

            return;
        }


        html =
            await data.text();

    }


    if(!html.trim()){

        showToast(
            "HTML file is empty.",
            "error"
        );

        return;
    }


    /* =========================================
       CREATE A COMPLETE HTML DOCUMENT
    ========================================= */

    const finalHTML =
`
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<base href="${window.location.origin}/">

</head>

<body>

${html}

</body>

</html>
`;


    /* =========================================
       OPEN NEW PREVIEW WINDOW
    ========================================= */

    const previewWindow =
    window.open(
        "",
        "_blank"
    );


    if(!previewWindow){

        showToast(
            "Browser blocked the Preview window. Please allow pop-ups for this site.",
            "error"
        );

        return;
    }


    previewWindow.document.open();

    previewWindow.document.write(
        finalHTML
    );

    previewWindow.document.close();


    previewWindow.document.title =
        "ASIM TECH Preview — " +
        file.file_path;


    console.log(
        "ASIM TECH PREVIEW COMPLETE"
    );

}


/* =====================================================
   DOWNLOAD
===================================================== */

async function downloadFile(fileId){

    const file =
    allFiles.find(
        item =>
        item.id === fileId
    );


    if(!file){
        return;
    }


    let blob;


    if(file.storage_path){

        const {
            data,
            error
        } =
        await supabaseClient

        .storage

        .from(
            "repository-files"
        )

        .download(
            file.storage_path
        );


        if(error){

            showToast(
                error.message,
                "error"
            );

            return;
        }


        blob =
            data;

    }else{

        blob =
        new Blob(
            [
                file.content || ""
            ],
            {
                type:
                file.mime_type ||
                "text/html"
            }
        );

    }


    const url =
    URL.createObjectURL(
        blob
    );


    const a =
    document.createElement(
        "a"
    );


    a.href =
        url;


    a.download =
        file.file_path
        .split("/")
        .pop();


    document.body.appendChild(
        a
    );


    a.click();

    a.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* =====================================================
   SEARCH
===================================================== */

function filterFiles(){

    const query =
    document.getElementById(
        "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


    if(!query){

        renderFiles(
            allFiles
        );

        return;
    }


    const filtered =
    allFiles.filter(
        file =>
        String(
            file.file_path || ""
        )
        .toLowerCase()
        .includes(
            query
        )
    );


    renderFiles(
        filtered
    );

}


/* =====================================================
   README
===================================================== */

async function loadReadme(){

    const body =
    document.getElementById(
        "readmeBody"
    );


    const readme =
    allFiles.find(
        file => {

            const name =
            String(
                file.file_path || ""
            )
            .toLowerCase();


            return(
                name === "readme.md" ||
                name === "readme.txt" ||
                name === "readme"
            );

        }
    );


    if(!readme){

        body.innerHTML =
        `
            <h2>
                ${escapeHtml(
                    repository.name
                )}
            </h2>

            <p>
                No README file is available.
            </p>
        `;

        return;
    }


    body.innerHTML =
        markdownToHtml(
            readme.content || ""
        );

}


/* =====================================================
   STAR
===================================================== */

async function loadStarStatus(){

    if(!currentUser){
        return;
    }


    const {
        data
    } =
    await supabaseClient

    .from(
        "repository_stars"
    )

    .select(
        "repository_id,user_id"
    )

    .eq(
        "repository_id",
        repoId
    )

    .eq(
        "user_id",
        currentUser.id
    )

    .maybeSingle();


    isStarred =
        !!data;


    document.getElementById(
        "starButton"
    ).textContent =
        isStarred
        ? "★ Starred"
        : "☆ Star";

}


async function toggleStar(){

    if(!currentUser){

        window.location.href =
            "login.html";

        return;
    }


    try{

        if(isStarred){

            const {
                error
            } =
            await supabaseClient

            .from(
                "repository_stars"
            )

            .delete()

            .eq(
                "repository_id",
                repoId
            )

            .eq(
                "user_id",
                currentUser.id
            );


            if(error){
                throw error;
            }


            isStarred =
                false;


        }else{

            const {
                error
            } =
            await supabaseClient

            .from(
                "repository_stars"
            )

            .insert({

                repository_id:
                    repoId,

                user_id:
                    currentUser.id

            });


            if(error){
                throw error;
            }


            isStarred =
                true;

        }


        document.getElementById(
            "starButton"
        ).textContent =
            isStarred
            ? "★ Starred"
            : "☆ Star";


    }catch(error){

        showToast(
            error.message,
            "error"
        );

    }

}

/* =====================================================
   FILE ICON
===================================================== */

function getFileIcon(file){

    if(file.is_binary){
        return "📦";
    }


    const name =
    String(
        file.file_path || ""
    ).toLowerCase();


    if(
        name.endsWith(".html") ||
        name.endsWith(".htm")
    ){
        return "🌐";
    }


    if(name.endsWith(".css")){
        return "🎨";
    }


    if(name.endsWith(".js")){
        return "⚡";
    }


    if(name.endsWith(".json")){
        return "🔧";
    }


    if(name.endsWith(".md")){
        return "📖";
    }


    if(
        name.endsWith(".png") ||
        name.endsWith(".jpg") ||
        name.endsWith(".jpeg") ||
        name.endsWith(".gif") ||
        name.endsWith(".webp")
    ){
        return "🖼️";
    }


    return "📄";

}


/* =====================================================
   FILE TYPE
===================================================== */

function getFileType(path){

    const parts =
    String(
        path || ""
    ).split(".");


    if(parts.length < 2){
        return "FILE";
    }


    return parts
        .pop()
        .toUpperCase();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MARKDOWN
===================================================== */

function markdownToHtml(markdown){

    let text =
    escapeHtml(
        markdown
    );


    text =
    text.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );


    text =
    text.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
    );


    text =
    text.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
    );


    text =
    text.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );


    text =
    text.replace(
        /\n/g,
        "<br>"
    );


    return (
        "<p>" +
        text +
        "</p>"
    );

}

function showToast(

){

    );

}

    function(event){

        const branch =
        document.querySelector(
            ".branch-wrapper"
        );


        const add =
        document.querySelector(
            ".add-wrapper"
        );


        if(
            branch &&
            !branch.contains(

            )
        ){

            closeBranchMenu();

        }


        if(
            add &&
            !add.contains(
                event.target
            )
        ){

            closeAddMenu();

        }

    }
);
