<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Repository Details - ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#1f2937;
}

.navbar{
background:linear-gradient(135deg,#0f172a,#064e3b);
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.navbar a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:14px;
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:30px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
font-size:30px;
margin-bottom:10px;
}

.description{
color:#6b7280;
margin-bottom:20px;
font-size:16px;
}

.badge{
display:inline-block;
padding:7px 14px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-bottom:25px;
}

.public{
background:#dcfce7;
color:#166534;
}

.private{
background:#fee2e2;
color:#991b1b;
}

.published{
background:#dbeafe;
color:#1d4ed8;
}

.unpublished{
background:#fef3c7;
color:#92400e;
}

.info{
background:#f8fafc;
padding:18px;
border-radius:12px;
margin-bottom:25px;
}

.info p{
margin:10px 0;
font-size:14px;
word-break:break-word;
}

.info strong{
display:inline-block;
width:120px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:12px;
}

button{
border:none;
padding:13px 18px;
border-radius:10px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.files-btn{
background:#2563eb;
color:white;
}

.edit-btn{
background:#f59e0b;
color:white;
}

.delete-btn{
background:#dc2626;
color:white;
}

.publish-btn{
background:#16a34a;
color:white;
}

.unpublish-btn{
background:#dc2626;
color:white;
}

.website-btn{
background:#7c3aed;
color:white;
}

.back-btn{
background:#64748b;
color:white;
}

.loading{
text-align:center;
padding:50px;
font-size:18px;
color:#64748b;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:20px;
border-radius:12px;
}

.notice{
background:#eff6ff;
color:#1e40af;
padding:15px;
border-radius:10px;
margin-bottom:20px;
display:none;
}

@media(max-width:600px){

.container{
margin:20px auto;
padding:15px;
}

.card{
padding:22px;
}

h1{
font-size:25px;
}

.buttons{
flex-direction:column;
}

button{
width:100%;
}

.info strong{
width:100%;
margin-bottom:4px;
}

.navbar{
flex-direction:column;
align-items:flex-start;
gap:12px;
}

.navbar a{
margin-left:0;
margin-right:12px;
}

}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">
ASIM TECH
</div>

<div>

<a href="index.html">
Home
</a>

<a href="repositories.html">
Repositories
</a>

</div>

</div>


<div class="container">

<div id="loading"
class="loading">

Loading repository...

</div>


<div id="error"
class="error"
style="display:none;">

Unable to load repository.

</div>


<div id="repositoryCard"
class="card"
style="display:none;">

<h1 id="repoName"></h1>

<div id="repoDescription"
class="description">
</div>


<div>

<span id="repoVisibility"
class="badge">
</span>

<span id="publishStatus"
class="badge">
</span>

</div>


<div id="publishNotice"
class="notice">

</div>


<div class="info">

<p>
<strong>Owner ID:</strong>
<span id="ownerId"></span>
</p>

<p>
<strong>Created:</strong>
<span id="createdAt"></span>
</p>

<p>
<strong>Updated:</strong>
<span id="updatedAt"></span>
</p>

<p>
<strong>Repository ID:</strong>
<span id="repoId"></span>
</p>

</div>


<div class="buttons">


<button
class="files-btn"
onclick="openFiles()">

📁 Repository Files

</button>


<button
id="editButton"
class="edit-btn"
onclick="editRepo()">

✏️ Edit Repository

</button>


<button
id="publishButton"
class="publish-btn"
onclick="publishRepo()"
style="display:none;">

🚀 Publish Website

</button>


<button
id="unpublishButton"
class="unpublish-btn"
onclick="unpublishRepo()"
style="display:none;">

🔴 Unpublish Website

</button>


<button
id="websiteButton"
class="website-btn"
onclick="openWebsite()"
style="display:none;">

🌐 Open Website

</button>


<button
id="deleteButton"
class="delete-btn"
onclick="deleteRepo()">

🗑️ Delete Repository

</button>


<button
class="back-btn"
onclick="goBack()">

← Back to Repositories

</button>

</div>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let repo = null;

let currentUser = null;


/* LOAD REPOSITORY */

async function loadRepo(){

try{


/* CURRENT USER */

const {
data:{user},
error:userError
} =
await supabaseClient.auth.getUser();


if(userError){

throw userError;

}


currentUser = user;


/* GET REPOSITORY ID */

const params =
new URLSearchParams(
window.location.search
);

const repoId =
params.get("id");


if(!repoId){

showError(
"Repository ID is missing."
);

return;

}


/* LOAD REPOSITORY */

const result =
await supabaseClient

.from("repositories")

.select("*")

.eq("id",repoId)

.single();


if(result.error){

console.error(result.error);

showError(
"Unable to load repository."
);

return;

}


repo = result.data;


/* BASIC INFORMATION */

document.getElementById(
"repoName"
).textContent =
repo.name;


document.getElementById(
"repoDescription"
).textContent =
repo.description ||
"No description provided.";


/* VISIBILITY */

const visibility =
document.getElementById(
"repoVisibility"
);


if(repo.is_private){

visibility.textContent =
"Private";

visibility.className =
"badge private";

}else{

visibility.textContent =
"Public";

visibility.className =
"badge public";

}


/* PUBLISH STATUS */

const publishStatus =
document.getElementById(
"publishStatus"
);


if(repo.is_published){

publishStatus.textContent =
"Website Published";

publishStatus.className =
"badge published";

}else{

publishStatus.textContent =
"Website Not Published";

publishStatus.className =
"badge unpublished";

}


/* INFORMATION */

document.getElementById(
"ownerId"
).textContent =
repo.owner_id;


document.getElementById(
"repoId"
).textContent =
repo.id;


document.getElementById(
"createdAt"
).textContent =
formatDate(repo.created_at);


document.getElementById(
"updatedAt"
).textContent =
formatDate(repo.updated_at);


/* OWNER */

const isOwner =
currentUser &&
repo.owner_id ===
currentUser.id;


/* OWNER BUTTONS */

if(!isOwner){

document.getElementById(
"editButton"
).style.display =
"none";

document.getElementById(
"deleteButton"
).style.display =
"none";

}


/* PUBLISH BUTTONS */

if(isOwner){

if(repo.is_published){

document.getElementById(
"unpublishButton"
).style.display =
"inline-block";

document.getElementById(
"websiteButton"
).style.display =
"inline-block";

}else{

document.getElementById(
"publishButton"
).style.display =
"inline-block";

}

}


/* SHOW */

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"repositoryCard"
).style.display =
"block";


}catch(error){

console.error(error);

showError(
"Something went wrong while loading repository."
);

}

}


/* ERROR */

function showError(message){

document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"error"
).textContent =
message;


document.getElementById(
"error"
).style.display =
"block";

}


/* DATE */

function formatDate(date){

if(!date){

return "—";

}

return new Date(date)
.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


/* OWNER CHECK */

function checkOwner(){

if(!repo ||
!currentUser){

alert(
"Please login first."
);

return false;

}

if(repo.owner_id !== currentUser.id){

alert(
"Only the repository owner can perform this action."
);

return false;

}

return true;

}


/* OPEN FILES */

function openFiles(){

if(!repo){

return;

}

window.location.href =
"repository-files.html?repository_id=" +
encodeURIComponent(repo.id);

}


/* EDIT */

function editRepo(){

if(!checkOwner()){

return;

}

window.location.href =
"edit-repository.html?id=" +
encodeURIComponent(repo.id);

}


/* PUBLISH WEBSITE */

async function publishRepo(){

if(!checkOwner()){

return;

}


/*
CHECK INDEX PAGE
*/

const {
data:pages,
error:pageError
} =
await supabaseClient

.from("web_pages")

.select("id,page_name,is_published")

.eq("repository_id",repo.id);


if(pageError){

console.error(pageError);

alert(
"Unable to check website pages."
);

return;

}


/*
FIND INDEX.HTML
*/

const indexPage =
(pages || []).find(
page =>
(page.page_name || "")
.toLowerCase() ===
"index.html"
);


if(!indexPage){

alert(
"Please create an index.html Web Page before publishing the website."
);

return;

}


/*
CONFIRM
*/

const confirmed =
confirm(
"Publish '" +
repo.name +
"' as a public website?"
);


if(!confirmed){

return;

}


/*
PUBLISH REPOSITORY
*/

const result =
await supabaseClient

.from("repositories")

.update({

is_published:true,

published_at:
new Date().toISOString(),

updated_at:
new Date().toISOString()

})

.eq("id",repo.id)

.eq("owner_id",currentUser.id);


if(result.error){

console.error(result.error);

alert(
"Unable to publish website."
);

return;

}


/*
PUBLISH INDEX PAGE
*/

const pageResult =
await supabaseClient

.from("web_pages")

.update({

is_published:true,

published_at:
new Date().toISOString()

})

.eq("id",indexPage.id)

.eq("owner_id",currentUser.id);


if(pageResult.error){

console.error(
pageResult.error
);

alert(
"Repository published, but index.html could not be published."
);

return;

}


alert(
"Website published successfully!"
);


/*
RELOAD
*/

location.reload();

}


/* UNPUBLISH WEBSITE */

async function unpublishRepo(){

if(!checkOwner()){

return;

}


const confirmed =
confirm(
"Unpublish '" +
repo.name +
"' website?"
);


if(!confirmed){

return;

}


/*
UNPUBLISH REPOSITORY
*/

const result =
await supabaseClient

.from("repositories")

.update({

is_published:false,

published_at:null,

updated_at:
new Date().toISOString()

})

.eq("id",repo.id)

.eq("owner_id",currentUser.id);


if(result.error){

console.error(result.error);

alert(
"Unable to unpublish website."
);

return;

}


/*
UNPUBLISH ALL PAGES
*/

const pageResult =
await supabaseClient

.from("web_pages")

.update({

is_published:false,

published_at:null

})

.eq("repository_id",repo.id)

.eq("owner_id",currentUser.id);


if(pageResult.error){

console.error(
pageResult.error
);

}


alert(
"Website unpublished successfully."
);


location.reload();

}


/* OPEN WEBSITE */

async function openWebsite(){

if(!repo){

return;

}


/*
FIND PUBLISHED INDEX
*/

const {
data:pages,
error
} =
await supabaseClient

.from("web_pages")

.select("id,page_name,is_published")

.eq("repository_id",repo.id)

.eq("is_published",true);


if(error){

console.error(error);

alert(
"Unable to open website."
);

return;

}


const indexPage =
(pages || []).find(
page =>
(page.page_name || "")
.toLowerCase() ===
"index.html"
);


if(!indexPage){

alert(
"Published index.html was not found."
);

return;

}


window.open(
"published-website.html?id=" +
encodeURIComponent(indexPage.id),
"_blank"
);

}


/* DELETE */

async function deleteRepo(){

if(!checkOwner()){

return;

}


const confirmed =
confirm(
"Are you sure you want to delete '" +
repo.name +
"'?"
);


if(!confirmed){

return;

}


try{

const result =
await supabaseClient

.from("repositories")

.delete()

.eq("id",repo.id)

.eq("owner_id",currentUser.id);


if(result.error){

throw result.error;

}


alert(
"Repository deleted successfully."
);


window.location.href =
"repositories.html";


}catch(error){

console.error(error);

alert(
"Unable to delete repository."
);

}

}


/* BACK */

function goBack(){

window.location.href =
"repositories.html";

}


/* START */

loadRepo();

</script>

</body>

</html>
