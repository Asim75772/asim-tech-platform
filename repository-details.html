<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =================================
   URL
================================= */

const params =
new URLSearchParams(
window.location.search
);

const repoId =
params.get("repository_id") ||
params.get("id");

const branchIdFromUrl =
params.get("branch_id");


/* =================================
   GLOBAL
================================= */

let currentUser = null;

let repository = null;

let allBranches = [];

let currentBranch = null;

let allFiles = [];

let isStarred = false;

let previewObjectUrls = [];


/* =================================
   LOAD
================================= */

document.addEventListener(
"DOMContentLoaded",
loadRepository
);


async function loadRepository(){

try{

if(!repoId){

throw new Error(
"Repository ID is missing."
);

}


const {
data,
error
} =
await supabaseClient
.auth
.getUser();


if(error){
throw error;
}


currentUser =
data?.user || null;


if(!currentUser){

window.location.href =
"login.html";

return;

}


const {
data:repo,
error:repoError
} =
await supabaseClient
.from("repositories")
.select("*")
.eq("id",repoId)
.single();


if(repoError){
throw repoError;
}


if(!repo){

throw new Error(
"Repository not found."
);

}


repository = repo;


renderRepository();


await loadBranches();

await loadFiles();

await loadReadme();

updatePageLinks();

updatePublishUI();

await loadStarStatus();


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"content"
).style.display =
"block";


}
catch(error){

console.error(error);


document.getElementById(
"loading"
).style.display =
"none";


const box =
document.getElementById(
"error"
);

box.style.display =
"block";

box.textContent =
error.message ||
"Unable to load repository.";

}

}


/* =================================
   REPOSITORY
================================= */

function renderRepository(){

document.getElementById(
"repoOwner"
).textContent =
"ASIM TECH";


document.getElementById(
"repoName"
).textContent =
repository.name;


document.getElementById(
"repoDescription"
).textContent =
repository.description ||
"No description";


document.getElementById(
"visibility"
).textContent =
repository.is_private
? "Private"
: "Public";


document.getElementById(
"starCount"
).textContent =
repository.stars_count || 0;


document.getElementById(
"forkCount"
).textContent =
repository.forks_count || 0;

}


/* =================================
   BRANCHES
================================= */

async function loadBranches(){

const {
data,
error
} =
await supabaseClient
.from("repository_branches")
.select("*")
.eq("repository_id",repoId)
.order(
"name",
{
ascending:true
}
);


if(error){
throw error;
}


allBranches =
data || [];


if(!allBranches.length){

throw new Error(
"No branches found."
);

}


let selected = null;


if(branchIdFromUrl){

selected =
allBranches.find(
b =>
b.id ===
branchIdFromUrl
);

}


if(!selected){

selected =
allBranches.find(
b =>
b.name ===
(
repository.default_branch ||
"main"
)
);

}


if(!selected){

selected =
allBranches[0];

}


currentBranch =
selected;


renderBranchMenu();

updateBranchUI();

}


/* =================================
   BRANCH MENU
================================= */

function renderBranchMenu(){

const list =
document.getElementById(
"branchList"
);

list.innerHTML = "";


allBranches.forEach(
branch => {

const button =
document.createElement(
"button"
);

button.className =
"branch-item";

button.textContent =
"🌿 " +
branch.name;


button.onclick =
async function(){

currentBranch =
branch;

updateBranchUI();

await loadFiles();

await loadReadme();

closeBranchMenu();

};


list.appendChild(
button
);

}
);

}


function updateBranchUI(){

if(!currentBranch){
return;
}


document.getElementById(
"branchName"
).textContent =
currentBranch.name;


document.getElementById(
"commitBranch"
).textContent =
currentBranch.name;


updatePageLinks();

}


/* =================================
   FILES
================================= */

async function loadFiles(){

if(!currentBranch){
return;
}


document.getElementById(
"fileList"
).innerHTML =
`
<div class="empty">
Loading files...
</div>
`;


const {
data,
error
} =
await supabaseClient
.from("repository_files")
.select("*")
.eq("repository_id",repoId)
.eq("branch_id",currentBranch.id)
.order(
"file_path",
{
ascending:true
}
);


if(error){

showToast(
error.message,
"error"
);

return;

}


allFiles =
data || [];


renderFiles(allFiles);

}


/* =================================
   RENDER FILES
================================= */

function renderFiles(files){

const list =
document.getElementById(
"fileList"
);

list.innerHTML = "";


document.getElementById(
"fileCount"
).textContent =
files.length +
(
files.length === 1
? " file"
: " files"
);


if(!files.length){

list.innerHTML =
`
<div class="empty">

📁

<br><br>

No files found.

</div>
`;

return;

}


files.forEach(
file => {

const row =
document.createElement(
"div"
);

row.className =
"file-row";


const editUrl =
"file-editor.html" +
"?file_id=" +
encodeURIComponent(file.id) +
"&repository_id=" +
encodeURIComponent(repoId) +
"&branch_id=" +
encodeURIComponent(currentBranch.id);


let previewButton = "";


if(!file.is_binary){

previewButton =
`
<button
class="btn btn-blue"
type="button"
onclick="previewFile('${file.id}')">

👁 Preview

</button>
`;

}


row.innerHTML =
`

<div class="file-main">

<div class="file-icon">

${getFileIcon(file)}

</div>


<div>

<div class="file-name">

${escapeHtml(file.file_path)}

</div>


<div class="file-sub">

${
file.is_binary
? "Binary file"
: "Text file"
}

${
file.updated_at
? " • Updated " +
formatDate(file.updated_at)
: ""
}

</div>

</div>

</div>


<div class="file-meta">

<span class="type-badge">

${getFileType(file.file_path)}

</span>


<span>

${formatFileSize(file.file_size)}

</span>


<div class="file-actions">

<a
class="btn"
href="${editUrl}">

✏️ Edit

</a>


${previewButton}


<button
class="btn"
onclick="downloadFile('${file.id}')">

⬇️

</button>

</div>

</div>

`;


list.appendChild(row);

}
);

}


/* =================================
   GET FILE CONTENT
================================= */

async function getFileContent(file){

if(
file.content !== null &&
file.content !== undefined &&
String(file.content).trim() !== ""
){

return file.content;

}


if(
file.storage_path
){

const {
data,
error
} =
await supabaseClient
.storage
.from("repository-files")
.download(
file.storage_path
);


if(error){
throw error;
}


return await data.text();

}


return "";

}


/* =================================
   GET FILE BLOB
================================= */

async function getFileBlob(file){

if(file.storage_path){

const {
data,
error
} =
await supabaseClient
.storage
.from("repository-files")
.download(
file.storage_path
);


if(error){
throw error;
}


return data;

}


return new Blob(
[
file.content || ""
],
{
type:
file.mime_type ||
"application/octet-stream"
}
);

}


/* =================================
   PATH NORMALIZATION
================================= */

function normalizePath(path){

let p =
String(path || "")
.replace(
/\\/g,
"/"
);

while(
p.startsWith("./")
){

p =
p.substring(2);

}


const parts = [];

p.split("/").forEach(
part => {

if(
!part ||
part === "."
){

return;

}

if(
part === ".."
){

parts.pop();

return;

}

parts.push(part);

}
);

return parts.join("/");

}


/* =================================
   RESOLVE ASSET PATH
================================= */

function resolveAssetPath(
baseFile,
reference
){

if(!reference){
return null;
}


let ref =
String(reference).trim();


if(
ref.startsWith("data:") ||
ref.startsWith("blob:") ||
ref.startsWith("http://") ||
ref.startsWith("https://") ||
ref.startsWith("//") ||
ref.startsWith("#") ||
ref.startsWith("mailto:")
){

return null;

}


ref =
ref.split("#")[0];

ref =
ref.split("?")[0];


if(!ref){
return null;
}


const base =
normalizePath(baseFile);


const slash =
base.lastIndexOf("/");


const directory =
slash >= 0
? base.substring(0,slash)
: "";


let resolved;


if(ref.startsWith("/")){

resolved =
normalizePath(
ref.substring(1)
);

}
else{

resolved =
normalizePath(
directory
? directory + "/" + ref
: ref
);

}


let file =
allFiles.find(
f =>
normalizePath(
f.file_path
) === resolved
);


if(file){
return file;
}


/*
   Fallback:
   Search by filename.
*/

const basename =
resolved
.split("/")
.pop();


file =
allFiles.find(
f =>
normalizePath(
f.file_path
)
.split("/")
.pop() === basename
);


return file || null;

}


/* =================================
   ASSET URL
================================= */

async function createAssetURL(file){

const blob =
await getFileBlob(file);


const url =
URL.createObjectURL(blob);


previewObjectUrls.push(url);


return url;

}


/* =================================
   REPLACE CSS ASSETS
================================= */

async function processCss(
css,
cssFile
){

return await replaceAsync(
css,
/
url\(\s*(['"]?)(.*?)\1\s*\)
/gi,
async function(
full,
quote,
reference
){

const asset =
resolveAssetPath(
cssFile.file_path,
reference
);

if(!asset){

return full;

}

try{

const url =
await createAssetURL(
asset
);

return "url('" + url + "')";

}
catch(e){

return full;

}

}
);

}


/* =================================
   ASYNC REGEX REPLACE
================================= */

async function replaceAsync(
string,
regex,
asyncFn
){

const matches = [];

string.replace(
regex,
function(){

matches.push(
Array.from(arguments)
);

}
);


const replacements =
await Promise.all(
matches.map(
args =>
asyncFn(...args)
)
);


let index = 0;


return string.replace(
regex,
function(){

return replacements[
index++
];

}
);

}


/* =================================
   PREPARE HTML
================================= */

async function preparePreviewHTML(
html,
htmlFile
){

const parser =
new DOMParser();


const doc =
parser.parseFromString(
html,
"text/html"
);


/*
   CSS files
*/

const links =
Array.from(
doc.querySelectorAll(
'link[href]'
)
);


for(
const link of links
){

const href =
link.getAttribute(
"href"
);


if(!href){
continue;
}


if(
href.toLowerCase()
.includes("stylesheet")
){

const cssFile =
resolveAssetPath(
htmlFile.file_path,
href
);


if(cssFile){

try{

let css =
await getFileContent(
cssFile
);


css =
await processCss(
css,
cssFile
);


const style =
doc.createElement(
"style"
);

style.textContent =
css;


link.replaceWith(
style
);

}
catch(e){

console.error(
"CSS load error",
e
);

}

}

}

}


/*
   JavaScript files
*/

const scripts =
Array.from(
doc.querySelectorAll(
"script[src]"
)
);


for(
const script of scripts
){

const src =
script.getAttribute(
"src"
);


const jsFile =
resolveAssetPath(
htmlFile.file_path,
src
);


if(jsFile){

try{

const js =
await getFileContent(
jsFile
);


script.removeAttribute(
"src"
);

script.textContent =
js;

}
catch(e){

console.error(
"JS load error",
e
);

}

}

}


/*
   Images
*/

const images =
Array.from(
doc.querySelectorAll(
"img[src]"
)
);


for(
const img of images
){

const src =
img.getAttribute(
"src"
);


const imageFile =
resolveAssetPath(
htmlFile.file_path,
src
);


if(imageFile){

try{

const url =
await createAssetURL(
imageFile
);

img.setAttribute(
"src",
url
);

}
catch(e){

console.error(
"Image load error",
e
);

}

}

}


/*
   Favicon
*/

const icons =
Array.from(
doc.querySelectorAll(
'link[rel*="icon"][href]'
)
);


for(
const icon of icons
){

const href =
icon.getAttribute(
"href"
);


const iconFile =
resolveAssetPath(
htmlFile.file_path,
href
);


if(iconFile){

try{

const url =
await createAssetURL(
iconFile
);

icon.setAttribute(
"href",
url
);

}
catch(e){}

}

}


/*
   Local HTML links

   Convert them to repository
   HTML preview URLs when possible.
*/

const anchors =
Array.from(
doc.querySelectorAll(
"a[href]"
)
);


for(
const anchor of anchors
){

const href =
anchor.getAttribute(
"href"
);


if(
!href ||
href.startsWith("#") ||
href.startsWith("http") ||
href.startsWith("mailto:")
){

continue;

}


const target =
resolveAssetPath(
htmlFile.file_path,
href
);


if(
target &&
(
target.file_path
.toLowerCase()
.endsWith(".html") ||
target.file_path
.toLowerCase()
.endsWith(".htm")
)
){

/*
   Keep the link relative.
   It will remain usable where
   the browser can resolve it.
*/

}

}


/*
   Add responsive safety.
*/

const head =
doc.querySelector("head");


if(head){

const viewport =
doc.querySelector(
'meta[name="viewport"]'
);


if(!viewport){

const meta =
doc.createElement(
"meta"
);

meta.name =
"viewport";

meta.content =
"width=device-width, initial-scale=1.0";

head.prepend(meta);

}

}


return "<!DOCTYPE html>\n" +
doc.documentElement.outerHTML;

}


/* =================================
   LIVE PREVIEW
================================= */

async function previewFile(
fileId
){

try{

const file =
allFiles.find(
item =>
item.id === fileId
);


if(!file){

showToast(
"File not found.",
"error"
);

return;

}


if(file.is_binary){

showToast(
"Binary files cannot be previewed.",
"error"
);

return;

}


const path =
String(
file.file_path || ""
).toLowerCase();


if(
!path.endsWith(".html") &&
!path.endsWith(".htm")
){

showToast(
"Live Preview is available for HTML files.",
"error"
);

return;

}


/*
   Clear old preview URLs.
*/

previewObjectUrls.forEach(
url =>
URL.revokeObjectURL(url)
);

previewObjectUrls = [];


let html =
await getFileContent(file);


if(!html.trim()){

showToast(
"HTML file is empty.",
"error"
);

return;

}


/*
   Prepare CSS, JS and images.
*/

html =
await preparePreviewHTML(
html,
file
);


/*
   Create final preview.
*/

const blob =
new Blob(
[html],
{
type:
"text/html;charset=utf-8"
}
);


const previewURL =
URL.createObjectURL(
blob
);


previewObjectUrls.push(
previewURL
);


const previewWindow =
window.open(
previewURL,
"_blank"
);


if(!previewWindow){

showToast(
"Please allow pop-ups for ASIM TECH.",
"error"
);

return;

}


/*
   Keep assets alive for 10 minutes.
*/

setTimeout(
function(){

previewObjectUrls.forEach(
url =>
URL.revokeObjectURL(
url
)
);

previewObjectUrls = [];

},
600000
);

}
catch(error){

console.error(error);

showToast(
"Preview error: " +
error.message,
"error"
);

}

}

/* =================================
   PUBLISH
================================= */

async function publishRepository(){

try{

if(!currentUser){
return;
}


if(
repository.owner_id !==
currentUser.id
){

showToast(
"Only repository owner can publish.",
"error"
);

return;

}


const branchName =
repository.default_branch ||
"main";


const {
data:branch,
error:branchError
} =
await supabaseClient
.from("repository_branches")
.select("id,name")
.eq(
"repository_id",
repoId
)
.eq(
"name",
branchName
)
.maybeSingle();


if(branchError){
throw branchError;
}


if(!branch){

showToast(
"Default branch not found.",
"error"
);

return;

}


const {
data:file,
error:fileError
} =
await supabaseClient
.from("repository_files")
.select("*")
.eq(
"repository_id",
repoId
)
.eq(
"branch_id",
branch.id
)
.eq(
"file_path",
"index.html"
)
.maybeSingle();


if(fileError){
throw fileError;
}


if(!file){

showToast(
"index.html not found.",
"error"
);

return;

}


if(file.is_binary){

showToast(
"index.html is marked as binary.",
"error"
);

return;

}


/*
   Check database OR Storage.
*/

let html = "";


try{

html =
await getFileContent(
file
);

}
catch(error){

showToast(
"Unable to read index.html: " +
error.message,
"error"
);

return;

}


if(!html.trim()){

showToast(
"index.html is empty.",
"error"
);

return;

}


if(
!confirm(
"Publish repository " +
repository.name +
"?\n\nDefault file: index.html"
)
){

return;

}


const {
error
} =
await supabaseClient
.from("repositories")
.update({

is_published:
true,

published_at:
new Date().toISOString(),

updated_at:
new Date().toISOString()

})
.eq(
"id",
repoId
);


if(error){
throw error;
}


repository.is_published =
true;


updatePublishUI();


showToast(
"Repository published successfully!",
"success"
);

}
catch(error){

showToast(
error.message,
"error"
);

}

}

}


const name =
(
file.file_path || ""
)
.toLowerCase();


if(
name.endsWith(".html") ||
name.endsWith(".htm")
){

}


if(
name.endsWith(".css")
){

return "🎨";

}


if(
name.endsWith(".js")
){

}


if(
name.endsWith(".json")
){

}

name.endsWith(".gif") ||
name.endsWith(".webp") ||
name.endsWith(".svg")
){

}


return "📄";

}

/* =================================
   FILE SIZE
================================= */

function formatFileSize(bytes){

if(
bytes === null ||
bytes === undefined ||
bytes === ""
){

return "";

}


const n =
Number(bytes);


if(n < 1024){

return n + " B";

}


if(
n < 1024 * 1024
){

return (
n / 1024
).toFixed(1) +
" KB";

}


if(
n < 1024 *
1024 *
1024
){

return (
n /
(1024 * 1024)
).toFixed(1) +
" MB";

}


return (
n /
(1024 *
1024 *
1024)
).toFixed(1) +
" GB";

}

   DATE
================================= */

if(!value){
return "";
}


try{

return new Date(
value
).toLocaleString(
"en-IN",
{

day:"2-digit",

month:"short",

year:"numeric",

hour:"2-digit",

minute:"2-digit"

}
);

}
catch(e){

return "";

}

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =================================
   MARKDOWN
================================= */

function markdownToHtml(
markdown
){

let text =
escapeHtml(
markdown
);


text =
text.replace(
/^### (.*)$/gm,
"<h3>$1</h3>"
);


text =
text.replace(
/^## (.*)$/gm,
"<h2>$1</h2>"
);


text =
text.replace(
/^# (.*)$/gm,
"<h1>$1</h1>"
);


text =
text.replace(
/\*\*(.*?)\*\*/g,
"<strong>$1</strong>"
);


text =
text.replace(
/\n\n/g,
"</p><p>"
);


text =
text.replace(
/\n/g,
"<br>"
);


return "<p>" +
text +
"</p>";

}
