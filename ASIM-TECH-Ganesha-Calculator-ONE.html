<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ASIM TECH Calculator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111}
body{display:flex;justify-content:center;align-items:center}
.app{
 width:100%;max-width:520px;height:100vh;position:relative;overflow:hidden;
 background-image:url("https://upload.wikimedia.org/wikipedia/commons/5/58/Lord_Ganesha.jpg");
 background-size:cover;background-position:center;
 padding:16px;
}
.app:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.30)}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
h1{margin:0;text-align:center;color:#fff;font-size:30px;text-shadow:0 2px 5px #000}
.sub{text-align:center;color:#fff;font-size:17px;margin:8px 0 18px;text-shadow:0 2px 4px #000}
.display{
 min-height:120px;border:1px solid rgba(255,255,255,.5);border-radius:32px;
 background:rgba(10,20,30,.58);color:#fff;display:flex;align-items:center;
 justify-content:flex-end;padding:18px 28px;font-size:58px;overflow:hidden
}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:20px;flex:1}
button{
 border:1px solid rgba(255,255,255,.35);border-radius:26px;
 background:rgba(10,20,30,.78);color:#fff;font-size:28px;font-weight:700;
 min-height:60px;box-shadow:0 4px 10px rgba(0,0,0,.3)
}
button:active{transform:scale(.96)}
.op{background:rgba(255,145,0,.94)} .ac{background:rgba(245,0,0,.94)}
.eq{background:rgba(0,205,55,.95)} .zero{grid-column:span 2}
.footer{text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 2px 4px #000;margin-top:7px}
@media(max-height:700px){
 h1{font-size:25px}.sub{margin:4px 0 9px}.display{min-height:88px;font-size:45px}
 .keys{gap:8px;margin-top:10px}button{min-height:50px;font-size:23px}
}
</style>
</head>
<body>
<div class="app"><div class="content">
<h1>ASIM TECH Calculator</h1>
<div class="sub">Calculate with Positive Vibes</div>
<div id="display" class="display">0</div>
<div class="keys">
<button class="ac" onclick="clearAll()">AC</button>
<button onclick="backspace()">⌫</button>
<button onclick="percent()">%</button>
<button class="op" onclick="press('/')">÷</button>
<button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('*')">×</button>
<button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('-')">−</button>
<button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('+')">+</button>
<button class="zero" onclick="press('0')">0</button><button onclick="press('.')">.</button><button class="eq" onclick="calculate()">=</button>
</div>
<div class="footer">|| गणेशाय नमः || • ASIM TECH</div>
</div></div>
<script>
let expr="",d=document.getElementById("display");
function update(){d.textContent=expr||"0"}
function press(v){expr+=v;update()}
function clearAll(){expr="";update()}
function backspace(){expr=expr.slice(0,-1);update()}
function percent(){try{expr=String(parseFloat(expr)/100);update()}catch(e){}}
function calculate(){
 try{if(!expr)return;if(!/^[0-9+\-*\/().\s]+$/.test(expr))throw 0;
 expr=String(Function("return ("+expr+")")());update()}
 catch(e){d.textContent="Error";setTimeout(clearAll,900)}
}
</script>
</body>
</html>
