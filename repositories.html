<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Repositories — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#07111f,#0b2233,#063b35);
    color:#fff;
    min-height:100vh;
}

nav{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(5,12,22,.92);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#36e0b5;
}

.nav-links{
    display:flex;
    gap:22px;
}

.nav-links a{
    color:#ddd;
    text-decoration:none;
}

.nav-links a:hover{
    color:#36e0b5;
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.header h1{
    font-size:32px;
}

.header p{
    color:#aab7c4;
    margin-top:7px;
}

.new-btn{
    background:#36e0b5;
    color:#06151a;
    text-decoration:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
    white-space:nowrap;
}

.new-btn:hover{
    opacity:.9;
}

.search{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #294252;
    background:#0c1b29;
    color:#fff;
    outline:none;
    margin-bottom:25px;
    font-size:15px;
}

.search:focus{
    border-color:#36e0b5;
}

#loading{
    text-align:center;
    color:#aab7c4;
    padding:40px;
}

#message{
    text-align:center;
    color:#ff8d8d;
    padding:20px;
    display:none;
}

.repositories{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.repo-card{
    background:rgba(13,29,43,.9);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:22px;
    transition:.2s;
}

.repo-card:hover{
    transform:translateY(-3px);
    border-color:#36e0b5;
}

.repo-name{
    font-size:21px;
    font-weight:bold;
    color:#fff;
    margin-bottom:10px;
    word-break:break-word;
}

.repo-description{
    color:#aab7c4;
    min-height:45px;
    line-height:1.5;
    margin-bottom:18px;
}

.badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    background:#17384a;
    color:#8edfc9;
}

.private{
    background:#46351c;
    color:#ffd27a;
}

.repo-info{
    color:#8293a1;
    font-size:13px;
    margin-bottom:16px;
}

.empty{
    text-align:center;
    padding:55px 20px;
    background:rgba(13,29,43,.8);
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#aab7c4;
    margin-bottom:20px;
}

.empty a{
    display:inline-block;
    background:#36e0b5;
    color:#06151a;
    padding:11px 18px;
    border-radius:9px;
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    color:#71818d;
    padding:35px 10px;
    font-size:13px;
}

@media(max-width:600px){

    nav{
        padding:0 5%;
    }

    .nav-links{
        gap:12px;
        font-size:13px;
    }

    .container{
        width:92%;
        margin:28px auto;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .header h1{
        font-size:27px;
    }

    .new-btn{
        width:100%;
        text-align:center;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">⚡ ASIM TECH</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="repositories.html">Repositories</a>
        <a href="dashboard.html">Dashboard</a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <div>
            <h1>📁 Repositories</h1>
            <p>Your ASIM TECH repositories</p>
        </div>

        <a class="new-btn" href="new-repository.html">
            ＋ New Repository
        </a>
    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 Search repositories..."
    >

    <div id="loading">
        Loading repositories...
    </div>

    <div id="message"></div>

    <div id="repositories" class="repositories"></div>

</div>

<footer>
    © 2026 ASIM TECH — Code. Create. Innovate.
</footer>


<script>

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let allRepositories = [];


/* Load repositories */

async function loadRepositories(){

    const loading =
        document.getElementById("loading");

    const message =
        document.getElementById("message");

    const container =
        document.getElementById("repositories");

    try{

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();


        if(userError){
            throw userError;
        }


        if(!user){

            window.location.href = "login.html";
            return;
        }


        const { data, error } =
            await supabaseClient
                .from("repositories")
                .select("*")
                .order("created_at", {
                    ascending:false
                });


        if(error){
            throw error;
        }


        allRepositories = data || [];

        loading.style.display = "none";

        renderRepositories(allRepositories);

    }
    catch(error){

        console.error(error);

        loading.style.display = "none";

        message.style.display = "block";

        message.textContent =
            "Unable to load repositories. Please try again.";

    }
}


/* Display repositories */

function renderRepositories(repositories){

    const container =
        document.getElementById("repositories");

    container.innerHTML = "";


    if(repositories.length === 0){

        container.innerHTML = `
            <div class="empty">
                <h2>📂 No repositories yet</h2>

                <p>
                    Create your first repository on ASIM TECH.
                </p>

                <a href="new-repository.html">
                    ＋ Create Repository
                </a>
            </div>
        `;

        return;
    }


    repositories.forEach(repo => {

        const card =
            document.createElement("div");

        card.className = "repo-card";


        const visibility =
            repo.is_private
                ? "Private"
                : "Public";


        const badgeClass =
            repo.is_private
                ? "badge private"
                : "badge";


        let date = "";

        if(repo.created_at){

            date =
                new Date(
                    repo.created_at
                ).toLocaleDateString(
                    "en-IN",
                    {
                        day:"numeric",
                        month:"short",
                        year:"numeric"
                    }
                );
        }


        card.innerHTML = `

            <div class="repo-name">
                📦 ${escapeHtml(repo.name)}
            </div>

            <div class="repo-description">
                ${
                    repo.description
                    ? escapeHtml(repo.description)
                    : "No description provided."
                }
            </div>

            <div class="badges">

                <span class="${badgeClass}">
                    ${visibility}
                </span>

                <span class="badge">
                    ASIM TECH
                </span>

            </div>

            <div class="repo-info">
                Created ${date}
            </div>

        `;


        container.appendChild(card);

    });

}


/* Search */

document
    .getElementById("search")
    .addEventListener("input", function(){

        const search =
            this.value
                .toLowerCase()
                .trim();


        const filtered =
            allRepositories.filter(repo => {

                const name =
                    (repo.name || "")
                    .toLowerCase();

                const description =
                    (repo.description || "")
                    .toLowerCase();


                return (
                    name.includes(search) ||
                    description.includes(search)
                );

            });


        renderRepositories(filtered);

    });


/* Security: escape HTML */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* Start */

loadRepositories();

</script>

</body>
</html>
