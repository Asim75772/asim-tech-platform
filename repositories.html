<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repositories — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#07111f,#0b2233,#063b35);
color:#fff;
min-height:100vh;
}

nav{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
background:rgba(5,12,22,.95);
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{font-size:22px;font-weight:bold;color:#36e0b5}

.nav-links{display:flex;gap:20px}
.nav-links a{color:#ddd;text-decoration:none}
.nav-links a:hover{color:#36e0b5}

.container{
width:90%;
max-width:1000px;
margin:40px auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-bottom:25px;
}

h1{font-size:32px}
.header p{color:#aab7c4;margin-top:7px}

.new-btn{
background:#36e0b5;
color:#06151a;
text-decoration:none;
padding:13px 18px;
border-radius:10px;
font-weight:bold;
}

.search{
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #294252;
background:#0c1b29;
color:#fff;
outline:none;
margin-bottom:25px;
font-size:15px;
}

.repositories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:18px;
}

.repo-card{
background:rgba(13,29,43,.95);
border:1px solid rgba(255,255,255,.1);
border-radius:14px;
padding:22px;
}

.repo-name{
font-size:21px;
font-weight:bold;
margin-bottom:10px;
word-break:break-word;
}

.repo-description{
color:#aab7c4;
line-height:1.5;
min-height:45px;
margin-bottom:18px;
}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:12px;
background:#17384a;
color:#8edfc9;
margin-right:6px;
}

.private{
background:#46351c;
color:#ffd27a;
}

.info{
color:#8293a1;
font-size:13px;
margin:16px 0;
}

.open-btn{
display:block;
text-align:center;
background:#17384a;
color:#8edfc9;
padding:11px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

.open-btn:hover{
background:#36e0b5;
color:#06151a;
}

#loading{
text-align:center;
padding:40px;
color:#aab7c4;
}

#message{
text-align:center;
padding:30px;
color:#ff8d8d;
display:none;
}

.empty{
text-align:center;
padding:50px 20px;
background:rgba(13,29,43,.9);
border-radius:14px;
}

.empty p{
color:#aab7c4;
margin:12px 0 20px;
}

.empty a{
display:inline-block;
background:#36e0b5;
color:#06151a;
padding:11px 18px;
border-radius:9px;
text-decoration:none;
font-weight:bold;
}

footer{
text-align:center;
color:#71818d;
padding:40px 10px;
}

@media(max-width:600px){
nav{padding:0 5%}
.nav-links{gap:10px;font-size:13px}
.container{width:92%;margin:28px auto}
.header{flex-direction:column;align-items:flex-start}
.new-btn{width:100%;text-align:center}
h1{font-size:28px}
}
</style>
</head>

<body>

<nav>
<div class="logo">⚡ ASIM TECH</div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="repositories.html">Repositories</a>
<a href="dashboard.html">Dashboard</a>
</div>
</nav>

<div class="container">

<div class="header">
<div>
<h1>📁 Repositories</h1>
<p>Your ASIM TECH repositories</p>
</div>

<a class="new-btn" href="new-repository.html">
＋ New Repository
</a>
</div>

<input
id="search"
class="search"
type="text"
placeholder="🔍 Search repositories..."
>

<div id="loading">Loading repositories...</div>

<div id="message"></div>

<div id="repositories" class="repositories"></div>

</div>

<footer>
© 2026 ASIM TECH — Code. Create. Innovate.
</footer>

<script>

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let allRepositories=[];


async function loadRepositories(){

try{

const {
data:{user},
error:userError
}=await supabaseClient.auth.getUser();

if(userError) throw userError;

if(!user){
window.location.href="login.html";
return;
}

const {data,error}=
await supabaseClient
.from("repositories")
.select("*")
.order("created_at",{ascending:false});

if(error) throw error;

allRepositories=data || [];

document.getElementById("loading").style.display="none";

renderRepositories(allRepositories);

}catch(error){

console.error(error);

document.getElementById("loading").style.display="none";

const message=document.getElementById("message");

message.style.display="block";

message.textContent=
"Unable to load repositories.";

}

}


function renderRepositories(list){

const container=
document.getElementById("repositories");

container.innerHTML="";

if(list.length===0){

container.innerHTML=`
<div class="empty">
<h2>📂 No repositories yet</h2>
<p>Create your first ASIM TECH repository.</p>
<a href="new-repository.html">
＋ Create Repository
</a>
</div>
`;

return;
}


list.forEach(repo=>{

const card=document.createElement("div");

card.className="repo-card";

const visibility=repo.is_private
?"🔒 Private"
:"🌐 Public";

const privateClass=repo.is_private
?"private"
:"";

const date=repo.created_at
?new Date(repo.created_at).toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
})
:"";


card.innerHTML=`

<div class="repo-name">
📦 ${escapeHtml(repo.name)}
</div>

<div class="repo-description">
${escapeHtml(
repo.description ||
"No description provided."
)}
</div>

<div>
<span class="badge ${privateClass}">
${visibility}
</span>

<span class="badge">
ASIM TECH
</span>
</div>

<div class="info">
Created ${date}
</div>

<a
class="open-btn"
href="repository-details.html?id=${encodeURIComponent(repo.id)}"
>
Open Repository →
</a>

`;

container.appendChild(card);

});

}


document
.getElementById("search")
.addEventListener("input",function(){

const text=this.value.toLowerCase().trim();

const filtered=allRepositories.filter(repo=>
(repo.name||"").toLowerCase().includes(text) ||
(repo.description||"").toLowerCase().includes(text)
);

renderRepositories(filtered);

});


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


loadRepositories();

</script>

</body>
</html>
