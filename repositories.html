<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Repositories — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#07111f,#0b2233,#063b35);
    color:#fff;
    min-height:100vh;
}

nav{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 6%;
    background:rgba(5,12,22,.95);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#36e0b5;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.nav-links a,
.nav-links button{
    color:#ddd;
    text-decoration:none;
    background:transparent;
    border:0;
    padding:8px 10px;
    cursor:pointer;
    font-size:14px;
}

.nav-links a:hover{
    color:#36e0b5;
}

.logout{
    border:1px solid rgba(255,255,255,.15) !important;
    border-radius:8px;
    color:#ff9b9b !important;
}

.logout:hover{
    background:#3b2025 !important;
}

.container{
    width:92%;
    max-width:1000px;
    margin:35px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

h1{
    font-size:32px;
}

.subtitle{
    color:#aab7c4;
    margin-top:8px;
    font-size:16px;
}

.new-btn{
    background:#36e0b5;
    color:#06151a;
    text-decoration:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
    display:inline-block;
    text-align:center;
    white-space:nowrap;
}

.new-btn:hover{
    background:#4be9c2;
}

.search-box{
    background:rgba(13,29,43,.95);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:16px;
    margin-bottom:25px;
}

.search-label{
    display:block;
    color:#aab7c4;
    margin-bottom:9px;
    font-size:14px;
}

#searchInput{
    width:100%;
    padding:13px 15px;
    border-radius:9px;
    border:1px solid #3a4a57;
    background:#081521;
    color:#fff;
    outline:none;
    font-size:16px;
}

#searchInput:focus{
    border-color:#36e0b5;
}

.search-info{
    color:#8293a1;
    font-size:13px;
    margin-top:9px;
}

.card{
    background:rgba(13,29,43,.95);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
}

.repo-card{
    transition:transform .15s ease,
                border-color .15s ease;
}

.repo-card:hover{
    transform:translateY(-2px);
    border-color:rgba(54,224,181,.4);
}

.repo-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.repo-name{
    font-size:21px;
    font-weight:bold;
    word-break:break-word;
}

.repo-name a{
    color:#58a6ff;
    text-decoration:none;
}

.repo-name a:hover{
    text-decoration:underline;
}

.badge{
    display:inline-block;
    padding:4px 9px;
    border-radius:20px;
    font-size:12px;
    white-space:nowrap;
}

.public-badge{
    background:#123b2d;
    color:#36e0b5;
    border:1px solid #236b52;
}

.private-badge{
    background:#3d2920;
    color:#ffcc8a;
    border:1px solid #73502d;
}

.repo-description{
    color:#aab7c4;
    margin:12px 0;
    line-height:1.5;
    word-break:break-word;
}

.repo-meta{
    color:#8293a1;
    font-size:13px;
    margin-bottom:15px;
}

.repo-actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.open-btn{
    background:#17384a;
    color:#8edfc9;
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
    font-weight:bold;
    font-size:14px;
}

.open-btn:hover{
    background:#1d4a60;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#aab7c4;
}

.empty h2{
    margin-bottom:12px;
}

.loading{
    text-align:center;
    padding:45px 20px;
    color:#aab7c4;
}

.error{
    display:none;
    background:#4b2027;
    color:#ffb5bd;
    padding:14px;
    border-radius:9px;
    margin-bottom:20px;
}

.stats{
    color:#8293a1;
    font-size:14px;
    margin-bottom:15px;
}

footer{
    text-align:center;
    color:#71818d;
    padding:40px 10px;
    margin-top:40px;
    border-top:1px solid rgba(255,255,255,.08);
}

@media(max-width:600px){

    nav{
        padding:12px 5%;
        align-items:flex-start;
        flex-direction:column;
        gap:12px;
    }

    .nav-links{
        width:100%;
        justify-content:flex-start;
    }

    .container{
        width:92%;
        margin:25px auto;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .header .new-btn{
        width:100%;
    }

    h1{
        font-size:27px;
    }

    .repo-header{
        flex-direction:column;
    }

    .repo-actions{
        width:100%;
    }

    .open-btn{
        flex:1;
        text-align:center;
    }

}

</style>

</head>


<body>


<nav>

<div class="logo">
⚡ ASIM TECH
</div>


<div class="nav-links">

<a href="index.html">
Home
</a>

<a href="dashboard.html">
Dashboard
</a>

<a href="profile.html">
👤 Profile
</a>

<button
class="logout"
id="logoutBtn">

🚪 Logout

</button>

</div>

</nav>



<div class="container">


<div class="header">

<div>

<h1>
📁 Repositories
</h1>

<p class="subtitle">
Explore and manage your repositories
</p>

</div>


<a
href="new-repository.html"
class="new-btn">

＋ New Repository

</a>

</div>



<div
id="error"
class="error">
</div>



<!-- SEARCH -->


<div class="search-box">

<label
class="search-label"
for="searchInput">

🔎 Search repositories

</label>


<input
type="search"
id="searchInput"
placeholder="Search by repository name or description...">


<div
id="searchInfo"
class="search-info">

Loading repositories...

</div>

</div>



<div
id="stats"
class="stats">

</div>



<div
id="repoList">

<div class="loading">

Loading repositories...

</div>

</div>


</div>



<footer>

© 2026 ASIM TECH — Code. Create. Innovate.

</footer>



<script>


/* SUPABASE */


const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



let currentUser = null;

let allRepositories = [];



/* ELEMENTS */


const repoList =
document.getElementById(
    "repoList"
);


const searchInput =
document.getElementById(
    "searchInput"
);


const searchInfo =
document.getElementById(
    "searchInfo"
);


const stats =
document.getElementById(
    "stats"
);


const errorBox =
document.getElementById(
    "error"
);


const logoutBtn =
document.getElementById(
    "logoutBtn"
);



/* ESCAPE HTML */


function escapeHtml(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}



/* SHOW ERROR */


function showError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}



/* HIDE ERROR */


function hideError(){

    errorBox.style.display =
        "none";

}



/* FORMAT DATE */


function formatDate(value){

    if(!value){

        return "Unknown";

    }

    const date =
        new Date(value);

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}



/* LOAD REPOSITORIES */


async function loadRepositories(){

    try{

        hideError();


        /* CHECK LOGIN */


        const {
            data:{user},
            error:userError
        } =
        await supabaseClient
            .auth
            .getUser();


        if(userError){

            throw userError;

        }


        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;



        /* LOAD REPOSITORIES */


        const {
            data,
            error
        } =
        await supabaseClient

            .from("repositories")

            .select(
                "id,owner_id,name,description,is_private,created_at,updated_at"
            )

            .order(
                "updated_at",
                {
                    ascending:false
                }
            );


        if(error){

            throw error;

        }


        allRepositories =
            data || [];


        renderRepositories(
            allRepositories
        );


    }catch(error){

        console.error(
            "Repository error:",
            error
        );


        repoList.innerHTML = `

            <div class="card empty">

                <h2>
                    ⚠️ Unable to load repositories
                </h2>

                <p style="margin-top:10px;">
                    Please refresh the page.
                </p>

            </div>

        `;


        searchInfo.textContent =
            "Unable to load repositories.";


        showError(
            error.message ||
            "Unable to load repositories."
        );

    }

}



/* RENDER REPOSITORIES */


function renderRepositories(
    repositories
){

    repoList.innerHTML =
        "";


    const searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();


    let filtered =
        repositories.filter(
            function(repo){

                if(!searchTerm){

                    return true;

                }


                const name =
                    String(
                        repo.name || ""
                    ).toLowerCase();


                const description =
                    String(
                        repo.description || ""
                    ).toLowerCase();


                return (
                    name.includes(
                        searchTerm
                    ) ||
                    description.includes(
                        searchTerm
                    )
                );

            }
        );



    /* STATS */


    stats.textContent =
        filtered.length +
        " repository" +
        (
            filtered.length === 1
            ? ""
            : "ies"
        );



    searchInfo.textContent =
        searchTerm
        ? `Showing ${filtered.length} result(s) for "${searchInput.value.trim()}"`
        : `${repositories.length} repository(s) available`;



    /* EMPTY SEARCH RESULT */


    if(filtered.length === 0){

        repoList.innerHTML = `

            <div class="card empty">

                <h2>
                    🔎 No repositories found
                </h2>

                <p>
                    Try another repository name or description.
                </p>

            </div>

        `;

        return;

    }



    /* DISPLAY */


    filtered.forEach(
        function(repo){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card repo-card";


            const badge =
                repo.is_private

                ? `
                    <span class="badge private-badge">
                        🔒 Private
                    </span>
                  `

                : `
                    <span class="badge public-badge">
                        🌐 Public
                    </span>
                  `;



            const description =
                repo.description
                ? escapeHtml(
                    repo.description
                  )
                : "No description";



            card.innerHTML = `

                <div class="repo-header">

                    <div>

                        <div class="repo-name">

                            <a
                                href="repository-details.html?id=${encodeURIComponent(repo.id)}"
                            >

                                ${escapeHtml(repo.name)}

                            </a>

                        </div>

                    </div>


                    <div>

                        ${badge}

                    </div>

                </div>


                <div class="repo-description">

                    ${description}

                </div>


                <div class="repo-meta">

                    Updated:
                    ${formatDate(
                        repo.updated_at ||
                        repo.created_at
                    )}

                </div>


                <div class="repo-actions">

                    <a
                        class="open-btn"
                        href="repository-details.html?id=${encodeURIComponent(repo.id)}"
                    >

                        📂 Open Repository →

                    </a>

                </div>

            `;


            repoList.appendChild(
                card
            );

        }
    );

}



/* SEARCH */


searchInput.addEventListener(
    "input",
    function(){

        renderRepositories(
            allRepositories
        );

    }
);



/* LOGOUT */


logoutBtn.addEventListener(
    "click",
    async function(){

        try{

            logoutBtn.disabled =
                true;

            logoutBtn.textContent =
                "Logging out...";


            const {
                error
            } =
            await supabaseClient
                .auth
                .signOut();


            if(error){

                throw error;

            }


            window.location.href =
                "login.html";


        }catch(error){

            console.error(
                "Logout error:",
                error
            );


            alert(
                "Logout failed: " +
                error.message
            );


            logoutBtn.disabled =
                false;

            logoutBtn.textContent =
                "🚪 Logout";

        }

    }
);



/* START */


loadRepositories();


</script>


</body>

</html>
