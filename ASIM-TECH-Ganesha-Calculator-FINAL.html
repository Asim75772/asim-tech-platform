.app{min-height:100vh;width:100%;max-width:520px;margin:auto;padding:18px 16px 22px;background:rgba(0,0,0,.08)}
.header{display:flex;align-items:center;margin-bottom:5px}
.icon{width:48px;text-align:center;font-size:32px;text-shadow:0 3px 8px #000}
.title{flex:1;text-align:center;font: bold 30px Georgia,serif;white-space:nowrap;text-shadow:0 3px 8px #000}
.subtitle{text-align:center;font-size:16px;margin-bottom:14px;text-shadow:0 2px 6px #000}
.display{min-height:145px;display:flex;align-items:flex-end;justify-content:flex-end;padding:20px;margin-bottom:16px;font-size:56px;border-radius:24px;background:rgba(10,8,7,.55);border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 25px rgba(0,0,0,.45);overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{min-height:78px;border-radius:20px;color:#fff;font-size:27px;font-weight:bold;background:rgba(18,28,38,.72);border:1px solid rgba(255,255,255,.28);box-shadow:0 6px 12px rgba(0,0,0,.4)}
button:active{transform:scale(.94)}
.operator{background:rgba(255,135,0,.94)} .equal{background:#00bd43} .clear{background:#e50000}
.zero{grid-column:span 2}
.footer{text-align:center;margin-top:22px;color:#ffe2a5;font-size:16px;text-shadow:0 2px 5px #000}
.brand{margin-top:8px;color:#eee;font-size:14px}
@media(max-width:400px){.app{padding:12px 10px 18px}.title{font-size:23px}.icon{font-size:27px;width:40px}.display{min-height:125px;font-size:46px}button{min-height:68px;font-size:24px}}
</style></head><body>
<div class="app">
<div class="header"><div class="icon">☰</div><div class="title">ASIM TECH Calculator</div><div class="icon">⚙</div></div>
<div class="subtitle">─── Calculate with Positive Vibes ───</div>
<div id="display" class="display">0</div>
<div class="keys">
<button class="clear" onclick="clearAll()">AC</button><button onclick="backspace()">⌫</button><button onclick="percent()">%</button><button class="operator" onclick="operator('/')">÷</button>
<button onclick="number('7')">7</button><button onclick="number('8')">8</button><button onclick="number('9')">9</button><button class="operator" onclick="operator('*')">×</button>
<button onclick="number('4')">4</button><button onclick="number('5')">5</button><button onclick="number('6')">6</button><button class="operator" onclick="operator('-')">−</button>
<button onclick="number('1')">1</button><button onclick="number('2')">2</button><button onclick="number('3')">3</button><button class="operator" onclick="operator('+')">+</button>
<button class="zero" onclick="number('0')">0</button><button onclick="decimal()">.</button><button class="equal" onclick="calculate()">=</button>
</div>
<div class="footer">─── || गणेशाय नमः || ───<div class="brand">ASIM TECH • Simple Calculator</div></div>
</div>
<script>
let current="0",previous=null,op=null,waiting=false;
const display=document.getElementById("display");
function update(){display.textContent=current}
function number(n){if(waiting){current=n;waiting=false}else{current=current==="0"?n:current+n}update()}
function decimal(){if(waiting){current="0.";waiting=false}else if(!current.includes("."))current+=".";update()}
function operator(x){if(previous!==null&&!waiting)calculate();previous=parseFloat(current);op=x;waiting=true}
function calculate(){if(previous===null||!op)return;let a=previous,b=parseFloat(current),r;if(op==="+")r=a+b;if(op==="-")r=a-b;if(op==="*")r=a*b;if(op==="/"){if(b===0){current="Error";previous=null;op=null;update();return}r=a/b}current=Number(r.toFixed(10)).toString();previous=null;op=null;waiting=true;update()}
function percent(){current=(parseFloat(current)/100).toString();update()}
function clearAll(){current="0";previous=null;op=null;waiting=false;update()}
function backspace(){if(waiting)return;current=current.length<=1?"0":current.slice(0,-1);update()}
</script></body></html>
