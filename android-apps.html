<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Android Apps — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:#ffffff;
}

nav{
    min-height:64px;
    background:#161b22;
    border-bottom:1px solid #30363d;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;
}

.logo{
    font-size:21px;
    font-weight:700;
}

.green{
    color:#39d353;
}

nav a{
    color:#58a6ff;
    text-decoration:none;
    margin-left:16px;
}

nav a:hover{
    text-decoration:underline;
}

main{
    max-width:1000px;
    margin:auto;
    padding:30px 18px;
}

.head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

h1{
    margin:0 0 7px;
}

.muted{
    color:#8b949e;
}

.btn{
    border:0;
    border-radius:8px;
    padding:11px 16px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
}

.primary{
    background:#238636;
    color:#ffffff;
}

.primary:hover{
    background:#2ea043;
}

.secondary{
    background:#21262d;
    color:#ffffff;
    border:1px solid #30363d;
}

.secondary:hover{
    background:#30363d;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(250px,1fr)
        );

    gap:16px;

    margin-top:24px;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:20px;
}

.card h3{
    margin:0 0 8px;
    color:#58a6ff;
}

.card p{
    color:#8b949e;
    min-height:42px;
}

.meta{
    font-size:13px;
    color:#8b949e;
    margin:12px 0;
}

.empty{
    text-align:center;
    padding:55px;
    color:#8b949e;
    grid-column:1 / -1;
}

.loading{
    text-align:center;
    padding:55px;
    color:#58a6ff;
    grid-column:1 / -1;
}

.error{
    text-align:center;
    padding:35px;
    color:#ff7b72;
    background:#161b22;
    border:1px solid #f85149;
    border-radius:10px;
    grid-column:1 / -1;
}

.modal{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.65);

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.box{
    width:min(480px,100%);

    background:#161b22;

    border:1px solid #30363d;

    border-radius:12px;

    padding:22px;
}

.box h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
textarea{

    width:100%;

    background:#0d1117;

    color:#ffffff;

    border:1px solid #30363d;

    border-radius:7px;

    padding:11px;

    margin:7px 0 14px;

    font-family:Arial,sans-serif;

}

input:focus,
textarea:focus{

    outline:none;

    border-color:#58a6ff;

}

.actions{

    display:flex;

    gap:9px;

    justify-content:flex-end;

}

.user-bar{

    margin-top:20px;

    padding:12px 15px;

    background:#161b22;

    border:1px solid #30363d;

    border-radius:8px;

    color:#8b949e;

    font-size:14px;

}

.user-email{

    color:#58a6ff;

    font-weight:bold;

}

@media(max-width:700px){

    nav{

        padding:10px 15px;

        flex-wrap:wrap;

        gap:10px;

    }

    nav div:last-child{

        width:100%;

        text-align:right;

    }

    nav a{

        font-size:13px;

        margin-left:10px;

    }

    main{

        padding:25px 15px;

    }

    .head{

        align-items:flex-start;

    }

    .head .btn{

        width:100%;

        text-align:center;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav>

    <div class="logo">

        <span class="green">
            ASIM
        </span>

        TECH

    </div>


    <div>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="index.html">
            Home
        </a>

    </div>

</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <div class="head">

        <div>

            <h1>
                📱 Android Apps
            </h1>

            <div class="muted">
                Create mobile-first apps with the ASIM TECH visual builder.
            </div>

        </div>


        <button
            class="btn primary"
            onclick="openModal()"
        >
            ＋ Create App
        </button>

    </div>



    <!-- USER -->

    <div
        id="userBar"
        class="user-bar"
    >
        Checking login...
    </div>



    <!-- APP LIST -->

    <div
        id="list"
        class="grid"
    >

        <div class="loading">
            Loading apps...
        </div>

    </div>


</main>



<!-- =====================================================
     CREATE APP MODAL
===================================================== -->

<div
    id="modal"
    class="modal"
>

    <div class="box">

        <h2>
            Create Android App
        </h2>


        <label for="name">
            App Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="My Mobile App"
        >


        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            rows="3"
            placeholder="What does your app do?"
        ></textarea>


        <div class="actions">

            <button
                class="btn secondary"
                onclick="closeModal()"
            >
                Cancel
            </button>


            <button
                class="btn primary"
                onclick="createApp()"
            >
                Create
            </button>

        </div>

    </div>

</div>



<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";


/*
   IMPORTANT:
   Correct Publishable Key
*/

const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


/* =====================================================
   CREATE SUPABASE CLIENT
===================================================== */

const sb =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                autoRefreshToken:true,
                persistSession:true,
                detectSessionInUrl:true
            }
        }
    );


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let user = null;


/* =====================================================
   DOM ELEMENTS
===================================================== */

const list =
    document.getElementById("list");

const modal =
    document.getElementById("modal");

const nameInput =
    document.getElementById("name");

const descriptionInput =
    document.getElementById("description");

const userBar =
    document.getElementById("userBar");


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(match){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[match];

        }
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

async function init(){

    try{

        userBar.textContent =
            "Checking login...";


        /*
           Give Supabase a moment to restore
           the persisted session.
        */

        const {
            data:sessionData,
            error:sessionError
        } =
        await sb.auth.getSession();


        if(sessionError){

            console.error(
                "Session error:",
                sessionError
            );

        }


        if(
            sessionData &&
            sessionData.session &&
            sessionData.session.user
        ){

            user =
                sessionData.session.user;

        }


        /*
           If session was not immediately available,
           ask Supabase for the current user.
        */

        if(!user){

            const {
                data:userData,
                error:userError
            } =
            await sb.auth.getUser();


            if(userError){

                console.error(
                    "User error:",
                    userError
                );

            }


            if(
                userData &&
                userData.user
            ){

                user =
                    userData.user;

            }

        }


        /*
           No logged-in user
        */

        if(!user){

            userBar.innerHTML = `
                Not signed in.
                Redirecting to login...
            `;

            setTimeout(
                function(){

                    window.location.href =
                        "login.html";

                },
                800
            );

            return;

        }


        /*
           User successfully authenticated
        */

        userBar.innerHTML = `
            Signed in as:
            <span class="user-email">
                ${esc(user.email || "User")}
            </span>
        `;


        /*
           Load apps
        */

        await load();


    }catch(error){

        console.error(
            "Initialization error:",
            error
        );


        userBar.innerHTML =
            "Authentication error. Please login again.";


        list.innerHTML = `

            <div class="error">

                Unable to initialize ASIM TECH.

                <br><br>

                <button
                    class="btn primary"
                    onclick="location.reload()"
                >
                    🔄 Try Again
                </button>

            </div>

        `;

    }

}


/* =====================================================
   AUTH STATE LISTENER
===================================================== */

sb.auth.onAuthStateChange(
    function(event, session){

        console.log(
            "Auth event:",
            event
        );


        if(
            session &&
            session.user
        ){

            user =
                session.user;

            userBar.innerHTML = `
                Signed in as:
                <span class="user-email">
                    ${esc(user.email || "User")}
                </span>
            `;

        }

    }
);


/* =====================================================
   LOAD APPS
===================================================== */

async function load(){

    if(!user){

        return;

    }


    list.innerHTML = `

        <div class="loading">

            Loading apps...

        </div>

    `;


    const {

        data,
        error

    } =
    await sb

        .from("apps")

        .select(
            "id,name,description,is_published,created_at,updated_at"
        )

        .eq(
            "owner_id",
            user.id
        )

        .order(
            "updated_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Apps load error:",
            error
        );


        list.innerHTML = `

            <div class="error">

                Unable to load apps.

                <br><br>

                ${esc(error.message)}

            </div>

        `;

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                No apps yet.

                <br><br>

                Click
                <b>Create App</b>
                to start.

            </div>

        `;

        return;

    }


    list.innerHTML =

        data.map(
            function(app){

                return `

                    <div class="card">

                        <h3>
                            ${esc(app.name)}
                        </h3>


                        <p>
                            ${esc(
                                app.description ||
                                "No description"
                            )}
                        </p>


                        <div class="meta">

                            ${
                                app.is_published
                                ? "🟢 Published"
                                : "🟡 Draft"
                            }

                            ·

                            Updated

                            ${
                                new Date(
                                    app.updated_at ||
                                    app.created_at
                                ).toLocaleString()
                            }

                        </div>


                        <a
                            class="btn secondary"
                            href="android-builder.html?id=${encodeURIComponent(app.id)}"
                        >

                            Open Builder →

                        </a>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   OPEN CREATE MODAL
===================================================== */

function openModal(){

    modal.classList.add(
        "show"
    );

    setTimeout(
        function(){

            nameInput.focus();

        },
        100
    );

}


/* =====================================================
   CLOSE CREATE MODAL
===================================================== */

function closeModal(){

    modal.classList.remove(
        "show"
    );

}


/* =====================================================
   CREATE APP
===================================================== */

async function createApp(){

    if(!user){

        alert(
            "You are not logged in. Please login again."
        );

        return;

    }


    const appName =
        nameInput.value.trim();


    const appDescription =
        descriptionInput.value.trim();


    if(!appName){

        alert(
            "Please enter an app name."
        );

        nameInput.focus();

        return;

    }


    const {

        data,
        error

    } =
    await sb

        .from("apps")

        .insert({

            owner_id:user.id,

            name:appName,

            description:appDescription

        })

        .select("id")

        .single();


    if(error){

        console.error(
            "Create app error:",
            error
        );


        alert(
            "Unable to create app:\n\n" +
            error.message
        );

        return;

    }


    /*
       Open Android Builder
    */

    window.location.href =
        "android-builder.html?id=" +
        encodeURIComponent(
            data.id
        );

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

modal.addEventListener(
    "click",
    function(event){

        if(
            event.target === modal
        ){

            closeModal();

        }

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

nameInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            createApp();

        }

    }
);


/* =====================================================
   START
===================================================== */

init();

</script>

</body>

</html>
