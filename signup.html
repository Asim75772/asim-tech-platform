<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - ASIM TECH</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #39d353;
        }

        .tagline {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
        }

        .box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #c9d1d9;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #39d353;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #8b949e;
        }

        .login a {
            color: #58a6ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>ASIM</span> TECH
    </div>

    <p class="tagline">
        Code. Create. Innovate.
    </p>

    <div class="box">

        <h2>Create your account</h2>

        <form id="signupForm">

            <label>Username</label>
            <input
                id="username"
                type="text"
                placeholder="Choose a username"
                required
            >

            <label>Full Name</label>
            <input
                id="fullName"
                type="text"
                placeholder="Your full name"
                required
            >

            <label>Email</label>
            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                id="password"
                type="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <button type="submit" id="signupBtn">
                Create Account
            </button>

            <div id="message"></div>

        </form>

    </div>

    <div class="login">
        Already have an account?
        <a href="login.html">Sign in</a>
    </div>

</div>

<script>

    const SUPABASE_URL =
        "https://lgwaeqgiqrsjprsecwxx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    document
        .getElementById("signupForm")
        .addEventListener("submit", async function (e) {

            e.preventDefault();

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const message =
                document.getElementById("message");

            const button =
                document.getElementById("signupBtn");


            message.textContent = "";

            button.disabled = true;

            button.textContent =
                "Creating account...";


            try {

                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {

                                username: username,

                                full_name: fullName

                            }

                        }

                    });


                if (error) {
                    throw error;
                }


                message.style.color =
                    "#39d353";

                message.textContent =
                    "Account created successfully! Please check your email if confirmation is required.";


                document
                    .getElementById("signupForm")
                    .reset();


            } catch (error) {

                message.style.color =
                    "#ff7b72";

                message.textContent =
                    error.message;

            }


            button.disabled = false;

            button.textContent =
                "Create Account";

        });

</script>

</body>
</html>
