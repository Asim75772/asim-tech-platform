<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Published Website — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
height:100%;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#ffffff;
color:#1f2937;
}

/* ================================
   LOADING
================================ */

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#ffffff;
font-size:20px;
color:#64748b;
}

/* ================================
   ERROR
================================ */

#error{
display:none;
max-width:700px;
margin:80px auto;
padding:25px;
background:#fee2e2;
color:#991b1b;
border-radius:14px;
text-align:center;
}

#error h2{
margin-bottom:10px;
}

/* ================================
   WEBSITE
================================ */

#website{
display:none;
width:100%;
min-height:100vh;
}

/* ================================
   TOP BAR
================================ */

.topbar{
background:#0f172a;
color:white;
padding:12px 20px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.brand{
font-weight:bold;
font-size:18px;
}

.status{
background:#166534;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

/* ================================
   WEBSITE FRAME
================================ */

.website-frame{
width:100%;
height:calc(100vh - 55px);
min-height:500px;
border:0;
background:white;
display:block;
}

</style>

</head>


<body>


<!-- ================================
     LOADING
================================ -->

<div id="loading">

🚀 Loading repository...

</div>


<!-- ================================
     ERROR
================================ -->

<div id="error">

<h2>
Website unavailable
</h2>

<p id="errorText">
Unable to load this website.
</p>

</div>


<!-- ================================
     WEBSITE
================================ -->

<div id="website">

<div class="topbar">

<div class="brand">
⚡ ASIM TECH
</div>

<div class="status">
● Published
</div>

</div>


<iframe
id="websiteFrame"
class="website-frame"
sandbox="allow-scripts allow-forms allow-modals allow-popups">
</iframe>

</div>



<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GET REPOSITORY ID
===================================================== */

const params =
new URLSearchParams(
window.location.search
);


/*
Accept both:

?id=REPOSITORY_ID

and

?repository_id=REPOSITORY_ID
*/

const repositoryId =
params.get("repository_id") ||
params.get("id");


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message){

document.getElementById("loading")
.style.display="none";


document.getElementById("website")
.style.display="none";


const errorBox =
document.getElementById("error");


document.getElementById("errorText")
.textContent =
message;


errorBox.style.display="block";

}


/* =====================================================
   LOAD PUBLISHED REPOSITORY
===================================================== */

async function loadPublishedWebsite(){

try{


/* -----------------------------------------------
   CHECK REPOSITORY ID
------------------------------------------------ */

if(!repositoryId){

showError(
"Repository ID is missing."
);

return;

}


/* -----------------------------------------------
   LOAD REPOSITORY
------------------------------------------------ */

const {
data:repository,
error:repositoryError
} =
await supabaseClient

.from("repositories")

.select(`
id,
name,
description,
is_private,
is_published,
default_branch
`)

.eq("id",repositoryId)

.single();


if(repositoryError){

console.error(
"Repository error:",
repositoryError
);

showError(
"Unable to load repository."
);

return;

}


/* -----------------------------------------------
   CHECK PUBLISHED STATUS
------------------------------------------------ */

if(!repository.is_published){

showError(
"This repository has not been published yet."
);

return;

}


/* -----------------------------------------------
   PRIVATE REPOSITORY CHECK
------------------------------------------------ */

if(repository.is_private){

showError(
"This website is private and cannot be viewed publicly."
);

return;

}


/* -----------------------------------------------
   LOAD INDEX.HTML
------------------------------------------------ */

const {
data:file,
error:fileError
} =
await supabaseClient

.from("repository_files")

.select(`
file_path,
content,
language,
is_binary,
mime_type
`)

.eq(
"repository_id",
repositoryId
)

.eq(
"file_path",
"index.html"
)

.eq(
"is_binary",
false
)

.maybeSingle();


if(fileError){

console.error(
"File error:",
fileError
);

showError(
"Unable to load index.html."
);

return;

}


/* -----------------------------------------------
   INDEX.HTML CHECK
------------------------------------------------ */

if(!file){

showError(
"This published repository does not contain an index.html file."
);

return;

}


/* -----------------------------------------------
   GET HTML
------------------------------------------------ */

const html =
file.content || "";


if(!html.trim()){

showError(
"The index.html file is empty."
);

return;

}


/* -----------------------------------------------
   WEBSITE FRAME
------------------------------------------------ */

const frame =
document.getElementById(
"websiteFrame"
);


/* -----------------------------------------------
   BUILD HTML
------------------------------------------------ */

let completeHtml;


/*
If the uploaded index.html already contains
<html>, <head> or <body>, use it directly.

Otherwise create a complete HTML document.
*/

if(
/<html[\s>]/i.test(html) ||
/<!DOCTYPE/i.test(html)
){

completeHtml = html;

}else{

completeHtml = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
${escapeHtml(repository.name || "ASIM TECH")}
</title>

</head>

<body>

${html}

</body>

</html>

`;

}


/* -----------------------------------------------
   DISPLAY WEBSITE
------------------------------------------------ */

frame.srcdoc =
completeHtml;


/* -----------------------------------------------
   PAGE TITLE
------------------------------------------------ */

document.title =
(repository.name || "Website") +
" — ASIM TECH";


/* -----------------------------------------------
   SHOW WEBSITE
------------------------------------------------ */

document.getElementById("loading")
.style.display="none";


document.getElementById("website")
.style.display="block";


console.log(
"Published website loaded successfully:",
repository.name
);


}catch(error){

console.error(
"Published website error:",
error
);

showError(
"Unable to load the published website."
);

}

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

loadPublishedWebsite();

</script>


</body>

</html>
