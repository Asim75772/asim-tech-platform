<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Published Website</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
}


/* ================================
   LOADING
================================ */

#loading {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #ffffff;

    color: #475569;

    font-size: 20px;

    z-index: 9999;
}


/* ================================
   ERROR
================================ */

#error {

    display: none;

    position: fixed;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    width: min(700px, 90%);

    padding: 30px;

    background: #fee2e2;

    color: #991b1b;

    border-radius: 14px;

    text-align: center;

    z-index: 99999;
}

#error h2 {
    margin-bottom: 10px;
}


/* ================================
   WEBSITE
================================ */

#website {

    display: none;

    width: 100%;

    height: 100vh;

    background: #ffffff;
}


#websiteFrame {

    display: block;

    width: 100%;

    height: 100vh;

    border: 0;

    margin: 0;

    padding: 0;

    background: #ffffff;
}

</style>

</head>


<body>


<div id="loading">
    🚀 Loading website...
</div>


<div id="error">

    <h2>
        Website unavailable
    </h2>

    <p id="errorText">
        Unable to load this website.
    </p>

</div>


<div id="website">

    <iframe
        id="websiteFrame"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin allow-presentation">
    </iframe>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GET REPOSITORY ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const repositoryId =
    params.get("repository_id") ||
    params.get("id");


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "website"
    ).style.display = "none";


    document.getElementById(
        "errorText"
    ).textContent = message;


    document.getElementById(
        "error"
    ).style.display = "block";
}


/* =====================================================
   NORMALIZE PATH
===================================================== */

function normalizePath(path) {

    if (!path) {
        return "";
    }


    return String(path)

        .replace(/\\/g, "/")

        .replace(/^\.\/+/, "")

        .replace(/^\/+/, "")

        .replace(/\/+/g, "/")

        .trim();
}


/* =====================================================
   RESOLVE FILE PATH
===================================================== */

function resolveFilePath(
    source,
    baseFile
) {

    if (!source) {
        return "";
    }


    /* Remove query */

    source =
        source
            .split("?")[0]
            .split("#")[0];


    /* External URL */

    if (
        /^https?:\/\//i.test(source) ||
        /^\/\//.test(source)
    ) {

        return null;
    }


    /* Data / Blob */

    if (
        source.startsWith("data:") ||
        source.startsWith("blob:")
    ) {

        return null;
    }


    const base =
        normalizePath(
            baseFile
        );


    const parts =
        base.split("/");


    parts.pop();


    const sourceParts =
        source
            .replace(/^\/+/, "")
            .split("/");


    for (
        const part of sourceParts
    ) {

        if (
            part === "" ||
            part === "."
        ) {

            continue;
        }


        if (part === "..") {

            if (parts.length) {
                parts.pop();
            }

        } else {

            parts.push(part);

        }

    }


    return normalizePath(
        parts.join("/")
    );
}


/* =====================================================
   FIND FILE
===================================================== */

function findFile(
    fileMap,
    requestedPath
) {

    const cleanPath =
        normalizePath(
            requestedPath
        );


    if (
        Object.prototype.hasOwnProperty.call(
            fileMap,
            cleanPath
        )
    ) {

        return cleanPath;
    }


    /* Try root filename */

    const filename =
        cleanPath.split("/").pop();


    const matches =
        Object.keys(fileMap)
            .filter(function(path) {

                return (
                    path === filename ||
                    path.endsWith(
                        "/" + filename
                    )
                );

            });


    if (matches.length === 1) {

        return matches[0];
    }


    return null;
}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/"/g, "&quot;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;");
}


/* =====================================================
   LOAD WEBSITE
===================================================== */

async function loadPublishedWebsite() {

    try {


        /* ---------------------------------------------
           REPOSITORY ID
        --------------------------------------------- */

        if (!repositoryId) {

            showError(
                "Repository ID is missing."
            );

            return;
        }


        /* ---------------------------------------------
           REPOSITORY
        --------------------------------------------- */

        const {
            data: repository,
            error: repositoryError
        } =
        await supabaseClient

            .from("repositories")

            .select(`
                id,
                name,
                description,
                is_private,
                is_published,
                default_branch
            `)

            .eq(
                "id",
                repositoryId
            )

            .single();


        if (repositoryError) {

            console.error(
                repositoryError
            );

            showError(
                "Unable to load repository."
            );

            return;
        }


        if (!repository) {

            showError(
                "Repository was not found."
            );

            return;
        }


        /* ---------------------------------------------
           PUBLISHED
        --------------------------------------------- */

        if (!repository.is_published) {

            showError(
                "This repository has not been published yet."
            );

            return;
        }


        /* ---------------------------------------------
           PRIVATE
        --------------------------------------------- */

        if (repository.is_private) {

            showError(
                "This website is private."
            );

            return;
        }


        /* ---------------------------------------------
           BRANCH
        --------------------------------------------- */

        const branchName =
            repository.default_branch ||
            "main";


        const {
            data: branch,
            error: branchError
        } =
        await supabaseClient

            .from("repository_branches")

            .select(`
                id,
                name
            `)

            .eq(
                "repository_id",
                repositoryId
            )

            .eq(
                "name",
                branchName
            )

            .maybeSingle();


        if (branchError) {

            console.error(
                branchError
            );

            showError(
                "Unable to load branch."
            );

            return;
        }


        if (!branch) {

            showError(
                "Published branch was not found."
            );

            return;
        }


        /* =================================================
           LOAD ALL FILES
        ================================================= */

        const {
            data: files,
            error: filesError
        } =
        await supabaseClient

            .from("repository_files")

            .select(`
                file_path,
                content,
                language,
                is_binary,
                mime_type,
                branch_id
            `)

            .eq(
                "repository_id",
                repositoryId
            )

            .eq(
                "branch_id",
                branch.id
            );


        if (filesError) {

            console.error(
                filesError
            );

            showError(
                "Unable to load repository files."
            );

            return;
        }


        /* =================================================
           CREATE FILE MAP
        ================================================= */

        const fileMap = {};


        (files || []).forEach(
            function(file) {

                if (
                    !file.file_path ||
                    file.is_binary
                ) {

                    return;
                }


                const path =
                    normalizePath(
                        file.file_path
                    );


                fileMap[path] =
                    file.content || "";

            }
        );


        console.log(
            "ASIM TECH files:",
            Object.keys(fileMap)
        );


        /* =================================================
           INDEX.HTML
        ================================================= */

        const indexPath =
            findFile(
                fileMap,
                "index.html"
            );


        if (!indexPath) {

            showError(
                "index.html was not found."
            );

            return;
        }


        let html =
            fileMap[indexPath];


        if (!html ||
            !html.trim()) {

            showError(
                "index.html is empty."
            );

            return;
        }


        /* =================================================
           CSS INJECTION
        ================================================= */

        html =
            html.replace(

                /<link\b([^>]*?)\bhref\s*=\s*["']([^"']+)["']([^>]*?)>/gi,

                function(
                    fullTag,
                    before,
                    href,
                    after
                ) {

                    /* Only stylesheet */

                    if (
                        !/\brel\s*=\s*["']stylesheet["']/i
                            .test(fullTag)
                    ) {

                        return fullTag;
                    }


                    /* External */

                    if (
                        /^https?:\/\//i.test(href) ||
                        /^\/\//.test(href) ||
                        href.startsWith("data:")
                    ) {

                        return fullTag;
                    }


                    const resolved =
                        resolveFilePath(
                            href,
                            indexPath
                        );


                    if (!resolved) {

                        return fullTag;
                    }


                    const actualPath =
                        findFile(
                            fileMap,
                            resolved
                        );


                    if (!actualPath) {

                        console.warn(
                            "CSS NOT FOUND:",
                            href
                        );

                        return fullTag;
                    }


                    const css =
                        fileMap[actualPath];


                    console.log(
                        "CSS LOADED:",
                        actualPath
                    );


                    return `

<style
data-asim-tech-file="${escapeAttribute(actualPath)}">

${css}

</style>

`;

                }
            );


        /* =================================================
           JAVASCRIPT INJECTION
        ================================================= */

        html =
            html.replace(

                /<script\b([^>]*?)\bsrc\s*=\s*["']([^"']+)["']([^>]*)>\s*<\/script>/gi,

                function(
                    fullTag,
                    before,
                    src,
                    after
                ) {

                    /* External */

                    if (
                        /^https?:\/\//i.test(src) ||
                        /^\/\//.test(src) ||
                        src.startsWith("data:") ||
                        src.startsWith("blob:")
                    ) {

                        return fullTag;
                    }


                    const resolved =
                        resolveFilePath(
                            src,
                            indexPath
                        );


                    if (!resolved) {

                        return fullTag;
                    }


                    const actualPath =
                        findFile(
                            fileMap,
                            resolved
                        );


                    if (!actualPath) {

                        console.warn(
                            "JAVASCRIPT NOT FOUND:",
                            src
                        );

                        return fullTag;
                    }


                    const js =
                        fileMap[actualPath];


                    console.log(
                        "JAVASCRIPT LOADED:",
                        actualPath
                    );


                    /*
                       Protect </script>
                    */

                    const safeJS =
                        String(js)
                            .replace(
                                /<\/script>/gi,
                                "<\\/script>"
                            );


                    return `

<script
data-asim-tech-file="${escapeAttribute(actualPath)}">

${safeJS}

<\/script>

`;

                }
            );


        /* =================================================
           FIX RELATIVE LINKS / IMAGES
        ================================================= */

        html =
            html.replace(

                /<img\b([^>]*?)\bsrc\s*=\s*["']([^"']+)["']([^>]*)>/gi,

                function(
                    fullTag,
                    before,
                    src,
                    after
                ) {

                    if (
                        /^https?:\/\//i.test(src) ||
                        /^data:/i.test(src) ||
                        /^blob:/i.test(src)
                    ) {

                        return fullTag;
                    }


                    const resolved =
                        resolveFilePath(
                            src,
                            indexPath
                        );


                    if (!resolved) {
                        return fullTag;
                    }


                    const actualPath =
                        findFile(
                            fileMap,
                            resolved
                        );


                    if (!actualPath) {
                        return fullTag;
                    }


                    return fullTag;
                }
            );


        /* =================================================
           ADD BASE
        ================================================= */

        /*
           Do NOT add a base URL.
           CSS and JS have already been injected.
        */


        /* =================================================
           FRAME
        ================================================= */

        const frame =
            document.getElementById(
                "websiteFrame"
            );


        frame.srcdoc =
            html;


        /* =================================================
           TITLE
        ================================================= */

        document.title =
            repository.name ||
            "Published Website";


        /* =================================================
           SHOW
        ================================================= */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "website"
        ).style.display =
            "block";


        console.log(
            "ASIM TECH publishing engine loaded successfully."
        );


    }

    catch (error) {

        console.error(
            "PUBLISH ERROR:",
            error
        );


        showError(
            "Unable to load website: " +
            error.message
        );

    }

}


/* =====================================================
   START
===================================================== */

loadPublishedWebsite();

</script>


</body>

</html>
