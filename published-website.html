<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Published Website</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ================================
   RESET
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* ================================
   FULL PAGE
================================ */

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #1f2937;
}


/* ================================
   LOADING
================================ */

#loading {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #ffffff;

    font-size: 20px;

    color: #64748b;

    z-index: 9999;
}


/* ================================
   ERROR
================================ */

#error {

    display: none;

    max-width: 700px;

    margin: 80px auto;

    padding: 25px;

    background: #fee2e2;

    color: #991b1b;

    border-radius: 14px;

    text-align: center;
}

#error h2 {

    margin-bottom: 10px;
}


/* ================================
   WEBSITE
================================ */

#website {

    display: none;

    width: 100%;

    height: 100vh;

    min-height: 100vh;

    background: #ffffff;
}


/* ================================
   WEBSITE FRAME
================================ */

.website-frame {

    width: 100%;

    height: 100vh;

    min-height: 100vh;

    border: 0;

    margin: 0;

    padding: 0;

    background: #ffffff;

    display: block;
}

</style>

</head>


<body>


<!-- =====================================
     LOADING
===================================== -->

<div id="loading">

    🚀 Loading website...

</div>


<!-- =====================================
     ERROR
===================================== -->

<div id="error">

    <h2>
        Website unavailable
    </h2>

    <p id="errorText">
        Unable to load this website.
    </p>

</div>


<!-- =====================================
     WEBSITE
===================================== -->

<div id="website">

    <iframe
        id="websiteFrame"
        class="website-frame"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin allow-presentation">
    </iframe>

</div>


<script>


/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GET REPOSITORY ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


/*
   Accept both:

   ?id=REPOSITORY_ID

   and

   ?repository_id=REPOSITORY_ID
*/

const repositoryId =
    params.get("repository_id") ||
    params.get("id");


/* =====================================================
   ERROR HANDLER
===================================================== */

function showError(message) {

    document.getElementById("loading")
        .style.display = "none";


    document.getElementById("website")
        .style.display = "none";


    const errorBox =
        document.getElementById("error");


    document.getElementById("errorText")
        .textContent = message;


    errorBox.style.display = "block";
}


/* =====================================================
   LOAD PUBLISHED WEBSITE
===================================================== */

async function loadPublishedWebsite() {

    try {


        /* ---------------------------------------------
           CHECK REPOSITORY ID
        --------------------------------------------- */

        if (!repositoryId) {

            showError(
                "Repository ID is missing."
            );

            return;
        }


        /* ---------------------------------------------
           LOAD REPOSITORY
        --------------------------------------------- */

        const {
            data: repository,
            error: repositoryError
        } =
        await supabaseClient

            .from("repositories")

            .select(`
                id,
                name,
                description,
                is_private,
                is_published,
                default_branch
            `)

            .eq(
                "id",
                repositoryId
            )

            .single();


        if (repositoryError) {

            console.error(
                "Repository error:",
                repositoryError
            );

            showError(
                "Unable to load repository."
            );

            return;
        }


        /* ---------------------------------------------
           CHECK PUBLISHED STATUS
        --------------------------------------------- */

        if (!repository.is_published) {

            showError(
                "This repository has not been published yet."
            );

            return;
        }


        /* ---------------------------------------------
           PRIVATE REPOSITORY CHECK
        --------------------------------------------- */

        if (repository.is_private) {

            showError(
                "This website is private and cannot be viewed publicly."
            );

            return;
        }


        /* ---------------------------------------------
           DEFAULT BRANCH
        --------------------------------------------- */

        const defaultBranchName =
            repository.default_branch ||
            "main";


        /* ---------------------------------------------
           LOAD BRANCH
        --------------------------------------------- */

        const {
            data: branch,
            error: branchError
        } =
        await supabaseClient

            .from("repository_branches")

            .select(`
                id,
                name
            `)

            .eq(
                "repository_id",
                repositoryId
            )

            .eq(
                "name",
                defaultBranchName
            )

            .maybeSingle();


        if (branchError) {

            console.error(
                "Branch error:",
                branchError
            );

            showError(
                "Unable to load the published branch."
            );

            return;
        }


        if (!branch) {

            showError(
                "Published branch was not found."
            );

            return;
        }


        /* ---------------------------------------------
           LOAD INDEX.HTML
        --------------------------------------------- */

        const {
            data: file,
            error: fileError
        } =
        await supabaseClient

            .from("repository_files")

            .select(`
                file_path,
                content,
                language,
                is_binary,
                mime_type,
                branch_id
            `)

            .eq(
                "repository_id",
                repositoryId
            )

            .eq(
                "branch_id",
                branch.id
            )

            .eq(
                "file_path",
                "index.html"
            )

            .eq(
                "is_binary",
                false
            )

            .maybeSingle();


        if (fileError) {

            console.error(
                "File error:",
                fileError
            );

            showError(
                "Unable to load index.html."
            );

            return;
        }


        /* ---------------------------------------------
           INDEX.HTML CHECK
        --------------------------------------------- */

        if (!file) {

            showError(
                "This published repository does not contain an index.html file on the default branch."
            );

            return;
        }


        /* ---------------------------------------------
           GET HTML
        --------------------------------------------- */

        const html =
            file.content || "";


        if (!html.trim()) {

            showError(
                "The index.html file is empty."
            );

            return;
        }


        /* ---------------------------------------------
           WEBSITE FRAME
        --------------------------------------------- */

        const frame =
            document.getElementById(
                "websiteFrame"
            );


        /* ---------------------------------------------
           BUILD COMPLETE HTML
        --------------------------------------------- */

        let completeHtml;


        /*
           If index.html already contains
           <html>, <head> or <!DOCTYPE>,
           use it directly.
        */

        if (
            /<html[\s>]/i.test(html) ||
            /<!DOCTYPE/i.test(html)
        ) {

            completeHtml = html;

        } else {

            completeHtml = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>
${escapeHtml(repository.name || "Website")}
</title>

</head>

<body>

${html}

</body>

</html>

`;

        }


        /* ---------------------------------------------
           LOAD WEBSITE
        --------------------------------------------- */

        frame.srcdoc =
            completeHtml;


        /* ---------------------------------------------
           PAGE TITLE
        --------------------------------------------- */

        document.title =
            repository.name ||
            "Published Website";


        /* ---------------------------------------------
           SHOW WEBSITE
        --------------------------------------------- */

        document.getElementById("loading")
            .style.display = "none";


        document.getElementById("website")
            .style.display = "block";


        console.log(
            "Published website loaded successfully:",
            repository.name,
            "Branch:",
            branch.name
        );


    }

    catch (error) {

        console.error(
            "Published website error:",
            error
        );

        showError(
            "Unable to load the published website."
        );
    }
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   START
===================================================== */

loadPublishedWebsite();

</script>


</body>

</html>
