<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Published Website</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
}

#loading {

    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;

    color: #475569;

    font-size: 20px;

    z-index: 9999;
}

#error {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 90%;
    max-width: 700px;

    padding: 25px;

    background: #fee2e2;

    color: #991b1b;

    border-radius: 14px;

    text-align: center;

    z-index: 99999;
}

#error h2 {
    margin-bottom: 10px;
}

#website {

    display: none;

    width: 100%;
    height: 100vh;
}

#websiteFrame {

    width: 100%;
    height: 100vh;

    border: 0;

    display: block;
}

</style>

</head>


<body>


<div id="loading">
    🚀 Loading website...
</div>


<div id="error">

    <h2>
        Website unavailable
    </h2>

    <p id="errorText">
        Unable to load website.
    </p>

</div>


<div id="website">

    <iframe
        id="websiteFrame"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin allow-presentation">
    </iframe>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   REPOSITORY ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const repositoryId =
    params.get("repository_id") ||
    params.get("id");


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "website"
    ).style.display = "none";


    document.getElementById(
        "errorText"
    ).textContent = message;


    document.getElementById(
        "error"
    ).style.display = "block";

}


/* =====================================================
   NORMALIZE PATH
===================================================== */

function normalizePath(path) {

    if (!path) {
        return "";
    }

    return String(path)
        .replace(/\\/g, "/")
        .replace(/^\.\/+/g, "")
        .replace(/^\/+/g, "")
        .replace(/\/+/g, "/")
        .trim();

}


/* =====================================================
   GET FILE
===================================================== */

async function getFile(
    repositoryId,
    branchId,
    paths
) {

    for (
        const path of paths
    ) {

        const result =
            await supabaseClient

                .from("repository_files")

                .select(`
                    file_path,
                    content,
                    is_binary
                `)

                .eq(
                    "repository_id",
                    repositoryId
                )

                .eq(
                    "branch_id",
                    branchId
                )

                .eq(
                    "file_path",
                    path
                )

                .eq(
                    "is_binary",
                    false
                )

                .maybeSingle();


        if (
            !result.error &&
            result.data
        ) {

            return result.data;

        }

    }

    return null;

}


/* =====================================================
   MAIN
===================================================== */

async function loadPublishedWebsite() {

    try {

        if (!repositoryId) {

            showError(
                "Repository ID is missing."
            );

            return;
        }


        /* =============================================
           REPOSITORY
        ============================================= */

        const {
            data: repository,
            error: repositoryError
        } =
        await supabaseClient

            .from("repositories")

            .select(`
                id,
                name,
                is_private,
                is_published,
                default_branch
            `)

            .eq(
                "id",
                repositoryId
            )

            .single();


        if (repositoryError) {

            console.error(
                repositoryError
            );

            showError(
                "Repository could not be loaded."
            );

            return;
        }


        if (!repository) {

            showError(
                "Repository not found."
            );

            return;
        }


        if (!repository.is_published) {

            showError(
                "Repository is not published."
            );

            return;
        }


        if (repository.is_private) {

            showError(
                "This repository is private."
            );

            return;
        }


        /* =============================================
           BRANCH
        ============================================= */

        const branchName =
            repository.default_branch ||
            "main";


        const {
            data: branch,
            error: branchError
        } =
        await supabaseClient

            .from("repository_branches")

            .select(`
                id,
                name
            `)

            .eq(
                "repository_id",
                repositoryId
            )

            .eq(
                "name",
                branchName
            )

            .maybeSingle();


        if (branchError) {

            console.error(
                branchError
            );

            showError(
                "Branch could not be loaded."
            );

            return;
        }


        if (!branch) {

            showError(
                "Branch not found."
            );

            return;
        }


        /* =============================================
           INDEX.HTML
        ============================================= */

        const indexFile =
            await getFile(
                repositoryId,
                branch.id,
                [
                    "index.html"
                ]
            );


        if (!indexFile) {

            showError(
                "index.html was not found."
            );

            return;
        }


        let html =
            indexFile.content || "";


        if (!html.trim()) {

            showError(
                "index.html is empty."
            );

            return;
        }


        /* =============================================
           CSS FILE
        ============================================= */

        let cssFile =
            await getFile(
                repositoryId,
                branch.id,
                [
                    "style.css",
                    "css/style.css"
                ]
            );


        /* =============================================
           JAVASCRIPT FILE
        ============================================= */

        let jsFile =
            await getFile(
                repositoryId,
                branch.id,
                [
                    "script.js",
                    "js/script.js",
                    "js/app.js"
                ]
            );


        console.log(
            "INDEX:",
            !!indexFile
        );

        console.log(
            "CSS:",
            cssFile
                ? cssFile.file_path
                : "NOT FOUND"
        );

        console.log(
            "JS:",
            jsFile
                ? jsFile.file_path
                : "NOT FOUND"
        );


        /* =============================================
           INSERT CSS
        ============================================= */

        if (cssFile) {

            const css =
                cssFile.content || "";


            const styleBlock = `

<style>

${css}

</style>

`;


            if (
                /<\/head>/i.test(
                    html
                )
            ) {

                html =
                    html.replace(
                        /<\/head>/i,
                        styleBlock +
                        "</head>"
                    );

            } else {

                html =
                    styleBlock +
                    html;

            }

        }


        /* =============================================
           INSERT JAVASCRIPT
        ============================================= */

        if (jsFile) {

            const js =
                jsFile.content || "";


            const safeJS =
                js.replace(
                    /<\/script>/gi,
                    "<\\/script>"
                );


            const scriptBlock = `

<script>

${safeJS}

<\/script>

`;


            if (
                /<\/body>/i.test(
                    html
                )
            ) {

                html =
                    html.replace(
                        /<\/body>/i,
                        scriptBlock +
                        "</body>"
                    );

            } else {

                html +=
                    scriptBlock;

            }

        }


        /* =============================================
           FRAME
        ============================================= */

        const frame =
            document.getElementById(
                "websiteFrame"
            );


        frame.srcdoc =
            html;


        /* =============================================
           TITLE
        ============================================= */

        document.title =
            repository.name ||
            "Published Website";


        /* =============================================
           SHOW
        ============================================= */

        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "website"
        ).style.display =
            "block";


        console.log(
            "ASIM TECH publishing completed."
        );


    }

    catch (error) {

        console.error(
            "Publishing error:",
            error
        );


        showError(
            "Publishing error: " +
            error.message
        );

    }

}


/* =====================================================
   TIMEOUT
===================================================== */

setTimeout(
    function() {

        const loading =
            document.getElementById(
                "loading"
            );


        if (
            loading &&
            loading.style.display !== "none"
        ) {

            showError(
                "Website loading timed out. Please refresh and try again."
            );

        }

    },
    15000
);


/* =====================================================
   START
===================================================== */

loadPublishedWebsite();

</script>


</body>

</html>
