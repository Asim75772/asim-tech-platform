<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   URL
========================================= */

const params =
new URLSearchParams(
window.location.search
);

const repositoryId =
params.get("repository_id") ||
params.get("id");


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let repository = null;

let actions = [];

let runs = [];

let currentTab = "actions";


/* =========================================
   INIT
========================================= */

async function init(){

try{

if(!repositoryId){

throw new Error(
"Repository ID is missing."
);

}


/* USER */

const {
data:userData,
error:userError
} =
await supabaseClient
.auth
.getUser();

if(userError)
throw userError;

if(!userData.user){

window.location.href =
"login.html";

return;

}

currentUser =
userData.user;


/* REPOSITORY */

const {
data:repo,
error:repoError
} =
await supabaseClient

.from("repositories")

.select(`
id,
owner_id,
name,
description,
is_private
`)

.eq(
"id",
repositoryId
)

.single();


if(repoError)
throw repoError;

if(!repo){

throw new Error(
"Repository not found."
);

}

repository =
repo;


/* HEADER */

document.getElementById(
"repoName"
).textContent =
repo.name;


document.getElementById(
"repoDescription"
).textContent =
repo.description ||
"Repository Actions";


document.title =
"Actions — " +
repo.name +
" — ASIM TECH";


/* OWNER */

if(
repo.owner_id !==
currentUser.id
){

document.getElementById(
"newActionButton"
).style.display =
"none";

}


/* LOAD */

await loadActions();

await loadRuns();


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"mainContent"
).style.display =
"block";


}

catch(error){

console.error(
"Actions initialization error:",
error
);


document.getElementById(
"loading"
).style.display =
"none";


showError(
error.message ||
"Unable to load Actions."
);

}

}


/* =========================================
   LOAD ACTIONS
========================================= */

async function loadActions(){

const {
data,
error
} =
await supabaseClient

.from(
"repository_actions"
)

.select("*")

.eq(
"repository_id",
repositoryId
)

.order(
"created_at",
{
ascending:false
}
);


if(error)
throw error;

actions =
data || [];


renderActions();

}


/* =========================================
   LOAD RUNS
========================================= */

async function loadRuns(){

const {
data,
error
} =
await supabaseClient

.from(
"repository_action_runs"
)

.select(`
id,
action_id,
repository_id,
branch_name,
status,
trigger_type,
commit_message,
logs,
started_at,
completed_at,
created_by,
triggered_by,
created_at
`)

.eq(
"repository_id",
repositoryId
)

.order(
"created_at",
{
ascending:false
}
);


if(error)
throw error;

runs =
data || [];


renderRuns();

}


/* =========================================
   RENDER ACTIONS
========================================= */

function renderActions(){

const list =
document.getElementById(
"actionsList"
);

if(!actions.length){

list.innerHTML = `

<div class="empty">

<div class="empty-icon">
⚡
</div>

<h3>
No actions yet
</h3>

<p style="margin-top:8px;">
Create your first workflow action.
</p>

</div>

`;

return;

}


list.innerHTML =
actions.map(
action => {

const enabled =
action.enabled !== false;

return `

<div class="action-row">

<div class="action-icon">
⚡
</div>

<div class="action-main">

<div class="action-name">
${escapeHtml(action.name || "Unnamed action")}
</div>

<div class="action-description">
${escapeHtml(action.description || "No description")}
</div>

<div class="action-meta">

<span class="badge ${
enabled
? "badge-enabled"
: "badge-disabled"
}">

${enabled ? "Enabled" : "Disabled"}

</span>

&nbsp;

Trigger:
<strong>
${escapeHtml(action.event || "manual")}
</strong>

·

Branch:
<strong>
${escapeHtml(action.branch || "main")}
</strong>

·

Workflow:
<strong>
${escapeHtml(action.workflow_file || "Not specified")}
</strong>

</div>

</div>


<div class="action-actions">

${
enabled
?
`
<button
class="btn btn-blue"
onclick="runAction('${action.id}')">

▶ Run

</button>
`
:
`
<button
class="btn btn-blue"
onclick="runAction('${action.id}')"
disabled
style="opacity:.5;cursor:not-allowed;">

▶ Run

</button>
`
}


<button
class="btn"
onclick="toggleAction(
'${action.id}',
${enabled}
)">

${enabled ? "Disable" : "Enable"}

</button>


<button
class="btn btn-danger"
onclick="deleteAction('${action.id}')">

Delete

</button>

</div>

</div>

`;

}
).join("");

}


/* =========================================
   RENDER RUNS
========================================= */

function renderRuns(){

const list =
document.getElementById(
"runsList"
);

if(!runs.length){

list.innerHTML = `

<div class="empty">

<div class="empty-icon">
▶
</div>

No workflow runs yet.

</div>

`;

return;

}


list.innerHTML =
runs.map(
run => {

const action =
actions.find(
a =>
a.id ===
run.action_id
);

const actionName =
action
?
action.name
:
"Workflow";


const status =
(run.status || "queued")
.toLowerCase();


return `

<div class="run-row">

<div class="run-top">

<div class="run-name">

⚡
${escapeHtml(actionName)}

</div>

<div>

<span class="status status-${escapeHtml(status)}">

${escapeHtml(
status.toUpperCase()
)}

</span>

</div>

</div>


<div class="run-meta">

Started:
${formatDate(run.started_at || run.created_at)}

${
run.completed_at
?
`
<br>
Completed:
${formatDate(run.completed_at)}
`
:
""
}

${
run.branch_name
?
`
<br>
Branch:
${escapeHtml(run.branch_name)}
`
:
""
}

${
run.trigger_type
?
`
<br>
Trigger:
${escapeHtml(run.trigger_type)}
`
:
""
}

</div>


<div class="logs">

${escapeHtml(
run.logs ||
"No logs available."
)}

</div>

</div>

`;

}
).join("");

}


/* =========================================
   CREATE ACTION
========================================= */

async function createAction(){

clearMessages();

const button =
document.getElementById(
"createActionButton"
);

const name =
document.getElementById(
"actionName"
).value.trim();

const description =
document.getElementById(
"actionDescription"
).value.trim();

const event =
document.getElementById(
"actionEvent"
).value;

const branch =
document.getElementById(
"actionBranch"
).value.trim() ||
"main";

const workflowFile =
document.getElementById(
"workflowFile"
).value.trim();


if(!name){

showModalError(
"Action name is required."
);

return;

}


button.disabled =
true;

button.textContent =
"Creating...";


try{

const {
error
} =
await supabaseClient

.from(
"repository_actions"
)

.insert({

repository_id:
repositoryId,

created_by:
currentUser.id,

name:
name,

description:
description,

event:
event,

branch:
branch,

workflow_file:
workflowFile,

enabled:
true

});


if(error)
throw error;


closeNewAction();

showSuccess(
"Action created successfully."
);

await loadActions();


}

catch(error){

console.error(
"Create action error:",
error
);

showModalError(
error.message ||
"Unable to create action."
);

}

finally{

button.disabled =
false;

button.textContent =
"Create action";

}

}


/* =========================================
   RUN ACTION
========================================= */

async function runAction(actionId){

clearMessages();

const action =
actions.find(
a =>
a.id === actionId
);

if(!action){

showError(
"Action not found."
);

return;

}


if(action.enabled === false){

showError(
"This action is disabled."
);

return;

}


/* CREATE RUN */

try{

const {
data:run,
error
} =
await supabaseClient

.from(
"repository_action_runs"
)

.insert({

action_id:
action.id,

repository_id:
repositoryId,

branch_name:
action.branch ||
"main",

status:
"queued",

trigger_type:
action.event ||
"manual",

commit_message:
null,

logs:
"Workflow queued...",

started_at:
null,

completed_at:
null,

created_by:
currentUser.id,

triggered_by:
currentUser.id

})

.select(`
id,
action_id,
repository_id,
branch_name,
status,
trigger_type,
commit_message,
logs,
started_at,
completed_at,
created_by,
triggered_by,
created_at
`)

.single();


if(error)
throw error;


showSuccess(
"Workflow queued successfully."
);


await loadRuns();

setTab("runs");


/*
   SIMULATED WORKFLOW

   queued
      ↓
   running
      ↓
   success
*/


setTimeout(
async function(){

await updateRunToRunning(
run.id,
action
);

},
1200
);


setTimeout(
async function(){

await updateRunToSuccess(
run.id,
action
);

},
3500
);


}

catch(error){

console.error(
"Run action error:",
error
);

showError(
error.message ||
"Unable to run action."
);

}

}


/* =========================================
   UPDATE RUN → RUNNING
========================================= */

async function updateRunToRunning(
runId,
action
){

try{

const now =
new Date().toISOString();

const {
error
} =
await supabaseClient

.from(
"repository_action_runs"
)

.update({

status:
"running",

logs:
[
"Workflow started...",
"",
"Preparing workflow:",
action.workflow_file ||
"Not specified",

"Branch:",
action.branch ||
"main",

"Running workflow steps..."
].join("\n"),

started_at:
now

})

.eq(
"id",
runId
);


if(error)
throw error;


await loadRuns();

}

catch(error){

console.error(
"Run update error:",
error
);

}

}


/* =========================================
   UPDATE RUN → SUCCESS
========================================= */

async function updateRunToSuccess(
runId,
action
){

try{

const now =
new Date().toISOString();

const {
error
} =
await supabaseClient

.from(
"repository_action_runs"
)

.update({

status:
"success",

logs:
[
"Workflow started...",
"",
"Preparing workflow:",
action.workflow_file ||
"Not specified",

"Branch:",
action.branch ||
"main",

"Running workflow steps...",
"",
"Checking workflow configuration...",
"✓ Configuration valid",

"Executing action...",
"✓ Action completed successfully",

"",
"Workflow finished successfully."
].join("\n"),

completed_at:
now

})

.eq(
"id",
runId
);


if(error)
throw error;


showSuccess(
"Workflow completed successfully."
);


await loadRuns();

}

catch(error){

console.error(
"Run completion error:",
error
);

showError(
"Workflow started but could not update completion status: " +
(error.message || "Unknown error")
);

}

}


/* =========================================
   TOGGLE ACTION
========================================= */

async function toggleAction(
actionId,
currentlyEnabled
){

clearMessages();

try{

const {
error
} =
await supabaseClient

.from(
"repository_actions"
)

.update({

enabled:
!currentlyEnabled,

updated_at:
new Date().toISOString()

})

.eq(
"id",
actionId
);


if(error)
throw error;


showSuccess(
currentlyEnabled
?
"Action disabled."
:
"Action enabled."
);


await loadActions();

}

catch(error){

console.error(
"Toggle action error:",
error
);

showError(
error.message ||
"Unable to update action."
);

}

}


/* =========================================
   DELETE ACTION
========================================= */

async function deleteAction(
actionId
){

clearMessages();

if(
!confirm(
"Are you sure you want to delete this action?"
)
){

return;

}


try{

const {
error
} =
await supabaseClient

.from(
"repository_actions"
)

.delete()

.eq(
"id",
actionId
);


if(error)
throw error;


showSuccess(
"Action deleted successfully."
);


await loadActions();

}

catch(error){

console.error(
"Delete action error:",
error
);

showError(
error.message ||
"Unable to delete action."
);

}

}


/* =========================================
   TABS
========================================= */

function setTab(tab){

currentTab =
tab;


const actionsTab =
document.getElementById(
"actionsTab"
);

const runsTab =
document.getElementById(
"runsTab"
);

const actionsView =
document.getElementById(
"actionsView"
);

const runsView =
document.getElementById(
"runsView"
);


if(tab === "actions"){

actionsTab.classList.add(
"active"
);

runsTab.classList.remove(
"active"
);

actionsView.style.display =
"block";

runsView.style.display =
"none";

}

else{

actionsTab.classList.remove(
"active"
);

runsTab.classList.add(
"active"
);

actionsView.style.display =
"none";

runsView.style.display =
"block";

}

}

/* =========================================
   DATE FORMAT
========================================= */

function formatDate(value){

if(!value)
return "—";

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){

return value;

}

return date.toLocaleString(
"en-IN",
{
year:"numeric",
month:"short",
day:"2-digit",
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

);
