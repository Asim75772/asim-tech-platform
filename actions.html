<div id="mainContent"

</div>

style="display:none;">

<div class="runs-header">

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
   URL
========================================= */

const params =
new URLSearchParams(
window.location.search
);

const repositoryId =
params.get("repository_id") ||
params.get("id");


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let repository = null;

let actions = [];

let runs = [];

let currentTab = "actions";


/* =========================================
   INIT
========================================= */

async function init(){

try{

if(!repositoryId){

throw new Error(
"Repository ID is missing."
);

}


/* USER */

const {
data:userData,
error:userError
} =
await supabaseClient
.auth
.getUser();

if(userError)
throw userError;

if(!userData.user){

window.location.href =
"login.html";

return;

}

currentUser =
userData.user;


/* REPOSITORY */

const {
data:repo,
error:repoError
} =
await supabaseClient

.from("repositories")

.select(`
id,
owner_id,
name,
description,
is_private
`)

.eq(
"id",
repositoryId
)

.single();


if(repoError)
throw repoError;

if(!repo){

throw new Error(
"Repository not found."
);

}

repository =
repo;


/* HEADER */

document.getElementById(
"repoName"
).textContent =
repo.name;


document.getElementById(
"repoDescription"
).textContent =
repo.description ||
"Repository Actions";


document.title =
"Actions — " +
repo.name +
" — ASIM TECH";


/* OWNER */

if(
repo.owner_id !==
currentUser.id
){

document.getElementById(
"newActionButton"
).style.display =
"none";

}


/* LOAD */

await loadActions();

await loadRuns();


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"mainContent"
).style.display =
"block";


}

catch(error){

console.error(
"Actions initialization error:",
error
);


document.getElementById(
"loading"
).style.display =
"none";


showError(
error.message ||
"Unable to load Actions."
);

}

}


/* =========================================
   LOAD ACTIONS
========================================= */

async function loadActions(){

const {
data,
error
} =
await supabaseClient

.from(
"repository_actions"
)

.select("*")

.eq(
"repository_id",
repositoryId
)

.order(
"created_at",
{
ascending:false
}
);


if(error)
throw error;


actions =
data || [];


renderActions();

}


/* =========================================
   LOAD RUNS
========================================= */

async function loadRuns(){

const {
data,
error
} =
await supabaseClient

.from(
"repository_action_runs"
)

.select(`
*,
repository_actions(name)
`)

.eq(
"repository_id",
repositoryId
)

.order(
"created_at",
{
ascending:false
}
)

.limit(30);


if(error)
throw error;


runs =
data || [];


renderRuns();

}


/* =========================================
   RENDER ACTIONS
========================================= */

function renderActions(){

const list =
document.getElementById(
"actionsList"
);


if(!actions.length){

list.innerHTML = `

<div class="empty">

<div class="empty-icon">
⚡
</div>

<h3 style="color:#e6edf3;margin-bottom:8px;">
No actions yet
</h3>

<p>
Create your first workflow action.
</p>

</div>

`;

return;

}


list.innerHTML =
actions.map(
action => {

const enabled =
action.enabled !== false;


const event =
action.event ||
action.trigger ||
"manual";


const branch =
action.branch ||
"main";


const workflow =
action.workflow_file ||
action.workflow_path ||
"";


return `

<div class="action-row">

<div class="action-icon">
⚡
</div>


<div class="action-main">

<div class="action-name">

${escapeHtml(
action.name ||
"Unnamed action"
)}

</div>


<div class="action-description">

${escapeHtml(
action.description ||
"No description"
)}

</div>


<div class="action-meta">

<span class="badge ${
enabled
?
"badge-enabled"
:
"badge-disabled"
}">

${
enabled
?
"Enabled"
:
"Disabled"
}

</span>

Trigger:
<strong>
${escapeHtml(event)}
</strong>

· Branch:
<strong>
${escapeHtml(branch)}
</strong>

${
workflow
?
" · Workflow: " +
escapeHtml(workflow)
:
""
}

</div>

</div>


<div class="action-actions">

<button
class="btn btn-blue"
onclick="runAction('${escapeHtml(action.id)}')">

▶ Run

</button>


<button
class="btn"
onclick="toggleAction('${escapeHtml(action.id)}',${enabled})">

${
enabled
?
"Disable"
:
"Enable"
}

</button>


<button
class="btn btn-danger"
onclick="deleteAction('${escapeHtml(action.id)}')">

Delete

</button>

</div>

</div>

`;

}
).join("");

}


/* =========================================
   RENDER RUNS
========================================= */

function renderRuns(){

const list =
document.getElementById(
"runsList"
);


if(!runs.length){

list.innerHTML = `

<div class="empty">

<div class="empty-icon">
▶
</div>

No workflow runs yet.

</div>

`;

return;

}


list.innerHTML =
runs.map(
run => {

const actionName =
run.repository_actions
?
run.repository_actions.name
:
"Workflow";


const status =
run.status ||
"queued";


return `

<div class="run-row">

<div class="run-top">

<div class="run-name">

⚡
${escapeHtml(actionName)}

</div>


<div class="status status-${escapeHtml(status)}">

${escapeHtml(
status.toUpperCase()
)}

</div>

</div>


<div class="run-meta">

Started:
${formatDate(run.created_at)}

${
run.finished_at
?
" · Finished: " +
formatDate(run.finished_at)
:
""
}

</div>


${
run.logs
?
`
<div class="logs">
${escapeHtml(run.logs)}
</div>
`
:
""
}

</div>

`;

}
).join("");

}


/* =========================================
   TABS
========================================= */

function setTab(tab){

currentTab =
tab;


document.getElementById(
"actionsTab"
).classList.remove(
"active"
);


document.getElementById(
"runsTab"
).classList.remove(
"active"
);


if(tab === "actions"){

document.getElementById(
"actionsTab"
).classList.add(
"active"
);


document.getElementById(
"actionsView"
).style.display =
"block";


document.getElementById(
"runsView"
).style.display =
"none";

}
else{

document.getElementById(
"runsTab"
).classList.add(
"active"
);


document.getElementById(
"actionsView"
).style.display =
"none";


document.getElementById(
"runsView"
).style.display =
"block";


loadRuns();

}

}


/* =========================================
   OPEN MODAL
========================================= */

function openNewAction(){

if(!currentUser){

alert(
"Please login first."
);

window.location.href =
"login.html";

return;

}


document.getElementById(
"actionModal"
).classList.add(
"show"
);


document.getElementById(
"modalError"
).style.display =
"none";


document.getElementById(
"actionName"
).focus();

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeNewAction(){

document.getElementById(
"actionModal"
).classList.remove(
"show"
);


document.getElementById(
"modalError"
).style.display =
"none";

}


/* =========================================
   CREATE ACTION
========================================= */

async function createAction(){

if(
!currentUser ||
!repository
){

showModalError(
"Please login first."
);

return;

}


if(
repository.owner_id !==
currentUser.id
){

showModalError(
"Only repository owner can create actions."
);

return;

}


const name =
document.getElementById(
"actionName"
).value.trim();


const description =
document.getElementById(
"actionDescription"
).value.trim();


const event =
document.getElementById(
"actionEvent"
).value;


const branch =
document.getElementById(
"actionBranch"
).value.trim()
||
"main";


const workflowFile =
document.getElementById(
"workflowFile"
).value.trim();


if(!name){

showModalError(
"Action name is required."
);

return;

}


const button =
document.getElementById(
"createActionButton"
);


button.disabled =
true;


button.textContent =
"Creating...";


try{

const {
data,
error
} =
await supabaseClient

.from(
"repository_actions"
)

.insert({

repository_id:
repositoryId,

created_by:
currentUser.id,

name:
name,

description:
description,

event:
event,

branch:
branch,

workflow_file:
workflowFile,

enabled:
true

})

.select()
.single();


if(error){

throw error;

}


actions.unshift(
data
);


renderActions();

closeNewAction();

clearActionForm();


showSuccess(
"Action created successfully."
);


}
catch(error){

console.error(error);


showModalError(
error.message ||
"Unable to create action."
);

}
finally{

button.disabled =
false;

button.textContent =
"Create action";

}

}


/* =========================================
   CLEAR FORM
========================================= */

function clearActionForm(){

document.getElementById(
"actionName"
).value =
"";


document.getElementById(
"actionDescription"
).value =
"";


document.getElementById(
"actionEvent"
).value =
"manual";


document.getElementById(
"actionBranch"
).value =
"main";


document.getElementById(
"workflowFile"
).value =
"";

}


/* =========================================
   RUN ACTION
========================================= */

async function runAction(actionId){

if(!currentUser){

alert(
"Please login first."
);

return;

}


const action =
actions.find(
item =>
item.id === actionId
);


if(!action){

showError(
"Action not found."
);

return;

}


if(
repository.owner_id !==
currentUser.id
){

showError(
"Only repository owner can run actions."
);

return;

}


if(
action.enabled === false
){

showError(
"This action is disabled."
);

return;

}


try{

/* CREATE RUN */

const {
data:run,
error
} =
await supabaseClient

.from(
"repository_action_runs"
)

.insert({

repository_id:
repositoryId,

action_id:
actionId,

triggered_by:
currentUser.id,

status:
"queued",

logs:
"Workflow queued..."

})

.select()
.single();


if(error)
throw error;


/* LOCAL */

runs.unshift(
run
);

renderRuns();


showSuccess(
"Action queued successfully."
);


/*
Simulated execution.

This does not execute arbitrary server code.
It records the workflow run state.
*/

setTimeout(
async function(){

try{

const started =
new Date().toISOString();


await supabaseClient

.from(
"repository_action_runs"
)

.update({

status:
"running",

started_at:
started,

logs:
"Workflow started..."

})

.eq(
"id",
run.id
);


await loadRuns();


setTimeout(
async function(){

const finished =
new Date().toISOString();


await supabaseClient

.from(
"repository_action_runs"
)

.update({

status:
"success",

finished_at:
finished,

logs:
"Workflow completed successfully."

})

.eq(
"id",
run.id
);


await loadRuns();


},
1200
);


}
catch(error){

console.error(error);

}

},
700
);


}
catch(error){

console.error(error);


showError(
error.message ||
"Unable to run action."
);

}

}


/* =========================================
   TOGGLE ACTION
========================================= */

async function toggleAction(
actionId,
currentEnabled
){

if(
!currentUser ||
!repository
){

return;

}


if(
repository.owner_id !==
currentUser.id
){

showError(
"Only repository owner can modify actions."
);

return;

}


try{

const {
error
} =
await supabaseClient

.from(
"repository_actions"
)

.update({

enabled:
!currentEnabled,

updated_at:
new Date().toISOString()

})

.eq(
"id",
actionId
)

.eq(
"repository_id",
repositoryId
);


if(error)
throw error;


const action =
actions.find(
item =>
item.id === actionId
);


if(action){

action.enabled =
!currentEnabled;

}


renderActions();


showSuccess(
currentEnabled
?
"Action disabled."
:
"Action enabled."
);


}
catch(error){

console.error(error);


showError(
error.message ||
"Unable to update action."
);

}

}


/* =========================================
   DELETE ACTION
========================================= */

async function deleteAction(actionId){

if(
!currentUser ||
!repository
){

return;

}


if(
repository.owner_id !==
currentUser.id
){

showError(
"Only repository owner can delete actions."
);

return;

}


const action =
actions.find(
item =>
item.id === actionId
);


if(!action)
return;


if(
!confirm(
'Delete action "' +
(action.name || "") +
'" permanently?'
)
){

return;

}


try{

const {
error
} =
await supabaseClient

.from(
"repository_actions"
)

.delete()

.eq(
"id",
actionId
)

.eq(
"repository_id",
repositoryId
);


if(error)
throw error;


actions =
actions.filter(
item =>
item.id !== actionId
);


renderActions();


showSuccess(
"Action deleted successfully."
);


}
catch(error){

console.error(error);


showError(
error.message ||
"Unable to delete action."
);

}

}


/* =========================================
   ERROR
========================================= */

function showError(message){

const box =
document.getElementById(
"error"
);


box.textContent =
message;


box.style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});


setTimeout(
function(){

box.style.display =
"none";

},
7000
);

}

========================================= */

"success"
);


box.textContent =

box.style.display =

behavior:"smooth"
});


setTimeout(

box.style.display =

/* =========================================
   DATE
========================================= */

function formatDate(date){

if(!date)
return "";


return new Date(date)
.toLocaleString(
"en-IN",
{

day:"2-digit",

month:"short",

year:"numeric",

hour:"2-digit",

minute:"2-digit"

}
);

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

if(
value === null ||
value === undefined
){

return "";

}


return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}

========================================= */

)

if(
event.target === this
){
