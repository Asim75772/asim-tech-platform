.empty{

@media(max-width:600px){

}

}

}

}

</style>

<div id="loading"
class="loading">

Loading pull requests...

<div id="error"
class="error">
</div>


<div id="success"
class="success">

<div id="mainContent"
style="display:none;">


<div class="repo-header">

<div class="repo-name">

📁 ASIM TECH
/
<strong id="repoName">
Repository
</strong>

</div>

class="description">

</div>

</div>


<div class="top-actions">

<div class="pr-tabs">


<a id="openTab"
class="pr-tab active"
onclick="setState('open')">

🟢 Open

<span id="openCount"
class="pr-count">
0
</span>

</a>


<a id="closedTab"
class="pr-tab"
onclick="setState('closed')">

class="pr-count">

class="pr-tab"
onclick="setState('merged')">

🟣 Merged

<span id="mergedCount"
class="pr-count">
0

<a id="allTab"
class="pr-tab"
onclick="setState('all')">

All

<span id="allCount"
class="pr-count">
0
</span>

</a>

</div>

class="btn btn-green"
onclick="openNewPR()">

＋ New pull request

type="search"
placeholder="🔎 Search pull requests..."

class="pr-list">

id="prTitle"

</label>

</label>

<script>


/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
"https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   URL
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

const repositoryId =
params.get("repository_id") ||
params.get("id");


/* =====================================================
   VARIABLES
===================================================== */

let repository = null;

let currentUser = null;

let pullRequests = [];

let currentState = "open";


/* =====================================================
   INITIAL LOAD
===================================================== */

async function loadPage(){

try{

if(!repositoryId){

showError(
"Repository ID is missing."
);

return;

}


/* USER */

const {
data:userData
} =
await supabaseClient
.auth
.getUser();

if(userData &&
userData.user){

currentUser =
userData.user;

}


/* REPOSITORY */

const {
data:repo,
error:repoError
} =
await supabaseClient

.from("repositories")

.select(`
id,
owner_id,
name,
description,
is_private,
default_branch
`)

.eq(
"id",
repositoryId
)

.single();


if(repoError){

throw repoError;

}

if(!repo){

throw new Error(
"Repository not found."
);

}


repository =
repo;


document.getElementById(
"repoName"
).textContent =
repo.name;


document.getElementById(
"repoDescription"
).textContent =
repo.description ||
"Repository pull requests";


document.title =
"Pull Requests — " +
repo.name +
" — ASIM TECH";


/* DEFAULT BRANCH */

document.getElementById(
"targetBranch"
).value =
repo.default_branch ||
"main";


await loadPullRequests();


document.getElementById(
"loading"
).style.display =
"none";


document.getElementById(
"mainContent"
).style.display =
"block";


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to load pull requests."
);

}

}


/* =====================================================
   LOAD PULL REQUESTS
===================================================== */

async function loadPullRequests(){

const {
data,
error
} =
await supabaseClient

.from("repository_pull_requests")

.select(`
id,
repository_id,
author_id,
title,
body,
source_branch,
target_branch,
state,
created_at,
updated_at,
closed_at,
merged_at
`)

.eq(
"repository_id",
repositoryId
)

.order(
"created_at",
{
ascending:false
}
);


if(error){

throw error;

}


pullRequests =
data || [];


updateCounts();

renderPullRequests();

}


/* =====================================================
   COUNTS
===================================================== */

function updateCounts(){

const open =
pullRequests.filter(
pr => pr.state === "open"
).length;


const closed =
pullRequests.filter(
pr => pr.state === "closed"
).length;


const merged =
pullRequests.filter(
pr => pr.state === "merged"
).length;


document.getElementById(
"openCount"
).textContent =
open;


document.getElementById(
"closedCount"
).textContent =
closed;


document.getElementById(
"mergedCount"
).textContent =
merged;


document.getElementById(
"allCount"
).textContent =
pullRequests.length;

}


/* =====================================================
   STATE FILTER
===================================================== */

function setState(state){

currentState =
state;


document
.querySelectorAll(".pr-tab")
.forEach(
tab =>
tab.classList.remove("active")
);


if(state === "open"){

document.getElementById(
"openTab"
).classList.add("active");

}


if(state === "closed"){

document.getElementById(
"closedTab"
).classList.add("active");

}


if(state === "merged"){

document.getElementById(
"mergedTab"
).classList.add("active");

}


if(state === "all"){

document.getElementById(
"allTab"
).classList.add("active");

}


renderPullRequests();

}


/* =====================================================
   RENDER
===================================================== */

function renderPullRequests(){

const list =
document.getElementById(
"prList"
);


const search =
(
document.getElementById(
"searchInput"
).value ||
""
)
.toLowerCase()
.trim();


const filtered =
pullRequests.filter(
pr => {


if(
currentState !== "all" &&
pr.state !== currentState
){

return false;

}


if(!search){

return true;

}


return (

(pr.title || "")
.toLowerCase()
.includes(search)

||

(pr.body || "")
.toLowerCase()
.includes(search)

||

(pr.source_branch || "")
.toLowerCase()
.includes(search)

||

(pr.target_branch || "")
.toLowerCase()
.includes(search)

);

}
);


if(!filtered.length){

let message =
"No pull requests found.";

if(currentState === "open"){

message =
"No open pull requests.";

}

if(currentState === "closed"){

message =
"No closed pull requests.";

}

if(currentState === "merged"){

message =
"No merged pull requests.";

}


list.innerHTML = `

<div class="empty">

<div style="font-size:38px;">
🔀
</div>

<h3 style="margin:10px 0;">
${message}
</h3>

<p>
Create a new pull request to get started.
</p>

</div>

`;

return;

}


list.innerHTML =
"";


filtered.forEach(
function(pr){

const row =
document.createElement(
"div"
);

row.className =
"pr-row";


const icon =
document.createElement(
"div"
);

icon.className =
"pr-icon " +
(
pr.state === "open"
?
"open"
:
pr.state === "merged"
?
"merged"
:
"closed"
);

icon.textContent =
pr.state === "open"
?
"●"
:
pr.state === "merged"
?
"◆"
:
"●";


const main =
document.createElement(
"div"
);

main.className =
"pr-main";


const title =
document.createElement(
"div"
);

title.className =
"pr-title";

title.textContent =
pr.title;

title.onclick =
function(){

showPR(pr);

};


const meta =
document.createElement(
"div"
);

meta.className =
"pr-meta";


meta.innerHTML =

getBadge(pr.state)

+

" #" +
escapeHtml(
pr.id.substring(0,8)
)

+

" · " +

escapeHtml(
pr.source_branch ||
"main"
)

+

" → " +

escapeHtml(
pr.target_branch ||
"main"
)

+

" · " +

formatDate(
pr.created_at
);


const body =
document.createElement(
"div"
);

body.className =
"pr-body";

body.textContent =
pr.body ||
"";


main.appendChild(
title
);

main.appendChild(
meta
);

if(pr.body){

main.appendChild(
body
);

}


const actions =
document.createElement(
"div"
);

actions.className =
"pr-actions";


const canManage =
currentUser &&
(
currentUser.id ===
pr.author_id
||
currentUser.id ===
repository.owner_id
);


const viewButton =
document.createElement(
"button"
);

viewButton.className =
"small-btn";

viewButton.textContent =
"View";

viewButton.onclick =
function(){

showPR(pr);

};

actions.appendChild(
viewButton
);


if(
pr.state === "open" &&
canManage
){

const closeButton =
document.createElement(
"button"
);

closeButton.className =
"small-btn";

closeButton.textContent =
"Close";

closeButton.onclick =
function(){

closePR(pr.id);

};

actions.appendChild(
closeButton
);

}


if(
pr.state === "closed" &&
canManage
){

const reopenButton =
document.createElement(
"button"
);

reopenButton.className =
"small-btn";

reopenButton.textContent =
"Reopen";

reopenButton.onclick =
function(){

reopenPR(pr.id);

};

actions.appendChild(
reopenButton
);

}


if(
pr.state === "open" &&
canManage
){

const mergeButton =
document.createElement(
"button"
);

mergeButton.className =
"small-btn";

mergeButton.textContent =
"Merge";

mergeButton.onclick =
function(){

mergePR(pr.id);

};

actions.appendChild(
mergeButton
);

}


if(canManage){

const deleteButton =
document.createElement(
"button"
);

deleteButton.className =
"small-btn";

deleteButton.textContent =
"Delete";

deleteButton.onclick =
function(){

deletePR(pr.id);

};

actions.appendChild(
deleteButton
);

}


row.appendChild(
icon
);

row.appendChild(
main
);

row.appendChild(
actions
);

list.appendChild(
row
);

});

}


/* =====================================================
   BADGE
===================================================== */

function getBadge(state){

if(state === "merged"){

return `
<span class="badge badge-merged">
🟣 Merged
</span>
`;

}


if(state === "closed"){

return `
<span class="badge badge-closed">
⚫ Closed
</span>
`;

}


return `
<span class="badge badge-open">
🟢 Open
</span>
`;

}


/* =====================================================
   NEW PR
===================================================== */

function openNewPR(){

if(!currentUser){

alert(
"Please login first to create a pull request."
);

window.location.href =
"login.html";

return;

}


document.getElementById(
"newPRModal"
).style.display =
"flex";


document.getElementById(
"prTitle"
).focus();

}


function closeNewPR(){

document.getElementById(
"newPRModal"
).style.display =
"none";


document.getElementById(
"modalError"
).style.display =
"none";

}


/* =====================================================
   CREATE PR
===================================================== */

async function createPullRequest(){

if(!currentUser){

showModalError(
"Please login first."
);

return;

}


const title =
document.getElementById(
"prTitle"
).value.trim();


const body =
document.getElementById(
"prBody"
).value.trim();


const sourceBranch =
document.getElementById(
"sourceBranch"
).value.trim();


const targetBranch =
document.getElementById(
"targetBranch"
).value.trim();


if(!title){

showModalError(
"Pull request title is required."
);

return;

}


if(!sourceBranch){

showModalError(
"Source branch is required."
);

return;

}


if(!targetBranch){

showModalError(
"Target branch is required."
);

return;

}


if(
sourceBranch ===
targetBranch
){

showModalError(
"Source and target branch must be different."
);

return;

}


const button =
document.getElementById(
"createButton"
);

button.disabled =
true;

button.textContent =
"Creating...";


try{

const {
data,
error
} =
await supabaseClient

.from(
"repository_pull_requests"
)

.insert({

repository_id:
repositoryId,

author_id:
currentUser.id,

title:
title,

body:
body,

source_branch:
sourceBranch,

target_branch:
targetBranch,

state:
"open"

})

.select()

.single();


if(error){

throw error;

}


pullRequests.unshift(
data
);


updateCounts();

renderPullRequests();

closeNewPR();

clearForm();

showSuccess(
"Pull Request created successfully."
);


}catch(error){

console.error(error);

showModalError(
error.message ||
"Unable to create pull request."
);

}finally{

button.disabled =
false;

button.textContent =
"Create pull request";

}

}


/* =====================================================
   SHOW PR
===================================================== */

function showPR(pr){

let text =
"Pull Request\n\n";

text +=
"Title: " +
pr.title +
"\n\n";

text +=
"State: " +
pr.state +
"\n\n";

text +=
"Source: " +
pr.source_branch +
"\n";

text +=
"Target: " +
pr.target_branch +
"\n\n";

text +=
"Description:\n" +
(
pr.body ||
"No description."
);


alert(text);

}


/* =====================================================
   CLOSE
===================================================== */

async function closePR(id){

if(
!confirm(
"Close this pull request?"
)
){

return;

}


try{

const now =
new Date().toISOString();


const {
error
} =
await supabaseClient

.from(
"repository_pull_requests"
)

.update({

state:
"closed",

closed_at:
now,

updated_at:
now

})

.eq(
"id",
id
);


if(error){

throw error;

}


const pr =
pullRequests.find(
item =>
item.id === id
);


if(pr){

pr.state =
"closed";

pr.closed_at =
now;

pr.updated_at =
now;

}


updateCounts();

renderPullRequests();

showSuccess(
"Pull Request closed."
);


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to close pull request."
);

}

}


/* =====================================================
   REOPEN
===================================================== */

async function reopenPR(id){

try{

const now =
new Date().toISOString();


const {
error
} =
await supabaseClient

.from(
"repository_pull_requests"
)

.update({

state:
"open",

closed_at:
null,

updated_at:
now

})

.eq(
"id",
id
);


if(error){

throw error;

}


const pr =
pullRequests.find(
item =>
item.id === id
);


if(pr){

pr.state =
"open";

pr.closed_at =
null;

pr.updated_at =
now;

}


updateCounts();

renderPullRequests();

showSuccess(
"Pull Request reopened."
);


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to reopen pull request."
);

}

}

/* =====================================================
   DELETE
===================================================== */

async function deletePR(id){

if(
!confirm(
"Delete this pull request permanently?"
)
){

return;

}


try{

const {
error
} =
await supabaseClient

.from(
"repository_pull_requests"
)

.delete()

.eq(
"id",
id
);


if(error){

throw error;

}


pullRequests =
pullRequests.filter(
pr =>
pr.id !== id
);


updateCounts();

renderPullRequests();

showSuccess(
"Pull Request deleted."
);


}catch(error){

console.error(error);

showError(
error.message ||
"Unable to delete pull request."
);

}

}

);

);

/* =====================================================
   DATE
===================================================== */

function formatDate(date){

if(!date){

return "";

}


return new Date(date)
.toLocaleString(
"en-IN",
{

day:"2-digit",

month:"short",

year:"numeric",

hour:"2-digit",

minute:"2-digit"

}
);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

if(
value === null ||
value === undefined
){

return "";

}


return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
