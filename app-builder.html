<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App Builder — ASIM TECH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ZIP DOWNLOAD LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:#ffffff;
    min-height:100vh;
}

.navbar{
    min-height:65px;
    background:#161b22;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.green{
    color:#39d353;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.nav-link{
    color:#ffffff;
    text-decoration:none;
    background:#21262d;
    border:1px solid #30363d;
    padding:8px 12px;
    border-radius:7px;
    font-size:13px;
}

.nav-link:hover{
    background:#30363d;
}

.container{
    max-width:1250px;
    margin:auto;
    padding:25px 18px 50px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.header h1{
    font-size:27px;
    margin-bottom:6px;
}

.header p{
    color:#8b949e;
    font-size:14px;
}

.header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.btn{
    border:1px solid #30363d;
    border-radius:7px;
    padding:10px 14px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
}

.back{
    background:#21262d;
    color:#fff;
}

.preview{
    background:#1f6feb;
    color:#fff;
}

.save{
    background:#238636;
    color:#fff;
}

.download{
    background:#0969da;
    color:#fff;
}

.publish{
    background:#8957e5;
    color:#fff;
}

.btn:hover{
    opacity:.9;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.app-info{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:18px;
    color:#c9d1d9;
}

.app-info strong{
    color:#58a6ff;
}

.builder{
    display:grid;
    grid-template-columns:270px 1fr;
    gap:15px;
}

.panel{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:10px;
    overflow:hidden;
}

.panel-title{
    padding:14px 16px;
    border-bottom:1px solid #30363d;
    font-weight:bold;
}

.file-list{
    padding:8px;
}

.file{
    width:100%;
    border:none;
    background:transparent;
    color:#c9d1d9;
    padding:12px;
    text-align:left;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}

.file:hover{
    background:#21262d;
}

.file.active{
    background:#1f6feb;
    color:#fff;
}

.add-file{
    margin:10px;
    width:calc(100% - 20px);
    border:1px dashed #484f58;
    background:#21262d;
    color:#58a6ff;
    padding:10px;
    border-radius:7px;
    cursor:pointer;
}

.add-file:hover{
    background:#30363d;
}

.editor-panel{
    min-height:600px;
}

.editor-header{
    padding:13px 15px;
    border-bottom:1px solid #30363d;
}

.file-name{
    font-weight:bold;
}

.language{
    color:#8b949e;
    font-size:12px;
    margin-top:4px;
}

textarea{
    display:block;
    width:100%;
    height:520px;
    resize:vertical;
    border:none;
    outline:none;
    background:#0d1117;
    color:#e6edf3;
    padding:18px;
    font-family:Consolas,Monaco,"Courier New",monospace;
    font-size:14px;
    line-height:1.6;
}

.bottom-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    border-top:1px solid #30363d;
}

.status{
    color:#8b949e;
    font-size:13px;
}

.message{
    display:none;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:8px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#0f2d1b;
    border:1px solid #238636;
    color:#7ee787;
}

.message.error{
    display:block;
    background:#2d1111;
    border:1px solid #f85149;
    color:#ff7b72;
}

.loading{
    padding:25px;
    text-align:center;
    color:#58a6ff;
}

.empty{
    padding:25px;
    text-align:center;
    color:#8b949e;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:24px;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box label{
    display:block;
    color:#c9d1d9;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.modal-box input{
    width:100%;
    padding:11px;
    border-radius:7px;
    border:1px solid #30363d;
    background:#0d1117;
    color:#fff;
    outline:none;
    margin-bottom:18px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
}

.cancel{
    background:#21262d;
    color:#fff;
}

.create{
    background:#238636;
    color:#fff;
}

@media(max-width:750px){

    .navbar{
        padding:10px 15px;
        flex-wrap:wrap;
        gap:10px;
    }

    .nav-right{
        width:100%;
        justify-content:flex-end;
    }

    .container{
        padding:20px 12px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .header-actions{
        width:100%;
    }

    .header-actions .btn{
        flex:1;
        text-align:center;
        min-width:75px;
    }

    .builder{
        grid-template-columns:1fr;
    }

    textarea{
        height:450px;
    }

}

</style>

</head>

<body>


<nav class="navbar">

    <div class="logo">

        <span class="green">
            ASIM
        </span>

        TECH

    </div>


    <div class="nav-right">

        <a
            href="apps.html"
            class="nav-link"
        >
            📱 Apps
        </a>

        <a
            href="dashboard.html"
            class="nav-link"
        >
            Dashboard
        </a>

    </div>

</nav>


<main class="container">


    <div class="header">

        <div>

            <h1>
                🛠️ App Builder
            </h1>

            <p>
                Build your own application with ASIM TECH.
            </p>

        </div>


        <div class="header-actions">

            <a
                href="apps.html"
                class="btn back"
            >
                ← Apps
            </a>


            <button
                type="button"
                class="btn preview"
                onclick="previewApp()"
            >
                👁️ Preview
            </button>


            <button
                type="button"
                class="btn save"
                onclick="saveFile()"
            >
                💾 Save
            </button>


            <button
                type="button"
                class="btn download"
                onclick="downloadApp()"
            >
                ⬇️ Download
            </button>


            <button
                type="button"
                class="btn publish"
                onclick="publishApp()"
            >
                🚀 Publish
            </button>

        </div>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="appInfo"
        class="app-info"
    >
        Loading app...
    </div>


    <div class="builder">


        <div class="panel">


            <div class="panel-title">
                📁 App Files
            </div>


            <div
                id="fileList"
                class="file-list"
            >

                <div class="loading">
                    Loading files...
                </div>

            </div>


            <button
                type="button"
                class="add-file"
                onclick="openFileModal()"
            >
                + Create File
            </button>


        </div>


        <div class="panel editor-panel">


            <div class="editor-header">


                <div
                    id="currentFileName"
                    class="file-name"
                >
                    No file selected
                </div>


                <div
                    id="currentLanguage"
                    class="language"
                >
                    -
                </div>


            </div>


            <textarea
                id="codeEditor"
                spellcheck="false"
                placeholder="Select a file to start editing..."
            ></textarea>


            <div class="bottom-bar">


                <div
                    id="saveStatus"
                    class="status"
                >
                    Ready
                </div>


                <div class="status">
                    ASIM TECH App Builder
                </div>


            </div>


        </div>


    </div>


</main>


<!-- CREATE FILE MODAL -->

<div
    id="fileModal"
    class="modal"
>

    <div class="modal-box">


        <h2>
            📄 Create App File
        </h2>


        <label for="newFileName">
            File Name
        </label>


        <input
            id="newFileName"
            type="text"
            placeholder="index.html"
        >


        <div class="modal-actions">


            <button
                type="button"
                class="btn cancel"
                onclick="closeFileModal()"
            >
                Cancel
            </button>


            <button
                type="button"
                class="btn create"
                onclick="createFile()"
            >
                Create File
            </button>


        </div>


    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lgwaeqgiqrsjprsecwxx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_DEoJz1PlONjxqa3eqqXH8Q_uc0hlemT";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const appId =
    params.get("id");


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let currentApp = null;

let currentFile = null;

let appFiles = [];


/* =====================================================
   DOM
===================================================== */

const appInfo =
    document.getElementById(
        "appInfo"
    );

const fileList =
    document.getElementById(
        "fileList"
    );

const codeEditor =
    document.getElementById(
        "codeEditor"
    );

const currentFileName =
    document.getElementById(
        "currentFileName"
    );

const currentLanguage =
    document.getElementById(
        "currentLanguage"
    );

const saveStatus =
    document.getElementById(
        "saveStatus"
    );

const messageBox =
    document.getElementById(
        "message"
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "success"
){

    messageBox.textContent =
        text;

    messageBox.className =
        "message " + type;


    setTimeout(
        function(){

            messageBox.className =
                "message";

        },
        3500
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}


/* =====================================================
   LANGUAGE
===================================================== */

function detectLanguage(
    fileName
){

    const name =
        fileName.toLowerCase();


    if(
        name.endsWith(".html")
    )
        return "HTML";


    if(
        name.endsWith(".css")
    )
        return "CSS";


    if(
        name.endsWith(".js")
    )
        return "JavaScript";


    if(
        name.endsWith(".json")
    )
        return "JSON";


    if(
        name.endsWith(".md")
    )
        return "Markdown";


    if(
        name.endsWith(".txt")
    )
        return "Text";


    return "Code";

}


/* =====================================================
   LOGIN
===================================================== */

async function checkLogin(){

    const {
        data:{session},
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if(error)
        throw error;


    if(!session){

        window.location.href =
            "login.html";

        return null;

    }


    return session.user;

}


/* =====================================================
   LOAD APP
===================================================== */

async function loadApp(){

    try{


        currentUser =
            await checkLogin();


        if(!currentUser)
            return;


        if(!appId){

            appInfo.innerHTML =
                "<strong>App ID missing.</strong>";

            fileList.innerHTML =
                "<div class='empty'>"
                + "No App ID was provided."
                + "</div>";

            return;

        }


        const {
            data:app,
            error
        } =
            await supabaseClient
                .from("apps")
                .select("*")
                .eq(
                    "id",
                    appId
                )
                .eq(
                    "owner_id",
                    currentUser.id
                )
                .single();


        if(error)
            throw error;


        currentApp =
            app;


        updateAppInfo();


        await loadFiles();


    }
    catch(error){

        console.error(
            "Load app error:",
            error
        );


        appInfo.innerHTML =
            "<strong>"
            + "Unable to load app."
            + "</strong>";


        fileList.innerHTML =
            "<div class='empty'>"
            + escapeHtml(
                error.message
            )
            + "</div>";

    }

}


/* =====================================================
   APP INFO
===================================================== */

function updateAppInfo(){

    if(!currentApp)
        return;


    appInfo.innerHTML = `

        <strong>
            📱
            ${escapeHtml(
                currentApp.name
            )}
        </strong>

        &nbsp; — &nbsp;

        ${escapeHtml(
            currentApp.description ||
            "No description"
        )}

        &nbsp;&nbsp;

        ${
            currentApp.is_published
            ? "✓ Published"
            : "Draft"
        }

    `;

}


/* =====================================================
   LOAD FILES
===================================================== */

async function loadFiles(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("app_files")
            .select("*")
            .eq(
                "app_id",
                appId
            )
            .order(
                "file_path",
                {
                    ascending:true
                }
            );


    if(error)
        throw error;


    appFiles =
        data || [];


    renderFiles();


    if(
        appFiles.length === 0
    ){

        currentFile =
            null;


        currentFileName.textContent =
            "No file selected";


        currentLanguage.textContent =
            "-";


        codeEditor.value =
            "";


        saveStatus.textContent =
            "Create your first file";


        return;

    }


    const indexFile =
        appFiles.find(
            function(file){

                return file.file_path
                    .toLowerCase()
                    === "index.html";

            }
        );


    selectFile(
        indexFile ||
        appFiles[0]
    );

}


/* =====================================================
   RENDER FILES
===================================================== */

function renderFiles(){

    if(
        appFiles.length === 0
    ){

        fileList.innerHTML = `

            <div class="empty">
                No files yet.
            </div>

        `;

        return;

    }


    fileList.innerHTML =
        appFiles.map(
            function(file){

                const active =
                    currentFile &&
                    currentFile.id === file.id
                    ? "active"
                    : "";


                return `

                    <button
                        type="button"
                        class="file ${active}"
                        onclick="selectFileById('${file.id}')"
                    >

                        📄

                        ${escapeHtml(
                            file.file_path
                        )}

                    </button>

                `;

            }
        ).join("");

}


/* =====================================================
   SELECT FILE
===================================================== */

function selectFileById(id){

    const file =
        appFiles.find(
            function(item){

                return item.id === id;

            }
        );


    if(file)
        selectFile(file);

}


function selectFile(file){

    currentFile =
        file;


    currentFileName.textContent =
        file.file_path;


    currentLanguage.textContent =
        file.language ||
        detectLanguage(
            file.file_path
        );


    codeEditor.value =
        file.content || "";


    saveStatus.textContent =
        "Editing";


    renderFiles();

}


/* =====================================================
   SAVE FILE
===================================================== */

async function saveFile(){

    if(!currentFile){

        showMessage(
            "Please select a file first.",
            "error"
        );

        return;

    }


    saveStatus.textContent =
        "Saving...";


    try{


        const {
            data,
            error
        } =
            await supabaseClient
                .from("app_files")
                .update({

                    content:
                        codeEditor.value,

                    language:
                        detectLanguage(
                            currentFile.file_path
                        ),

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    currentFile.id
                )
                .eq(
                    "app_id",
                    appId
                )
                .select()
                .single();


        if(error)
            throw error;


        currentFile =
            data;


        const index =
            appFiles.findIndex(
                function(file){

                    return file.id === data.id;

                }
            );


        if(index !== -1){

            appFiles[index] =
                data;

        }


        saveStatus.textContent =
            "Saved ✓";


        showMessage(
            "File saved successfully."
        );


    }
    catch(error){

        console.error(
            error
        );


        saveStatus.textContent =
            "Save failed";


        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   CREATE FILE MODAL
===================================================== */

function openFileModal(){

    document
        .getElementById(
            "fileModal"
        )
        .classList
        .add("show");


    document
        .getElementById(
            "newFileName"
        )
        .value = "";


    setTimeout(
        function(){

            document
                .getElementById(
                    "newFileName"
                )
                .focus();

        },
        100
    );

}


function closeFileModal(){

    document
        .getElementById(
            "fileModal"
        )
        .classList
        .remove("show");

}


/* =====================================================
   CREATE FILE
===================================================== */

async function createFile(){

    const input =
        document.getElementById(
            "newFileName"
        );


    const fileName =
        input.value.trim();


    if(!fileName){

        showMessage(
            "Enter a file name.",
            "error"
        );

        return;

    }


    const duplicate =
        appFiles.some(
            function(file){

                return file.file_path
                    .toLowerCase()
                    === fileName.toLowerCase();

            }
        );


    if(duplicate){

        showMessage(
            "This file already exists.",
            "error"
        );

        return;

    }


    try{


        const {
            data,
            error
        } =
            await supabaseClient
                .from("app_files")
                .insert({

                    app_id:
                        appId,

                    file_path:
                        fileName,

                    content:
                        getStarterContent(
                            fileName
                        ),

                    language:
                        detectLanguage(
                            fileName
                        )

                })
                .select()
                .single();


        if(error)
            throw error;


        appFiles.push(
            data
        );


        closeFileModal();


        renderFiles();


        selectFile(
            data
        );


        showMessage(
            "File created successfully."
        );


    }
    catch(error){

        console.error(
            error
        );


        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   STARTER CONTENT
===================================================== */

function getStarterContent(
    fileName
){

    const language =
        detectLanguage(
            fileName
        );


    if(language === "HTML"){

        return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My ASIM TECH App</title>
</head>
<body>

<h1>Hello from ASIM TECH!</h1>

<p>Start building your app here.</p>

</body>
</html>`;

    }


    if(language === "CSS"){

        return `body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 30px;
}`;

    }


    if(language === "JavaScript"){

        return `console.log("Hello from ASIM TECH App!");`;

    }


    if(language === "JSON"){

        return `{
    "name": "My ASIM TECH App"
}`;

    }


    return "";

}


/* =====================================================
   BUILD PREVIEW
===================================================== */

function buildPreview(){

    const htmlFile =
        appFiles.find(
            function(file){

                return file.file_path
                    .toLowerCase()
                    === "index.html";

            }
        );


    if(!htmlFile){

        return `
<!DOCTYPE html>
<html>
<body>

<h2>No index.html found</h2>

<p>Create index.html first.</p>

</body>
</html>
`;

    }


    let html =
        htmlFile.content || "";


    /* CSS FILES */

    const cssFiles =
        appFiles.filter(
            function(file){

                return file.file_path
                    .toLowerCase()
                    .endsWith(".css");

            }
        );


    cssFiles.forEach(
        function(file){

            const css =
                file.content || "";


            const cssBlock =
                "<style>"
                + css
                + "</style>";


            if(
                html.toLowerCase()
                    .includes(
                        "</head>"
                    )
            ){

                html =
                    html.replace(
                        /<\/head>/i,
                        cssBlock +
                        "</head>"
                    );

            }
            else{

                html =
                    cssBlock +
                    html;

            }

        }
    );


    /* JAVASCRIPT FILES */

    const jsFiles =
        appFiles.filter(
            function(file){

                return file.file_path
                    .toLowerCase()
                    .endsWith(".js");

            }
        );


    jsFiles.forEach(
        function(file){

            const js =
                file.content || "";


            /*
               IMPORTANT:
               Build closing script tag
               in pieces.
            */

            const closingTag =
                "<"
                + "/script>";


            const jsBlock =
                "<script>"
                + js
                + closingTag;


            if(
                html.toLowerCase()
                    .includes(
                        "</body>"
                    )
            ){

                html =
                    html.replace(
                        /<\/body>/i,
                        jsBlock +
                        "</body>"
                    );

            }
            else{

                html +=
                    jsBlock;

            }

        }
    );


    return html;

}


/* =====================================================
   PREVIEW
===================================================== */

function previewApp(){

    if(
        appFiles.length === 0
    ){

        showMessage(
            "No app files available.",
            "error"
        );

        return;

    }


    const html =
        buildPreview();


    const blob =
        new Blob(
            [html],
            {
                type:"text/html"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    window.open(
        url,
        "_blank"
    );


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        60000
    );

}


/* =====================================================
   DOWNLOAD COMPLETE APP AS ZIP
===================================================== */

async function downloadApp(){

    if(
        appFiles.length === 0
    ){

        showMessage(
            "No app files available.",
            "error"
        );

        return;

    }


    if(
        typeof JSZip === "undefined"
    ){

        showMessage(
            "ZIP library is not loaded. Please refresh the page.",
            "error"
        );

        return;

    }


    try{


        showMessage(
            "Preparing complete App ZIP..."
        );


        /*
           CREATE ZIP
        */

        const zip =
            new JSZip();


        /*
           ADD EVERY APP FILE
        */

        appFiles.forEach(
            function(file){

                zip.file(
                    file.file_path,
                    file.content || ""
                );

            }
        );


        /*
           CREATE README
        */

        const appName =
            currentApp &&
            currentApp.name
            ? currentApp.name
            : "ASIM TECH App";


        const readme =
`ASIM TECH APP

App Name:
${appName}

Created with:
ASIM TECH Platform

Files:
${appFiles
    .map(
        function(file){

            return "- " +
                file.file_path;

        }
    )
    .join("\n")}

To run the app:
Open index.html in a web browser.
`;


        zip.file(
            "README.txt",
            readme
        );


        /*
           GENERATE ZIP
        */

        const blob =
            await zip.generateAsync({

                type:"blob",

                compression:"DEFLATE",

                compressionOptions:{
                    level:6
                }

            });


        /*
           SAFE APP NAME
        */

        const safeName =
            appName
                .replace(
                    /[^a-z0-9-_]/gi,
                    "-"
                )
                .replace(
                    /-+/g,
                    "-"
                )
                .replace(
                    /^-|-$/g,
                    ""
                )
                .toLowerCase();


        const finalName =
            (
                safeName ||
                "asim-tech-app"
            )
            +
            ".zip";


        /*
           DOWNLOAD
        */

        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            finalName;


        link.style.display =
            "none";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            3000
        );


        showMessage(
            "Complete App downloaded: "
            + finalName
        );


    }
    catch(error){

        console.error(
            "ZIP download error:",
            error
        );


        showMessage(
            "Download failed: "
            + error.message,
            "error"
        );

    }

}


/* =====================================================
   PUBLISH APP
===================================================== */

async function publishApp(){

    if(!currentApp){

        showMessage(
            "App is not loaded.",
            "error"
        );

        return;

    }


    const indexFile =
        appFiles.find(
            function(file){

                return file.file_path
                    .toLowerCase()
                    === "index.html";

            }
        );


    if(!indexFile){

        showMessage(
            "Create index.html before publishing.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Publish this app?\n\n"
            +
            "App: "
            +
            currentApp.name
        );


    if(!confirmed)
        return;


    try{


        const {
            data,
            error
        } =
            await supabaseClient
                .from("apps")
                .update({

                    is_published:true,

                    published_at:
                        new Date()
                            .toISOString(),

                    updated_at:
                        new Date()
                            .toISOString()

                })
                .eq(
                    "id",
                    currentApp.id
                )
                .eq(
                    "owner_id",
                    currentUser.id
                )
                .select()
                .single();


        if(error)
            throw error;


        currentApp =
            data;


        updateAppInfo();


        showMessage(
            "App published successfully."
        );


    }
    catch(error){

        console.error(
            "Publish error:",
            error
        );


        showMessage(
            error.message,
            "error"
        );

    }

}
